# RFactory #3 desktops (KubeVirt VMs): manifests live in olafkfreund/RFactory. While the feature is built the app
# follows its branch, so a pushed image pin deploys without a pull request here (RFactory plan deviation 42);
# set targetRevision to main when the branch merges.
# Not synced by itself: `exclude` keeps this file and namespace.yaml out of the
# synced set. The namespace is applied once by hand and never owned by the app
# (plan deviation 9). Deleting this Application removes the workloads, policies
# and StorageClass, never the namespace, PVCs or profile ConfigMaps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rfactory-desktops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/olafkfreund/RFactory
    targetRevision: feat/3-agent-workspace
    path: deploy/k8s/rfactory-desktops
    directory:
      exclude: "{namespace.yaml,application.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: rfactory-desktops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - RespectIgnoreDifferences=true
