# TFactory — autonomous test generation & execution.
# Source repo: github.com/olafkfreund/TFactory
#
# Status: placeholder until TFactory grows deploy/k8s/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tfactory
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/olafkfreund/factory-gitops
    targetRevision: main
    path: apps/tfactory/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: factory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # KEDA's HPA owns spec.replicas (RFC-0016 #192). Without this, selfHeal would
  # revert the HPA's scale-out back to the manifest and fight the autoscaler.
  #
  # observe-otlp-auth-sync owns otlp-auth-resourceversion: it stamps that
  # annotation on the pod template when it rewrites `otel-otlp-auth`, which is
  # what makes the new header reach a running pod at all (Factory#606). A
  # secretKeyRef env var is resolved once at container start and never
  # refreshed. Without this pointer, selfHeal would strip the annotation back
  # off and roll the Deployment a second time.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: tfactory
      jsonPointers:
        - /spec/replicas
        - /spec/template/metadata/annotations/otlp-auth-resourceversion
