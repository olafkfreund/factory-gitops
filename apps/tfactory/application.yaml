# TFactory — autonomous test generation & execution.
# Source repo: github.com/olafkfreund/TFactory
#
# Status: placeholder until TFactory grows deploy/k8s/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tfactory
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/olafkfreund/factory-gitops
    targetRevision: main
    path: apps/tfactory/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: factory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
