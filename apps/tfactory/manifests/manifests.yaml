apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: tfactory-data, namespace: factory, labels: { app: tfactory } }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: tfactory, namespace: factory, labels: { app: tfactory } }
spec:
  selector: { app: tfactory }
  ports: [{ name: http, port: 3103, targetPort: 3103 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: tfactory, namespace: factory, labels: { app: tfactory } }
spec:
  replicas: 1
  selector: { matchLabels: { app: tfactory } }
  strategy: { type: Recreate }
  template:
    metadata: { labels: { app: tfactory } }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      enableServiceLinks: false
      securityContext: { fsGroup: 65532 }
      initContainers:
        # Always-fresh provider CLIs (upgraded on every pod start) into a shared volume.
        - name: install-clis
          image: node:22-bookworm-slim
          command: ["sh","-c"]
          args:
            - |
              set -e
              export npm_config_prefix=/clis
              npm install -g @anthropic-ai/claude-code @openai/codex @google/gemini-cli
              ln -sf /clis/bin/gemini /clis/bin/antigravity   # antigravity CLI == gemini-cli, invoked as `antigravity`
              echo "installed:"; ls -la /clis/bin
          volumeMounts:
            - { name: clis, mountPath: /clis }
        # Seed per-CLI OAuth credential files into writable dirs (so the CLIs can refresh tokens).
        - name: seed-creds
          image: busybox:1.36
          command: ["sh","-c"]
          args:
            - |
              set -e
              mkdir -p /h/.claude /h/.codex /h/.gemini /h/.config/github-copilot
              cp /seed/claude-credentials.json  /h/.claude/.credentials.json
              cp /seed/codex-auth.json          /h/.codex/auth.json
              cp /seed/copilot-apps.json        /h/.config/github-copilot/apps.json
              cp /seed/gemini-oauth_creds.json  /h/.gemini/oauth_creds.json
              chmod -R g+rwX /h/.claude /h/.codex /h/.gemini /h/.config
              echo "seeded:"; ls -la /h/.claude /h/.codex /h/.gemini
          volumeMounts:
            - { name: cc-claude, mountPath: /h/.claude }
            - { name: cc-codex,  mountPath: /h/.codex }
            - { name: cc-gemini, mountPath: /h/.gemini }
            - { name: cc-config, mountPath: /h/.config }
            - { name: cli-creds, mountPath: /seed, readOnly: true }
      containers:
        - name: tfactory
          image: ghcr.io/olafkfreund/tfactory:0.6.4
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3103 }]
          env:
            - { name: APP_HOST, value: "0.0.0.0" }
            - { name: APP_PORT, value: "3103" }
            - { name: PATH, value: "/clis/bin:/home/projects/MagesticAI/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" }
            - { name: TFACTORY_COMPLETION_WEBHOOK, value: "http://cfactory.factory.svc.cluster.local:3111/api/events" }
            - { name: ANTHROPIC_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: ANTHROPIC_API_KEY } } }
            - { name: GITHUB_TOKEN, valueFrom: { secretKeyRef: { name: factory-secrets, key: GITHUB_TOKEN } } }
            # Shared static API token for programmatic access (CFactory's adapters
            # send it as `Authorization: Bearer`). Matches aifactory so all three
            # factories accept the one shared token from factory-secrets.
            - { name: APP_API_TOKEN, valueFrom: { secretKeyRef: { name: factory-secrets, key: APP_API_TOKEN } } }
            # OIDC SSO via Keycloak
            - { name: APP_OIDC_ENABLED, value: "true" }
            - { name: APP_OIDC_ISSUER_URL, value: "https://keycloak.freundcloud.org.uk/realms/factory" }
            - { name: APP_OIDC_CLIENT_ID, value: "tfactory" }
            - { name: APP_OIDC_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: factory-secrets, key: TFACTORY_OIDC_CLIENT_SECRET } } }
            - { name: APP_OIDC_REDIRECT_URI, value: "https://tfactory.freundcloud.org.uk/api/auth/oidc/callback" }
            # provider keys — power the claude / codex / antigravity CLIs seeded above
            - { name: OPENAI_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: OPENAI_API_KEY } } }
            - { name: GEMINI_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: GEMINI_API_KEY } } }
            - { name: CONTEXT7_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: CONTEXT7_KEY } } }
            - { name: LANGCHAIN_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: LANGCHAIN_API_KEY } } }
            - { name: RAPIDAPI_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: RAPIDAPI_KEY } } }
            - { name: CLAUDE_CODE_OAUTH_TOKEN, valueFrom: { secretKeyRef: { name: factory-secrets, key: CLAUDE_CODE_OAUTH_TOKEN } } }
          volumeMounts:
            - { name: data,      mountPath: /home/nonroot/.tfactory }
            - { name: clis,      mountPath: /clis }
            - { name: cc-claude, mountPath: /home/nonroot/.claude }
            - { name: cc-codex,  mountPath: /home/nonroot/.codex }
            - { name: cc-gemini, mountPath: /home/nonroot/.gemini }
            - { name: cc-config, mountPath: /home/nonroot/.config }
          readinessProbe: { httpGet: { path: /api/health, port: 3103 }, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 6 }
          livenessProbe:  { httpGet: { path: /api/health, port: 3103 }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 2Gi } }
      volumes:
        - { name: data,      persistentVolumeClaim: { claimName: tfactory-data } }
        - { name: clis,      emptyDir: {} }
        - { name: cc-claude, emptyDir: {} }
        - { name: cc-codex,  emptyDir: {} }
        - { name: cc-gemini, emptyDir: {} }
        - { name: cc-config, emptyDir: {} }
        - { name: cli-creds, secret: { secretName: factory-cli-creds } }
