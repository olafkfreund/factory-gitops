apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: tfactory-data, namespace: factory, labels: { app: tfactory } }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: { requests: { storage: 5Gi } }
---
# RFC-0016 #197 — warm /nix/store shared across per-task Nix verify Jobs so they
# stop cold-fetching the closure every run. RWO is fine on this single-node cluster;
# a multi-node fleet needs RWX.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: tfactory-nix-store, namespace: factory, labels: { app: tfactory, role: nix-store } }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: { requests: { storage: 20Gi } }
---
# RFC-0005 Tier A: SA + least-privilege RBAC so TFactory can dispatch ephemeral
# Nix-lane Jobs (tools/runners/kube_sandbox.py) and read their logs. Scoped to
# the factory namespace; jobs + pod logs only.
apiVersion: v1
kind: ServiceAccount
metadata: { name: tfactory-sandbox, namespace: factory, labels: { app: tfactory } }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: tfactory-sandbox, namespace: factory, labels: { app: tfactory } }
rules:
  - { apiGroups: ["batch"], resources: ["jobs"], verbs: ["create","get","list","watch","delete"] }
  - { apiGroups: [""], resources: ["pods"], verbs: ["get","list"] }
  - { apiGroups: [""], resources: ["pods/log"], verbs: ["get"] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: tfactory-sandbox, namespace: factory, labels: { app: tfactory } }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: tfactory-sandbox }
subjects:
  - { kind: ServiceAccount, name: tfactory-sandbox, namespace: factory }
---
apiVersion: v1
kind: Service
metadata: { name: tfactory, namespace: factory, labels: { app: tfactory } }
spec:
  selector: { app: tfactory }
  ports: [{ name: http, port: 3103, targetPort: 3103 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: tfactory, namespace: factory, labels: { app: tfactory } }
spec:
  # No `replicas:` — KEDA's HPA owns the replica count (RFC-0016 #192). ArgoCD
  # ignores /spec/replicas (see application.yaml ignoreDifferences) so selfHeal
  # does not fight the HPA. RollingUpdate (not Recreate) so KEDA can run >1 pod;
  # the RWO data PVC co-mounts on the single k3d node (multi-replica-safe now
  # that authoritative state is in Postgres, #220).
  selector: { matchLabels: { app: tfactory } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    metadata: { labels: { app: tfactory } }
    spec:
      # RFC-0005 Tier A: this SA can create/read the ephemeral Nix-lane Jobs.
      serviceAccountName: tfactory-sandbox
      imagePullSecrets: [{ name: ghcr-pull }]
      enableServiceLinks: false
      securityContext: { fsGroup: 65532 }
      initContainers:
        # Always-fresh provider CLIs (upgraded on every pod start) into a shared volume.
        - name: install-clis
          image: node:22-bookworm-slim
          command: ["sh","-c"]
          args:
            - |
              set -e
              export npm_config_prefix=/clis
              npm install -g @anthropic-ai/claude-code @openai/codex @google/gemini-cli
              ln -sf /clis/bin/gemini /clis/bin/antigravity   # antigravity CLI == gemini-cli, invoked as `antigravity`
              echo "installed:"; ls -la /clis/bin
          volumeMounts:
            - { name: clis, mountPath: /clis }
        # Seed per-CLI OAuth credential files into writable dirs (so the CLIs can refresh tokens).
        - name: seed-creds
          image: busybox:1.36
          command: ["sh","-c"]
          args:
            - |
              set -e
              mkdir -p /h/.claude /h/.codex /h/.gemini /h/.config/github-copilot
              cp /seed/claude-credentials.json  /h/.claude/.credentials.json
              cp /seed/codex-auth.json          /h/.codex/auth.json
              cp /seed/copilot-apps.json        /h/.config/github-copilot/apps.json
              cp /seed/gemini-oauth_creds.json  /h/.gemini/oauth_creds.json
              chmod -R g+rwX /h/.claude /h/.codex /h/.gemini /h/.config
              echo "seeded:"; ls -la /h/.claude /h/.codex /h/.gemini
          volumeMounts:
            - { name: cc-claude, mountPath: /h/.claude }
            - { name: cc-codex,  mountPath: /h/.codex }
            - { name: cc-gemini, mountPath: /h/.gemini }
            - { name: cc-config, mountPath: /h/.config }
            - { name: cli-creds, mountPath: /seed, readOnly: true }
      containers:
        - name: tfactory
          image: ghcr.io/olafkfreund/tfactory:0.6.4
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3103 }]
          env:
            - { name: APP_HOST, value: "0.0.0.0" }
            - { name: APP_PORT, value: "3103" }
            # RFC-0016 #220/#468: durable shared state in Postgres (tfactory DB).
            # Replaces pod-local SQLite (~/.tfactory/data.db); init_db() runs
            # `alembic upgrade head` on boot (MIGRATIONS_AUTO_APPLY default true),
            # creating job_states + all tables. Makes verify-job state durable +
            # multi-replica safe. Out-of-band secret factory-db-tfactory.
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: factory-db-tfactory, key: DATABASE_URL } } }
            # RFC-0016 #190: S3-compatible object store (in-cluster MinIO) for
            # verify artifacts (findings/verdicts.json, test reports, evidence).
            # The shared client (apps/backend/tools/runners/artifact_store.py)
            # reads these; emission is fail-open so an outage never blocks a
            # verdict. Creds from the out-of-band `minio-creds` Secret.
            - { name: S3_ENDPOINT, value: "http://minio.factory.svc.cluster.local:9000" }
            - { name: S3_BUCKET, value: "factory-artifacts" }
            - { name: S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: minio-creds, key: S3_ACCESS_KEY } } }
            - { name: S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: minio-creds, key: S3_SECRET_KEY } } }
            # bwrap can't run on k3d (node is a container) — disable the bash sandbox
            # so agent bash works. Real syscall sandbox via gVisor: AIFactory #363.
            - { name: AIFACTORY_BASH_SANDBOX, value: "false" }
            - { name: PATH, value: "/clis/bin:/home/projects/MagesticAI/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" }
            # The web-server process must import the backend's `agents` package
            # (create_spec_ingest_workspace schedules agents.planner on ingest).
            # Without apps/backend on the path the import fails silently and the
            # ingested spec sits at status=pending — the verify pipeline never
            # runs. (#71: AIFactory→TFactory handoff lands but TFactory no-ops.)
            - { name: PYTHONPATH, value: "/home/projects/MagesticAI/apps/backend" }
            - { name: TFACTORY_COMPLETION_WEBHOOK, value: "http://cfactory.factory.svc.cluster.local:3111/api/events" }
            # Auto-run the verify pipeline on spec ingest (planner → gen-functional
            # → evaluate → triage) so an AIFactory→TFactory handoff actually
            # generates + runs tests and emits a verdict. Without these the spec
            # ingests but sits at status=pending (the PARR verify leg never runs).
            - { name: TFACTORY_AUTO_PLAN, value: "true" }
            - { name: TFACTORY_AUTO_GENERATE, value: "true" }
            - { name: TFACTORY_AUTO_EVALUATE, value: "true" }
            - { name: TFACTORY_AUTO_TRIAGE, value: "true" }
            # RFC-0005 Tier A / RFC-0016 #469: the Nix-lane k8s-Job sandbox
            # co-mounts the worktree from this PVC and runs the per-task flake in
            # the thin Nix image. nixjob is now the DEFAULT verify execution path
            # (the code prefers it when TFACTORY_NIX_RUNNER_IMAGE is set and the
            # contract environment is a nix env; catalog-image/host-venv remain
            # fallbacks). TFACTORY_NIX_STORE_PVC warms the /nix closure across Jobs.
            - { name: TFACTORY_WORKSPACES_PVC, value: "tfactory-data" }
            - { name: TFACTORY_NIX_RUNNER_IMAGE, value: "ghcr.io/olafkfreund/tfactory-runner-nix:latest" }
            - { name: TFACTORY_NIX_STORE_PVC, value: "tfactory-nix-store" }
            # TFACTORY_IMAGE pins the TFactory backend image the verify Job runs
            # on (the image that now ships the `agents` package on PYTHONPATH —
            # the ModuleNotFoundError that reverted FLIP #3 was fixed in #479).
            # CD bumps the kustomization newTag but NOT this env — keep this SHA
            # aligned with kustomization.yaml newTag (FLAT manifests; no Helm
            # image-injection). STAGE 0 (round-5, 2026-06-21): realigned to
            # sha-e5f5b01 — the #480 merge that injects CLAUDE_CODE_OAUTH_TOKEN
            # (+ full provider env) into the verify Job, on top of #479 verify-image
            # / #476 wiring / #478 loop+flake. The verify Job now runs on the image
            # whose dispatch propagates the LLM credential (resolves the round-4
            # "No OAuth token found" that reverted FLIP #4).
            - { name: TFACTORY_IMAGE, value: "ghcr.io/olafkfreund/tfactory:sha-e5f5b01" }
            # RFC-0016 #466 / RFC-0017: Job-native verify orchestration.
            # FLIP #1 (2026-06-21) REVERTED — verify_dispatch was present but NOT
            # WIRED (nothing called verify_exec_mode), so the flip was inert.
            # #476 (live as sha-081cc6d) FIXED the wiring, AND IT WORKS: with
            # TFACTORY_VERIFY_EXEC=kubejob the verify now DISPATCHES a real k8s Job
            # (factory-tfactory-erify-<spec>) with the correct nix-develop-wrapped
            # entrypoint `nix develop path:/work#default --command python -m
            # agents.verify_pipeline …` on TFACTORY_NIX_RUNNER_IMAGE. So the wiring
            # defect #466 fixed is PROVEN resolved (verified live on aifactory-test,
            # spec verify-kubejob-035558).
            # FLIP #2 (2026-06-21, post-#476) REVERTED — two NEW downstream defects
            # (NOT the wiring, NOT the pre-existing review-lane stall — the pipeline
            # got all the way past review to dispatch):
            #   (a) verify_dispatch._record_dispatch raised RuntimeError "got Future
            #       attached to a different loop" — _run_dispatch_blocking runs the
            #       async job_state_store.enqueue on its own event loop while the
            #       store's asyncpg/SQLAlchemy session is bound to the main loop. The
            #       dispatch record FAILED (logged WARNING + continued), so no durable
            #       job_states row exists → reconcile can never produce a verdict.
            #   (b) the verify Job pod failed exit=1: `flake.nix does not exist` at
            #       /work — the per-task Nix flake is not materialized into the
            #       co-mounted worktree PVC, so `nix develop path:/work#default`
            #       fails before verify_pipeline runs.
            # Net: Job dispatched but no terminal verdict reached job_states
            # (status/verdict=None). Needs CODE fixes in TFactory (run the enqueue on
            # the store's loop; materialize the task flake into /work for the Job).
            # FIX (#478, merged a82c340): (a) verify_dispatch._record_dispatch builds
            # a fresh async engine bound to the dispatch's own loop (no cross-loop
            # Future); (b) the per-task flake is materialized into the project
            # worktree (flake_subpath) before dispatch so `nix develop path:/work`
            # resolves.
            # FLIP #3 (2026-06-21, post-#478) REVERTED — but #478 DID work, BOTH
            # fixes PROVEN live on aifactory-test (Job
            # factory-tfactory-fy-kubejob-d2-044024):
            #   (a) a durable job_states row LANDED for the verify job
            #       (kind=verify, worker_ref recorded; NO "Future attached to a
            #       different loop" error), and the control-plane reconcile PICKED
            #       IT UP (lifecycle_state transitioned to a terminal `stuck` with
            #       an honest "no verdict" error). Cross-loop store defect: FIXED.
            #   (b) the per-task flake MATERIALIZED into /work — the entrypoint
            #       `nix develop path:/work/workspaces/olafkfreund-aifactory-test
            #       #default` SUCCEEDED (whole nix env incl. pytest/fastapi fetched
            #       from cache, python3-3.13 env built). NO "flake.nix does not
            #       exist". Missing-flake defect: FIXED.
            # A NEW, distinct next-in-chain defect surfaced: after nix develop
            # succeeded, the Job's `python -m agents.verify_pipeline …` died with
            # `ModuleNotFoundError: No module named 'agents'`. The nix runner image
            # (TFACTORY_NIX_RUNNER_IMAGE) + per-task flake provide the TOOLCHAIN
            # (python/pytest/deps) but NOT TFactory's own backend `agents` package,
            # and it isn't on PYTHONPATH from /work (which is the SUT workspace, not
            # the TFactory backend). So verify_pipeline never runs evaluate→triage,
            # the Job produces no verdict, and reconcile honestly marks the row
            # `stuck` ("verify Job finished … with no verdict — lanes pending #464").
            # Needs a CODE fix in TFactory dispatch (ship/mount the backend `agents`
            # package into the verify Job + set PYTHONPATH, or build the runner image
            # to contain it). Cannot be fixed from gitops env. Staying on the in-pod
            # verify default until that lands.
            # FLIP #4 (round-4, 2026-06-21, post-#479) REVERTED — but #479 DID
            # work, the ModuleNotFoundError that reverted FLIP #3 is RESOLVED.
            # Proven live on aifactory-test, spec verify-kubejob-d4-130020, Job
            # factory-tfactory-fy-kubejob-d4-130020 (image sha-fe2cb3b):
            #   - generation was slow (plan→generate→replan loop; both test
            #     subtasks hit replan_count=2), but it DID complete and the verify
            #     DISPATCHED a real k8s Job (not the pre-dispatch stall).
            #   - the verify Job had PYTHONPATH set and TFactory's `agents`
            #     package IMPORTED — execution reached deep into
            #     agents.evaluator.run_evaluator → _run_evaluator_session →
            #     create_client. NO `ModuleNotFoundError: No module named
            #     'agents'`. #479 (agents-on-PYTHONPATH) is PROVEN resolved.
            # A NEW, distinct next-in-chain defect surfaced — the SAME one Stage B
            # hit on the build Job: the verify Job is created with only
            # JOB_ID/FACTORY_SERVICE/DATABASE_URL/PYTHONPATH — it does NOT
            # propagate the LLM credential (CLAUDE_CODE_OAUTH_TOKEN). So the
            # evaluator died `ValueError: No OAuth token found … TFactory requires
            # Claude Code OAuth authentication` (core/auth.py require_auth_token);
            # no verdict reached job_states; Job terminal Failed
            # (BackoffLimitExceeded). (S3_ENDPOINT unset → artifact upload skipped,
            # verdict-unaffected — incidental.)
            # Needs a CODE fix in TFactory verify dispatch (verify_dispatch /
            # gen_functional kubejob Job-spec): inject CLAUDE_CODE_OAUTH_TOKEN into
            # the verify Job container, mirroring the in-pod env. This is the same
            # class of fix the build Job needs (AIFactory #671 FLIP #4). Cannot be
            # fixed from gitops. Back to in-pod verify default (safe).
            # - { name: TFACTORY_VERIFY_EXEC, value: "kubejob" }  # REVERTED — see FLIP #4 above (verify Job missing CLAUDE_CODE_OAUTH_TOKEN; #479 agents-import FIXED)
            # #481: file-auth CLI creds for the dispatched verify Job — seeds the
            # factory-cli-creds secret into the Job pod via the seed-creds
            # initContainer (verify_dispatch._inject_verify_seed_creds). INERT
            # until TFACTORY_VERIFY_EXEC=kubejob (default in-pod), so it is safe to
            # set ahead of the verify-default flip: the Job then has file-auth
            # provider parity (codex/gemini-oauth/copilot) once kubejob is enabled.
            - { name: TFACTORY_VERIFY_CLI_CREDS_SECRET, value: "factory-cli-creds" }
            # Opt-in LLM staff-engineer review lane (additive, parallel, never
            # feeds the verdict path). Writes findings/review.json each verify.
            - { name: TFACTORY_REVIEW_LANE, value: "1" }
            - { name: GITHUB_TOKEN, valueFrom: { secretKeyRef: { name: factory-secrets, key: GITHUB_TOKEN } } }
            # Shared static API token for programmatic access (CFactory's adapters
            # send it as `Authorization: Bearer`). Matches aifactory so all three
            # factories accept the one shared token from factory-secrets.
            - { name: APP_API_TOKEN, valueFrom: { secretKeyRef: { name: factory-secrets, key: APP_API_TOKEN } } }
            # OIDC SSO via Keycloak
            - { name: APP_OIDC_ENABLED, value: "true" }
            - { name: APP_OIDC_ISSUER_URL, value: "https://keycloak.freundcloud.org.uk/realms/factory" }
            - { name: APP_OIDC_CLIENT_ID, value: "tfactory" }
            - { name: APP_OIDC_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: factory-secrets, key: TFACTORY_OIDC_CLIENT_SECRET } } }
            - { name: APP_OIDC_REDIRECT_URI, value: "https://tfactory.freundcloud.org.uk/api/auth/oidc/callback" }
            # provider keys — power the claude / codex / antigravity CLIs seeded above
            - { name: OPENAI_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: OPENAI_API_KEY } } }
            - { name: GEMINI_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: GEMINI_API_KEY } } }
            - { name: CONTEXT7_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: CONTEXT7_KEY } } }
            - { name: LANGCHAIN_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: LANGCHAIN_API_KEY } } }
            - { name: RAPIDAPI_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: RAPIDAPI_KEY } } }
            - { name: CLAUDE_CODE_OAUTH_TOKEN, valueFrom: { secretKeyRef: { name: factory-secrets, key: CLAUDE_CODE_OAUTH_TOKEN } } }
          volumeMounts:
            - { name: data,      mountPath: /home/nonroot/.tfactory }
            - { name: clis,      mountPath: /clis }
            - { name: cc-claude, mountPath: /home/nonroot/.claude }
            - { name: cc-codex,  mountPath: /home/nonroot/.codex }
            - { name: cc-gemini, mountPath: /home/nonroot/.gemini }
            - { name: cc-config, mountPath: /home/nonroot/.config }
          readinessProbe: { httpGet: { path: /api/health, port: 3103 }, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 6 }
          livenessProbe:  { httpGet: { path: /api/health, port: 3103 }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 2Gi } }
      volumes:
        - { name: data,      persistentVolumeClaim: { claimName: tfactory-data } }
        - { name: clis,      emptyDir: {} }
        - { name: cc-claude, emptyDir: {} }
        - { name: cc-codex,  emptyDir: {} }
        - { name: cc-gemini, emptyDir: {} }
        - { name: cc-config, emptyDir: {} }
        - { name: cli-creds, secret: { secretName: factory-cli-creds } }
---
# RFC-0016 #197 — size-capped GC for the warm Nix store (see aifactory twin).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tfactory-nix-store-gc
  namespace: factory
  labels: { app: tfactory, role: nix-store-gc }
spec:
  schedule: "30 3 * * *"         # nightly 03:30 (offset from aifactory)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 600
      template:
        metadata: { labels: { app: tfactory, role: nix-store-gc } }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets: [{ name: ghcr-pull }]
          containers:
            - name: gc
              image: ghcr.io/olafkfreund/tfactory-runner-nix:latest
              command: ["nix", "store", "gc", "--max", "12G"]
              volumeMounts: [{ name: nix-store, mountPath: /nix }]
          volumes:
            - name: nix-store
              persistentVolumeClaim: { claimName: tfactory-nix-store }
