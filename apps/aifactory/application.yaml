# AIFactory — spec-driven development for AI agents.
# Source repo: github.com/olafkfreund/AIFactory
#
# Status: placeholder. Will turn green once AIFactory grows a deploy/k8s
# directory with at least a Deployment + Service. Until then, ArgoCD
# will report ComparisonError on the missing path — that's expected.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aifactory
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/olafkfreund/factory-gitops
    targetRevision: main
    path: apps/aifactory/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: factory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # KEDA's HPA owns spec.replicas (RFC-0016 #192 / RFC-0017 #681). Without this,
  # selfHeal would revert the HPA's scale-out back to the manifest and fight the
  # autoscaler. Matches the pfactory/tfactory pattern.
  #
  # observe-otlp-auth-sync owns otlp-auth-resourceversion: it stamps that
  # annotation on the pod template when it rewrites `otel-otlp-auth`, which is
  # what makes the new header reach a running pod at all (Factory#606). A
  # secretKeyRef env var is resolved once at container start and never
  # refreshed. Without this pointer, selfHeal would strip the annotation back
  # off and roll the Deployment a second time.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: aifactory
      jsonPointers:
        - /spec/replicas
        - /spec/template/metadata/annotations/otlp-auth-resourceversion
