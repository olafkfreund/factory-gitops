apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: factory
resources:
- manifests.yaml
# CI bumps `newTag` via: kustomize edit set image ghcr.io/olafkfreund/aifactory=ghcr.io/olafkfreund/aifactory:<tag>
images:
- name: ghcr.io/olafkfreund/aifactory
  newName: ghcr.io/olafkfreund/aifactory
  newTag: sha-ac338b5
# AIFactory#1737: the gate-image-prepull DaemonSet pulls exactly what the Jobs
# run. Runs after `images:` above, so the -nix tag is not retagged.
replacements:
- source:
    fieldPath: spec.template.spec.containers.[name=aifactory].env.[name=AIFACTORY_SANDBOX_IMAGE].value
    kind: Deployment
    name: aifactory
  targets:
  - fieldPaths:
    - spec.template.spec.initContainers.[name=sandbox-image].image
    select:
      kind: DaemonSet
      name: gate-image-prepull
- source:
    fieldPath: spec.template.spec.containers.[name=aifactory].env.[name=AIFACTORY_BUILD_IMAGE].value
    kind: Deployment
    name: aifactory
  targets:
  - fieldPaths:
    - spec.template.spec.initContainers.[name=build-image].image
    select:
      kind: DaemonSet
      name: gate-image-prepull
