apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: aifactory-data, namespace: factory, labels: { app: aifactory } }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: aifactory, namespace: factory, labels: { app: aifactory } }
spec:
  selector: { app: aifactory }
  ports: [{ name: http, port: 3101, targetPort: 3101 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: aifactory, namespace: factory, labels: { app: aifactory } }
spec:
  replicas: 1
  selector: { matchLabels: { app: aifactory } }
  strategy: { type: Recreate }
  template:
    metadata: { labels: { app: aifactory } }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      enableServiceLinks: false
      securityContext: { fsGroup: 65532 }
      containers:
        - name: aifactory
          image: ghcr.io/olafkfreund/aifactory:v3.4.2
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3101 }]
          env:
            - { name: APP_HOST, value: "0.0.0.0" }
            - { name: APP_PORT, value: "3101" }
            - { name: AIFACTORY_COMPLETION_WEBHOOK, value: "http://cfactory.factory.svc.cluster.local:3111/api/events" }
            - { name: ANTHROPIC_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: ANTHROPIC_API_KEY } } }
            - { name: GITHUB_TOKEN, valueFrom: { secretKeyRef: { name: factory-secrets, key: GITHUB_TOKEN } } }
          volumeMounts: [{ name: data, mountPath: /home/nonroot/.aifactory }]
          readinessProbe: { httpGet: { path: /api/health, port: 3101 }, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 6 }
          livenessProbe:  { httpGet: { path: /api/health, port: 3101 }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 2Gi } }
        - name: tailscale
          image: docker.io/tailscale/tailscale:v1.98.4
          env:
            - { name: TS_AUTHKEY, valueFrom: { secretKeyRef: { name: tailscale-auth-key, key: TS_AUTHKEY } } }
            - { name: TS_HOSTNAME, value: "aifactory" }
            - { name: TS_KUBE_SECRET, value: "" }
            - { name: TS_USERSPACE, value: "true" }
            - { name: TS_STATE_DIR, value: "/tmp/tsstate" }
            - { name: TS_EXTRA_ARGS, value: "--accept-dns=false" }
            - { name: TS_SERVE_CONFIG, value: "/etc/tsconfig/serve.json" }
          volumeMounts:
            - { name: ts-serve-config, mountPath: /etc/tsconfig, readOnly: true }
          securityContext: { runAsUser: 1000, runAsNonRoot: true }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 128Mi } }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: aifactory-data } }
        - name: ts-serve-config
          configMap: { name: aifactory-tailscale-serve-config }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: aifactory-tailscale-serve-config, namespace: factory }
data:
  serve.json: |
    { "TCP": { "443": { "HTTPS": true } }, "Web": { "${TS_CERT_DOMAIN}:443": { "Handlers": { "/": { "Proxy": "http://127.0.0.1:3101" } } } }, "AllowFunnel": {} }
