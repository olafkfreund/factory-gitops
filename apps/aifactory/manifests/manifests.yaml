apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: aifactory-data, namespace: factory, labels: { app: aifactory } }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: aifactory, namespace: factory, labels: { app: aifactory } }
spec:
  selector: { app: aifactory }
  ports: [{ name: http, port: 3101, targetPort: 3101 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: aifactory, namespace: factory, labels: { app: aifactory } }
spec:
  replicas: 1
  selector: { matchLabels: { app: aifactory } }
  strategy: { type: Recreate }
  template:
    metadata: { labels: { app: aifactory } }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      enableServiceLinks: false
      securityContext: { fsGroup: 65532 }
      initContainers:
        # Always-fresh provider CLIs (upgraded on every pod start) into a shared volume.
        - name: install-clis
          image: node:22-bookworm-slim
          command: ["sh","-c"]
          args:
            - |
              set -e
              export npm_config_prefix=/clis
              npm install -g @anthropic-ai/claude-code @openai/codex @google/gemini-cli
              ln -sf /clis/bin/gemini /clis/bin/antigravity   # antigravity CLI == gemini-cli, invoked as `antigravity`
              echo "installed:"; ls -la /clis/bin
          volumeMounts:
            - { name: clis, mountPath: /clis }
        # Seed per-CLI OAuth credential files into writable dirs (so the CLIs can refresh tokens).
        - name: seed-creds
          image: busybox:1.36
          command: ["sh","-c"]
          args:
            - |
              set -e
              mkdir -p /h/.claude /h/.codex /h/.gemini /h/.config/github-copilot
              cp /seed/claude-credentials.json  /h/.claude/.credentials.json
              cp /seed/codex-auth.json          /h/.codex/auth.json
              cp /seed/copilot-apps.json        /h/.config/github-copilot/apps.json
              cp /seed/gemini-oauth_creds.json  /h/.gemini/oauth_creds.json
              chmod -R g+rwX /h/.claude /h/.codex /h/.gemini /h/.config
              echo "seeded:"; ls -la /h/.claude /h/.codex /h/.gemini
          volumeMounts:
            - { name: cc-claude, mountPath: /h/.claude }
            - { name: cc-codex,  mountPath: /h/.codex }
            - { name: cc-gemini, mountPath: /h/.gemini }
            - { name: cc-config, mountPath: /h/.config }
            - { name: cli-creds, mountPath: /seed, readOnly: true }
      containers:
        - name: aifactory
          image: ghcr.io/olafkfreund/aifactory:v3.4.2
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3101 }]
          env:
            - { name: APP_HOST, value: "0.0.0.0" }
            - { name: APP_PORT, value: "3101" }
            # Shared HMAC key so PFactory's signed Task Contract verifies in
            # AIFactory's /api/tasks/from-plan (skip-planning fast path) — PARR (#517).
            - { name: AIFACTORY_TRUSTED_PLAN_KEY_PFACTORY, valueFrom: { secretKeyRef: { name: factory-secrets, key: AIFACTORY_TRUSTED_PLAN_KEY_PFACTORY } } }
            - { name: PATH, value: "/clis/bin:/home/projects/MagesticAI/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" }
            - { name: AIFACTORY_COMPLETION_WEBHOOK, value: "http://cfactory.factory.svc.cluster.local:3111/api/events" }
            - { name: ANTHROPIC_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: ANTHROPIC_API_KEY } } }
            - { name: GITHUB_TOKEN, valueFrom: { secretKeyRef: { name: factory-secrets, key: GITHUB_TOKEN } } }
            # Static API token for programmatic/MCP access (alongside OIDC SSO).
            - { name: APP_API_TOKEN, valueFrom: { secretKeyRef: { name: factory-secrets, key: APP_API_TOKEN } } }
            # OIDC SSO via Keycloak
            - { name: APP_OIDC_ENABLED, value: "true" }
            - { name: APP_OIDC_ISSUER_URL, value: "https://keycloak.freundcloud.org.uk/realms/factory" }
            - { name: APP_OIDC_CLIENT_ID, value: "aifactory" }
            - { name: APP_OIDC_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: factory-secrets, key: AIFACTORY_OIDC_CLIENT_SECRET } } }
            - { name: APP_OIDC_REDIRECT_URI, value: "https://aifactory.freundcloud.org.uk/api/auth/oidc/callback" }
            # rmux Live Agent Console — always on
            - { name: APP_RMUX_ENABLED, value: "true" }
            - { name: AIFACTORY_RMUX_ENABLED, value: "true" }
            - { name: AIFACTORY_RMUX_PANES_DIR, value: "/home/nonroot/.aifactory/rmux-panes" }
            # k3d can't host bwrap (node is a container); disable the bash sandbox
            # so agent bash works. Real syscall sandbox via gVisor tracked on AIFactory #363.
            - { name: AIFACTORY_BASH_SANDBOX, value: "false" }
            # PR endgame (#71 Phase 4): on a clean build, open a PR + request a
            # Copilot review, then STOP for a human. AUTO_MERGE deliberately left
            # UNSET (off) — nothing is auto-merged until explicitly enabled.
            - { name: AIFACTORY_AUTO_PR, value: "true" }
            # provider keys
            - { name: OPENAI_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: OPENAI_API_KEY } } }
            # Ollama Cloud via the OpenAI-compatible provider — a task model
            # string like "openai-compatible:qwen3-coder:480b" routes here.
            - { name: OPENAI_COMPATIBLE_BASE_URL, value: "https://ollama.com" }
            - { name: OPENAI_COMPATIBLE_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: OPENAI_COMPATIBLE_API_KEY } } }
            # TFactory handoff (#496) — opt-in auto-handover of finished tasks
            # for testing. send_handoff is a no-op without this base URL.
            - { name: TFACTORY_BASE_URL, value: "http://tfactory.factory.svc.cluster.local:3103" }
            - { name: GEMINI_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: GEMINI_API_KEY } } }
            - { name: CONTEXT7_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: CONTEXT7_KEY } } }
            - { name: LANGCHAIN_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: LANGCHAIN_API_KEY } } }
            - { name: RAPIDAPI_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: RAPIDAPI_KEY } } }
            - { name: CLAUDE_CODE_OAUTH_TOKEN, valueFrom: { secretKeyRef: { name: factory-secrets, key: CLAUDE_CODE_OAUTH_TOKEN } } }
          volumeMounts:
            - { name: data,      mountPath: /home/nonroot/.aifactory }
            - { name: clis,      mountPath: /clis }
            - { name: cc-claude, mountPath: /home/nonroot/.claude }
            - { name: cc-codex,  mountPath: /home/nonroot/.codex }
            - { name: cc-gemini, mountPath: /home/nonroot/.gemini }
            - { name: cc-config, mountPath: /home/nonroot/.config }
          readinessProbe: { httpGet: { path: /api/health, port: 3101 }, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 6 }
          livenessProbe:  { httpGet: { path: /api/health, port: 3101 }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 2Gi } }
      volumes:
        - { name: data,      persistentVolumeClaim: { claimName: aifactory-data } }
        - { name: clis,      emptyDir: {} }
        - { name: cc-claude, emptyDir: {} }
        - { name: cc-codex,  emptyDir: {} }
        - { name: cc-gemini, emptyDir: {} }
        - { name: cc-config, emptyDir: {} }
        - { name: cli-creds, secret: { secretName: factory-cli-creds } }
