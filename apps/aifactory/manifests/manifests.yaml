apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: aifactory-data, namespace: factory, labels: { app: aifactory } }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: { requests: { storage: 5Gi } }
---
# The warm /nix/store PVC (RFC-0016 #197) is GONE — removed with its GC CronJob and
# AIFACTORY_NIX_STORE_PVC env (Factory#253, AIFactory#830).
#
# Its own comment carried the assumption that broke it: "RWO is fine on this
# single-node cluster (all Jobs land on the one node holding local-path)". The
# cluster grew a second node and the comment did not. local-path is
# WaitForFirstConsumer, so each PV is created wherever its first consumer lands:
# aifactory-data settled on k3d-factory-server-0 and aifactory-nix-store on
# k3d-agent-0-0. Any pod mounting both RWO claims then satisfies NO node's
# affinity — the gate Job could not schedule at all. It also serialised concurrent
# Jobs on one mount (TFactory#623), which is what capped the fleet at 3-4
# concurrent tasks on 80 idle cores.
#
# Nothing needs it now: the -nix images bake the very store the PVC was seeded
# from (kube_sandbox's seed initContainer did `cp -a /nix/. /warm/` FROM the
# image), and both Job paths resolve /nix from the image —
# AIFACTORY_PACKED_NIX_IN_IMAGE=true covers the build path (build_backend) and the
# gate path (gate_runner, via core.nix_env.nix_in_image). The cost is only the
# closures realised during a task, re-fetched per Job instead of persisting:
# speed traded for schedulability.
---
apiVersion: v1
kind: Service
metadata: { name: aifactory, namespace: factory, labels: { app: aifactory } }
spec:
  selector: { app: aifactory }
  ports: [{ name: http, port: 3101, targetPort: 3101 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: aifactory, namespace: factory, labels: { app: aifactory } }
spec:
  # No `replicas:` — KEDA's HPA owns the replica count (RFC-0016 #192 / RFC-0017
  # #681). ArgoCD ignores /spec/replicas (see application.yaml ignoreDifferences)
  # so selfHeal doesn't fight the autoscaler. rmux is now multi-replica safe via
  # the shared Redis bus (REDIS_URL), so the old replicas:1 pin is lifted.
  selector: { matchLabels: { app: aifactory } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    metadata: { labels: { app: aifactory } }
    spec:
      serviceAccountName: aifactory-sandbox
      imagePullSecrets: [{ name: ghcr-pull }]
      enableServiceLinks: false
      # Factory#503. Every CronJob in this namespace has carried this set since
      # it was written; the Deployments never did, so nothing VERIFIED that the
      # control plane runs non-root — the image's `USER nonroot` was the only
      # thing holding it, and an image change that dropped it would start this
      # pod as root silently.
      # runAsUser is explicit and NUMERIC on purpose: the chainguard image's
      # `USER nonroot` is a NAME, and `runAsNonRoot: true` alone cannot resolve a
      # name — that is AIFactory#848, where every build Job died
      # CreateContainerConfigError. 65532 IS chainguard's `nonroot`, i.e. the uid
      # this pod already runs as; setting it changes nothing at runtime and makes
      # the kubelet refuse to start the pod the day the image changes.
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # #791: provider CLIs (claude-code, codex, gemini-cli + the `antigravity`
        # alias, and copilot) are now BAKED into the image at
        # /home/nonroot/.npm-global/bin (Dockerfile), so the old install-clis
        # init container + its /clis emptyDir are gone — no per-pod npm fetch to
        # stall the rollout. PATH above points at the baked bin dir.
        # Seed per-CLI OAuth credential files into writable dirs (so the CLIs can refresh tokens).
        - name: seed-creds
          image: busybox:1.36
          command: ["sh","-c"]
          args:
            - |
              set -e
              mkdir -p /h/.claude /h/.codex /h/.gemini /h/.config/github-copilot
              cp /seed/claude-credentials.json  /h/.claude/.credentials.json
              cp /seed/codex-auth.json          /h/.codex/auth.json
              cp /seed/copilot-apps.json        /h/.config/github-copilot/apps.json
              cp /seed/gemini-oauth_creds.json  /h/.gemini/oauth_creds.json
              # `|| true` is load-bearing under the pod-level runAsUser: 65532
              # added for Factory#503. The four mount ROOTS are owned root:65532
              # (kubelet applies fsGroup), and chmod(2) requires ownership, so as
              # uid 65532 they return EPERM. Measured, not assumed:
              #   chmod: /h/.claude: Operation not permitted
              # With `set -e` that aborts the init container and the pod never
              # starts at all. Everything BELOW the roots still gets chmod'd.
              # The chmod is near-redundant now anyway — every file here is
              # created by 65532, so it is already owner-writable.
              chmod -R g+rwX /h/.claude /h/.codex /h/.gemini /h/.config || true
              echo "seeded:"; ls -la /h/.claude /h/.codex /h/.gemini
          # Writes only into the mounts above, so a read-only root fs is free.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: cc-claude, mountPath: /h/.claude }
            - { name: cc-codex,  mountPath: /h/.codex }
            - { name: cc-gemini, mountPath: /h/.gemini }
            - { name: cc-config, mountPath: /h/.config }
            - { name: cli-creds, mountPath: /seed, readOnly: true }
      containers:
        # Credential sync (Factory#292). seed-creds copies the Secret into the
        # writable ~/.claude emptyDir ONCE at pod start, so a credential the
        # cred-broker CronJob refreshes never reaches a long-running pod (the
        # pod keeps a stale/expired token until it happens to restart). The
        # cli-creds Secret VOLUME is auto-refreshed by kubelet, so this sidecar
        # just re-copies it in whenever the seed is newer than what's on disk.
        # "Newer only" matters: the agent SDK also writes this file when it
        # refreshes, and we must not clobber a fresher token with a staler one.
        - name: cred-sync
          image: python:3.12-slim
          command: ["python3", "-u", "-c"]
          args:
            - |
              import json, os, shutil, time
              SEED = "/seed/claude-credentials.json"
              DEST = "/h/.claude/.credentials.json"
              def exp(p):
                  try:
                      with open(p) as f:
                          return int(json.load(f).get("claudeAiOauth", {}).get("expiresAt", 0))
                  except Exception:
                      return 0
              while True:
                  try:
                      s, d = exp(SEED), exp(DEST)
                      if s > d:
                          tmp = DEST + ".tmp"
                          shutil.copyfile(SEED, tmp)
                          os.chmod(tmp, 0o660)
                          os.replace(tmp, DEST)  # atomic; readers never see a partial file
                          print(f"cred-sync: adopted fresher credential (+{(s - d) / 3600000:.1f}h)", flush=True)
                  except Exception as e:
                      print(f"cred-sync: {type(e).__name__}: {e}", flush=True)
                  time.sleep(60)
          securityContext:
            allowPrivilegeEscalation: false
            # Stdlib-only inline script; every write goes to the /h/.claude
            # emptyDir. Verified read-only + uid 65532 against python:3.12-slim.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 5m, memory: 24Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - { name: cc-claude, mountPath: /h/.claude }
            - { name: cli-creds, mountPath: /seed, readOnly: true }
        - name: aifactory
          image: ghcr.io/olafkfreund/aifactory:v3.4.2
          imagePullPolicy: IfNotPresent
          # Factory#520. readOnlyRootFilesystem is now ON. #503 left it off with
          # an honest reason; this is the enumeration that reason asked for,
          # measured by running THIS image read-only rather than by reading the
          # source.
          #
          # The obvious fix stays wrong: /home/nonroot/.npm-global is 1.1G of
          # baked provider CLIs (#791, measured `du -sh` in the live pod), so an
          # emptyDir over /home/nonroot would MASK them and a per-pod init copy
          # of 1.1G under a KEDA autoscaler is not a fix either. Every volume
          # below therefore sits BELOW /home/nonroot, and `ls .npm-global/bin`
          # inside the read-only container still returns all 7 CLIs.
          #
          # Measured, read-only + uid 65532 + cap-drop ALL + no-new-privileges:
          #   /tmp                    18 tempfile sites  -> emptyDir; verified
          #                           tempfile.NamedTemporaryFile() succeeds
          #   ~/.cache                opencode_agentic   -> emptyDir; without it
          #                           `touch ~/.cache/x` -> Read-only file system
          #   ~/.npm                  npm _logs/_cacache -> emptyDir; same
          #   ~/.local                XDG state          -> emptyDir; not baked
          #                           at all, so nothing is masked
          #   ~/.claude.json          THE blocker. It is a FILE at the HOME
          #                           root, which no emptyDir can cover, and
          #                           `touch` there is Read-only file system.
          #                           Solved by CLAUDE_CONFIG_DIR below, NOT by
          #                           a volume — verified the CLI then writes
          #                           .claude.json + backups/ INTO the existing
          #                           .claude mount.
          #   ~/.gitconfig            read-only is fine: the identity is BAKED
          #                           and nothing in this codebase runs
          #                           `git config --global` (grepped). A CLI
          #                           that tries gets one failed command, not a
          #                           broken service.
          #   __pycache__ under       CPython silently skips bytecode on a
          #   /home/projects/...      read-only fs. Measured 277 .pyc files
          #                           written on the live pod today; they simply
          #                           stop being written.
          #
          # End to end, this exact image, fully read-only: alembic migrations
          # ran, "Application startup complete", GET /api/health -> 200.
          #
          # What is NOT proven here: a full agent build task. A write failure
          # mid-task is a runtime 500, not a CrashLoop, so pod status will not
          # catch it — watch one real build after this rolls out.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports: [{ containerPort: 3101 }]
          env:
            - { name: APP_HOST, value: "0.0.0.0" }
            - { name: APP_PORT, value: "3101" }
            # RFC-0016 #220/#673: durable shared state in Postgres (aifactory DB).
            # Replaces pod-local SQLite (~/.aifactory/data.db); init_db() runs
            # `alembic upgrade head` on boot (MIGRATIONS_AUTO_APPLY default true),
            # creating job_states + all tables. Makes the build admission queue
            # durable (HA-ready). Combined with the rmux shared Redis bus
            # (APP_REDIS_URL, RFC-0017 #681), aifactory is now multi-replica safe
            # and the old replicas:1 pin is lifted (KEDA owns replicas, max 3).
            # Out-of-band secret factory-db-aifactory.
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: factory-db-aifactory, key: DATABASE_URL } } }
            # Shared HMAC key so PFactory's signed Task Contract verifies in
            # AIFactory's /api/tasks/from-plan (skip-planning fast path) — PARR (#517).
            - { name: AIFACTORY_TRUSTED_PLAN_KEY_PFACTORY, valueFrom: { secretKeyRef: { name: factory-secrets, key: AIFACTORY_TRUSTED_PLAN_KEY_PFACTORY } } }
            - { name: PATH, value: "/home/nonroot/.npm-global/bin:/home/projects/MagesticAI/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" }
            # Factory#520. This is what makes readOnlyRootFilesystem possible at
            # all. The claude CLI writes ~/.claude.json at the HOME ROOT — a
            # single file, which no emptyDir can cover and which a subPath mount
            # would turn into a DIRECTORY. CLAUDE_CONFIG_DIR relocates it into
            # the .claude emptyDir that already exists. Verified read-only
            # against the baked CLI (2.1.215): with this set, `claude` writes
            # .claude.json (389 bytes) and backups/ under /home/nonroot/.claude;
            # without it the same call hits Read-only file system.
            # It points at the SAME directory seed-creds already seeds, so
            # .credentials.json resolution is unchanged.
            - { name: CLAUDE_CONFIG_DIR, value: "/home/nonroot/.claude" }
            - { name: AIFACTORY_COMPLETION_WEBHOOK, value: "http://cfactory.factory.svc.cluster.local:3111/api/events" }
            - { name: GITHUB_TOKEN, valueFrom: { secretKeyRef: { name: factory-secrets, key: GITHUB_TOKEN } } }
            # Static API token for programmatic/MCP access (alongside OIDC SSO).
            - { name: APP_API_TOKEN, valueFrom: { secretKeyRef: { name: factory-secrets, key: APP_API_TOKEN } } }
            # Federated cross-portal search (#149): read-scoped cockpit key so this
            # portal's /api/search proxy can query the cockpit's aggregated index.
            - { name: CFACTORY_READ_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: CFACTORY_READ_KEY } } }
            # OIDC SSO via Keycloak
            - { name: APP_OIDC_ENABLED, value: "true" }
            - { name: APP_OIDC_ISSUER_URL, value: "https://keycloak.freundcloud.org.uk/realms/factory" }
            - { name: APP_OIDC_CLIENT_ID, value: "aifactory" }
            - { name: APP_OIDC_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: factory-secrets, key: AIFACTORY_OIDC_CLIENT_SECRET } } }
            - { name: APP_OIDC_REDIRECT_URI, value: "https://aifactory.freundcloud.org.uk/api/auth/oidc/callback" }
            # rmux Live Agent Console — always on
            - { name: APP_RMUX_ENABLED, value: "true" }
            - { name: AIFACTORY_RMUX_ENABLED, value: "true" }
            - { name: AIFACTORY_RMUX_PANES_DIR, value: "/home/nonroot/.aifactory/rmux-panes" }
            # RFC-0017 #681: shared Redis bus for the rmux Live Agent Console.
            # When set, rmux registers panes + fans out pane bytes via Redis
            # (pub/sub + a pane index) so a console session served by ANY replica
            # reaches the pane, regardless of which replica started the build.
            # NOTE: the web-server Settings use env_prefix="APP_", so the bound
            # env var is APP_REDIS_URL (a bare REDIS_URL is ignored — verified
            # live 2026-06-21: settings.REDIS_URL stayed empty with REDIS_URL,
            # populated with APP_REDIS_URL). Unset => pod-local panes (single
            # replica only). Precondition for >1 replica.
            - { name: APP_REDIS_URL, value: "redis://redis.factory.svc.cluster.local:6379/0" }
            # k3d can't host bwrap (node is a container); disable the bash sandbox
            # so agent bash works. Real syscall sandbox via gVisor tracked on AIFactory #363.
            - { name: AIFACTORY_BASH_SANDBOX, value: "false" }
            # PR endgame (#71 Phase 4) — OPT-IN, default OFF. When "true", a
            # clean build opens a PR + requests a Copilot review, then STOPS for
            # a human. AIFACTORY_AUTO_MERGE (also default off) additionally
            # merges on Copilot APPROVED + re-tests. NOTE: live Copilot review
            # requires GitHub Copilot *code review* enabled for the repo/org;
            # without it the watcher degrades to pending→timeout→human-stop.
            # See guides/pr-endgame.md. Verified live 2026-06-10 (PR #10 on
            # aifactory-test). Left OFF after the test — flip to "true" to opt in.
            - { name: AIFACTORY_AUTO_PR, value: "true" }
            # RFC-0005/0006 in-cluster verification gate (#594). Trailing build
            # gates run as ephemeral k8s Jobs co-mounting the task worktree.
            # RFC-0016 #674: nixjob is now the DEFAULT build/gate execution path.
            # The thin nix-base image carries no toolchains; each task's flake
            # (materialized from the contract `environment`) provides them, so this
            # is language-agnostic (retires the single-image golang:1.25 experiment).
            # AIFACTORY_NIX_STORE_PVC is deliberately UNSET (Factory#253): /nix now
            # comes from the image, not a node-pinned RWO warm store. Unset means
            # gate_runner and build_backend both pass nix_store_pvc=None, which
            # kube_sandbox/job_dispatch treat as "no mount" — the documented
            # cold-fetch path. Do not reintroduce it without RWX storage; the two
            # RWO claims stranding on different nodes is what deadlocked the gate.
            - { name: AIFACTORY_SANDBOX_GATES, value: "true" }
            - { name: AIFACTORY_SANDBOX_BACKEND, value: "nixjob" }
            - { name: AIFACTORY_SANDBOX_IMAGE, value: "ghcr.io/olafkfreund/tfactory-runner-nix:latest" }
            - { name: AIFACTORY_SANDBOX_REPO_PVC, value: "aifactory-data" }
            # ── RFC-0011 label-driven intake poller (#636) — the issue->build
            # handover. INERT until an issue carries a `factory:*` label: the loop
            # lists issues, skips anything already `factory:queued` (its
            # idempotency guard, paired with a SQLite one), and ignores everything
            # without a `factory:` prefix. So enabling it with no labelled issues
            # is a no-op; labelling ONE issue fires exactly one run.
            #
            # Routing is by RFC-0011 difficulty tier: low/medium take the
            # skip-planning fast path straight to a build; hard routes to PFactory.
            #
            # PFACTORY_INGEST_URL: hard-tier issues route to PFactory planning.
            # The contract mismatch that kept this unset is fixed: PFactory#306
            # added POST /api/plan/sessions/from-issue accepting exactly
            # _route_hard's payload {repo, provider, issue_number, title, body,
            # labels, autonomy_tier, change_mode}; shipped to main via PFactory
            # PR #312 (2026-07-17) and probed live from this pod (401 without
            # auth, i.e. the route exists). Auth: _pfactory_token() falls back to
            # the shared APP_API_TOKEN this pod already carries. _route_hard
            # POSTs this URL DIRECTLY (not as a base) — keep the full path.
            - { name: PFACTORY_INGEST_URL, value: "http://pfactory.factory.svc.cluster.local:3114/api/plan/sessions/from-issue" }
            #
            # AIFACTORY_URL is the poller's base for its OWN /api/tasks/from-issue
            # route — in-cluster localhost (Service port 3101, verified), not the
            # public ingress, so intake does not depend on Cloudflare/oauth2-proxy
            # being in the path. GITHUB_TOKEN (factory-secrets) is the fetch/label
            # credential.
            - { name: AIFACTORY_INTAKE_POLLER, value: "false" }
            # AIFactory#1064 orphaned-task reaper. A task's status is written
            # by the worker running it, so when that worker dies nothing writes
            # the terminal status and the card shows as active forever --
            # 089-memory-chain-probe-three sat at in_progress for 36 hours.
            #
            # REPORT-ONLY. It logs one JSON line per sweep naming every task it
            # WOULD cancel and changes nothing. Flip REAPER_DRY_RUN to "false"
            # only after reading those reports and confirming it names real
            # orphans -- enabling the loop and enabling writes are deliberately
            # two separate decisions.
            #
            # Runs in this pod rather than a CronJob because the spec tree is on
            # a ReadWriteOnce PVC: a separate pod scheduled onto another node
            # reads an empty directory, reports zero orphans and exits 0.
            - { name: AIFACTORY_STALE_REAPER, value: "true" }
            - { name: REAPER_DRY_RUN, value: "true" }
            - { name: AIFACTORY_INTAKE_INTERVAL_S, value: "30" }
            - { name: AIFACTORY_URL, value: "http://localhost:3101" }
            # The poller calls its OWN /api/tasks/from-issue and authenticates
            # with `AIFACTORY_TOKEN or GH_TOKEN` (intake_poller._post_json).
            # Unset, it fell back to GH_TOKEN — a GitHub PAT — and AIFactory
            # rightly answered 401, which the poller reported on the issue:
            #   "AIFactory intake failed (terminal):
            #    http://localhost:3101/api/tasks/from-issue -> HTTP 401"
            # Point it at the API's own token. (The GH_TOKEN fallback is a code
            # smell — a GitHub PAT is never valid against our API — tracked
            # separately; this is the config that makes intake work today.)
            - name: AIFACTORY_TOKEN
              valueFrom:
                secretKeyRef: { name: factory-secrets, key: APP_API_TOKEN }
            # project_id is the AIFactory project the repo maps to (registered via
            # POST /api/projects with gitUrl, which clones into the workspaces
            # PVC). Start with the demo target only — it is disposable and is the
            # same repo the recorded poller demo ran against. Add fleet repos here
            # once the chain is proven end-to-end on it.
            # olafkfreund/TFactory added 2026-07-17: first fleet repo dogfooding
            # the factory on its own code (project registered with branch=dev so
            # builds base off the integration branch).
            - name: AIFACTORY_INTAKE_REPOS
              value: '[{"provider":"github","repo":"olafkfreund/aifactory-demo","project_id":"5d78d4b9-35f9-4445-92c1-78f3ff60a494"},{"provider":"github","repo":"olafkfreund/TFactory","project_id":"de08a1a1-d9ba-4ff0-a1f6-80db8be476a1","base_branch":"dev"}]'
            # RFC-0016 #671 / RFC-0017: run.py-as-a-k8s-Job build backend.
            # FLIP #1 (2026-06-21) REVERTED: StartError — the build Job ran on the
            # thin AIFACTORY_SANDBOX_IMAGE (no bash/python). FIXED in #685.
            # FLIP #2 (2026-06-21, post-#685) ALSO REVERTED — but #685 DID work:
            # the build Job dispatched on the python-capable AIFACTORY_IMAGE, the
            # container STARTED (StartError gone), bash+python ran. A NEW defect
            # surfaced: the entrypoint ran `python run.py … ` with workingDir=/work
            # but run.py lives at /home/projects/MagesticAI/apps/backend/run.py in
            # the image, NOT in the co-mounted worktree /work → every build Job
            # died with `python: can't open file '/work/run.py': [Errno 2]`.
            # FIX (#686, merged f1135ee): build Job invokes run.py by its ABSOLUTE
            # image path while keeping --project-dir /work.
            # FLIP #3 (2026-06-21, post-#686) ALSO REVERTED — but #686 DID work:
            # the build Job ran on sha-f1135ee, the entrypoint invoked run.py by its
            # ABSOLUTE image path (`python /home/projects/MagesticAI/apps/backend/
            # run.py --spec <id> --project-dir /work …`), and run.py EXECUTED — the
            # AUTO-BUILD FRAMEWORK banner printed (no StartError, no /work/run.py
            # Errno 2). exit=1 from the app logic itself.
            # A NEW, distinct defect surfaced (next-in-chain): run.py printed
            #   `Error: Spec '031-…' not found / No specs found` and exited 1.
            # Root cause: the kubejob dispatch co-mounts the per-task worktree
            #   .aifactory/worktrees/tasks/<spec_id>  at /work, but on this fast
            #   path that worktree is an EMPTY STUB — it contains only
            #   `.aifactory/.gitignore_checked` + `.gitignore`, NO git checkout and
            #   NO `.aifactory/specs/<spec_id>/spec.md`. find_spec(/work, <id>)
            #   (cli/utils.py) therefore finds nothing. The spec DOES exist in the
            #   PROJECT specs dir (.aifactory/specs/<id>/spec.md), and the in-pod
            #   path works because _spawn_task_execution creates+populates a real
            #   git worktree (with the spec) before running; the kubejob dispatch
            #   skips that worktree materialization. Proven live on aifactory-test:
            #   Job factory-aifactory-lass-kubejob-b2-vali (BackoffLimitExceeded,
            #   exit=1); worktree 031-…/ had .aifactory/.gitignore_checked only vs
            #   a full checkout in the in-pod worktree 028-go-hello-kubejob/.
            # Needs a CODE fix in AIFactory build dispatch (build_backend.py /
            #   agent_service): create + populate the per-task worktree (git
            #   worktree add + copy/sync the spec into .aifactory/specs) BEFORE
            #   dispatching the Job, mirroring _spawn_task_execution. Cannot be
            #   fixed from gitops env. Staying on the in-pod subprocess default
            #   until that lands.
            # AIFACTORY_IMAGE pins the python-capable image the build Job runs on.
            # CD bumps the kustomization newTag but NOT this env — keep this SHA
            # aligned with kustomization.yaml newTag (FLAT manifests; no Helm
            # image-injection). RFC-0017 #190 (Stage E, 2026-06-23): realigned to
            # sha-ccbd0ce (== current kustomization newTag / running Deployment
            # image) from sha-54ccf04. sha-54ccf04 carried the unpack consumer but
            # NOT the packed-Job fixes in #727: it mounts no writable /work for a
            # packed Job (nonroot unpack dies PermissionError: /work) and its
            # consumer doesn't mark the unpacked repo git-safe (worktree setup dies
            # `detected dubious ownership in repository at '/work'`). Both were
            # caught in live #190 validation and fixed in #727 (ccbd0ce). So with
            # AIFACTORY_PACK_WORKSPACE ON, the build Job MUST run sha-ccbd0ce — the
            # control plane (newTag) emits the writable-/work emptyDir manifest and
            # the build Job (this pin) unpacks + git-safes /work end-to-end.
            - { name: AIFACTORY_IMAGE, value: "ghcr.io/olafkfreund/aifactory:sha-ccbd0ce" }
            # FLIP #4 (round-4, 2026-06-21, post-#687) REVERTED — but #687 DID
            # work, the empty-worktree defect that reverted FLIP #3 is RESOLVED.
            # Proven live on aifactory-test, Job
            # factory-aifactory-hello-class-b4-vali (image sha-b91f6a4):
            #   - the per-task worktree MATERIALIZED at /work — full git checkout
            #     (src/ tests/ pyproject.toml …) AND
            #     .aifactory/specs/032-go-hello-class-b4-vali/spec.md present
            #     (SPEC_FOUND). No empty stub.
            #   - run.py STARTED on the python-capable AIFACTORY_IMAGE, the
            #     AUTO-BUILD FRAMEWORK banner printed, and it FOUND the spec
            #     (`Spec: 032-go-hello-class-b4-vali`). No StartError, no
            #     /work/run.py Errno 2, no "Spec not found".
            # A NEW, distinct next-in-chain defect surfaced: the build Job was
            # created with ONLY 2 env vars (JOB_ID, FACTORY_SERVICE) — the
            # dispatch does NOT propagate the LLM credential the in-pod path has
            # (CLAUDE_CODE_OAUTH_TOKEN), nor the other ~37 env vars — so run.py
            # died: `Error: No OAuth token found … Magestic AI requires Claude
            # Code OAuth authentication`. Job reached terminal Failed
            # (BackoffLimitExceeded, exit !=0).
            # Needs a CODE fix in AIFactory build dispatch (build_backend.py /
            # agent_service kubejob Job-spec): inject CLAUDE_CODE_OAUTH_TOKEN (and
            # the rest of the build env / provider keys) into the Job container,
            # mirroring the in-pod subprocess env. Cannot be fixed from gitops.
            # FLIP #5 (round-5, 2026-06-21, post-#688) REVERTED — but #688 DID
            # work, the round-4 "No OAuth token found" that reverted FLIP #4 is
            # RESOLVED. Proven live on aifactory-test, Job
            # factory-aifactory-e-b-kubejob-build-sm (image sha-8e0f0e8):
            #   - the build Job container env now carries CLAUDE_CODE_OAUTH_TOKEN
            #     (len 108, in `env` NOT argv) + GITHUB_TOKEN + the fixed build
            #     env (CI/CLAUDE_CODE_ENTRYPOINT/PYTHONUNBUFFERED/IOENCODING).
            #   - run.py STARTED, the AUTO-BUILD banner printed, it FOUND the spec
            #     (`Spec: 032-rfc17-stage-b-kubejob-build-sm`), and crucially:
            #     `Auth: CLAUDE_CODE_OAUTH_TOKEN` + `Auth pre-flight: anthropic OK`
            #     — the credential AUTHENTICATED. NO "No OAuth token found".
            #     #688 (build-Job OAuth/env injection) is PROVEN resolved.
            # A NEW, distinct next-in-chain defect surfaced: setup_workspace →
            # WorktreeManager(/work) died `core.worktree.WorktreeError: Failed to
            # get current branch: fatal: not a git repository (null)` /
            # `Error: No .git directory found at /work`. The kubejob build dispatch
            # co-mounts the spec + project FILES at /work but NOT a git repo (no
            # .git), so run.py's isolated-worktree setup (WorktreeManager) cannot
            # create a worktree. The in-pod path runs in a real git checkout; the
            # kubejob /work mount is a plain dir. Job terminal Failed (exit 1,
            # backoffLimit 0). Needs a CODE fix in AIFactory build dispatch:
            # materialize /work as a git repo (init/clone or co-mount the .git)
            # before the Job, OR run the build with a worktree mode that does not
            # require an outer git repo at /work. Cannot be fixed from gitops env.
            # FLIP #5 blocker RESOLVED (2026-06-23): AIFactory #716 makes
            # populate_build_worktree build a SELF-CONTAINED git clone at /work
            # (real .git dir + aifactory/<spec> branch + GitHub origin + spec),
            # so WorktreeManager + the PR-endgame push work in-Job. #51 (below)
            # seeds the file-auth CLI creds. All build-Job code blockers are now
            # fixed (#685 image / #686 abs run.py / #716 self-contained /work /
            # #688 OAuth / #689 provider env / #690 file-auth creds) → flipping the
            # build to Job-native. REVERT = re-comment this one line.
            - { name: AIFACTORY_BUILD_BACKEND, value: "kubejob" }
            # #690: file-auth CLI creds for the dispatched build Job — seeds the
            # factory-cli-creds secret into the Job pod via the seed-creds
            # initContainer (build_backend._inject_seed_creds). INERT until
            # AIFACTORY_BUILD_BACKEND=kubejob (default off), so it is safe to set
            # ahead of the build-default flip: the Job then has file-auth provider
            # parity (codex/gemini-oauth/copilot) the moment kubejob is enabled.
            - { name: AIFACTORY_CLI_CREDS_SECRET, value: "factory-cli-creds" }
            # RFC-0017 #190 (Stage E): S3-compatible object store (in-cluster
            # MinIO) for packed build workspaces. The shared client
            # (apps/backend/core/artifact_store.py) reads this S3_* namespace —
            # NOT the chart's fsspec AIFACTORY_S3_*/AWS_* WorkspaceStore vars.
            # The producer (build_backend pack) AND the dispatched build Job
            # (core/workspace_fetch unpack, which inherits these via
            # build_backend._PASSTHROUGH_BUILD_ENV, AIFactory #726) both need
            # them. INERT until AIFACTORY_PACK_WORKSPACE=true (default off): with
            # the flag off the producer never packs, so /work still comes from the
            # RWO co-mount and these vars are unused. Safe to set ahead of the
            # pack flip. Mirrors TFactory's verify-artifact S3_* block. Creds from
            # the out-of-band `minio-creds` Secret. REVERT = remove these lines.
            - { name: S3_ENDPOINT, value: "http://minio.factory.svc.cluster.local:9000" }
            - { name: S3_BUCKET, value: "factory-artifacts" }
            - { name: S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: minio-creds, key: S3_ACCESS_KEY } } }
            - { name: S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: minio-creds, key: S3_SECRET_KEY } } }
            # RFC-0017 #190 (Stage E) FLIP: turn ON workspace packing. The build
            # producer (build_backend) now packs the populated /work to MinIO and
            # threads the s3:// URI onto the Job's WORKSPACE_URI; the Job drops the
            # RWO /work co-mount (slice 5) and unpacks from object storage instead
            # (core/workspace_fetch), so a build Job is no longer pinned to the
            # worktree's node. Requires: AIFACTORY_BUILD_BACKEND=kubejob (set
            # above), the S3_* env (above), and AIFactory #721-#726 (all shipped).
            # Producer is fail-safe (pack error → falls back to co-mount); once a
            # pack succeeds the Job unpack is fail-loud (no co-mount). Pre-flip S3
            # round-trip from the live pod verified OK. REVERT = remove this line.
            - { name: AIFACTORY_PACK_WORKSPACE, value: "true" }
            # RFC-0017 #190 (Stage E) DEPIN: source nix from the build IMAGE
            # instead of the node-pinned aifactory-nix-store warm-store PVC, so a
            # PACKED build Job is no longer re-pinned to that PVC's node — the last
            # node-affinity on the packed path (closes #190 / epic #206).
            # AIFACTORY_BUILD_IMAGE overrides AIFACTORY_IMAGE for the build Job ONLY
            # (build_backend._resolve_build_image precedence) and points at the
            # `-nix` variant: the cf0dea8 runtime image — a strict superset of the
            # ccbd0ce AIFACTORY_IMAGE pin, so it still carries the #727 writable-/work
            # + git-safe-/work packed-Job fixes (cf0dea8 = e386c4c + docs + the
            # chainguard/python CVE base-digest bump #735, no functional change) —
            # PLUS a baked /nix/store (Dockerfile
            # build-runtime stage, published by build-nix.yml). AIFACTORY_PACKED_NIX_IN_IMAGE
            # makes build_backend DROP the nix-store PVC volume from the packed build
            # Job (Slice A gate, #730); the Job then resolves `nix develop` from the
            # image's own /nix/store.
            # UPDATE (Factory#253, AIFactory#830): this flag is no longer packed-path
            # only. The line that used to sit here — "INERT unless
            # AIFACTORY_PACK_WORKSPACE=true (packed path only) — the GATE/sandbox Jobs
            # keep AIFACTORY_NIX_STORE_PVC above" — described the bug: the flip landed
            # on the build path and silently missed the gate path, which kept mounting
            # the stranded RWO PVC and could not schedule once the PVs split across
            # nodes. gate_runner now reads the SAME predicate (core.nix_env.nix_in_image),
            # and AIFACTORY_NIX_STORE_PVC is gone entirely, so both paths source /nix
            # from their image. REVERT = remove these two lines.
            # NOTE (2026-06-25): the build-nix.yml publish workflow tags the -nix
            # image with a 7-char short SHA (sha-205d6f1-nix), but git abbreviates
            # commit #745 to 8 chars (205d6f19) for uniqueness. Pinning the git
            # short-SHA here (sha-205d6f19-nix) 404s — the pushed tag is 7-char.
            # Corrected to the actual published tag. Validated live: pulls + runs
            # nix 2.30.1 (121 /nix/store entries) on a 2nd k3d node, no nix PVC.
            - { name: AIFACTORY_BUILD_IMAGE, value: "ghcr.io/olafkfreund/aifactory:sha-fe6cd10-nix" }
            - { name: AIFACTORY_PACKED_NIX_IN_IMAGE, value: "true" }
            # provider keys
            - { name: OPENAI_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: OPENAI_API_KEY } } }
            # Ollama Cloud via the OpenAI-compatible provider — a task model
            # string like "openai-compatible:qwen3-coder:480b" routes here.
            - { name: OPENAI_COMPATIBLE_BASE_URL, value: "http://host.k3d.internal:11434" }
            - { name: OPENAI_COMPATIBLE_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: OPENAI_COMPATIBLE_API_KEY } } }
            # Local reasoning models (Ollama gemma4/gpt-oss) spend the response
            # budget on hidden thinking; bound it + reserve an output budget so
            # structured/tool turns actually emit (else finish=length, empty).
            - { name: OPENAI_COMPATIBLE_REASONING_EFFORT, value: "low" }
            - { name: OPENAI_COMPATIBLE_MAX_TOKENS, value: "4096" }
            # TFactory handoff (#496) — opt-in auto-handover of finished tasks
            # for testing. send_handoff is a no-op without this base URL.
            - { name: TFACTORY_BASE_URL, value: "http://tfactory.factory.svc.cluster.local:3103" }
            - { name: GEMINI_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: GEMINI_API_KEY } } }
            # Headless/automated runs: the gemini/antigravity CLI refuses to run in an
            # "untrusted" workspace and exits before any API call. The build subprocess
            # inherits the server env, so set trust here (not just per-invocation).
            - { name: GEMINI_CLI_TRUST_WORKSPACE, value: "true" }
            - { name: CONTEXT7_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: CONTEXT7_KEY } } }
            - { name: LANGCHAIN_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: LANGCHAIN_API_KEY } } }
            - { name: RAPIDAPI_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: RAPIDAPI_KEY } } }
            - { name: CLAUDE_CODE_OAUTH_TOKEN, valueFrom: { secretKeyRef: { name: factory-secrets, key: CLAUDE_CODE_OAUTH_TOKEN } } }
            # OpenTelemetry export -> in-cluster OpenObserve OTLP/HTTP backend
            # (apps/observe, service `observe:5080`). The web-server exporter
            # (#567) honors these and is a NO-OP when OTEL_EXPORTER_OTLP_ENDPOINT
            # is unset; a bad endpoint only logs (never crashes the factory).
            # OpenObserve ingests OTLP/HTTP under an org-scoped base; the OTel SDK
            # appends /v1/{traces,metrics,logs}. Org = `default`. Verified live:
            # POST .../api/default/v1/traces -> 401 unauth / 400 with Basic auth.
            # Auth header (HTTP Basic root creds) is sourced from secret
            # otel-otlp-auth (key `headers`) — NEVER inlined; built from observe-root.
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://observe.factory.svc.cluster.local:5080/api/default" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf" }
            - { name: OTEL_EXPORTER_OTLP_HEADERS, valueFrom: { secretKeyRef: { name: otel-otlp-auth, key: headers } } }
          volumeMounts:
            - { name: data,      mountPath: /home/nonroot/.aifactory }
            - { name: cc-claude, mountPath: /home/nonroot/.claude }
            - { name: cc-codex,  mountPath: /home/nonroot/.codex }
            - { name: cc-gemini, mountPath: /home/nonroot/.gemini }
            - { name: cc-config, mountPath: /home/nonroot/.config }
            # Factory#520. Every one of these is BELOW /home/nonroot on purpose
            # — see the securityContext comment. They are emptyDirs, not
            # volumes, because none of them holds anything worth surviving a
            # pod: ~/.cache and ~/.npm are download caches whose baked contents
            # are only useful to an installer that no longer runs at runtime
            # (#791 baked the CLIs), and ~/.local does not exist in the image at
            # all, so nothing is masked.
            - { name: tmp,        mountPath: /tmp }
            - { name: home-cache, mountPath: /home/nonroot/.cache }
            - { name: home-npm,   mountPath: /home/nonroot/.npm }
            - { name: home-local, mountPath: /home/nonroot/.local }
          readinessProbe: { httpGet: { path: /api/health, port: 3101 }, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 6 }
          livenessProbe:  { httpGet: { path: /api/health, port: 3101 }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 1Gi }, limits: { memory: 12Gi } }
      volumes:
        - { name: data,      persistentVolumeClaim: { claimName: aifactory-data } }
        - { name: cc-claude, emptyDir: {} }
        - { name: cc-codex,  emptyDir: {} }
        - { name: cc-gemini, emptyDir: {} }
        - { name: cc-config, emptyDir: {} }
        - { name: cli-creds, secret: { secretName: factory-cli-creds } }
        # Factory#520 — the writable holes a read-only rootfs needs.
        - { name: tmp,        emptyDir: {} }
        - { name: home-cache, emptyDir: {} }
        - { name: home-npm,   emptyDir: {} }
        - { name: home-local, emptyDir: {} }
---
# RFC-0005 #68: dedicated SA + scoped Role so the coder can launch per-task
# verification sandboxes as ephemeral Kubernetes Jobs (the in-cluster backend;
# the pod has no container runtime). Least-privilege: jobs + read-only pod logs
# in the factory namespace only. No cluster-wide rights.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aifactory-sandbox
  namespace: factory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aifactory-sandbox
  namespace: factory
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aifactory-sandbox
  namespace: factory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aifactory-sandbox
subjects:
  - kind: ServiceAccount
    name: aifactory-sandbox
    namespace: factory
---
# The aifactory-nix-store-gc CronJob (RFC-0016 #197) is GONE with the PVC it
# trimmed (Factory#253). It nightly `nix store gc`'d a warm store that nothing
# writes to any more — garbage-collecting garbage. Per-Job /nix now comes from
# the image and dies with the Job, so there is nothing to cap.
