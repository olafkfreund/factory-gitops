# KubeVirt v1.9.1, upstream release manifests unchanged (kubevirt-operator.yaml, kubevirt-cr.yaml from
# github.com/kubevirt/kubevirt/releases/tag/v1.9.1), with every image pinned to tag@digest (docs/image-digest-pinning.md).
# The operator reads one *_IMAGE variable per component (pkg/virt-operator/util/config.go at v1.9.1).
# Supports Kubernetes 1.34-1.36 (kubevirt/sig-release releases/k8s-support-matrix.md); the cluster runs 1.35.
# KVM only: no developerConfiguration.useEmulation. For RFactory #3 (desktop VMs, olafkfreund/RFactory
# plan/2026-11-18-3-agent-workspace-k3d.md step k1a).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kubevirt-operator.yaml
  - kubevirt-cr.yaml
patches:
  - target: {kind: Deployment, name: virt-operator, namespace: kubevirt}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: quay.io/kubevirt/virt-operator:v1.9.1@sha256:a8adf7b772e9ce0bf7e2ce889910fc41ebadf552c9dbe843e9b86641e34f5df9
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: quay.io/kubevirt/virt-operator:v1.9.1@sha256:a8adf7b772e9ce0bf7e2ce889910fc41ebadf552c9dbe843e9b86641e34f5df9
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: VIRT_API_IMAGE, value: "quay.io/kubevirt/virt-api:v1.9.1@sha256:d341c751dbe632d183989cce78203a888293e0e2a32719f32461bd6273322485"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: VIRT_CONTROLLER_IMAGE, value: "quay.io/kubevirt/virt-controller:v1.9.1@sha256:75c94c787eec15458729848e00fe0b421ca8998c6219de8c2d3cae72ff0bd287"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: VIRT_HANDLER_IMAGE, value: "quay.io/kubevirt/virt-handler:v1.9.1@sha256:c23b635ea4aff7f0779c6c061c431da0469c7796255e6de90a5970236b5ea61b"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: VIRT_LAUNCHER_IMAGE, value: "quay.io/kubevirt/virt-launcher:v1.9.1@sha256:53e6d12197761cda653201f82e295ac6098d689a58bc2c68df0970c248d61fa6"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: VIRT_EXPORTPROXY_IMAGE, value: "quay.io/kubevirt/virt-exportproxy:v1.9.1@sha256:fe9a0a297e7b407c3a322c6f5fccba5313c668907c30cb0b80b8c51bcdea640a"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: VIRT_EXPORTSERVER_IMAGE, value: "quay.io/kubevirt/virt-exportserver:v1.9.1@sha256:76c01dca74921eb5fd74d00b82e77a60d58e8213c72d84cc66a3bc92679690b8"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: VIRT_SYNCHRONIZATIONCONTROLLER_IMAGE, value: "quay.io/kubevirt/virt-synchronization-controller:v1.9.1@sha256:5f3da789a7b7a4febb1ece9f4a085ceb73aabcd468af84563ea7b6809341eb10"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: GS_IMAGE, value: "quay.io/kubevirt/libguestfs-tools:v1.9.1@sha256:08df144de2a77ad8259f93df3dca7e13e73669651ce8fbe63f58c23e4fdd6427"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: PR_HELPER_IMAGE, value: "quay.io/kubevirt/pr-helper:v1.9.1@sha256:c7724681efa3297091d0ce0edf4fda52c062455fb83b76484499a46ae261f61d"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: SIDECAR_SHIM_IMAGE, value: "quay.io/kubevirt/sidecar-shim:v1.9.1@sha256:d48c6af64305c28de7e9a5509a11737b115cc0193f57f2a0f42faff85bebe5cd"}
  - target: {kind: KubeVirt, name: kubevirt}
    patch: |-
      - op: add
        path: /metadata/annotations
        value: {argocd.argoproj.io/sync-wave: "1", argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true}
