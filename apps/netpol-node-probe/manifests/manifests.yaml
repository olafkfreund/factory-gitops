# netpol-node-probe: NetworkPolicy enforcement, proven per node (Factory#3782).
#
# One CronJob (server-0). The agent-0 CronJob is RETIRED (Factory#3832): agent-0
# carries the taint rfactory.io/desktops=true:NoSchedule (RFactory#3) and Kyverno
# `rfactory-desktops-toleration` admits that toleration only on desktop launcher
# pods, so the probe pod stayed Pending until its deadline every run. New task
# pods cannot land on agent-0 either, so the probe's subject is gone. If the
# taint is lifted, restore the CronJob from git history (docs/runbooks/k3d-restart.md).
# Each pod carries factory.io/kind=task, so
# factory-sandbox-jobs-egress selects it like any task pod, and runs the same
# two-leg check as the netpol-gate (apps/kyverno-policies): the kube-api
# ClusterIP must connect AND this node's kubelet :10250 must be refused. Both
# legs together: "refused" alone also describes a pod with no network.
#
# CEILING: an EGRESS sentinel for fresh task pods on that node. It does not prove
# ingress default-deny. A kubelet unreachable for some other reason would read as
# enforced, the same ceiling the gate has. The rule-count check in
# docs/runbooks/k3d-restart.md is the broader human-run proof.
#
# FAILURE MODES, all of which fail the Job (job-watchdog -> GitHub issue):
#   gate init container fails  -> read its log (`netpol-gate`)
#   Kyverno down (webhook Fail) -> no pod is created; check Kyverno first
#   node NotReady / renamed     -> pod stays Pending until the deadline; node
#                                  names below are hard-coded
#   main container fails       -> its log names the node and the failed leg
#
# No RBAC, no token, no hostNetwork, not privileged.
apiVersion: v1
kind: ConfigMap
metadata:
  name: netpol-node-probe-script
  namespace: factory
  labels: { app: netpol-node-probe }
data:
  probe.sh: |
    set -u
    allowed() { nc -z -w2 10.43.0.1 443 >/dev/null 2>&1; }
    denied()  { ! nc -z -w1 "$HOST_IP" 10250 >/dev/null 2>&1; }
    i=0
    while [ "$i" -lt 30 ]; do
      # Sampled twice so one dropped SYN cannot read as an enforced policy.
      if allowed && denied && allowed && denied; then
        echo "OK: NetworkPolicy enforced for task pods on $NODE ($HOST_IP)"
        exit 0
      fi
      i=$((i + 1))
      sleep 1
    done
    if allowed; then
      echo "FAIL $NODE: kube-api reachable and kubelet $HOST_IP:10250 ALSO reachable, so NO NetworkPolicy is in force for task pods on this node. Likely kube-router holds a stale node IP after a restart: see docs/runbooks/k3d-restart.md" >&2
    elif denied; then
      echo "FAIL $NODE: UNKNOWN, neither kube-api nor kubelet is reachable. Either policy is enforced and egress rule 4 of factory-sandbox-jobs-egress no longer matches, or this pod has no network." >&2
    else
      echo "FAIL $NODE: kubelet reachable and kube-api is NOT; fix API reachability first." >&2
    fi
    exit 1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: netpol-node-probe-server
  namespace: factory
  labels: { app: netpol-node-probe }
spec:
  # Not staggered: apps/job-watchdog reads `5-59/10` style schedules as hourly.
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  # Failed Jobs are the evidence job-watchdog counts; keep them (no TTL).
  failedJobsHistoryLimit: 10
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 0
      # Covers pod start, the Kyverno-injected netpol-gate (up to 60 polls) and
      # the check below. A NotReady node never starts the pod, so this also fails.
      activeDeadlineSeconds: 420
      template:
        metadata:
          labels:
            # The selector factory-sandbox-jobs-egress uses, so this pod is
            # confined exactly like a real task pod. Kyverno injects the gate too.
            factory.io/kind: task
            app: netpol-node-probe
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          automountServiceAccountToken: false
          # Not nodeName: that would skip the scheduler's resource and taint checks.
          nodeSelector: { kubernetes.io/hostname: k3d-factory-server-0 }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: probe
              image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
              command: ["sh", "/script/probe.sh"]
              env:
                - name: HOST_IP
                  valueFrom: { fieldRef: { fieldPath: status.hostIP } }
                - name: NODE
                  valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { memory: 32Mi }
              volumeMounts:
                - { name: script, mountPath: /script, readOnly: true }
          volumes:
            - name: script
              configMap: { name: netpol-node-probe-script }
