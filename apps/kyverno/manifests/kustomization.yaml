# Kyverno admission controller — the engine that evaluates the image
# signature-verification policy in apps/kyverno-policies/.
#
# Rendered from the upstream pinned release install.yaml, exactly the same
# remote-resource pattern bootstrap/kustomization.yaml uses for argo-cd.
# Bump deliberately: change the release tag below, never track `latest`.
#
# Footprint (v1.12.6): admission-controller + background-controller +
# cleanup-controller + reports-controller Deployments in the `kyverno`
# namespace, plus Kyverno CRDs (ClusterPolicy, Policy, PolicyReport, ...)
# and one ValidatingWebhookConfiguration. Its webhook failurePolicy for our
# policy is pinned to Ignore (see the ClusterPolicy) so a Kyverno outage can
# never block Pod admission fleet-wide.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kyverno/kyverno/releases/download/v1.12.6/install.yaml
