# Kyverno admission controller — the engine that evaluates the image
# signature-verification policy in apps/kyverno-policies/.
#
# Rendered from the upstream pinned release install.yaml, exactly the same
# remote-resource pattern bootstrap/kustomization.yaml uses for argo-cd.
# Bump deliberately: change the release tag below, never track `latest`.
#
# Footprint (v1.18.2): admission-controller + background-controller +
# cleanup-controller + reports-controller Deployments in the `kyverno`
# namespace, plus 22 Kyverno CRDs (ClusterPolicy, Policy, PolicyReport, ...)
# and 9 webhook configurations. Our policy pins failurePolicy: Ignore and
# validationFailureAction: Audit (see the ClusterPolicy), so a Kyverno outage
# can never block Pod admission fleet-wide.
#
# Was v1.12.6 until 2026-07-26. That release shipped four cleanup CronJobs
# running `bitnami/kubectl:1.28.5`, which stopped resolving when Bitnami
# retired their public Docker Hub catalogue:
#
#   Failed to pull "bitnami/kubectl:1.28.5":
#   docker.io/bitnami/kubectl:1.28.5: not found
#
# leaving four pods in ImagePullBackOff on every schedule. Upstream removed
# those CronJobs entirely — the cleanup-controller handles report pruning
# natively — so bumping deletes the broken component rather than pinning a
# replacement image. It also stops running a 1.28-era kubectl against this
# v1.31.5 cluster.
#
# Verified before the bump: v1.18.2 still serves ClusterPolicy v1/v2beta1, and
# verifyImages / attestors / keyless / mutateDigest remain in the CRD schema,
# so the policy manifest needed no changes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kyverno/kyverno/releases/download/v1.18.2/install.yaml

# Drop the empty `metadata.labels: {}` upstream emits on the eleven
# policies.kyverno.io CRDs (Factory#440).
#
# THE DEFECT: v1.18.2's install.yaml renders those eleven CRDs with a literal
# `labels: {}` — the other eleven Kyverno CRDs carry real labels. The API
# server does not store an empty map, so the live object comes back with no
# `labels` key at all. ArgoCD then compares a desired object that HAS
# `metadata.labels` against a live object that does not, forever. Measured
# against the live cluster via the ArgoCD managed-resources API:
#
#   validatingpolicies.policies.kyverno.io   (OutOfSync)
#     live -> target:  + "labels": {}
#   clusterpolicies.kyverno.io               (Synced)
#     live -> target:  (no metadata difference)
#
# The correlation is exact in both directions: all 11 CRDs rendering
# `labels: {}` are OutOfSync, all 11 rendering real labels are Synced. That
# was the whole of the `kyverno` app's OutOfSync — nothing was actually
# unapplied, and `kubectl diff` against the same manifests is empty.
#
# WHY A PATCH AND NOT `ignoreDifferences`: ignoring /metadata/labels on
# CustomResourceDefinition would also blind the other eleven CRDs to a real
# label change. This removes a field that cannot be stored instead of hiding
# the fact that it cannot. Nothing reads these labels — the live CRDs have
# had none since 2026-07-26 and Kyverno is unaffected.
#
# WHY IT MATTERS BEYOND TIDINESS: `kyverno` was one of two apps permanently
# yellow on the ArgoCD board. A column that is never all-green is a column
# nobody reads, which is how the postgres-backup failure in Factory#429 went
# unnoticed for 5.6 days.
#
# Delete this patch when a Kyverno release stops emitting the empty map.
patches:
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '^.+\.policies\.kyverno\.io$'
    patch: |-
      - op: remove
        path: /metadata/labels

  # Stop the reports-controller crash loop (Factory#501).
  #
  # THE DEFECT: 581 restarts over 3 days, and 621 EphemeralReports queued
  # behind it with nothing draining them. PolicyReports have been frozen at
  # 2026-07-26 ever since, so the audit trail this policy exists to produce
  # has been a stale answer presented as a current one.
  #
  # NOT an OOM kill. The container exits 0 / Completed -- a clean shutdown
  # after losing its leader lease. The logs say what actually happens:
  #
  #   failed to wait for cache sync   *v1.ClusterPolicy, *v1beta1.ValidatingPolicy,
  #                                   *v1beta1.PolicyException, +6 more
  #   Failed to update lease optimistically ... falling back to slow path
  #   error="client rate limiter Wait returned an error: context deadline exceeded"
  #   leadership lost, stopped leading
  #
  # No --clientRateLimitQPS is set anywhere in the args, so it runs at
  # Kyverno's default 20 QPS / 50 burst. On startup this controller LISTs and
  # WATCHes ~20 informer types AND has a 621-deep report backlog to aggregate.
  # The lease renewal call queues behind that traffic on the same client-side
  # rate limiter and times out, leadership drops mid-sync, the process exits
  # cleanly, and it does the whole thing again five minutes later. The backlog
  # only grows, so this cannot recover on its own.
  #
  # 300 QPS / 600 burst is the upstream recommendation for a cluster with a
  # report backlog; it is client-side throttling only and does not raise load
  # on the API server beyond what the controller genuinely needs to catch up.
  #
  # Memory 128Mi -> 512Mi: not the crash cause, but ~20 informer caches plus
  # 621 reports will not fit in 128Mi, and the next failure would be a real
  # OOM once it stops dying early enough to avoid one.
  #
  # Revisit once the backlog is drained; the QPS bump is safe to keep.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kyverno-reports-controller
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --clientRateLimitQPS=300
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --clientRateLimitBurst=600
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi

  # Give Kyverno a ghcr.io READ credential (Factory#563).
  #
  # THE DEFECT: two of the eleven `tfactory-runner-*` GHCR packages --
  # `tfactory-runner-nix` and `tfactory-runner-portal-ui` -- are PRIVATE, and
  # Kyverno had no registry credential at all. It ran with
  # `--registryCredentialHelpers=default,google,amazon,azure,github` and no
  # imagePullSecret, which means it read ghcr.io anonymously. It cannot
  # retrieve a signature it cannot read:
  #
  #   failed to verify image ghcr.io/olafkfreund/tfactory-runner-nix:latest:
  #   .attestors[0].entries[0].keyless: GET https://ghcr.io/token?scope=
  #   repository%3Aolafkfreund%2Ftfactory-runner-nix%3Apull&service=ghcr.io:
  #   UNAUTHORIZED: authentication required
  #
  # Both images ARE correctly signed. This is a read-access failure, not a
  # signature verdict -- and Kyverno reports BOTH as `unverified image`, which
  # is the whole lesson of Factory#430. A real signature verdict reads
  # `no matching signatures` and never names ghcr.io/token.
  #
  # WHY A CREDENTIAL AND NOT PUBLIC PACKAGES. Factory#563 originally proposed
  # making the two packages public. Container package visibility is a UI-only
  # operation -- `PATCH user/packages/container/<name>` returns 404 -- and the
  # UI toggle would not commit. The credential keeps the packages private and
  # makes them verifiable, which is the stronger end state anyway: it also
  # covers any factory package that goes private in future, whereas the
  # visibility flip has to be repeated per package and can be undone silently.
  #
  # WHY BOTH CONTROLLERS AND NOT JUST ADMISSION. They do image verification
  # independently and each builds its own registry client
  # (`internal.WithRegistryClient()` in cmd/kyverno/main.go and
  # cmd/reports-controller/main.go):
  #
  #   kyverno-admission-controller  verifies at admission (the webhook path)
  #   kyverno-reports-controller    verifies on the background scan
  #                                 (--backgroundScan=true, 1h interval)
  #
  # A credential on only one leaves half the evidence broken: admission-time
  # warnings would clear while the PolicyReport board kept reporting the same
  # two images as failures, or the reverse. kyverno-background-controller does
  # NOT build a registry client (generate / mutateExisting only) and
  # kyverno-cleanup-controller does no verification, so neither needs it.
  #
  # THE SECRET IS NOT IN THIS REPO. There is no SOPS and no sealed-secrets here
  # (docs/secrets-management.md), so `kyverno-ghcr-pull` is created out-of-band
  # exactly like `factory/ghcr-pull`, `minio-creds` and the rest. Create it
  # with `kubectl create secret docker-registry`, never `kubectl apply` -- an
  # apply writes the full plaintext into the
  # kubectl.kubernetes.io/last-applied-configuration annotation, which is
  # Factory#448 and is already live on `factory/ghcr-pull` (Factory#565):
  #
  #   printf '%s' "$PAT" > /dev/shm/pat            # never on the command line
  #   kubectl create secret docker-registry kyverno-ghcr-pull -n kyverno \
  #     --docker-server=ghcr.io --docker-username=olafkfreund \
  #     --docker-password="$(cat /dev/shm/pat)"; shred -u /dev/shm/pat
  #
  # The PAT needs `read:packages` AND NOTHING ELSE. This credential sits in a
  # cluster component that reads every image reference in the fleet. A
  # fine-grained PAT cannot be used: both packages are unlinked from any
  # repository (TFactory#952 -- their Dockerfiles omit
  # org.opencontainers.image.source), and fine-grained package permissions are
  # repository-scoped, so a classic PAT with the single `read:packages` scope
  # is the least privilege GHCR actually offers.
  #
  # SAFE TO APPLY BEFORE THE SECRET EXISTS. generateKeychainForPullSecrets in
  # pkg/registryclient/utils.go treats a NotFound secret as "skip", logs it at
  # v4 and carries on -- only a non-NotFound error propagates. With the secret
  # absent this flag is a no-op and the anonymous path for the nine public
  # runners and five service images is untouched. The keychain is also
  # re-resolved from the secret lister on EVERY image resolution
  # (autoRefreshSecrets.Resolve in pkg/registryclient/authn.go), so creating
  # the secret later needs no redeploy -- though the verification cache does
  # hold a failed result for --imageVerifyCacheTTLDuration (1h default), so
  # `kubectl -n kyverno rollout restart` on both Deployments makes it immediate.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: '^kyverno-(admission|reports)-controller$'
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --imagePullSecrets=kyverno-ghcr-pull
