# Kyverno admission controller — the engine that evaluates the image
# signature-verification policy in apps/kyverno-policies/.
#
# Rendered from the upstream pinned release install.yaml, exactly the same
# remote-resource pattern bootstrap/kustomization.yaml uses for argo-cd.
# Bump deliberately: change the release tag below, never track `latest`.
#
# Footprint (v1.18.2): admission-controller + background-controller +
# cleanup-controller + reports-controller Deployments in the `kyverno`
# namespace, plus 22 Kyverno CRDs (ClusterPolicy, Policy, PolicyReport, ...)
# and 9 webhook configurations. Our policy pins failurePolicy: Ignore and
# validationFailureAction: Audit (see the ClusterPolicy), so a Kyverno outage
# can never block Pod admission fleet-wide.
#
# Was v1.12.6 until 2026-07-26. That release shipped four cleanup CronJobs
# running `bitnami/kubectl:1.28.5`, which stopped resolving when Bitnami
# retired their public Docker Hub catalogue:
#
#   Failed to pull "bitnami/kubectl:1.28.5":
#   docker.io/bitnami/kubectl:1.28.5: not found
#
# leaving four pods in ImagePullBackOff on every schedule. Upstream removed
# those CronJobs entirely — the cleanup-controller handles report pruning
# natively — so bumping deletes the broken component rather than pinning a
# replacement image. It also stops running a 1.28-era kubectl against this
# v1.31.5 cluster.
#
# Verified before the bump: v1.18.2 still serves ClusterPolicy v1/v2beta1, and
# verifyImages / attestors / keyless / mutateDigest remain in the CRD schema,
# so the policy manifest needed no changes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kyverno/kyverno/releases/download/v1.18.2/install.yaml

# Drop the empty `metadata.labels: {}` upstream emits on the eleven
# policies.kyverno.io CRDs (Factory#440).
#
# THE DEFECT: v1.18.2's install.yaml renders those eleven CRDs with a literal
# `labels: {}` — the other eleven Kyverno CRDs carry real labels. The API
# server does not store an empty map, so the live object comes back with no
# `labels` key at all. ArgoCD then compares a desired object that HAS
# `metadata.labels` against a live object that does not, forever. Measured
# against the live cluster via the ArgoCD managed-resources API:
#
#   validatingpolicies.policies.kyverno.io   (OutOfSync)
#     live -> target:  + "labels": {}
#   clusterpolicies.kyverno.io               (Synced)
#     live -> target:  (no metadata difference)
#
# The correlation is exact in both directions: all 11 CRDs rendering
# `labels: {}` are OutOfSync, all 11 rendering real labels are Synced. That
# was the whole of the `kyverno` app's OutOfSync — nothing was actually
# unapplied, and `kubectl diff` against the same manifests is empty.
#
# WHY A PATCH AND NOT `ignoreDifferences`: ignoring /metadata/labels on
# CustomResourceDefinition would also blind the other eleven CRDs to a real
# label change. This removes a field that cannot be stored instead of hiding
# the fact that it cannot. Nothing reads these labels — the live CRDs have
# had none since 2026-07-26 and Kyverno is unaffected.
#
# WHY IT MATTERS BEYOND TIDINESS: `kyverno` was one of two apps permanently
# yellow on the ArgoCD board. A column that is never all-green is a column
# nobody reads, which is how the postgres-backup failure in Factory#429 went
# unnoticed for 5.6 days.
#
# Delete this patch when a Kyverno release stops emitting the empty map.
patches:
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '^.+\.policies\.kyverno\.io$'
    patch: |-
      - op: remove
        path: /metadata/labels

  # Stop the reports-controller crash loop (Factory#501).
  #
  # THE DEFECT: 581 restarts over 3 days, and 621 EphemeralReports queued
  # behind it with nothing draining them. PolicyReports have been frozen at
  # 2026-07-26 ever since, so the audit trail this policy exists to produce
  # has been a stale answer presented as a current one.
  #
  # NOT an OOM kill. The container exits 0 / Completed -- a clean shutdown
  # after losing its leader lease. The logs say what actually happens:
  #
  #   failed to wait for cache sync   *v1.ClusterPolicy, *v1beta1.ValidatingPolicy,
  #                                   *v1beta1.PolicyException, +6 more
  #   Failed to update lease optimistically ... falling back to slow path
  #   error="client rate limiter Wait returned an error: context deadline exceeded"
  #   leadership lost, stopped leading
  #
  # On startup this controller LISTs and WATCHes ~20 informer types AND had a
  # 621-deep report backlog to aggregate. The lease renewal call times out
  # mid-sync, leadership drops, the process exits cleanly, and it does the whole
  # thing again five minutes later. The backlog only grows, so this cannot
  # recover on its own.
  #
  # Memory 128Mi -> 512Mi: not the crash cause, but ~20 informer caches plus
  # 621 reports will not fit in 128Mi, and the next failure would be a real
  # OOM once it stops dying early enough to avoid one.
  #
  # TWO CORRECTIONS TO THE ABOVE, measured while root-causing Factory#561, which
  # is this same exit signature on the background- and cleanup-controllers.
  # They are recorded rather than quietly deleted because the original wording
  # is an actively misleading recipe: read as written, it says "controller
  # exits 0 after a lost lease" implies "raise clientRateLimitQPS", and the
  # obvious next move is to paste this patch onto the other three controllers.
  # That would be three deployment rolls of an admission webhook for nothing.
  #
  #   1. "Kyverno's default 20 QPS / 50 burst" IS NOT TRUE of this release.
  #      v1.18.2 defaults to 100 QPS / 200 burst -- from the shipped binary's
  #      own `--help`, run out of the exact image this kustomization pins:
  #
  #        -clientRateLimitQPS float
  #             ... Uses the client default if zero. (default 100)
  #        -clientRateLimitBurst int
  #             ... Uses the client default if zero. (default 200)
  #
  #      20/50 was the v1.12.x default -- correct when this comment was first
  #      written against v1.12.6, stale since the 2026-07-26 bump to v1.18.2.
  #      So this patch is a 3x on an already-generous limit, not the 15x rescue
  #      it reads as.
  #
  #   2. "client rate limiter Wait returned an error: context deadline
  #      exceeded" IS NOT EVIDENCE OF THROTTLING. It is what client-go logs
  #      when the context handed to the limiter was ALREADY dead on arrival.
  #      Read the two lines in order and the direction is unambiguous: the Put
  #      times out FIRST, burning the renew deadline, and only then does the
  #      slow-path Get find an expired context waiting at the limiter. The
  #      limiter is reporting the timeout, not causing it.
  #
  #      Measured on the live background-controller across 22h: zero
  #      "client-side throttling" / "Waited for" log lines, i.e. the 100 QPS
  #      limit is never reached in steady state.
  #
  # What actually ends the lease is the API server becoming unreachable from
  # the NODE for longer than Kyverno's renew deadline (leaseDurationSeconds is
  # 12 on every kyverno lease; renew deadline is hardcoded, no flag exposes
  # it -- `--leaderElectionRetryPeriod` is the only leader-election knob in
  # v1.18.2). Under Factory#571 the node resolv.conf pointed at a black hole
  # and every API-adjacent call was slow; under Factory#582 the node was
  # NotReady outright. Both are fixed, and the restarts stopped with them.
  #
  # THE TELL that it is the node and not Kyverno: on 2026-08-06T14:48:42Z all
  # four Kyverno controllers AND keda-operator -- a completely unrelated
  # leader-electing controller on the same node -- lost their leases in the
  # same second. No amount of Kyverno tuning explains keda.
  #
  # SO: do not add clientRateLimit flags to the other controllers. If this exit
  # signature returns, look at node-to-apiserver reachability first. The
  # restart itself is now alerted on by apps/restart-watchdog, so nobody has to
  # notice 392 of them by hand again.
  #
  # This patch is kept as-is: the memory bump is genuinely load-bearing (this
  # controller is the one that aggregates reports) and the QPS bump is
  # harmless. It is simply not the mechanism the text claimed.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kyverno-reports-controller
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --clientRateLimitQPS=300
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --clientRateLimitBurst=600
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi

  # KYVERNO HAS NO ghcr.io CREDENTIAL, AND DOES NOT NEED ONE. Factory#563.
  #
  # It runs with `--registryCredentialHelpers=default,google,amazon,azure,github`
  # and no imagePullSecret, so it reads ghcr.io ANONYMOUSLY. Every image named
  # by a glob in apps/kyverno-policies is a public GHCR package, so that is
  # sufficient. Confirmed with an empty credential store on 2026-08-07: all
  # five service packages and all eleven `tfactory-runner-*` packages return
  # 200 to an anonymous token, including the two -- `tfactory-runner-nix` and
  # `tfactory-runner-portal-ui` -- that were private when #563 was filed.
  #
  # A `--imagePullSecrets=kyverno-ghcr-pull` patch used to live here. It was
  # written for the private-package era and is now REMOVED rather than left
  # inert, for a reason that is not tidiness:
  #
  #   - the Secret it named was never created (`kubectl -n kyverno get secret
  #     kyverno-ghcr-pull` -> NotFound), so the flag was doing nothing; and
  #   - Factory#566 measured what it does when it IS satisfied by a wrong or
  #     EXPIRED credential: the keychain does not fall back to the anonymous
  #     path, so EVERY covered image goes unverified at once, not just the
  #     private ones. Classic PATs default to 30-day expiry. Leaving a dormant
  #     flag pointing at a Secret nobody maintains puts that whole-fleet failure
  #     in front of Factory#522's Enforce flip in exchange for nothing.
  #
  # THE REMOVAL WAS MUTATION-CHECKED, 2026-08-07 (Factory#566). Asserting that a
  # deletion closes a failure mode is not the same as showing it, so: one server
  # dry-run Pod carrying 17 RUNNING IMAGES through the real admission webhook,
  # both controllers restarted between states so the 60m image-verify cache is
  # cold.
  #
  # SAY WHICH COUNT YOU MEAN. There are two, both correct, at different grains:
  # 19 REPOSITORIES are named by globs in apps/kyverno-policies (fixed by that
  # file, changes only on a commit), and N IMAGES are actually running at any
  # given moment (changes whenever a workload starts or stops, no commit
  # anywhere). 17 below is the second kind, measured during this experiment --
  # it is not a target, and re-running this later will give a different N. The
  # hardcoded "sixteen" this block used to carry was wrong precisely because
  # nobody wrote down which grain it was. See the COUNTING NOTE in
  # apps/kyverno-policies/manifests/verify-factory-image-signatures.yaml.
  #
  #   flag present, no Secret                ->   0 failures  (the state #177 found)
  #   flag present, Secret holding a bad PAT ->  16 failures  (5 services + 11 runners)
  #   flag REMOVED, bad Secret still present ->   0 failures  (this file, today)
  #
  # The 16 is 17 minus one image whose verdict was still cache-warm; the point
  # is 0 -> everything, not the exact integer.
  #
  # Row 3 is the one that matters: the same invalid credential is still sitting
  # in the namespace and can no longer do any harm, because nothing reads it.
  # `--v=2` on the admission controller shows the mechanism directly --
  #
  #   with the flag:     setup registry client... insecure=false secrets=kyverno-ghcr-pull
  #   without the flag:  setup registry client... insecure=false secrets=
  #
  # -- so re-adding the flag is what re-arms this, not the Secret appearing.
  #
  # A NOTE ON MEASURING IT AGAIN, because the first attempt was a FALSE NEGATIVE.
  # Row 3 initially reported 16 failures: ArgoCD selfHeal had restored the flag
  # mid-probe, so the run measured the unpatched config. It was caught only
  # because residency of the removed arg was re-checked AFTER the probe rather
  # than before. To redo this, suspend `spec.syncPolicy.automated` on the
  # `kyverno` Application for the duration and restore it from a recorded value
  # -- and check residency last. Same lesson as Factory#620: pick the instrument
  # deliberately and prove it stayed applied.
  #
  # IF A FACTORY PACKAGE EVER GOES PRIVATE AGAIN, the credential comes back and
  # it goes on BOTH verifying controllers, not one. They build registry clients
  # independently (`internal.WithRegistryClient()` in cmd/kyverno/main.go and
  # cmd/reports-controller/main.go): kyverno-admission-controller verifies at
  # admission, kyverno-reports-controller verifies on the background scan. A
  # credential on only one leaves half the evidence broken -- admission-time
  # warnings clearing while the PolicyReport board keeps the same images red,
  # or the reverse. kyverno-background-controller builds no registry client
  # (generate / mutateExisting only) and kyverno-cleanup-controller verifies
  # nothing, so neither needs it. The full recipe, including why the PAT must
  # carry `read:packages` and nothing else and why it must be created with
  # `kubectl create secret` rather than `kubectl apply` (Factory#448/#565), is
  # kept in docs/image-signature-admission.md.
  #
  # `odin` WAS a private package, and was deliberately left without a signature
  # rule for exactly that reason -- a rule in front of an unreadable image
  # reports the Factory#430 registry-auth ambiguity, not a verdict. It went
  # public on 2026-08-07 and is now anonymously verifiable like the rest
  # (manifest and `.sig` tag both 200 to an anonymous token, and `cosign verify`
  # passes with an empty keychain), so Factory#572 gives it a rule with no
  # credential involved. The ordering rule stands for the next package: never
  # add a rule and a credential as a single change.
  #
  # AND KEEP THE FAILURE SIGNATURE, because the two are reported identically.
  # A read failure names the token endpoint; a signature verdict never does:
  #
  #   failed to verify image ghcr.io/olafkfreund/tfactory-runner-nix:latest:
  #   .attestors[0].entries[0].keyless: GET https://ghcr.io/token?scope=
  #   repository%3Aolafkfreund%2Ftfactory-runner-nix%3Apull&service=ghcr.io:
  #   UNAUTHORIZED: authentication required
  #
  # versus `no matching signatures` / `subject mismatch` / `issuer mismatch`.
  # Kyverno writes `unverified image` for both. That is Factory#430.

  # ---------------------------------------------------------------------
  # DIGEST PINS FOR KYVERNO'S OWN FIVE IMAGES (factory-gitops#161).
  #
  # These are the images of the component that enforces supply-chain policy
  # for everything else: verify-factory-image-signatures,
  # require-first-party-signature-coverage and every other rule in
  # apps/kyverno-policies runs inside these processes. Until now all five ran
  # on the tag `v1.18.2`, and a tag is a pointer. Repointing it swaps the
  # admission controller, and the thing that would ordinarily notice a swapped
  # image IS the admission controller. The Factory#522 Enforce flip made that
  # worse rather than better: the enforcement now has teeth, and the enforcer
  # was the one component nothing was watching.
  #
  # `v1.18.2` is a patch-level tag, not a floating line like `pg17` was in
  # Factory#588, so it moves rarely. That lowers the probability, not the
  # blast radius.
  #
  # THE CLI PIN ABOVE DEPENDS ON THIS. The header of
  # .github/workflows/manifest-validate.yml explains at length that the Kyverno
  # CLI is pinned to v1.18.2 to MATCH the controller in this cluster, so that
  # `kyverno test` offline agrees with admission online. That reasoning is only
  # as good as `v1.18.2` meaning the same bytes in both places, which a mutable
  # tag does not guarantee and a digest does.
  #
  # Resolved live 2026-08-08 with `crane digest`; every one equals the imageID
  # the running pod already carries, so applying this pulls nothing and rolls
  # nothing that was not going to come back identical:
  #   kyverno                sha256:0a540e2d...
  #   kyvernopre             sha256:cd8cb4a3...
  #   background-controller  sha256:d62566ce...
  #   cleanup-controller     sha256:b0395d29...
  #   reports-controller     sha256:f09cf305...
  #
  # THE PINS ARE AN `images:` TRANSFORMER, BELOW THE PATCHES. Mechanics and the
  # reason the digest sits inside `newTag:` rather than in `digest:` are written
  # out once, in apps/keda/manifests/kustomization.yaml; the short version is
  # that `digest:` would drop `v1.18.2` from the rendered ref and a digest with
  # no tag is a pin nothing can ever tell you is stale.
  #
  # BUMPING KYVERNO IS NOW A FOUR-PART CHANGE, and doing three of them is
  # worse than doing none: the release URL above, the five digests below, the
  # CLI pin in manifest-validate.yml, and the `kyverno test` suites. Change the
  # URL alone and kustomize staples v1.18.2 digests onto v1.19.x tags -- a ref
  # the registry resolves to the DIGEST, i.e. you have "bumped" to the old
  # bytes under a new name. Re-resolve all five in the same commit.
  #
  # ROLL ORDER, if this ever has to be re-applied by hand: cleanup, then
  # reports, then background, then admission LAST. The admission controller is
  # the one that can refuse Pod creation cluster-wide; leaving it until the end
  # means the first three rolls happen while the escape hatch still works.
  # `kubectl run probe --image=registry.k8s.io/pause:3.9 --dry-run=server`
  # between each is how you check the escape hatch is still open, and
  # apps/kyverno-policies/PANIC.sh is the revert if it is not.

images:
  - name: reg.kyverno.io/kyverno/kyverno
    newTag: "v1.18.2@sha256:0a540e2ddf74d0d2d3d45f9ef248d7dbc96576accdbcc6a2dd7eaff9fea56504"
  - name: reg.kyverno.io/kyverno/kyvernopre
    newTag: "v1.18.2@sha256:cd8cb4a31d25b3992734fb8f24a90ef691c90ce49338c89bea96792160eacb98"
  - name: reg.kyverno.io/kyverno/background-controller
    newTag: "v1.18.2@sha256:d62566ce41bd0d4a32bf2cf44b9ebfc02c36374f821f83070890287f62f68671"
  - name: reg.kyverno.io/kyverno/cleanup-controller
    newTag: "v1.18.2@sha256:b0395d29ae332276e6910eb40418be9bc127c068d659f90aa1bcddd6be99ccb4"
  - name: reg.kyverno.io/kyverno/reports-controller
    newTag: "v1.18.2@sha256:f09cf305170014e191b94e1c54f5be73163d8824eefad49349675c4efe43159a"
