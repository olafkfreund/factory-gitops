# Kyverno — policy engine used here ONLY to verify cosign image signatures
# at admission (Factory #318, compliance gap #8). The cluster previously
# admitted factory workloads by tag with no signature check; the release
# workflows sign images keyless (cosign + GitHub OIDC) but nothing verified
# them. This installs the engine; the policy lives in apps/kyverno-policies/.
#
# The policy is AUDIT-ONLY (validationFailureAction: Audit) — it reports
# violations to PolicyReports, it does NOT deny Pods. See
# docs/image-signature-admission.md for the phased path to Enforce.
#
# App-of-apps auto-discovers this file (apps/**/application.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/olafkfreund/factory-gitops
    targetRevision: main
    path: apps/kyverno/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Kyverno ships large CRDs; server-side apply avoids the
      # last-applied-configuration annotation size limit (same reason as KEDA).
      - ServerSideApply=true
