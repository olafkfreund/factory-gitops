# The k3s CoreDNS Corefile, with TWO deliberate changes: the forward upstream
# (Factory#571/#430) and the `k3d.internal` server block (factory-gitops#195/#196).
#
# ONLY the Corefile key is declared here. `NodeHosts` is deliberately absent —
# k3s owns and rewrites it as nodes join and leave, and this Application syncs
# with ServerSideApply so field ownership is split rather than contested. Adding
# NodeHosts here would freeze node-name resolution at whatever was committed.
#
# The rest of this file is k3s's own template, reproduced verbatim so the diff
# against a stock cluster is exactly those two blocks. If a k3s upgrade changes
# the template, ArgoCD will show this Application OutOfSync against the new
# default — that is the intended signal to re-baseline, not a bug.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
        }
        hosts /etc/coredns/NodeHosts {
          ttl 60
          reload 15s
          fallthrough
        }
        prometheus :9153
        # Factory#571/#430: the node resolver (Docker bridge gw 172.18.0.1) only
        # answers inside the node's own netns, so from pod netns it is a black hole
        # and every external lookup in the cluster dies. Listed FIRST so the node
        # resolver is still preferred once nixos_config#1232 makes it work; the
        # public resolvers are the fallback forward's health-check fails over to.
        #
        # `policy sequential` and not the default random: with random, a third of
        # lookups would still be aimed at the black hole and time out. Sequential
        # means the list is an ORDER OF PREFERENCE, and forward's health-checking
        # marks the dead upstream down and moves to the next. Measured on the live
        # cluster: 8/8 external lookups resolved through this block while
        # /etc/resolv.conf was still pointing at the unreachable 172.18.0.1.
        forward . /etc/resolv.conf 1.1.1.1 8.8.8.8 {
          policy sequential
        }
        cache 30
        loop
        reload
        loadbalance
        import /etc/coredns/custom/*.override
    }
    # factory-gitops#195 / #196 — host.k3d.internal, the fleet-wide spelling for
    # "the p510 host running ollama". Every service that talks to the self-hosted
    # model uses this name: OPENAI_COMPATIBLE_BASE_URL in apps/aifactory and
    # apps/tfactory, OLLAMA_BASE_URL in apps/fides, and the sandbox-job egress
    # rule in apps/factory-namespace is written against the address behind it.
    #
    # IT DID NOT RESOLVE FROM ANY POD, and had not for some time. Measured on the
    # live cluster before this block existed, from two different services' pods:
    #
    #   kubernetes.default.svc -> 10.43.0.1        (cluster DNS fine)
    #   github.com             -> 20.26.156.215    (external DNS fine)
    #   host.k3d.internal      -> FAIL [Errno -2] Name or service not known
    #
    # while the box behind the name was up the whole time: an HTTP GET to
    # 172.18.0.1:11434/api/tags from inside the same pod listed all five models.
    # So every self-hosted-model call in the fleet was dying at NAME RESOLUTION
    # and surfacing as a provider/model connection error. That is why it survived:
    # it reads as "ollama is flaky", not "the hostname does not exist", and every
    # conclusion drawn about local-model quality, latency or availability was
    # measured against a connection that never opened (AIFactory#1099, #1213).
    #
    # WHY THE NAME WAS MISSING — absent, not misspelled and not unroutable. k3d
    # injects `host.k3d.internal` into the coredns ConfigMap's NodeHosts key ONCE,
    # at cluster creation. NodeHosts is then owned and REGENERATED by the k3s
    # supervisor from the live node list every time the node set changes, and a
    # regenerated NodeHosts contains node entries only. This cluster's server node
    # is 44 days old and its agent node 2 days old, and what NodeHosts held was
    # exactly the two nodes and nothing else — the agent join rewrote the file and
    # took k3d's record with it.
    #
    # WHICH IS ALSO WHY THE OBVIOUS FIX LOSES. Adding the record to NodeHosts puts
    # it right back in the field that already destroyed it once, and this file's own
    # header explains why this Application must not claim that field at all.
    # hostAliases on the Deployments would work but hardcodes the address in four
    # places instead of one and covers only the workloads someone remembered to
    # edit — not sandbox Job pods, which are built at runtime by application code.
    # An ExternalName Service needs a resolvable target, and nothing resolves.
    # A Service with manual Endpoints hardcodes the same address, adds a kube-proxy
    # hop, and abandons the documented name. Rewriting every URL to the literal IP
    # is four edits, re-breaks on a bridge-subnet change, and throws away the one
    # spelling that every runbook and issue already refers to.
    #
    # A SEPARATE SERVER BLOCK, not a second `hosts` in `.:53`: the hosts plugin may
    # only be instantiated once per server block, and the one that is already there
    # belongs to k3s. This declares the synthetic zone as its own, so it cannot
    # interact with node-name resolution, cluster DNS or the forward block above.
    # Changes here land automatically: the `reload` plugin in `.:53` re-reads this
    # Corefile on an interval (visible in the CoreDNS log) and a Corefile whose
    # checksum changed is re-instantiated, so no pod restart is needed.
    #
    # THE ADDRESS IS BRITTLE AND THAT IS HANDLED, NOT HIDDEN. 172.18.0.1 is the
    # Docker bridge gateway for the `k3d-factory` network as seen from pod netns.
    # It is stable for the life of the network and it CAN change if the cluster is
    # rebuilt onto a different subnet. Nothing in a gitops repo can discover it at
    # sync time, so every candidate fix hardcodes it somewhere; the difference is
    # that this hardcodes it ONCE, and apps/host-k3d-internal-probe fails loudly
    # within ~50 minutes if this record ever stops resolving or stops serving.
    #
    # To re-derive it after a rebuild, with kubectl alone — the k3d node
    # containers sit on the bridge and the host is that subnet's gateway, so the
    # node addresses give it away without needing access to the Docker daemon
    # (which runs as another user here):
    #
    #   $ kubectl --context factory get nodes -o wide
    #   k3d-factory-server-0   172.18.0.2
    #   k3d-agent-0-0          172.18.0.3     -> subnet 172.18.0.0/16, host .1
    #
    # Confirm before committing it, rather than trusting the convention:
    #   $ kubectl --context factory -n factory run ollama-probe --rm -it \
    #       --restart=Never --image=python:3.12-slim --command -- \
    #       python3 -c "import urllib.request as u; \
    #                   print(u.urlopen('http://172.18.0.1:11434/api/tags').status)"
    #
    # The probe is what tells you to go and look.
    k3d.internal:53 {
        errors
        hosts {
            172.18.0.1 host.k3d.internal
            ttl 60
        }
    }
    import /etc/coredns/custom/*.server
