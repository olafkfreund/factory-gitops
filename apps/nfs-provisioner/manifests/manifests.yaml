# NFS RWX provisioner (nfs-ganesha-server-and-external-provisioner) — #781.
# One Deployment runs an in-pod ganesha NFS server backed by a local-path PVC and
# hands out ReadWriteMany volumes via the `nfs` storageClass, so any node's pod
# can mount the shared workspaces volume (the cluster otherwise ships only
# local-path RWO, which pins a PVC to one node).
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: nfs-provisioner, namespace: factory, labels: { app: nfs-provisioner } }
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata: { name: nfs-provisioner-runner, labels: { app: nfs-provisioner } }
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get"]
  - apiGroups: ["extensions"]
    resources: ["podsecuritypolicies"]
    resourceNames: ["nfs-provisioner"]
    verbs: ["use"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata: { name: run-nfs-provisioner, labels: { app: nfs-provisioner } }
subjects:
  - kind: ServiceAccount
    name: nfs-provisioner
    namespace: factory
roleRef:
  kind: ClusterRole
  name: nfs-provisioner-runner
  apiGroup: rbac.authorization.k8s.io
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata: { name: leader-locking-nfs-provisioner, namespace: factory, labels: { app: nfs-provisioner } }
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata: { name: leader-locking-nfs-provisioner, namespace: factory, labels: { app: nfs-provisioner } }
subjects:
  - kind: ServiceAccount
    name: nfs-provisioner
    namespace: factory
roleRef:
  kind: Role
  name: leader-locking-nfs-provisioner
  apiGroup: rbac.authorization.k8s.io
---
# Backing store for the in-pod NFS server (local-path, RWO — the ganesha pod owns
# it and re-exports it as RWX). Sized for the workspaces it will hold.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: nfs-provisioner-backing, namespace: factory, labels: { app: nfs-provisioner } }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-provisioner
  namespace: factory
  labels: { app: nfs-provisioner }
spec:
  selector: { app: nfs-provisioner }
  ports:
    - { name: nfs, port: 2049 }
    - { name: nfs-udp, port: 2049, protocol: UDP }
    - { name: nlockmgr, port: 32803 }
    - { name: nlockmgr-udp, port: 32803, protocol: UDP }
    - { name: mountd, port: 20048 }
    - { name: mountd-udp, port: 20048, protocol: UDP }
    - { name: rquotad, port: 875 }
    - { name: rquotad-udp, port: 875, protocol: UDP }
    - { name: rpcbind, port: 111 }
    - { name: rpcbind-udp, port: 111, protocol: UDP }
    - { name: statd, port: 662 }
    - { name: statd-udp, port: 662, protocol: UDP }
---
kind: Deployment
apiVersion: apps/v1
metadata: { name: nfs-provisioner, namespace: factory, labels: { app: nfs-provisioner } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: nfs-provisioner } }
  template:
    metadata: { labels: { app: nfs-provisioner } }
    spec:
      serviceAccountName: nfs-provisioner
      terminationGracePeriodSeconds: 10
      # Factory#521 — ACCEPTED EXCEPTION, recorded so the next sweep does not
      # "fix" it. This pod runs as root and keeps the default capability set,
      # and both are required. Ganesha is a userspace NFS server: it forks
      # rpcbind and rpc.statd, which bind privileged ports and setuid down to
      # the `rpc` user. Measured against this exact image rather than argued:
      #
      #   drop:[ALL] + the two adds below
      #     -> Error setting up NFS server: Starting rpcbind failed with error:
      #        exit status 1, output: rpcbind: /run/rpcbind/rpcbind.lock:
      #        Permission denied                                   (exit 255)
      #   drop:[ALL] + those two + SETUID SETGID DAC_OVERRIDE CHOWN FOWNER
      #   NET_BIND_SERVICE
      #     -> Error setting up NFS server: rpc.statd failed with error:
      #        exit status 1                                       (exit 255)
      #   default caps
      #     -> Running NFS server!
      #
      # So `drop: [ALL]` alongside the two explicit adds — the shape #521
      # suggested — does NOT work here, and a CrashLoop takes the `nfs`
      # storageClass down with it, which is what tfactory-data-rwx (#781) is
      # built on.
      #
      # What IS safe was measured the same way and is applied below:
      # seccompProfile RuntimeDefault and allowPrivilegeEscalation: false.
      #
      # CORRECTION, Factory#521 re-examination 2026-08-07. The paragraph that
      # used to sit here said: "without SYS_RESOURCE that same raise logs
      # 'operation not permitted' — which is the documented reason for the
      # SYS_RESOURCE add, confirmed rather than taken on trust." That was a
      # MISREAD, and it is the kind of misread that turns an exception into a
      # permanent hole: it proved the capability does something, not that
      # removing it breaks anything. Upstream logs that line at klog level W
      # (server.go:99) and carries on. Re-measured on this exact digest, three
      # configurations, each run to the same end state:
      #
      #   default caps + DAC_READ_SEARCH + SYS_RESOURCE
      #     -> rlimit.Cur 1024 -> 1048576 ... "Running NFS server!"
      #   default caps + DAC_READ_SEARCH (SYS_RESOURCE dropped)
      #     -> W "Error setting RLIMIT_NOFILE ... operation not permitted"
      #        ... "Running NFS server!"          <- STILL STARTS
      #   default caps, NEITHER add
      #     -> same warning ... "Running NFS server!"   <- STILL STARTS
      #        and ganesha still wrote its export tree (ganesha.log, v4old/)
      #
      # All three then exit 255 on the identical unrelated line — "Failed to
      # create config: unable to load in-cluster configuration" — because the
      # probe had no kube API. Same failure in every arm, and it happens AFTER
      # ganesha is up, so the three are comparable.
      #
      # So SYS_RESOURCE is NOT required for the NFS server to run. What it
      # actually buys is fd headroom: the soft limit stays at 1024 without it.
      # Note the hard limit in the live pod is 524288, and raising the SOFT
      # limit up to the hard limit needs no capability at all — measured in this
      # image: `ulimit -n 524288` succeeds unprivileged. The cap is only needed
      # because upstream asks for 1048576, which is above that hard limit.
      #
      # KEPT ANYWAY, on a corrected and much narrower justification: this is an
      # availability tradeoff, not a hard requirement. 1024 fds on the NFS
      # server that backs tfactory-data-rwx (#781) is a real "Too many open
      # files" risk, and the alternative — wrapping the entrypoint in a shell to
      # raise ulimit — means changing the command of the cluster's storage
      # provisioner to save one capability on a container that is ALREADY root
      # with the full default set (DAC_OVERRIDE, SETUID, SETGID, SETPCAP...).
      # Next to root-with-default-caps these two adds are a rounding error. The
      # exposure worth removing here is root itself, and root is proven required
      # by the rpcbind/rpc.statd evidence above. Anyone revisiting this should
      # go after root, not after these two capabilities.
      #
      # DAC_READ_SEARCH is likewise not needed to START (third arm above), but
      # its job is cross-uid traversal at SERVE time, which the probe could not
      # exercise without a kube API. Untested at serve time, so it stays; that
      # is a gap in this evidence and is stated rather than papered over.
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nfs-provisioner
          image: registry.k8s.io/sig-storage/nfs-provisioner:v4.0.8@sha256:c825f3d5e28bde099bd7a3daace28772d412c9157ad47fa752a9ad0baafc118d
          ports:
            - { name: nfs, containerPort: 2049 }
            - { name: nfs-udp, containerPort: 2049, protocol: UDP }
            - { name: nlockmgr, containerPort: 32803 }
            - { name: nlockmgr-udp, containerPort: 32803, protocol: UDP }
            - { name: mountd, containerPort: 20048 }
            - { name: mountd-udp, containerPort: 20048, protocol: UDP }
            - { name: rquotad, containerPort: 875 }
            - { name: rquotad-udp, containerPort: 875, protocol: UDP }
            - { name: rpcbind, containerPort: 111 }
            - { name: rpcbind-udp, containerPort: 111, protocol: UDP }
            - { name: statd, containerPort: 662 }
            - { name: statd-udp, containerPort: 662, protocol: UDP }
          securityContext:
            # DAC_READ_SEARCH: traverse exported trees regardless of the
            # requesting uid — not needed to start, kept for serve-time
            # traversal, which this evidence does not cover.
            # SYS_RESOURCE: fd headroom only. NOT required to start — measured,
            # see the correction in the pod-level comment above. Kept as an
            # availability tradeoff, not as a requirement.
            # No `drop: [ALL]` here, deliberately; see the pod-level comment.
            capabilities:
              add: ["DAC_READ_SEARCH", "SYS_RESOURCE"]
            allowPrivilegeEscalation: false
          # Factory#521 — this was the ONLY workload in the namespace with
          # neither limits nor requests, i.e. an unbounded root container that
          # the scheduler could not reason about. Measured steady state is
          # 2m CPU / 28Mi, so the memory limit is ~18x headroom: an OOMKill here
          # takes the `nfs` storageClass down, so it is sized to never bind in
          # normal operation while still capping a runaway.
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 512Mi }
          args:
            - "-provisioner=factory.io/nfs"
          env:
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: SERVICE_NAME, value: nfs-provisioner }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - { name: export-volume, mountPath: /export }
      volumes:
        - name: export-volume
          persistentVolumeClaim: { claimName: nfs-provisioner-backing }
---
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata: { name: nfs, labels: { app: nfs-provisioner } }
provisioner: factory.io/nfs
mountOptions:
  - vers=4.1
reclaimPolicy: Retain
volumeBindingMode: Immediate
