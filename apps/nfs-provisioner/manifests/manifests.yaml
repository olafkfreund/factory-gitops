# NFS RWX provisioner (nfs-ganesha-server-and-external-provisioner) — #781.
# One Deployment runs an in-pod ganesha NFS server backed by a local-path PVC and
# hands out ReadWriteMany volumes via the `nfs` storageClass, so any node's pod
# can mount the shared workspaces volume (the cluster otherwise ships only
# local-path RWO, which pins a PVC to one node).
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: nfs-provisioner, namespace: factory, labels: { app: nfs-provisioner } }
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata: { name: nfs-provisioner-runner, labels: { app: nfs-provisioner } }
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get"]
  - apiGroups: ["extensions"]
    resources: ["podsecuritypolicies"]
    resourceNames: ["nfs-provisioner"]
    verbs: ["use"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata: { name: run-nfs-provisioner, labels: { app: nfs-provisioner } }
subjects:
  - kind: ServiceAccount
    name: nfs-provisioner
    namespace: factory
roleRef:
  kind: ClusterRole
  name: nfs-provisioner-runner
  apiGroup: rbac.authorization.k8s.io
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata: { name: leader-locking-nfs-provisioner, namespace: factory, labels: { app: nfs-provisioner } }
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata: { name: leader-locking-nfs-provisioner, namespace: factory, labels: { app: nfs-provisioner } }
subjects:
  - kind: ServiceAccount
    name: nfs-provisioner
    namespace: factory
roleRef:
  kind: Role
  name: leader-locking-nfs-provisioner
  apiGroup: rbac.authorization.k8s.io
---
# Backing store for the in-pod NFS server (local-path, RWO — the ganesha pod owns
# it and re-exports it as RWX). Sized for the workspaces it will hold.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: nfs-provisioner-backing, namespace: factory, labels: { app: nfs-provisioner } }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-provisioner
  namespace: factory
  labels: { app: nfs-provisioner }
spec:
  selector: { app: nfs-provisioner }
  ports:
    - { name: nfs, port: 2049 }
    - { name: nfs-udp, port: 2049, protocol: UDP }
    - { name: nlockmgr, port: 32803 }
    - { name: nlockmgr-udp, port: 32803, protocol: UDP }
    - { name: mountd, port: 20048 }
    - { name: mountd-udp, port: 20048, protocol: UDP }
    - { name: rquotad, port: 875 }
    - { name: rquotad-udp, port: 875, protocol: UDP }
    - { name: rpcbind, port: 111 }
    - { name: rpcbind-udp, port: 111, protocol: UDP }
    - { name: statd, port: 662 }
    - { name: statd-udp, port: 662, protocol: UDP }
---
kind: Deployment
apiVersion: apps/v1
metadata: { name: nfs-provisioner, namespace: factory, labels: { app: nfs-provisioner } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: nfs-provisioner } }
  template:
    metadata: { labels: { app: nfs-provisioner } }
    spec:
      serviceAccountName: nfs-provisioner
      terminationGracePeriodSeconds: 10
      # Factory#521 — ACCEPTED EXCEPTION, recorded so the next sweep does not
      # "fix" it. This pod runs as root and keeps the default capability set,
      # and both are required. Ganesha is a userspace NFS server: it forks
      # rpcbind and rpc.statd, which bind privileged ports and setuid down to
      # the `rpc` user. Measured against this exact image rather than argued:
      #
      #   drop:[ALL] + the two adds below
      #     -> Error setting up NFS server: Starting rpcbind failed with error:
      #        exit status 1, output: rpcbind: /run/rpcbind/rpcbind.lock:
      #        Permission denied                                   (exit 255)
      #   drop:[ALL] + those two + SETUID SETGID DAC_OVERRIDE CHOWN FOWNER
      #   NET_BIND_SERVICE
      #     -> Error setting up NFS server: rpc.statd failed with error:
      #        exit status 1                                       (exit 255)
      #   default caps
      #     -> Running NFS server!
      #
      # So `drop: [ALL]` alongside the two explicit adds — the shape #521
      # suggested — does NOT work here, and a CrashLoop takes the `nfs`
      # storageClass down with it, which is what tfactory-data-rwx (#781) is
      # built on.
      #
      # What IS safe was measured the same way and is applied below:
      # seccompProfile RuntimeDefault and allowPrivilegeEscalation: false. With
      # no-new-privileges plus the two adds the server still reports
      #   starting RLIMIT_NOFILE rlimit.Cur 1024 -> ending rlimit.Cur 1048576
      #   Running NFS server!
      # and without SYS_RESOURCE that same raise logs "operation not permitted"
      # — which is the documented reason for the SYS_RESOURCE add, confirmed
      # rather than taken on trust.
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nfs-provisioner
          image: registry.k8s.io/sig-storage/nfs-provisioner:v4.0.8@sha256:c825f3d5e28bde099bd7a3daace28772d412c9157ad47fa752a9ad0baafc118d
          ports:
            - { name: nfs, containerPort: 2049 }
            - { name: nfs-udp, containerPort: 2049, protocol: UDP }
            - { name: nlockmgr, containerPort: 32803 }
            - { name: nlockmgr-udp, containerPort: 32803, protocol: UDP }
            - { name: mountd, containerPort: 20048 }
            - { name: mountd-udp, containerPort: 20048, protocol: UDP }
            - { name: rquotad, containerPort: 875 }
            - { name: rquotad-udp, containerPort: 875, protocol: UDP }
            - { name: rpcbind, containerPort: 111 }
            - { name: rpcbind-udp, containerPort: 111, protocol: UDP }
            - { name: statd, containerPort: 662 }
            - { name: statd-udp, containerPort: 662, protocol: UDP }
          securityContext:
            # DAC_READ_SEARCH: traverse exported trees regardless of the
            # requesting uid. SYS_RESOURCE: raise this process's own
            # file-descriptor limit (see the measured RLIMIT_NOFILE line above).
            # Both are load-bearing for RWX provisioning — do not remove.
            # No `drop: [ALL]` here, deliberately; see the pod-level comment.
            capabilities:
              add: ["DAC_READ_SEARCH", "SYS_RESOURCE"]
            allowPrivilegeEscalation: false
          args:
            - "-provisioner=factory.io/nfs"
          env:
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: SERVICE_NAME, value: nfs-provisioner }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - { name: export-volume, mountPath: /export }
      volumes:
        - name: export-volume
          persistentVolumeClaim: { claimName: nfs-provisioner-backing }
---
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata: { name: nfs, labels: { app: nfs-provisioner } }
provisioner: factory.io/nfs
mountOptions:
  - vers=4.1
reclaimPolicy: Retain
volumeBindingMode: Immediate
