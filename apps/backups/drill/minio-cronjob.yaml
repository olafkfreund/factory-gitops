################################################################################
# Scheduled MinIO restore drill (Factory#3691, risk R-001).
#
# Restores a bounded sample of the newest complete minio-backup-local snapshot
# into the scratch bucket restore-drill-scratch, checks every object against the
# snapshot manifest, empties the scratch bucket, measures the full path as
# rto_seconds, writes the result to factory-evidence and to the OpenObserve
# job_health stream (cronjob=minio-restore-drill), and fails red when anything is
# wrong. Never writes outside the scratch bucket and the evidence prefix.
# The sample is restored, not the whole bucket: sample_bytes and snapshot_bytes
# are in the result so a full restore can be estimated; none is claimed.
#
# Credentials (reused, none new): minio-creds, observe-root.
################################################################################
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-restore-drill
  namespace: factory
  labels: { app: minio-restore-drill }
spec:
  # 04:30 UTC: after the snapshot (03:30) and the postgres drill (04:15).
  schedule: "30 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  # Ten failed runs kept so a recurring failure can be read (Factory#381).
  failedJobsHistoryLimit: 10
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      # 0: a retry would write a second evidence object and job_health record for one night.
      backoffLimit: 0
      # A hung restore must end: with Forbid, an active Job blocks every later run.
      activeDeadlineSeconds: 1800
      # No ttlSecondsAfterFinished: it would reap failed Jobs and their logs (Factory#381).
      template:
        metadata: { labels: { app: minio-restore-drill } }
        spec:
          # Never, not OnFailure: failed pods must stay readable (Factory#438).
          restartPolicy: Never
          enableServiceLinks: false
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532        # owns the snapshot (mode 0700)
            fsGroup: 65532
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: drill
              image: ghcr.io/olafkfreund/mirror/minio-client:latest-dev@sha256:b056b795d31828015aea061e3168267b0ba80590ba2d8f869e72ff77153a68e8
              command: ["/bin/sh", "/script/minio-drill.sh"]
              env:
                - { name: S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: minio-creds, key: S3_ACCESS_KEY } } }
                - { name: S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: minio-creds, key: S3_SECRET_KEY } } }
              securityContext: &sec
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts: &mounts
                - { name: backup, mountPath: /backup, readOnly: true }
                - { name: scratch, mountPath: /scratch }
                - { name: script, mountPath: /script, readOnly: true }
              resources: &small
                requests: { cpu: 20m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
            - name: evidence
              image: ghcr.io/olafkfreund/mirror/minio-client:latest-dev@sha256:b056b795d31828015aea061e3168267b0ba80590ba2d8f869e72ff77153a68e8
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  export MC_CONFIG_DIR=/scratch/.mc
                  # A failed upload must not stop emit: it marks the run and emit goes red.
                  { mc alias set fac http://minio.factory.svc.cluster.local:9000 "$S3_ACCESS_KEY" "$S3_SECRET_KEY" >/dev/null 2>&1 \
                    && mc cp /scratch/result.json "fac/factory-evidence/control-plane-push/minio-restore-drill/$(date -u +%Y%m%dT%H%M%SZ).json"; } \
                    || { echo "evidence: upload FAILED" >&2; : > /scratch/evidence.failed; }
              env:
                - { name: S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: minio-creds, key: S3_ACCESS_KEY } } }
                - { name: S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: minio-creds, key: S3_SECRET_KEY } } }
              securityContext: *sec
              volumeMounts: *mounts
              resources: *small
          containers:
            - name: emit
              image: python:3.12-slim@sha256:646fb0bca3dd3ea1bcc6feb72c17ed16eed6e10cffc732fcc1478bd3e7f02d7b
              command: ["python", "/script/emit.py"]
              env:
                - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
                - { name: CRONJOB, value: minio-restore-drill }
                - { name: DRILL_KIND, value: minio_restore_drill }
                - name: OO_USER
                  valueFrom: { secretKeyRef: { name: observe-root, key: email } }
                - name: OO_PASS
                  valueFrom: { secretKeyRef: { name: observe-root, key: password } }
              securityContext: *sec
              volumeMounts: *mounts
              resources: *small
          volumes:
            - name: backup
              persistentVolumeClaim: { claimName: minio-backup-local, readOnly: true }
            - name: scratch
              emptyDir: { sizeLimit: 1Gi }
            - name: script
              configMap:
                name: postgres-restore-drill-script
                defaultMode: 0555
