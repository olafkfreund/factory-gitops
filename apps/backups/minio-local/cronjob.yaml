################################################################################
# In-cluster snapshot of the MinIO buckets factory-artifacts and factory-evidence
# onto a separate PVC (Factory#3691, risk R-001). No external credential.
#
# Protects against deletion, overwrite and corruption of bucket data. It does NOT
# protect against loss of the node disk: minio-data and this PVC are both
# local-path on the one node. The off-cluster copy is minio-offsite (Factory#3681).
# The snapshot is plaintext (mc reads decrypted bytes): mode 0700, uid 65532 only.
# See Factory docs/compliance/dr-runbook.md. Restored and checked nightly by
# minio-restore-drill (apps/backups/drill).
#
# Credentials (reused, none new): minio-creds.
################################################################################
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: minio-backup-local, namespace: factory, labels: { app: minio-backup-local } }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  # KEEP=3 full generations of factory-artifacts (7.2 GB on 2026-11-24) need ~22 GB (#423).
  resources: { requests: { storage: 40Gi } }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-backup-local
  namespace: factory
  labels: { app: minio-backup-local }
spec:
  # 03:30 UTC: after the postgres dump (02:15), before the restore drills (04:15, 04:30).
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  # Ten failed runs kept so a recurring failure can be read (Factory#381).
  failedJobsHistoryLimit: 10
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      # A hung copy must end: with Forbid, an active Job blocks every later run.
      activeDeadlineSeconds: 3600
      # No ttlSecondsAfterFinished: it would reap failed Jobs and their logs (Factory#381).
      template:
        metadata: { labels: { app: minio-backup-local } }
        spec:
          # Never, not OnFailure: failed pods must stay readable (Factory#438).
          restartPolicy: Never
          enableServiceLinks: false
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            fsGroup: 65532
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: copy
              image: ghcr.io/olafkfreund/mirror/minio-client:latest-dev@sha256:b056b795d31828015aea061e3168267b0ba80590ba2d8f869e72ff77153a68e8
              command: ["/bin/sh", "/script/minio-local.sh"]
              env:
                - { name: S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: minio-creds, key: S3_ACCESS_KEY } } }
                - { name: S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: minio-creds, key: S3_SECRET_KEY } } }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: backup, mountPath: /backup }
                - { name: scratch, mountPath: /scratch }
                - { name: script, mountPath: /script, readOnly: true }
              resources:
                requests: { cpu: 20m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
          volumes:
            - name: backup
              persistentVolumeClaim: { claimName: minio-backup-local }
            - name: scratch
              emptyDir: { sizeLimit: 1Gi }
            - name: script
              configMap:
                name: minio-backup-local-script
                defaultMode: 0555
