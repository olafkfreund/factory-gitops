# Audit-anchor freshness/integrity alert (Factory#313, #319, #381,
# factory-gitops#146).
#
# There is NO Prometheus/Alertmanager/kube-state-metrics in this cluster —
# OpenObserve (apps/observe) is the only telemetry backend. This CronJob verifies
# CFactory's tamper-evident audit chain daily and fails when it is stale or broken.
#
# Factory#381 FIXED THE ALERT ITSELF. Until then its only alerting mechanism was
# `eprint("ALERT: ...")` plus a non-zero exit: it wrote to stderr and died. The
# single outbound request it made FETCHED /api/audit; it notified nobody. An alert
# job whose alert is "the job failed", in a cluster where nothing watched job
# failures, was a no-op — and that is how cred-broker failed silently for seven
# weeks. It now EMITS a durable record to the OpenObserve `job_health` stream on
# every run, over the exact path apps/audit-siem-forward already uses. The
# non-zero exit is kept as well, so nothing that depended on it regresses.
#
# It reports on the healthy path too. Silence is not health: a record with
# status=ok every day is what makes "this check stopped running" a query rather
# than a thing somebody has to happen to notice. apps/job-watchdog watches the
# schedule side of the same job.
#
# factory-gitops#146 FIXED WHAT IT WAS LOOKING AT. The check read `GET /api/audit`,
# which serves the newest 100 rows. Against a 5,380-row trail that window is ids
# ~5280-5380: the standing fork at 2178 sits outside it, as does 98% of the trail,
# so the job reported `ok` daily on a chain with a known anomaly and would have
# missed any edit to a row older than the last hundred. It now reads
# `GET /api/audit/chain` (CFactory#312), which walks every row and recomputes
# every HMAC, and takes its verdict from that. `/api/audit` is still read, because
# it is the only surface carrying entry timestamps and freshness comes from there.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-anchor-alert-script
  namespace: factory
  labels: { app: audit-anchor-alert }
data:
  check.py: |
    #!/usr/bin/env python3
    """Alert when CFactory's tamper-evident audit chain is stale or broken.

    The audit "anchor" is the HMAC hash chain CFactory maintains over every
    confirmed HITL action (cfactory/audit.py, #21): each entry chains to the
    prior one via prev_hash == previous entry_hash. If CFactory or its audit
    store dies, the chain stops being written and its external attestation
    silently lapses — exactly the failure Factory#313/#319 has no alert for.

    This checker reads two read-only surfaces and alerts when the chain is
    unreachable, empty, anomalous, or STALE (newest entry older than STALE_HOURS):

      GET /api/audit/chain  the WHOLE trail (CFactory#312). Walks every row and
                            recomputes every HMAC server-side, returning a
                            verdict of ok / forked / tampered plus the row count
                            it actually walked. This is the integrity authority.
      GET /api/audit        the newest 100 rows. Read only for entry timestamps,
                            because /api/audit/chain carries none, and as the
                            degraded fallback below.

    Stdlib only; no HMAC secret needed — the recompute happens inside CFactory,
    which is the only thing that holds the key.

    COULD-NOT-CHECK IS NOT OK (factory-gitops#146). If /api/audit/chain is absent
    — a cockpit image predating CFactory#312 answers 404 — the job reports
    `degraded` and exits NON-ZERO. It does not fall silent and it does not report
    `ok`. That "a check that cannot run reads as a pass" failure is the entire
    defect class this job exists to catch, and it would be absurd for the job to
    commit it. The old newest-100 structural check still runs underneath so the
    weaker signal is not lost while the deploy catches up, but it cannot promote
    the run back to `ok`. This red clears itself the moment CFactory#312 reaches
    the deployed image; it is transient by construction, not an alarm wired on
    forever (which was CFactory#306's own defect).

    ALERTING (Factory#381): every run POSTs a record to the OpenObserve
    `job_health` stream — status `ok`, `alert` or `degraded`, with the problem
    text, the chain verdict and the row count actually walked — and
    THEN exits non-zero if there were problems. The emit is the notification; the
    exit code is kept for anything that reads it. If the emit itself fails that is
    printed loudly, and the check's own exit code still wins, because a delivery
    failure must never downgrade a real audit-chain alert to silence.

    Env:
      CFACTORY_URL   base url (default in-cluster service)
      STALE_HOURS    max age of the newest entry, hours (default 26; <=0 disables)
      API_KEY        optional bearer for /api/* when the keystore is enforced
      OBSERVE_URL    OpenObserve base url (default in-cluster service)
      OO_ORG         OpenObserve organization (default "default")
      OO_STREAM      target stream (default "job_health")
      OO_USER/OO_PASS OpenObserve login (from the observe-root secret)
    """

    import base64
    import json
    import os
    import sys
    import urllib.error
    import urllib.request
    from datetime import datetime, timezone


    def eprint(*a):
        print(*a, file=sys.stderr, flush=True)


    def notify(
        status: str,
        problems: list[str],
        entries: int | None = None,
        verdict: str | None = None,
        rows: int | None = None,
    ) -> None:
        """Best-effort durable alert record into OpenObserve.

        Same stream, same credentials and same /_json ingest as
        apps/audit-siem-forward and apps/job-watchdog — one delivery path for the
        whole namespace, not a second one to rot in parallel. Never raises: the
        caller's exit code is the authority on whether the CHAIN is healthy, and
        a broken sink must not mask that.
        """
        user, pw = os.environ.get("OO_USER", ""), os.environ.get("OO_PASS", "")
        if not user or not pw:
            eprint("WARN: OO_USER/OO_PASS unset — alert NOT delivered to OpenObserve")
            return
        oo = os.environ.get(
            "OBSERVE_URL", "http://observe.factory.svc.cluster.local:5080"
        ).rstrip("/")
        org = os.environ.get("OO_ORG", "default")
        stream = os.environ.get("OO_STREAM", "job_health")
        rec = {
            "_timestamp": int(datetime.now(timezone.utc).timestamp() * 1_000_000),
            "source": "audit-anchor-alert",
            "namespace": os.environ.get("NAMESPACE", "factory"),
            "cronjob": "audit-anchor-alert",
            "status": status,
            "problems": problems,
            "entries": entries,
            # factory-gitops#146: `rows` is how many the server actually walked.
            # It is the field that tells "the chain is sound" from "the check
            # looked at a hundred rows out of 5,380 and said fine".
            "verdict": verdict,
            "rows": rows,
        }
        try:
            req = urllib.request.Request(
                f"{oo}/api/{org}/{stream}/_json",
                data=json.dumps([rec]).encode(),
                headers={
                    "authorization": f"Basic {base64.b64encode(f'{user}:{pw}'.encode()).decode()}",
                    "content-type": "application/json",
                },
                method="POST",
            )
            with urllib.request.urlopen(req, timeout=30) as r:
                res = json.load(r)
        except Exception as e:  # noqa: BLE001 — delivery failure must not mask the alert
            eprint(f"WARN: could not deliver alert to OpenObserve: {e!r}")
            return
        st = (res.get("status") or [{}])[0] if isinstance(res.get("status"), list) else res
        if isinstance(st, dict) and st.get("failed"):
            eprint(f"WARN: OpenObserve rejected the alert record: {res}")
            return
        eprint(f"delivered status={status} to OpenObserve stream '{stream}'")


    def _parse_ts(raw: str) -> datetime:
        # pydantic emits ISO-8601; tolerate a trailing Z and naive (assume UTC).
        dt = datetime.fromisoformat(raw.replace("Z", "+00:00"))
        return dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc)


    def fetch(base: str, path: str) -> tuple[dict, str]:
        """GET a JSON surface -> (payload, error). A non-empty error means the
        surface could not be read, and no caller may treat that as healthy."""
        req = urllib.request.Request(f"{base}{path}", method="GET")
        key = os.environ.get("API_KEY")
        if key:
            req.add_header("authorization", f"Bearer {key}")
        try:
            with urllib.request.urlopen(req, timeout=30) as r:
                return json.load(r), ""
        except urllib.error.HTTPError as e:
            return {}, f"{path} HTTP {e.code}"
        except Exception as e:  # noqa: BLE001 — any failure is a real problem
            return {}, f"cannot reach {path}: {e!r}"


    def stale(entries: list[dict], now: datetime, stale_hours: float) -> list[str]:
        """Freshness, from /api/audit — the only surface carrying entry
        timestamps. `stale_hours <= 0` disables it (see the README: on a quiet
        control plane this can fire without a real fault)."""
        if stale_hours <= 0 or not entries:
            return []
        newest = max(_parse_ts(str(e["ts"])) for e in entries)
        age_h = (now - newest).total_seconds() / 3600.0
        if age_h > stale_hours:
            return [f"anchor STALE: newest entry is {age_h:.1f}h old (> {stale_hours}h)"]
        return []


    def chain_problems(report: dict) -> list[str]:
        """The whole-trail verdict from /api/audit/chain -> problems (empty == healthy).

        CFactory recomputed every HMAC over every row to produce this, so there is
        nothing left for this job to re-derive — it reads the verdict:

          tampered  a mutated/duplicate/dangling row. The real one.
          forked    a concurrent-append fork this deploy has NOT declared. After
                    CFactory#310 serialised the appends a new fork should be
                    impossible, so an undeclared one means that regressed.
          ok        no anomalies, or only forks configuration already explains.

        Declared forks come back in `acknowledged_forks` and are REPORTED, never
        alerted on: the live chain forked once at entry 2178 under the pre-#310
        write race, every HMAC in it is valid, and relinking it is precisely the
        edit the chain exists to detect — so it is never going away, and colouring
        it red forever would rebuild the always-on alarm of CFactory#306.

        `rows` is checked because a verdict computed over nothing is not a pass —
        that is the same "the check did not really run" hole as the 100-row window.
        """
        verdict = str(report.get("verdict") or "<missing>")
        rows = report.get("rows")
        if not isinstance(rows, int) or rows <= 0:
            return [
                f"/api/audit/chain walked rows={rows!r} — the check did not really run"
            ]
        if verdict == "ok":
            return []
        findings = report.get("findings") or []
        detail = "; ".join(
            f"id={f.get('id')} {f.get('kind')}: {f.get('detail')}" for f in findings[:5]
        ) or "(no detail)"
        return [
            f"chain verdict {verdict.upper()} over {rows} rows, "
            f"{len(findings)} undeclared finding(s): {detail}"
        ]


    def evaluate(entries: list[dict], now: datetime, stale_hours: float) -> list[str]:
        """Structural link check over the /api/audit window -> problems.

        DEMOTED by factory-gitops#146 from the integrity authority to the
        degraded fallback for when /api/audit/chain is absent. It can only ever
        attest to the newest 100 rows; chain_problems() is what covers the trail.
        """
        problems: list[str] = []
        if not entries:
            return ["audit chain is EMPTY — no anchored entries at all"]
        rows = sorted(entries, key=lambda e: e["id"])
        # Link the window to ITSELF, not to genesis. /api/audit returns at most
        # 100 entries. While the chain was shorter than that the first row was
        # always the genesis entry (prev_hash None) and seeding `prev = None`
        # worked. The moment the chain crossed 100 entries the window started
        # mid-chain — live right now at id=3..102 — and the first row's
        # prev_hash became legitimately non-None, so this check reported a FALSE
        # "chain BREAK at id=3" on EVERY run (Factory#381).
        #
        # That matters more than it looks: #381 exists because nobody noticed a
        # real failure, and nothing trains people to ignore an alert faster than
        # one that cries wolf daily. A windowed endpoint can only attest to
        # linkage WITHIN the window it returns; genesis is not observable from
        # here and full HMAC re-verification remains CFactory's job (as the
        # docstring already says). Deletion, reorder and tamper inside the
        # window are still caught.
        prev = rows[0].get("prev_hash")
        for e in rows:
            if e.get("prev_hash") != prev:
                problems.append(
                    f"chain BREAK at id={e.get('id')}: prev_hash={e.get('prev_hash')!r} "
                    f"!= expected {prev!r} (deletion/reorder/tamper)"
                )
                break
            prev = e.get("entry_hash")
        return problems + stale(rows, now, stale_hours)


    def main() -> int:
        base = os.environ.get(
            "CFACTORY_URL", "http://cfactory.factory.svc.cluster.local:3111"
        ).rstrip("/")
        stale_hours = float(os.environ.get("STALE_HOURS", "26"))
        now = datetime.now(timezone.utc)

        # /api/audit first: it is the only surface with entry timestamps, so
        # freshness comes from here whichever path below runs.
        payload, err = fetch(base, "/api/audit")
        if err:
            return emit("alert", 3, [f"{err} — audit surface unreachable"])
        entries = payload.get("entries")
        if not isinstance(entries, list):
            return emit("alert", 4, [f"/api/audit gave no entries list: keys={sorted(payload)}"])

        report, err = fetch(base, "/api/audit/chain")
        if err:
            # COULD NOT CHECK -> `degraded`, non-zero, never `ok`. A cockpit image
            # predating CFactory#312 answers 404 here. The newest-100 structural
            # check still runs so the weak signal is not lost, but a clean window
            # cannot promote this to a pass: 98% of the trail went unread and
            # saying "ok" to that is the defect, not the workaround for it.
            return emit(
                "degraded",
                6,
                [
                    f"COULD NOT CHECK the full chain: {err}. Needs GET /api/audit/chain "
                    f"(CFactory#312) on the deployed cockpit image; falling back to the "
                    f"newest-{len(entries)} window, which cannot attest to the rest of "
                    f"the trail. See factory-gitops#146.",
                    *evaluate(entries, now, stale_hours),
                ],
                entries=len(entries),
            )

        verdict, rows = str(report.get("verdict") or ""), report.get("rows")
        problems = chain_problems(report) + stale(entries, now, stale_hours)
        if problems:
            return emit("alert", 5, problems, len(entries), verdict, rows)
        acked = report.get("acknowledged_forks") or []
        eprint(
            f"OK: whole audit chain verified, verdict={verdict}, {rows} rows walked, "
            f"{len(acked)} declared fork(s) {acked}, fresh (<{stale_hours}h)"
        )
        # Emit on the healthy path too: a daily status=ok record is what turns
        # "this check silently stopped running" into a query instead of a hope.
        return emit("ok", 0, [], len(entries), verdict, rows)


    def emit(
        status: str,
        code: int,
        problems: list[str],
        entries: int | None = None,
        verdict: str | None = None,
        rows: int | None = None,
    ) -> int:
        """Print, DELIVER, then return the exit code. All three, in that order."""
        for p in problems:
            eprint(f"{status.upper()}: {p}")
        notify(status, problems, entries, verdict, rows)
        return code


    def _selftest() -> int:
        now = datetime(2026, 7, 24, 12, 0, tzinfo=timezone.utc)
        good = [
            {"id": 1, "prev_hash": None, "entry_hash": "a", "ts": "2026-07-24T11:00:00"},
            {"id": 2, "prev_hash": "a", "entry_hash": "b", "ts": "2026-07-24T11:30:00"},
        ]
        assert evaluate(good, now, 26) == [], "healthy chain must pass"
        assert evaluate([], now, 26), "empty chain must alert"
        broken = [dict(good[0]), {**good[1], "prev_hash": "WRONG"}]
        assert evaluate(broken, now, 26), "broken link must alert"
        # REGRESSION (Factory#381): /api/audit caps at 100 rows, so a healthy
        # chain longer than that arrives as a window starting mid-chain with a
        # non-None first prev_hash. That must NOT read as tampering — it did,
        # on every run, once the live chain passed 100 entries.
        windowed = [
            {"id": 3, "prev_hash": "c9e6", "entry_hash": "d1", "ts": "2026-07-24T11:00:00"},
            {"id": 4, "prev_hash": "d1", "entry_hash": "d2", "ts": "2026-07-24T11:30:00"},
        ]
        assert evaluate(windowed, now, 26) == [], "mid-chain window is not a break"
        # ...but a real break INSIDE the window is still caught.
        assert evaluate(
            [windowed[0], {**windowed[1], "prev_hash": "WRONG"}], now, 26
        ), "tamper inside the window must still alert"
        old = [{"id": 1, "prev_hash": None, "entry_hash": "a", "ts": "2026-07-01T00:00:00"}]
        assert evaluate(old, now, 26), "stale chain must alert"
        assert evaluate(old, now, 0) == [], "stale disabled (<=0) must pass"

        # factory-gitops#146: the whole-trail verdict is now the authority.
        live = {"verdict": "ok", "rows": 5380, "findings": [], "acknowledged_forks": [2178]}
        assert chain_problems(live) == [], (
            "a DECLARED fork must not alert — entry 2178 is permanent, and an "
            "alarm that is always on is not an alarm (CFactory#306)"
        )
        assert chain_problems(
            {**live, "verdict": "forked", "findings": [{"id": 9001, "kind": "forked", "detail": "x"}]}
        ), "an UNdeclared fork must alert — after CFactory#310 it means serialisation regressed"
        assert chain_problems(
            {**live, "verdict": "tampered", "findings": [{"id": 42, "kind": "mutated", "detail": "x"}]}
        ), "tamper must alert"
        assert chain_problems({**live, "rows": 0}), (
            "a verdict computed over 0 rows is 'the check did not run', not 'ok' — "
            "the same hole as the 100-row window"
        )

        # COULD NOT CHECK must surface as an error, not an exception and not a pass.
        # Port 9 (discard) is closed, so this needs no network.
        payload, err = fetch("http://127.0.0.1:9", "/api/audit/chain")
        assert err and payload == {}, "an unreadable surface must report an error, not raise"
        print("selftest OK")
        return 0


    if __name__ == "__main__":
        sys.exit(_selftest() if sys.argv[1:2] == ["selftest"] else main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-anchor-alert
  namespace: factory
  labels: { app: audit-anchor-alert }
spec:
  # Daily at 06:00. Freshness window (26h) > 24h so one skipped run is harmless.
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  # Factory#381: keep enough failed runs to reconstruct what happened. At one run
  # a day this is ten days of evidence; the #378 post-mortem had none, because
  # the failed Jobs were GC'd before anyone looked.
  failedJobsHistoryLimit: 10
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata: { labels: { app: audit-anchor-alert } }
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              # Stock python; the script is stdlib-only so no custom image.
              image: python:3.12-slim@sha256:646fb0bca3dd3ea1bcc6feb72c17ed16eed6e10cffc732fcc1478bd3e7f02d7b
              command: ["python3", "/script/check.py"]
              env:
                - { name: STALE_HOURS, value: "26" }
                - { name: OO_STREAM, value: "job_health" }
                - { name: OO_ORG, value: "default" }
                # Factory#381: the alert now has somewhere to GO. Same
                # observe-root secret apps/audit-siem-forward already uses — one
                # delivery path for the namespace, not a second one to rot.
                - name: OO_USER
                  valueFrom: { secretKeyRef: { name: observe-root, key: email } }
                - name: OO_PASS
                  valueFrom: { secretKeyRef: { name: observe-root, key: password } }
                # Optional bearer for /api/* if the keystore is enforced. The
                # frontend uses the same bare key; absent secret => no header,
                # which is correct while the keystore is open.
                - name: API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cfactory-api-keys
                      key: api-key
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: audit-anchor-alert-script
