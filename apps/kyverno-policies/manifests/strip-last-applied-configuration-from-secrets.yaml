# Strip `kubectl.kubernetes.io/last-applied-configuration` from Secrets at admission.
#
# WHY THIS EXISTS. `kubectl apply` (client-side) writes the COMPLETE submitted
# manifest into that annotation, including `.data` — so the plaintext of every
# key lands in metadata. `kubectl create` does not do this; `kubectl apply
# --server-side` does not do this; ArgoCD's default (client-side) sync does.
#
# The annotation defeats the redaction people actually rely on:
#   - `kubectl describe secret` REDACTS `.data` but PRINTS annotations.
#   - RBAC and audit tooling is routinely written treating `.data` as the
#     sensitive field and metadata as safe.
#   - Any diagnostic dump, ArgoCD managed-resources view, or
#     `kubectl get secret -o json | jq .metadata` in a runbook prints the value.
#
# Factory#448 swept this once by hand and it CAME BACK within a day, because the
# cause is the write path, not any individual Secret. At the time this policy was
# written the sweep found 25 Secrets / 83 keys leaking, including the fleet's main
# credential bundle (factory/factory-secrets, 21 keys), ArgoCD's own signing
# material (argocd/argocd-secret), and a near-admin GitHub PAT (factory/ghcr-pull,
# Factory#565). A one-time sweep is not a fix for something that regenerates.
#
# Refs Factory#565, Factory#448, Factory#312, Factory#315.
#
# ---------------------------------------------------------------------------
# BLAST RADIUS — read before editing. This rule runs on EVERY Secret write in
# the cluster. Three deliberate choices keep a bad day from becoming an outage:
#
# 1. failurePolicy: Ignore  <- THE IMPORTANT ONE. DO NOT CHANGE TO Fail.
#    Installing this policy makes Kyverno register `secrets` on the resource
#    mutating webhook, which it does not do today (only pods/workloads). With
#    `Fail`, any Kyverno admission-controller outage would block EVERY Secret
#    write cluster-wide: ArgoCD sync, cert-manager renewals, ServiceAccount
#    token creation, Helm release writes. On a single-node k3d cluster whose
#    Kyverno background and cleanup controllers have each restarted hundreds of
#    times, that trade is not close. With `Ignore`, a Kyverno outage means an
#    annotation is briefly not stripped — a detectable, repairable gap — instead
#    of a wedged cluster. Defence in depth belongs in a detection sweep
#    (Factory#448 asks for one), not in making this webhook load-bearing.
#
# 2. Namespace exclusions: kube-system and kyverno.
#    - kube-system holds k3s control-plane material created by the API server
#      itself, not by `kubectl apply`. Nothing to gain, and it is the worst
#      possible place for an admission surprise during cluster boot.
#    - kyverno holds Kyverno's OWN webhook CA/TLS Secrets. Routing those writes
#      through Kyverno's own webhook is a self-dependency; cert rotation must
#      never be able to wedge on the thing it is rotating certs for.
#    Every other namespace — including namespaces that do not exist yet — is in
#    scope, which is the point: an allowlist would leak again on the next new
#    namespace.
#
# 3. A guarded JSON-Patch `remove`, NOT a strategic-merge null.
#    This was written the other way round first, and MEASURED WRONG against the
#    live cluster. `patchStrategicMerge` with
#    `kubectl.kubernetes.io/last-applied-configuration: null` is silently a
#    NO-OP here: the webhook fires (proved by swapping the rule for one that ADDS
#    a marker annotation — the marker landed) but the annotation survives. Do not
#    "simplify" this rule back to a strategic-merge null without re-running the
#    canary below; it will look clean, apply cleanly, report Ready, and strip
#    nothing.
#
#    JSON Patch `op: remove` FAILS on an absent path, which on its own would
#    reject every Secret that was correctly created WITHOUT the annotation — i.e.
#    it would break `kubectl create secret`. The `preconditions` block is what
#    makes that safe: the rule is only evaluated when the annotation is actually
#    present, so the remove can never hit a missing path. The precondition is
#    load-bearing, not decoration. Verified: `kubectl create secret generic` (no
#    annotation) is admitted normally.
#
#    Note the JSON Pointer escaping: `/` in the annotation key is written `~1`.
#    An unescaped key silently addresses the wrong path.
#
# WHAT THIS RULE DOES NOT DO. It does not touch `.data`, `.type`, ownership, or
# any other annotation. The only object state it can remove is one annotation
# whose sole consumer is client-side `kubectl apply`.
#
# EXPECTED NOISE, NOT A FAULT. Every `kubectl apply` onto an existing Secret now
# prints:
#   Warning: resource secrets/<name> is missing the
#   kubectl.kubernetes.io/last-applied-configuration annotation which is required
#   by kubectl apply ... The missing annotation will be patched automatically.
# That warning IS the policy working: kubectl re-adds the annotation, Kyverno
# strips it again on the way in. The apply succeeds. Do not "fix" this.
#
# KNOWN, ACCEPTED SIDE EFFECT. Client-side `kubectl apply` uses this annotation
# for its three-way merge to work out which fields to DELETE. With the annotation
# always absent, apply falls back to a two-way merge: a key REMOVED from a Secret
# manifest will no longer be removed from the live Secret on re-apply. Stale keys
# accumulate silently. That is a real papercut and it is the correct trade against
# leaking plaintext. The fix for anyone it bites is `kubectl apply --server-side`,
# which both tracks field ownership properly AND never writes the annotation.
#
# NOT USED: mutateExistingOnPolicyUpdate. It would clean pre-existing Secrets, but
# it runs in the background controller (the least stable pod here) and requires
# granting that controller UPDATE on every Secret in the cluster — a standing
# privilege expansion to do a one-off job that `kubectl annotate <res>
# kubectl.kubernetes.io/last-applied-configuration-` already did, in place,
# verifiably, without touching `.data`. Admission-time only is the smaller
# permanent footprint.
#
# VALIDATE ANY EDIT AGAINST THE LIVE WEBHOOK BEFORE MERGING:
#   kubectl --context factory apply --dry-run=server -f <this file>
# Factory#430: an invalid policy file cannot be applied at all, and ArgoCD then
# SILENTLY keeps serving the previous version while reporting Healthy. CI does not
# cover this directory (factory-gitops#111, #117), so the dry-run IS the gate.
# ---------------------------------------------------------------------------
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: strip-last-applied-configuration-from-secrets
  annotations:
    policies.kyverno.io/title: Strip last-applied-configuration from Secrets
    policies.kyverno.io/category: Secrets
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/description: >-
      Client-side kubectl apply and ArgoCD's default sync copy a Secret's full
      manifest, including plaintext .data, into the
      kubectl.kubernetes.io/last-applied-configuration annotation, where
      kubectl describe prints it unredacted. This removes that annotation on
      every Secret create and update outside kube-system and kyverno.
spec:
  # Admission-time only. `background: false` because a mutate rule with no
  # `targets` has nothing to do in a background scan; leaving it true would only
  # add churn in the background controller.
  admission: true
  background: false
  # Ignore: a Kyverno outage must degrade this rule, never block Secret writes.
  # See BLAST RADIUS note 1 above before changing. This is spec-level in
  # kyverno.io/v1 — a rule-level `failurePolicy` is rejected by the API server
  # with a strict-decoding error, it is NOT silently ignored.
  failurePolicy: Ignore
  rules:
    - name: remove-last-applied-configuration
      match:
        any:
          - resources:
              kinds:
                - Secret
              operations:
                - CREATE
                - UPDATE
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
      # LOAD-BEARING. Without this guard the `op: remove` below fails on any
      # Secret that has no such annotation, which would reject `kubectl create
      # secret`. See BLAST RADIUS note 3.
      preconditions:
        all:
          - key: '{{ request.object.metadata.annotations."kubectl.kubernetes.io/last-applied-configuration" || '''' }}'
            operator: NotEquals
            value: ""
      mutate:
        patchesJson6902: |-
          - path: /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
            op: remove
