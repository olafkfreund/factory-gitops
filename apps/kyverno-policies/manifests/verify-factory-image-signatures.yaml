# Verify cosign keyless signatures on factory container images at admission.
#
# AUDIT MODE ONLY. validationFailureAction: Audit means an unsigned or
# wrongly-signed image is REPORTED (ClusterPolicyReport + a PolicyViolation
# event) but the Pod is still admitted. See docs/image-signature-admission.md
# for the enforce path, and Factory#522 for the blockers still open.
#
# Signer identity verified per repo:
#   issuer  = https://token.actions.githubusercontent.com  (GitHub Actions OIDC)
#   subject = the FULL workflow-and-ref identity, anchored at both ends.
#
# Factory#522: the subject constraint used to be the repo prefix alone
# (`^https://github\.com/olafkfreund/<Repo>/`). That is scoped to owner and
# repo, but it accepts ANY workflow in that repo on ANY ref -- including
# `some-other.yml@refs/heads/main`, `deploy.yml@refs/heads/attacker-branch`
# and `deploy.yml@refs/pull/99/merge`. While this policy is in Audit that is
# academic; at Enforce the identity IS the security boundary, and a workflow
# added on a branch with `id-token: write` could mint an accepted signature.
# The pattern is now pinned to the exact publishing workflows on refs/heads/main.
#
# The workflow ALTERNATION is not decoration -- each listed workflow publishes
# images this cluster actually runs, verified with `cosign verify` against the
# live registry:
#   release.yml@refs/heads/main    -> :vX.Y.Z / :X.Y.Z   (semver, in manifests)
#   deploy.yml@refs/heads/main     -> :sha-<short>       (CD, every running Pod)
#   build-nix.yml@refs/heads/main  -> :sha-<short>-nix   (AIFACTORY_BUILD_IMAGE)
# Dropping one of these from the alternation denies real deployments. build-nix
# exists only in AIFactory; CFactory publishes solely from deploy.yml.
#
# Until Factory#430 only release.yml signed, so every running Pod (all on
# sha-* tags from deploy.yml) failed verification. Signing was added to the
# CD workflows; do not remove it.
#
# Factory#430, second finding (2026-08-05). After the CD workflows were signing
# correctly, the audit STILL failed 100%. The cause was not signing and not the
# identity above -- it was that no Pod in the cluster could resolve any external
# name, so Kyverno could not fetch the Sigstore TUF root:
#
#   failed to verify image ghcr.io/olafkfreund/aifactory:sha-6b116ee:
#   .attestors[0].entries[0].keyless: failed to get roots from fulcio:
#   initializing tuf: ... Get "https://tuf-repo-cdn.sigstore.dev/13.root.json":
#   lookup tuf-repo-cdn.sigstore.dev on 10.43.0.10:53: server misbehaving
#
# THE REPORT DOES NOT DISTINGUISH THE TWO CASES. Kyverno writes the same
# `fail: unverified image` result whether the image carries no valid signature
# or whether Kyverno could not reach Sigstore/GHCR at all. Before acting on a
# fail -- and especially before Factory#522 flips this to Enforce -- read the
# admission-controller log for that image and confirm the reason is a signature
# verdict, not a transport error:
#
#   kubectl -n kyverno logs deploy/kyverno-admission-controller \
#     | grep 'failed to verify image'
#
# The failure is also sticky per process: once the Sigstore root fetch fails,
# that admission-controller Pod keeps failing after connectivity is restored
# until it is restarted. See docs/image-signature-admission.md.
#
# Factory#444 (2026-08-05). `background: true` is now set. Until it was, a Pod
# was verified exactly once -- at admission -- and its PolicyReport was frozen
# at that verdict for the life of the Pod. That made "Audit is quiet" a
# statement about the last rollout, not about the cluster now.
#
# Two things about this that are easy to get wrong:
#
# 1. The scan is run by the REPORTS controller, not the deployment called
#    `kyverno-background-controller`. `--backgroundScan=true`,
#    `--backgroundScanInterval=1h`, `--backgroundScanWorkers=2` are all flags on
#    kyverno-reports-controller; the background-controller handles generate and
#    mutateExisting rules and touches nothing here. Factory#561 (background- and
#    cleanup-controller restart loops) therefore does not affect these reports.
#
# 2. `useCache` is TRUE (Kyverno's default, pinned explicitly below). The image
#    verify cache is positive-only, in-process, and keyed on
#    `policyUID;policyResourceVersion;ruleName;imageRef` with a 60m TTL
#    (--imageVerifyCacheTTLDuration, unset here so the 60m default applies).
#    Consequence: a background scan can serve a `pass` that was computed up to
#    60 minutes earlier, so with a 1h scan interval a revoked signature or a
#    repointed tag is detected within roughly one to two hours rather than
#    exactly one. It is a bounded lag, not a frozen report -- and any edit to
#    this file changes the policy resourceVersion, which invalidates every
#    entry. If that window ever needs to be tighter, lower
#    --imageVerifyCacheTTLDuration on kyverno-reports-controller; do NOT set
#    useCache: false, because the same field also governs the admission hot
#    path and would put a full Rekor round trip in front of every build and
#    verify Job Pod.
#
# Factory#524 (2026-08-05). The eleven `tfactory-runner-*` images -- the
# sandbox that generated code is built and executed in -- are covered by
# `verify-tfactory-runner-signature` below. Two of them (tfactory-runner-nix,
# tfactory-runner-portal-ui) were PRIVATE GHCR packages and reported `fail`
# because Kyverno reads ghcr.io anonymously and cannot retrieve a signature it
# cannot read.
#
# CLOSED by Factory#563 on 2026-08-07: both packages were made PUBLIC, so all
# sixteen covered images are readable with no credential at all. Kyverno holds
# no ghcr.io Secret and needs none -- see apps/kyverno/manifests/
# kustomization.yaml, which also records why the dormant
# `--imagePullSecrets=kyverno-ghcr-pull` flag was removed rather than left in
# place (Factory#566: a wrong or expired credential unverifies all sixteen at
# once, with no fallback to the anonymous path).
#
# Measured through the live webhook the same day, with no Secret in the
# kyverno namespace, on a Pod carrying all three kinds of runner:
#
#   kyverno.io/verify-images: {"ghcr.io/olafkfreund/tfactory-runner-nix:latest":"pass",
#     "ghcr.io/olafkfreund/tfactory-runner-portal-ui:latest":"pass",
#     "ghcr.io/olafkfreund/tfactory-runner-pytest:latest":"pass"}
#
# Factory#564 (2026-08-05). THE RULES IN THIS FILE ONLY EVER SPEAK ABOUT IMAGES
# THEIR GLOBS NAME. `required: true` below means "a MATCHED image must have a
# signature"; it does NOT mean "every image must match a rule". An image no
# glob names is admitted unverified and produces no result at all -- not a
# pass, not a fail, nothing. Fourteen such images were running in `factory`
# when #564 was filed, and the board still read "65 pass / 0 fail", which was
# true and useless.
#
# Two consequences to keep in mind when reading this file:
#
# 1. `verify-skillai-signature` was added here for `skillai` and
#    `skillai-migrator`, whose publishing workflow now signs (SkillAi#303).
#    NOTE ITS REF ANCHOR: that repository publishes from
#    `refs/heads/core-mvp-foundation`, its default branch, NOT from main. Every
#    other rule in this file anchors on main. Copying one of them for a new
#    SkillAi image would silently reject its signature.
#
# 2. `odin` is deliberately NOT given a rule here even though it is signed as
#    of Odin#4 and verifies against the live registry. The `odin` GHCR package
#    is PRIVATE and Kyverno holds no ghcr.io credential, so a rule would
#    report the Factory#430 registry-auth ambiguity rather than a signature
#    verdict -- a permanent misleading red that costs #522 its criterion. Its
#    absence is not silent: `require-first-party-signature-coverage` reports it
#    accurately as an uncovered first-party image until a rule can honestly be
#    written. Tracked in Factory#572.
#
# The general defect -- coverage by omission -- is closed by a separate policy,
# `require-first-party-signature-coverage.yaml` in this directory, which fails
# on ANY `ghcr.io/olafkfreund/*` image in `factory` that no glob here names.
# When you add a rule to this file, add its glob to that policy's mirror list
# IN THE SAME COMMIT. Read the long comment at the top of that file first; it
# records why the obvious catch-all shape (a sixth verifyImages rule with
# `required: true` and no attestor) was measured and rejected.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-factory-image-signatures
  annotations:
    policies.kyverno.io/title: Verify Factory Image Signatures (cosign keyless)
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Verifies cosign keyless signatures on ghcr.io/olafkfreund factory images
      admitted into the `factory` namespace. AUDIT mode: violations are reported,
      never denied. Signer identity is pinned to the exact publishing workflow
      on refs/heads/main.
spec:
  # AUDIT/WARN ONLY — report to PolicyReports, do NOT deny.
  #
  # Do NOT flip this to Enforce here. Factory#522 tracks the flip as a separate
  # change with its own blockers, the load-bearing one being that nothing has
  # ever observed this policy DENY anything. A control has to be seen failing
  # when its subject is bad before it is trusted to gate real deployments.
  validationFailureAction: Audit
  # If Kyverno itself is down / registry is unreachable, admit rather than
  # block. Signature verification is a report signal here, not a gate.
  failurePolicy: Ignore
  webhookTimeoutSeconds: 30
  # Factory#444. Re-evaluate matched resources on the reports controller's
  # background scan interval (1h) instead of only at admission, so a report is
  # live state rather than a snapshot of the last rollout. Turned on only after
  # Factory#430 and #441 made the audit genuinely green -- with the fleet
  # unverifiable this would have produced continuous noise.
  #
  # Cost, measured on the first sweep after the flip (2026-08-05T14:50:47Z):
  # 65 resources produce a result -- 55 ReplicaSets, 5 Deployments, 5 Pods --
  # of which 52 were fresh cosign verifications and 13 came from the cache,
  # across 45 distinct (rule, image reference) pairs. Call it ~50 registry+Rekor
  # calls an hour, ~1200 a day. Far below either service's limits.
  #
  # The cost is NOT the five running images. Autogen rules match every pod
  # controller and kyverno-reports-controller runs --skipResourceFilters=true,
  # so the [ReplicaSet,*,*] entry in the kyverno ConfigMap's resourceFilters
  # does not apply to background scans. Every retained ReplicaSet is verified
  # each interval on the historical sha-* tag it was created with: 41 distinct
  # image references. The ceiling is set by revisionHistoryLimit (10, the
  # default, on all five services) -- 5 x 11 = 55 ReplicaSets -- not by how
  # often anything deploys. Raise revisionHistoryLimit and this rises linearly.
  background: true
  rules:
    - name: verify-aifactory-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [factory]
      verifyImages:
        - imageReferences:
            - "ghcr.io/olafkfreund/aifactory:*"
          # Audit phase: verify the signature only. Do not require digest
          # pinning and do not mutate the tag to a digest.
          verifyDigest: false
          mutateDigest: false
          required: true
          # Kyverno's default, pinned so an upgrade cannot silently change the
          # freshness of the evidence. See the useCache note in the header.
          useCache: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    # build-nix.yml is in the alternation because
                    # AIFACTORY_BUILD_IMAGE (:sha-<short>-nix) matches the glob
                    # above and runs as a Pod in this namespace on every packed
                    # build Job. Omitting it would deny every Nix build.
                    subjectRegExp: "^https://github\\.com/olafkfreund/AIFactory/\\.github/workflows/(deploy|release|build-nix)\\.yml@refs/heads/main$"
                    # Kyverno v1.18 REJECTS a keyless attestor with neither
                    # `rekor` nor `roots` ("Either Rekor URL or roots are
                    # required"). Without it ArgoCD cannot apply this file at
                    # all, so the cluster kept a stale copy of the policy that
                    # had lost its subjectRegExp — i.e. it accepted a signature
                    # from ANY GitHub Actions workflow in ANY repo. Factory#430.
                    rekor:
                      url: "https://rekor.sigstore.dev"
    - name: verify-pfactory-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [factory]
      verifyImages:
        - imageReferences:
            - "ghcr.io/olafkfreund/pfactory:*"
          verifyDigest: false
          mutateDigest: false
          required: true
          # Kyverno's default, pinned so an upgrade cannot silently change the
          # freshness of the evidence. See the useCache note in the header.
          useCache: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: "^https://github\\.com/olafkfreund/PFactory/\\.github/workflows/(deploy|release)\\.yml@refs/heads/main$"
                    # Kyverno v1.18 REJECTS a keyless attestor with neither
                    # `rekor` nor `roots` ("Either Rekor URL or roots are
                    # required"). Without it ArgoCD cannot apply this file at
                    # all, so the cluster kept a stale copy of the policy that
                    # had lost its subjectRegExp — i.e. it accepted a signature
                    # from ANY GitHub Actions workflow in ANY repo. Factory#430.
                    rekor:
                      url: "https://rekor.sigstore.dev"
    - name: verify-tfactory-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [factory]
      verifyImages:
        - imageReferences:
            - "ghcr.io/olafkfreund/tfactory:*"
          verifyDigest: false
          mutateDigest: false
          required: true
          # Kyverno's default, pinned so an upgrade cannot silently change the
          # freshness of the evidence. See the useCache note in the header.
          useCache: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: "^https://github\\.com/olafkfreund/TFactory/\\.github/workflows/(deploy|release)\\.yml@refs/heads/main$"
                    # Kyverno v1.18 REJECTS a keyless attestor with neither
                    # `rekor` nor `roots` ("Either Rekor URL or roots are
                    # required"). Without it ArgoCD cannot apply this file at
                    # all, so the cluster kept a stale copy of the policy that
                    # had lost its subjectRegExp — i.e. it accepted a signature
                    # from ANY GitHub Actions workflow in ANY repo. Factory#430.
                    rekor:
                      url: "https://rekor.sigstore.dev"
    # CFactory signs both its images from deploy.yml (CFactory#191 + #247), so
    # the rule that was blocked on signing can now exist. Verified against the
    # live registry — both images carry a signature whose subject is
    # `.../CFactory/.github/workflows/deploy.yml@refs/heads/main`.
    #
    # Backend and cockpit share one rule: same repo, same workflow, same
    # attestor. The `cfactory:*` glob does not match `cfactory-frontend:*` —
    # the literal `:` after `cfactory` stops it — so both need listing.
    #
    # All five factory GHCR packages (aifactory, pfactory, tfactory, cfactory,
    # cfactory-frontend) are PUBLIC as of 2026-08-05. An earlier version of this
    # comment said cfactory and cfactory-frontend were private and therefore
    # unreadable by Kyverno; that is no longer true, and Factory#430 confirmed
    # it -- Kyverno now fetches and verifies both anonymously, and both report
    # `pass` in their Pod PolicyReports.
    #
    # Still true, and load-bearing for Factory#522: Kyverno has NO registry
    # credential for ghcr.io. It runs with
    # `--registryCredentialHelpers=default,google,amazon,azure,github` and there
    # is no imagePullSecret in the kyverno namespace, so it reads GHCR
    # anonymously. If any of these packages is ever flipped back to private,
    # verification breaks immediately -- a warning under Audit, a denial of
    # every Pod using it under Enforce. Making a factory package private
    # requires wiring a read-only GHCR credential into the kyverno namespace
    # first.
    - name: verify-cfactory-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [factory]
      verifyImages:
        - imageReferences:
            - "ghcr.io/olafkfreund/cfactory:*"
            - "ghcr.io/olafkfreund/cfactory-frontend:*"
          verifyDigest: false
          mutateDigest: false
          required: true
          # Kyverno's default, pinned so an upgrade cannot silently change the
          # freshness of the evidence. See the useCache note in the header.
          useCache: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    # No alternation: CFactory has no release.yml and no
                    # build-nix.yml. deploy.yml is its only publisher.
                    subjectRegExp: "^https://github\\.com/olafkfreund/CFactory/\\.github/workflows/deploy\\.yml@refs/heads/main$"
                    # Same Kyverno v1.18 requirement as the rules above: a
                    # keyless attestor with neither `rekor` nor `roots` is
                    # rejected outright and ArgoCD cannot apply the file.
                    rekor:
                      url: "https://rekor.sigstore.dev"
    # Factory#524, phase 2 (2026-08-05). The four rules above cover the five
    # SERVICE images -- the control plane. They cover none of the eleven RUNNER
    # images, which is the worse half: those are the sandbox in which generated
    # code is built and executed.
    #
    #   AIFACTORY_SANDBOX_IMAGE       tfactory-runner-nix
    #   TFACTORY_VAL3_K8S_JOB_IMAGE   tfactory-runner-nix
    #   TFACTORY_NIX_RUNNER_IMAGE     tfactory-runner-nix
    #   PORTAL_UI_IMAGE               tfactory-runner-portal-ui
    #   lane dispatch                 tfactory-runner-{pytest,jest,playwright,
    #                                 vitest,cypress,java,selenium,cucumber,cloud}
    #
    # TFactory#947/#949 (phase 1) added cosign signing to all three publishing
    # workflows. One rule covers all eleven: unlike `cfactory` /
    # `cfactory-frontend`, nothing here is stopped by a literal `:`, and
    # `tfactory-runner-*` was confirmed against kyverno v1.18.2 -- the cluster's
    # exact version -- to match `ghcr.io/olafkfreund/tfactory-runner-<x>:<tag>`.
    #
    # The three-way alternation is load-bearing in the same way the AIFactory
    # one is: nix-runner-image.yml, portal-ui-runner-image.yml and
    # runner-images.yml are three separate publishing workflows, and dropping
    # any one of them stops a real Job from verifying.
    #
    # THE TWO FORMERLY-PRIVATE RUNNERS -- READ THIS BEFORE TRIAGING A RED.
    #
    # `tfactory-runner-nix` and `tfactory-runner-portal-ui` were PRIVATE GHCR
    # packages while the other nine were public. Kyverno reads ghcr.io
    # anonymously -- there is no imagePullSecret in the kyverno namespace -- so
    # it could not retrieve a signature it could not read, and these two
    # reported `fail` while every other runner reported `pass`.
    #
    # CLOSED by Factory#563 on 2026-08-07: both packages are now PUBLIC. The
    # glob below already named them, so no rule changed and none needed to --
    # the gap was read access, never coverage. Verified anonymously, with an
    # empty credential store, which is exactly what Kyverno does:
    #
    #   $ DOCKER_CONFIG=<empty> cosign verify \
    #       --certificate-oidc-issuer https://token.actions.githubusercontent.com \
    #       --certificate-identity-regexp '<the subjectRegExp below>' \
    #       ghcr.io/olafkfreund/tfactory-runner-nix:latest
    #   Subject: .../workflows/nix-runner-image.yml@refs/heads/main
    #
    #   ghcr.io/olafkfreund/tfactory-runner-portal-ui:latest
    #   Subject: .../workflows/portal-ui-runner-image.yml@refs/heads/main
    #
    # and through the live webhook, on a Pod carrying both, zero warnings and
    # `kyverno.io/verify-images` reporting `pass` for each.
    #
    # IT WAS NOT FIXED WITH A CREDENTIAL. That path was built (a
    # `--imagePullSecrets=kyverno-ghcr-pull` flag on both verifying
    # controllers) and is now removed: the Secret was never created, and
    # Factory#566 measured that a wrong or EXPIRED one unverifies ALL SIXTEEN
    # covered images rather than degrading to the anonymous path. See
    # apps/kyverno/manifests/kustomization.yaml.
    #
    # It was also NOT fixed by excluding these two images from the rule. An
    # exclusion would have permanently unverified the sandbox that generated
    # code is built and executed in, which is the opposite of the point.
    #
    # IF EITHER GOES RED AGAIN, decide first which failure it is -- Kyverno
    # writes `unverified image` for both, which is the whole of Factory#430:
    #
    #   registry-auth   names ghcr.io/token and says UNAUTHORIZED; the package
    #                   went private again, and nothing here will fix it
    #   signature       says `no matching signatures`, `subject mismatch` or
    #                   `issuer mismatch`, and never touches the token endpoint
    #
    # Confirm the read half in one call, no cluster involved:
    #
    #   curl -s "https://ghcr.io/token?scope=repository%3Aolafkfreund%2F<pkg>%3Apull&service=ghcr.io"
    #
    # A private package answers that with `denied` and 403s the manifest.
    - name: verify-tfactory-runner-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [factory]
      verifyImages:
        - imageReferences:
            - "ghcr.io/olafkfreund/tfactory-runner-*"
          verifyDigest: false
          mutateDigest: false
          required: true
          # Kyverno's default, pinned so an upgrade cannot silently change the
          # freshness of the evidence. See the useCache note in the header.
          useCache: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: "^https://github\\.com/olafkfreund/TFactory/\\.github/workflows/(nix-runner-image|portal-ui-runner-image|runner-images)\\.yml@refs/heads/main$"
                    # Same Kyverno v1.18 requirement as the rules above: a
                    # keyless attestor with neither `rekor` nor `roots` is
                    # rejected outright and ArgoCD cannot apply the file.
                    rekor:
                      url: "https://rekor.sigstore.dev"
    # Factory#564 (2026-08-05). `skillai` ran in this namespace matched by no
    # rule at all, so it produced no result -- and it was simultaneously the
    # known-UNSIGNED control used in the #522 deny experiment. It is now signed
    # (SkillAi#303) and this rule is the second half of that fix.
    #
    # ORDER MATTERS AND WAS FOLLOWED: signing landed first, was confirmed
    # against the live registry with the anchored identity below, and only then
    # was this rule written. A rule in front of an unsigned image produces
    # nothing but Audit noise.
    #
    # TWO THINGS HERE DIFFER FROM EVERY OTHER RULE IN THIS FILE.
    #
    # 1. THE REF IS NOT main. SkillAi's default branch -- and the only branch
    #    its deploy-image.yml publishes from, and the one ArgoCD tracks in
    #    apps/skillai/application.yaml -- is `core-mvp-foundation`. Anchoring
    #    this on refs/heads/main would reject every signature SkillAi produces.
    #
    # 2. BOTH IMAGES ARE LISTED. `skillai-migrator` runs as a Job in this
    #    namespace, and `ghcr.io/olafkfreund/skillai:*` does NOT match
    #    `skillai-migrator:*` -- the literal `:` after `skillai` stops it. Same
    #    trap as `cfactory` / `cfactory-frontend` above. Both GHCR packages are
    #    public, so Kyverno can read them anonymously today.
    - name: verify-skillai-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [factory]
      verifyImages:
        - imageReferences:
            - "ghcr.io/olafkfreund/skillai:*"
            - "ghcr.io/olafkfreund/skillai-migrator:*"
          verifyDigest: false
          mutateDigest: false
          required: true
          # Kyverno's default, pinned so an upgrade cannot silently change the
          # freshness of the evidence. See the useCache note in the header.
          useCache: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    # No alternation: deploy-image.yml is SkillAi's only
                    # publisher of these two images. See point 1 above for the
                    # non-main ref.
                    subjectRegExp: "^https://github\\.com/olafkfreund/SkillAi/\\.github/workflows/deploy-image\\.yml@refs/heads/core-mvp-foundation$"
                    # Same Kyverno v1.18 requirement as the rules above: a
                    # keyless attestor with neither `rekor` nor `roots` is
                    # rejected outright and ArgoCD cannot apply the file.
                    rekor:
                      url: "https://rekor.sigstore.dev"
