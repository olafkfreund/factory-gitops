# Verify cosign keyless signatures on factory container images at admission.
#
# AUDIT MODE ONLY. validationFailureAction: Audit means an unsigned or
# wrongly-signed image is REPORTED (ClusterPolicyReport + a PolicyViolation
# event) but the Pod is still admitted. This must NOT be flipped to Enforce
# until every factory image — including CFactory — is signed. CFactory is
# deliberately excluded below because it is not signed yet (CFactory#191).
# See docs/image-signature-admission.md for the enforce path.
#
# Signer identity verified per repo, taken from each repo's release.yml
# "Verify signature (release self-test)" step:
#   issuer  = https://token.actions.githubusercontent.com  (GitHub Actions OIDC)
#   subject = ^https://github.com/olafkfreund/<Repo>/       (the release workflow)
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-factory-image-signatures
  annotations:
    policies.kyverno.io/title: Verify Factory Image Signatures (cosign keyless)
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Verifies cosign keyless signatures on ghcr.io/olafkfreund factory images
      admitted into the `factory` namespace. AUDIT mode: violations are reported,
      never denied. CFactory images are excluded until CFactory#191 signs them.
spec:
  # AUDIT/WARN ONLY — report to PolicyReports, do NOT deny. Never set to
  # Enforce in this repo until all images (incl. CFactory) are signed.
  validationFailureAction: Audit
  # If Kyverno itself is down / registry is unreachable, admit rather than
  # block. Signature verification is a report signal here, not a gate.
  failurePolicy: Ignore
  webhookTimeoutSeconds: 30
  background: false
  rules:
    - name: verify-aifactory-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [factory]
      verifyImages:
        - imageReferences:
            - "ghcr.io/olafkfreund/aifactory:*"
          # Audit phase: verify the signature only. Do not require digest
          # pinning and do not mutate the tag to a digest.
          verifyDigest: false
          mutateDigest: false
          required: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: "^https://github\\.com/olafkfreund/AIFactory/"
    - name: verify-pfactory-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [factory]
      verifyImages:
        - imageReferences:
            - "ghcr.io/olafkfreund/pfactory:*"
          verifyDigest: false
          mutateDigest: false
          required: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: "^https://github\\.com/olafkfreund/PFactory/"
    - name: verify-tfactory-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [factory]
      verifyImages:
        - imageReferences:
            - "ghcr.io/olafkfreund/tfactory:*"
          verifyDigest: false
          mutateDigest: false
          required: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: "^https://github\\.com/olafkfreund/TFactory/"
    # CFactory (ghcr.io/olafkfreund/cfactory + cfactory-frontend) is intentionally
    # NOT listed: it is not cosign-signed yet. Add a verify-cfactory-signature
    # rule once CFactory#191 lands, then move to the Enforce rollout (see docs).
