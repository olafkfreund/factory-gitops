  - name: seed-nix-store
    image: ghcr.io/olafkfreund/aifactory-nix:sha-deadbee
    command:
    - sh
    - -c
    - echo seed
  containers:
  - name: gate
    image: ghcr.io/olafkfreund/aifactory-nix:sha-deadbee
