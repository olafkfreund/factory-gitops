# Kyverno CLI test for verify-factory-image-signatures (factory-gitops#145).
#
# Run it with the SAME Kyverno version the cluster runs (v1.18.2 today, check
# with `kubectl -n kyverno get deploy kyverno-admission-controller -o
# jsonpath='{.spec.template.spec.containers[0].image}'`) -- glob behaviour is
# version-sensitive, and a test that passes on a different engine proves
# nothing about admission:
#
#   kyverno test apps/kyverno-policies/tests -f kyverno-test-verify-factory-image-signatures.yaml
#
# This suite is OFFLINE. Nothing in it reaches ghcr.io, Fulcio or Rekor, and it
# therefore says nothing about whether any signature verifies. It tests one
# thing: the SCOPE of the seven verifyImages rules -- which image references they
# speak about, and, the point of the file, which ones they must not.
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE ADDING A "MUST MATCH" CASE. IT WILL NOT DO WHAT YOU THINK.
#
# `kyverno test` v1.18.2 reports a resource for which a rule produced NO result
# as `Excluded`, and an Excluded row satisfies ANY expected result -- `skip`,
# `pass` and `fail` alike. Measured, on this repo, with this CLI:
#
#   - a `results` entry naming a rule that does not exist in the policy at all
#     is reported Excluded and PASSES;
#   - re-scoping require-first-party-signature-coverage to a namespace that
#     does not exist makes its rule evaluate nothing, and its 15-case suite
#     still reports "15 tests passed and 0 tests failed".
#
# So a positive assertion cannot fail IN THE CLI. Narrowing a glob until it
# covers nothing, or deleting a rule outright, turns every case about it
# Excluded and green. That is the tool, not this file, and it is
# factory-gitops#148.
#
# WHAT #148 CLOSED, and what it did not. manifest-validate.yml now wraps
# `kyverno test -o json` with two guards, so the tool's blind spot is no longer
# the gate's blind spot:
#
#   - a case expecting `pass`/`fail`/`warn`/`error` whose REASON is `Excluded`
#     or `Invalid Policy` FAILS the gate. The re-scoping measurement above is
#     caught: 5 errors where there were 15 passes.
#   - a `results` entry naming a rule the engine did not load FAILS the gate,
#     which is the first measurement above and is the one that matters here.
#     Rename or delete any of the seven rules below and this suite goes red
#     rather than quietly asserting nothing.
#
# What is still not caught is the narrowing of a glob within a rule that still
# exists -- see the `aifactory:v*` line below. Closing that needs a MATCHED
# image, which needs the network, which is the trade this file declined and
# #148 declined again.
#
# The consequence for this suite: only NEGATIVE space is assertable. Every case
# below asserts that no rule speaks about an image, which fails the moment a
# glob WIDENS -- the Factory#564 direction, where `skillai:*` grown to
# `skillai*` silently pulls a `skillai-*` package under SkillAi's non-main ref
# anchor. RE-MEASURED on Kyverno v1.18.2 when Factory#572 added the seventh rule
# and took the cross-product from 84 cases to 98:
#
#   `skillai:*`   -> `skillai*`            4 of 98 cases fail
#   `cfactory:*`  -> `cfactory*`           4 of 98 cases fail
#   `odin:*`      -> `odin*`               2 of 98 cases fail  (Factory#572,
#                                          both on `near-odin-exporter`, which
#                                          is what that fixture is FOR -- a
#                                          verifyImages rule emits two rows per
#                                          matched image, hence 2 not 1)
#   namespaces: [factory] -> [factory, default]   2 of 98 cases fail
#   `aifactory:*` -> `aifactory:v*`        0 fail -- the narrowing direction,
#                                          and still 0 after #148, because
#                                          every case here is legitimately
#                                          negative and legitimately Excluded
#
# THE NARROWING DIRECTION IS STILL UNCAUGHT HERE, and Factory#572 measured what
# that costs for a rule that is genuinely load-bearing rather than only for the
# `aifactory:v*` toy above. Narrowing `odin:*` to `odin:v*` and running the real
# running Pod through `kyverno apply` gives:
#
#   pass: 0, fail: 0, warn: 0, error: 0, skip: 0
#
# Not a fail. NOTHING. The rule stops speaking and the CLI reports success. The
# offline suites cannot see it -- the coverage policy reads its own mirror list,
# not these globs, so it goes on believing odin is covered. The channel that
# does see it is apps/kyverno-runner-probe, which reads the
# `kyverno.io/verify-images` annotation the live webhook writes and reports an
# absent image as `not_covered`. That is why the probe is not redundant with
# these tests, and why the mirror list and these globs must be edited together.
#
# That opposite direction is covered by a different control:
# require-first-party-signature-coverage reports any first-party image running
# in `factory` that its mirror list does not name, and that policy has its own
# suite in kyverno-test.yaml. It is not a complete substitute -- the mirror is a
# hand-maintained copy of these globs -- so the glob-narrowing gap is real and
# is recorded in the "does NOT catch" note at the end of the test step in
# manifest-validate.yml.
#
# The positive half WAS checked by hand when this file was written -- all nine
# references (aifactory, aifactory `-nix`, pfactory, tfactory, cfactory,
# cfactory-frontend, tfactory-runner-pytest, skillai, skillai-migrator) match
# their rule, none silently. Reproduce it with one Pod per reference:
#
#   kyverno apply apps/kyverno-policies/manifests/verify-factory-image-signatures.yaml \
#     --resource <(printf 'apiVersion: v1\nkind: Pod\nmetadata: {name: p, namespace: factory}\nspec:\n  containers: [{name: c, image: "ghcr.io/olafkfreund/aifactory:no-such-tag"}]\n')
#
# Those cases are deliberately NOT committed. A MATCHED image sends the CLI to
# ghcr.io -- verdict `fail` when it is reachable, `error` when it is not -- so
# committing them would put a third-party network dependency inside the required
# status check, in exchange for assertions that cannot fail. #148 kept that
# trade refused: it made coverage assertable WITHOUT the network, so these cases
# stay uncommitted.
#
# Factory#572 did the same by-hand positive check for `verify-odin-signature`,
# against the live registry with an EMPTY keychain (DOCKER_CONFIG pointing at a
# directory holding `{}`), which is how Kyverno reads ghcr.io:
#
#   kyverno apply .../verify-factory-image-signatures.yaml \
#     --resource <the running odin-dashboard Pod> --policy-report
#   -> rule: verify-odin-signature   result: pass
#      message: verified image signatures for ghcr.io/olafkfreund/odin:sha-2749b26
#
# and mutated it three ways, each of which must go red and did:
#
#   subject Odin -> CFactory                 pass:0 fail:2
#     "subject mismatch: expected ^https://github\.com/olafkfreund/CFactory/...,
#      received https://github.com/olafkfreund/Odin/.github/workflows/deploy.yml
#      @refs/heads/main"   <- the engine naming the real identity back
#   issuer -> https://accounts.google.com    pass:0 fail:2
#   glob odin:* -> odin:v*                   pass:0 fail:0  <- see the narrowing
#                                            note above; silence, not a verdict
#
# Restored: pass:2 fail:0. That is uncommitted for the reason above, but it is
# the check that says the identity is right rather than merely well-formed.
# ---------------------------------------------------------------------------
#
# `skip` is the expected result throughout. It reads as "this rule has nothing
# to say about this image", which for a verifyImages rule means the reference
# matched none of its `imageReferences` globs, or the Pod was out of namespace
# scope. Each of the seven rules is asserted against every fixture, because the
# claim being made is not per-rule: NO rule in this policy may speak about any
# of these images. That cross-product is what catches a glob widened in one
# rule toward a name that belongs to another.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: verify-factory-image-signatures
policies:
  - ../manifests/verify-factory-image-signatures.yaml
resources:
  - resources-verify-factory-image-signatures.yaml
results:
  - policy: verify-factory-image-signatures
    rule: verify-aifactory-signature
    kind: Pod
    result: skip
    resources: &no-rule-may-match
      - near-aifactory-worker
      - near-pfactory-planner
      - near-tfactory-runner-bare
      - near-cfactory-backend
      - near-cfactory-frontend-preview
      - near-skillai-worker
      - near-skillai-migrator-tools
      - near-miss-in-initcontainer
      - near-odin-exporter
      - digest-pinned-first-party
      - other-owner-same-name
      - other-registry-same-name
      - thirdparty-out-of-scope
      - covered-image-wrong-namespace
      - thirdparty-in-fides-namespace
      - fides-image-wrong-namespace
  - policy: verify-factory-image-signatures
    rule: verify-pfactory-signature
    kind: Pod
    result: skip
    resources: *no-rule-may-match
  - policy: verify-factory-image-signatures
    rule: verify-tfactory-signature
    kind: Pod
    result: skip
    resources: *no-rule-may-match
  - policy: verify-factory-image-signatures
    rule: verify-cfactory-signature
    kind: Pod
    result: skip
    resources: *no-rule-may-match
  - policy: verify-factory-image-signatures
    rule: verify-tfactory-runner-signature
    kind: Pod
    result: skip
    resources: *no-rule-may-match
  - policy: verify-factory-image-signatures
    rule: verify-skillai-signature
    kind: Pod
    result: skip
    resources: *no-rule-may-match
  # Factory#572. Naming this rule here is not padding: gate check 1 in
  # manifest-validate.yml fails the build if a suite names a rule the engine did
  # not load, so this entry is what ties `verify-odin-signature` to the loaded-
  # rule inventory. Rename or delete the rule and this suite goes red instead of
  # quietly asserting nothing about it.
  - policy: verify-factory-image-signatures
    rule: verify-odin-signature
    kind: Pod
    result: skip
    resources: *no-rule-may-match
  # fides#395. Same reason as the odin entry above: this names
  # `verify-fides-signature` so gate check 1 ties it to the loaded-rule
  # inventory. It is also the only rule here scoped outside `factory`, so the
  # two fides resources in the anchor above are what prove that scope is the
  # two fides namespaces and the two first-party globs -- not the namespace
  # alone (which would deny Postgres) and not the image alone (which would
  # reach into `factory`).
  - policy: verify-factory-image-signatures
    rule: verify-fides-signature
    kind: Pod
    result: skip
    resources: *no-rule-may-match
