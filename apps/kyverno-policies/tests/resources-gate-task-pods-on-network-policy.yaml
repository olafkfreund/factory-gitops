# Inputs for kyverno-test-gate-task-pods-on-network-policy.yaml.
#
# The two task-pod shapes are the two that actually exist in the fleet today:
# `job_dispatch.py` builds pods with NO init containers, `kube_sandbox.py`
# builds them WITH one (`seed-nix-store`). Both have to come out gated, and the
# second has to come out with seed-nix-store still present and still second.
---
# AIFactory/TFactory build-lane shape: no init containers at all.
apiVersion: v1
kind: Pod
metadata:
  name: task-no-init
  namespace: factory
  labels:
    app: aifactory-task
    factory.io/kind: task
spec:
  restartPolicy: Never
  containers:
    - name: coder
      image: ghcr.io/olafkfreund/aifactory-nix:sha-deadbee
---
# Gate-lane shape: a warm-nix-store seed init container already present.
apiVersion: v1
kind: Pod
metadata:
  name: task-with-init
  namespace: factory
  labels:
    app: aifactory-sandbox
    factory.io/kind: task
spec:
  restartPolicy: Never
  initContainers:
    - name: seed-nix-store
      image: ghcr.io/olafkfreund/aifactory-nix:sha-deadbee
      command: ["sh", "-c", "echo seed"]
  containers:
    - name: gate
      image: ghcr.io/olafkfreund/aifactory-nix:sha-deadbee
---
# MUST NOT be gated AGAIN. This stands in for the API server's SECOND call to
# Kyverno's mutating webhook: it is registered `reinvocationPolicy: IfNeeded`,
# so any other webhook touching the pod in the same admission causes a re-run,
# and on that pass Kyverno sees a pod that already carries the gate.
#
# This is not hypothetical and it is not cosmetic. Without the idempotency
# precondition the rule inserts a SECOND netpol-gate and the API server then
# rejects the pod outright:
#   The Pod "..." is invalid: spec.initContainers[1].name:
#   Duplicate value: "netpol-gate"
# which is every task pod in the fleet failing to start. Measured on the live
# cluster; the offline engine applies each rule once and never sees it. Deleting
# this case removes the only guard against re-introducing that.
apiVersion: v1
kind: Pod
metadata:
  name: task-already-gated
  namespace: factory
  labels:
    app: aifactory-task
    factory.io/kind: task
spec:
  restartPolicy: Never
  initContainers:
    - name: netpol-gate
      image: busybox:1.36
      command: ["sh", "-c", "echo already gated"]
  containers:
    - name: coder
      image: ghcr.io/olafkfreund/aifactory-nix:sha-deadbee
---
# MUST NOT be gated: a control-plane pod in the same namespace. Gating one of
# these would put a network precondition in front of the services that dispatch
# task pods in the first place.
apiVersion: v1
kind: Pod
metadata:
  name: control-plane-pod
  namespace: factory
  labels:
    app: aifactory
spec:
  containers:
    - name: aifactory
      image: ghcr.io/olafkfreund/aifactory:v3.4.2
---
# MUST NOT be gated: right label, wrong namespace. The NetworkPolicy is
# namespaced and does not exist outside `factory`, so a pod elsewhere carrying
# this label is protected by nothing and the deny leg would never refuse --
# gating it would hang the pod for 60s and then fail it.
apiVersion: v1
kind: Pod
metadata:
  name: task-other-namespace
  namespace: default
  labels:
    factory.io/kind: task
spec:
  containers:
    - name: coder
      image: busybox:1.36
