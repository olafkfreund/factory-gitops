# Fides on p510 k3d (namespace: fides). Adapted from the upstream EKS manifest
# (kubernetes/fides-deploy.yaml) for a self-hosted, AWS-free install:
#   - storageClassName gp3 -> local-path (k3d default)
#   - image ECR -> fides-server:local (built on p510, k3d image import)
#   - STORAGE_DRIVER s3 -> local (+ evidence PVC); SECRETS_PROVIDER aws -> unset (k8s Secret)
#   - AI: reuse the p510 HOST ollama (systemd, 0.0.0.0:11434) via host.k3d.internal
#   - IRSA ServiceAccount dropped (no AWS); default SA used
#   - FIDES_RLS_ENABLED=false for MVP (app carries explicit org_id scoping; enabling
#     RLS properly needs the least-privilege fides_app role + schema-rls.sql — follow-up)
# The `fides-secrets` Secret is created out-of-band (see runbook) — NOT in git.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fides-db-pvc
  namespace: fides
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fides-evidence-pvc
  namespace: fides
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fides-db
  namespace: fides
spec:
  replicas: 1
  strategy: { type: Recreate }   # single RWO PVC — never two pods mounting it
  selector:
    matchLabels: { app: fides-db }
  template:
    metadata:
      labels: { app: fides-db }
    spec:
      containers:
      - name: postgres
        # Digest-pinned per factory-gitops#161. `15-alpine` is a floating
        # patch line -- it moves on every 15.x release -- and this namespace
        # is outside the scope Factory#573 pinned. Resolved live against the
        # running pod's imageID on 2026-08-08, so this pin is a rename of what
        # was already pulled, not a new image.
        image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
        - name: POSTGRES_DB
          value: fides
        - name: POSTGRES_USER
          value: fides_user
        # Password comes from the out-of-band Secret (kept OUT of git), and the
        # same value is used inside db-dsn.
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: { name: fides-secrets, key: postgres-password }
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-data
        persistentVolumeClaim: { claimName: fides-db-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: fides-db
  namespace: fides
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector: { app: fides-db }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fides-server
  namespace: fides
spec:
  replicas: 1
  selector:
    matchLabels: { app: fides-server }
  template:
    metadata:
      labels: { app: fides-server }
    spec:
      containers:
      - name: app
        # factory-gitops#162. Was `:latest`, which carries no version
        # information at all and is repointed by every push to fides' `main`.
        # Nobody reading this manifest could tell what was deployed.
        #
        # THIS IS THE SAME BYTES, RENAMED. olafkfreund/fides' publish-ghcr.yml
        # pushes both `:latest` and `:${{ github.sha }}` from one build, so
        # every `:latest` has an immutable twin. Resolved live 2026-08-08:
        #   crane digest ...:latest                  -> sha256:4cd50a17...
        #   crane digest ...:1fc2aa6267...           -> sha256:4cd50a17...
        #   running pod imageID                      -> sha256:4cd50a17...
        # and 1fc2aa62 is olafkfreund/fides `main` HEAD. So this pins forward
        # to what is already running, not backward to something older.
        #
        # A 40-char commit tag rather than the fleet's `sha-<short>`: that is
        # what fides' publish workflow emits, and inventing a second tag scheme
        # here would name an image that does not exist.
        #
        # NOTHING BUMPS THIS. The four service repos push a `cd(...)` commit
        # into this repo on deploy; fides does not, so a merge to its `main`
        # now reaches this cluster never rather than within 30 minutes. That is
        # the #139 trade made deliberately and stated rather than discovered
        # later: legible-and-frozen beats illegible-and-drifting, but only
        # while the freeze is visible. olafkfreund/fides#389 tracks the missing
        # deploy leg; until it lands the bump is this line, by hand.
        image: ghcr.io/olafkfreund/fides-server:d326fcb856e97f25771569a01735e919e14110b7
        # Still Always: an immutable tag makes this a no-op on a warm node, and
        # it is the correct policy for the day somebody force-pushes a tag.
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        env:
        - name: PORT
          value: "8080"
        - name: DB_DRIVER
          value: postgres
        - name: DB_DSN
          valueFrom:
            secretKeyRef: { name: fides-secrets, key: db-dsn }
        - name: FIDES_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef: { name: fides-secrets, key: encryption-key }
        - name: FIDES_API_TOKEN
          valueFrom:
            secretKeyRef: { name: fides-secrets, key: api-token }
        # Fresh org UUID for p510 (generated in the runbook — NOT the AWS org).
        - name: FIDES_API_ORG_ID
          value: "f6fef630-5e5d-43fa-8d0d-afb40774402f"
        - name: PORTAL_USERNAME
          value: admin
        - name: PORTAL_PASSWORD
          valueFrom:
            secretKeyRef: { name: fides-secrets, key: portal-password }
        # AI: reuse the p510 host ollama (systemd). host.k3d.internal resolves to
        # the host from inside k3d; 172.18.0.1 also works.
        - name: AI_PROVIDER
          value: ollama
        - name: AI_OLLAMA_ENDPOINT
          value: http://host.k3d.internal:11434
        - name: AI_MODEL
          value: qwen2.5:7b
        # Local filesystem evidence storage (no S3/AWS).
        - name: STORAGE_DRIVER
          value: local
        - name: STORAGE_LOCAL_DIR
          value: /data/evidence
        - name: FIDES_RLS_ENABLED
          value: "false"
        - name: FIDES_MCP_ALLOWED_COMMANDS
          value: "echo,/bin/echo,/usr/bin/echo,/usr/local/bin/fides-mcp-sensor"
        - name: FIDES_EVENTS_ENABLED
          value: "true"
        # External URL for commit-status / links. Update once cloudflared host is set.
        - name: FIDES_PUBLIC_URL
          value: "https://fides.freundcloud.org.uk"
        - name: FIDES_DELEGATED_APPROVAL_ENABLED
          value: "true"
        volumeMounts:
        - name: evidence
          mountPath: /data/evidence
        resources:
          requests: { cpu: "100m", memory: "256Mi" }
          limits: { memory: "1Gi" }
      volumes:
      - name: evidence
        persistentVolumeClaim: { claimName: fides-evidence-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: fides-server
  namespace: fides
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector: { app: fides-server }
# THE `fides-server-updater` CronJob, ITS ServiceAccount, Role AND RoleBinding
# WERE REMOVED HERE (factory-gitops#162), and the reasoning is worth keeping
# because deleting a control that was just fixed looks like a mistake.
#
# The CronJob did one thing: `kubectl rollout restart deployment/fides-server`
# every 30 minutes, so that `imagePullPolicy: Always` on `:latest` would pick
# up whatever the GHCR publish workflow last pushed. Its entire value came from
# the tag being mutable. With the tag pinned above it restarts a 1-replica
# Deployment 48 times a day to re-pull bytes it already has -- which is not
# merely wasted, it costs three real things: pod age stops meaning "how long
# has this been up", 48 daily Job objects accumulate for job-watchdog and
# restart-watchdog to read, and a genuine crash-restart becomes indistinguish-
# able from the timer in the restart counts those two watchdogs alert on.
#
# So it goes, along with the `patch deployments` RBAC that existed only to
# serve it. Factory#567 / factory-gitops#141 got this CronJob working after it
# had never once succeeded; that work is not wasted -- it is what made the
# thing observable enough to see that its premise had gone.
#
# WHAT REPLACES IT: a commit to this file, which is how every other workload in
# this repo is updated. See the note on the image above for what does NOT yet
# push that commit (olafkfreund/fides#389).
#
# THE LORE IS NOT LOST, and the next person to write a CronJob in this cluster
# needs it: `Forbid` lets one ImagePullBackOff Job hold the slot forever, no
# `startingDeadlineSeconds` makes the controller give up counting past 100
# missed starts, and without `activeDeadlineSeconds` a Job that never starts
# stays Active and so produces no *new* failure for job-watchdog to see. All
# three, with the measurements, are in PR #141 and in this file's history at
# commit cfa5171.
