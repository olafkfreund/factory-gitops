# Fides on p510 k3d (namespace: fides). Adapted from the upstream EKS manifest
# (kubernetes/fides-deploy.yaml) for a self-hosted, AWS-free install:
#   - storageClassName gp3 -> local-path (k3d default)
#   - image ECR -> fides-server:local (built on p510, k3d image import)
#   - STORAGE_DRIVER s3 -> local (+ evidence PVC); SECRETS_PROVIDER aws -> unset (k8s Secret)
#   - AI: reuse the p510 HOST ollama (systemd, 0.0.0.0:11434) via host.k3d.internal
#   - IRSA ServiceAccount dropped (no AWS); default SA used
#   - FIDES_RLS_ENABLED=false for MVP (app carries explicit org_id scoping; enabling
#     RLS properly needs the least-privilege fides_app role + schema-rls.sql — follow-up)
# The `fides-secrets` Secret is created out-of-band (see runbook) — NOT in git.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fides-db-pvc
  namespace: fides
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fides-evidence-pvc
  namespace: fides
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fides-db
  namespace: fides
spec:
  replicas: 1
  strategy: { type: Recreate }   # single RWO PVC — never two pods mounting it
  selector:
    matchLabels: { app: fides-db }
  template:
    metadata:
      labels: { app: fides-db }
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: fides
        - name: POSTGRES_USER
          value: fides_user
        # Password comes from the out-of-band Secret (kept OUT of git), and the
        # same value is used inside db-dsn.
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: { name: fides-secrets, key: postgres-password }
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-data
        persistentVolumeClaim: { claimName: fides-db-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: fides-db
  namespace: fides
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector: { app: fides-db }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fides-server
  namespace: fides
spec:
  replicas: 1
  selector:
    matchLabels: { app: fides-server }
  template:
    metadata:
      labels: { app: fides-server }
    spec:
      containers:
      - name: app
        image: ghcr.io/olafkfreund/fides-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        env:
        - name: PORT
          value: "8080"
        - name: DB_DRIVER
          value: postgres
        - name: DB_DSN
          valueFrom:
            secretKeyRef: { name: fides-secrets, key: db-dsn }
        - name: FIDES_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef: { name: fides-secrets, key: encryption-key }
        - name: FIDES_API_TOKEN
          valueFrom:
            secretKeyRef: { name: fides-secrets, key: api-token }
        # Fresh org UUID for p510 (generated in the runbook — NOT the AWS org).
        - name: FIDES_API_ORG_ID
          value: "f6fef630-5e5d-43fa-8d0d-afb40774402f"
        - name: PORTAL_USERNAME
          value: admin
        - name: PORTAL_PASSWORD
          valueFrom:
            secretKeyRef: { name: fides-secrets, key: portal-password }
        # AI: reuse the p510 host ollama (systemd). host.k3d.internal resolves to
        # the host from inside k3d; 172.18.0.1 also works.
        - name: AI_PROVIDER
          value: ollama
        - name: AI_OLLAMA_ENDPOINT
          value: http://host.k3d.internal:11434
        - name: AI_MODEL
          value: qwen2.5:7b
        # Local filesystem evidence storage (no S3/AWS).
        - name: STORAGE_DRIVER
          value: local
        - name: STORAGE_LOCAL_DIR
          value: /data/evidence
        - name: FIDES_RLS_ENABLED
          value: "false"
        - name: FIDES_MCP_ALLOWED_COMMANDS
          value: "echo,/bin/echo,/usr/bin/echo,/usr/local/bin/fides-mcp-sensor"
        - name: FIDES_EVENTS_ENABLED
          value: "true"
        # External URL for commit-status / links. Update once cloudflared host is set.
        - name: FIDES_PUBLIC_URL
          value: "https://fides.freundcloud.org.uk"
        - name: FIDES_DELEGATED_APPROVAL_ENABLED
          value: "true"
        volumeMounts:
        - name: evidence
          mountPath: /data/evidence
        resources:
          requests: { cpu: "100m", memory: "256Mi" }
          limits: { memory: "1Gi" }
      volumes:
      - name: evidence
        persistentVolumeClaim: { claimName: fides-evidence-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: fides-server
  namespace: fides
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector: { app: fides-server }
---
# Hands-off updates: fides-server pulls ghcr:latest (imagePullPolicy Always), so a
# periodic rolling restart picks up whatever the GHCR publish workflow last pushed
# on a merge to main. Zero-downtime (rolling surge on a 1-replica Deployment).
# NOTE: this restarts on a timer regardless of whether the image changed; Argo CD
# Image Updater (digest-watch) is the no-churn upgrade if that ever matters.
apiVersion: v1
kind: ServiceAccount
metadata: { name: fides-updater, namespace: fides }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: fides-updater, namespace: fides }
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: fides-updater, namespace: fides }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: fides-updater }
subjects:
  - { kind: ServiceAccount, name: fides-updater, namespace: fides }
---
# This CronJob had never once succeeded (Factory#567). It wedged on 2026-07-31
# and stayed wedged for six days, and it took THREE independent defects to do
# it. Each of the three settings below closes one of them; none of them is
# decoration.
#
# 1. THE IMAGE WAS GONE. `bitnami/kubectl:1.31` stopped resolving when Bitnami
#    retired their public Docker Hub catalogue -- the same retirement that
#    broke Kyverno's cleanup CronJobs (see apps/kyverno/manifests/). The
#    replacement is upstream's own `registry.k8s.io/kubectl`, published by the
#    Kubernetes release process itself, needing no registry credential and with
#    nobody's commercial catalogue policy between us and it. v1.31.14 is the
#    final 1.31 patch, matching this cluster's k3s v1.31.5 server exactly.
#    Digest-pinned per factory-gitops#140 -- `apps/fides` was out of scope
#    there, so this closes that gap too.
#
#    runAsUser IS LOAD-BEARING: unlike the Bitnami image (uid 1001), the
#    upstream image declares `USER 0`, so `runAsNonRoot: true` alone would have
#    traded ImagePullBackOff for CreateContainerConfigError -- a second wedge
#    wearing a different error string. 65532 is the distroless nonroot uid.
#    Verified in-cluster before merge: `kubectl version --client` -> v1.31.14,
#    and `rollout restart` against this exact SA -> "deployment.apps/
#    fides-server restarted".
#
# 2. `Forbid` LET THE DEAD JOB HOLD THE SLOT. An ImagePullBackOff Job is Active
#    forever, and Forbid will not start a new Job while one is Active, so the
#    single 2026-07-31 failure suppressed all 290 schedules after it. `Replace`
#    evicts the stale Job and runs the new one: a failure costs one cycle, not
#    every subsequent one.
#
# 3. THE CONTROLLER HAD ALREADY GIVEN UP COUNTING. With no
#    startingDeadlineSeconds, the CronJob controller counts every missed start
#    since lastScheduleTime and aborts past 100. Six days at */30 is ~290, and
#    the cluster was emitting it before this landed:
#      Warning TooManyMissedTimes  cronjob-controller
#      too many missed start times. Set or decrease .spec.startingDeadlineSeconds
#    So fixing the image and the concurrency policy alone would still have
#    scheduled NOTHING. 300s bounds the count to at most one missed cycle.
#
# activeDeadlineSeconds bounds a Job that cannot make progress to two minutes
# (the real run takes ~2s), so it reaches a terminal Failed state instead of
# sitting Active. That is what makes the failure countable by job-watchdog --
# the reason this went unseen was not only the namespace gap, it was that a
# permanently-Active Job produces no *new* failures to alert on.
#
# backoffLimit is deliberately left at the default: activeDeadlineSeconds is
# the stronger bound on exactly the failure mode that wedged this (a pod that
# never starts burns wall-clock, not attempts), and a second knob capping the
# same thing would only be another number to get wrong.
apiVersion: batch/v1
kind: CronJob
metadata: { name: fides-server-updater, namespace: fides }
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Replace
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      template:
        spec:
          serviceAccountName: fides-updater
          restartPolicy: OnFailure
          containers:
            - name: kubectl
              image: registry.k8s.io/kubectl:v1.31.14@sha256:74a458e9b800947f4bd1875be5213e8f31f4f2d1e6639548bf05145387ad07bb
              command: ["kubectl", "rollout", "restart", "deployment/fides-server", "-n", "fides"]
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 65532
                capabilities: { drop: ["ALL"] }
