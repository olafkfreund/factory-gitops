################################################################################
# MinIO — S3-compatible object store for PARR artifacts (RFC-0016 #190)
#
# Bucket `factory-artifacts`, key layout <service>/<correlation_key>/<job_id>/
# <role>[/<path>] (Factory apis/concurrency-conventions.md §2). Services reach it
# via the env contract S3_ENDPOINT / S3_BUCKET / S3_ACCESS_KEY / S3_SECRET_KEY
# (see Factory scripts/artifact_store.py) using the shared `minio-creds` Secret.
#
# CREDENTIALS ARE OUT-OF-BAND. Like oauth2-proxy-* (apps/cfactory-auth), the
# `minio-creds` Secret is NOT committed here (no sealed-secrets / ESO yet). The
# operator creates it once:
#
#   kubectl -n factory create secret generic minio-creds \
#     --from-literal=S3_ACCESS_KEY="$(openssl rand -hex 16)" \
#     --from-literal=S3_SECRET_KEY="$(openssl rand -hex 32)"
#
# Keys: S3_ACCESS_KEY (MinIO root user) and S3_SECRET_KEY (root password). MinIO
# and the bucket-init Job both consume these; the consumer services mount the
# SAME two keys plus a static S3_ENDPOINT/S3_BUCKET. Rotate by recreating the
# secret and bouncing the minio Deployment + every consumer.
#
# ENCRYPTION AT REST (Factory#314 / #310 gap #3): MinIO is given a built-in
# single-key KMS via MINIO_KMS_SECRET_KEY, and the bucket-init Job turns on
# automatic SSE-S3 (`mc encrypt set sse-s3`) so every object PUT to the buckets
# is encrypted at rest with a per-object data key wrapped by that master key.
# This protects object CONTENT on the PVC; it does NOT encrypt the underlying
# block device (see docs/encryption-at-rest.md for the node-level LUKS runbook).
#
# The KMS master key (the KEK) is a SEPARATE out-of-band Secret `minio-kms`, key
# MINIO_KMS_SECRET_KEY, format `<key-name>:<base64 32-byte key>`. The operator
# seeds it ONCE, before first sync (the minio pod and the Job both reference it):
#
#   kubectl -n factory create secret generic minio-kms \
#     --from-literal=MINIO_KMS_SECRET_KEY="factory-kek-1:$(openssl rand -base64 32)"
#
# KEY CUSTODY: this KEK is the root of trust for all object encryption. Lose it
# and every encrypted object is unrecoverable; leak it and encryption-at-rest is
# void. Keep it in the SAME custody as minio-creds (agenix on p510 — see
# docs/secrets-management.md), never in git. Rotating the KEK is NOT a drop-in
# replace (existing objects are wrapped by the old key); see the runbook.
################################################################################
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: minio-data, namespace: factory, labels: { app: minio } }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: factory, labels: { app: minio } }
spec:
  selector: { app: minio }
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, namespace: factory, labels: { app: minio } }
spec:
  replicas: 1
  # RWO data PVC -> single writer. Recreate (not RollingUpdate) so the new pod
  # can take the volume. (Multi-replica MinIO needs distributed mode; out of
  # scope for #190 — the artifact STORE existing is what unblocks the fleet.)
  strategy: { type: Recreate }
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      enableServiceLinks: false
      securityContext: { fsGroup: 1000, runAsUser: 1000, runAsNonRoot: true }
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - { containerPort: 9000, name: s3 }
            - { containerPort: 9001, name: console }
          env:
            # MinIO root creds == the shared S3 access/secret the services use.
            - { name: MINIO_ROOT_USER, valueFrom: { secretKeyRef: { name: minio-creds, key: S3_ACCESS_KEY } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: minio-creds, key: S3_SECRET_KEY } } }
            # Built-in single-key KMS (KEK) that wraps per-object data keys for
            # SSE-S3. Format `<key-name>:<base64 32-byte key>`, seeded out-of-band
            # in the `minio-kms` Secret (see header + docs/encryption-at-rest.md).
            # Required before sync: without it the pod fails to start and the
            # bucket-init `mc encrypt set sse-s3` step below has no KMS to target.
            - { name: MINIO_KMS_SECRET_KEY, valueFrom: { secretKeyRef: { name: minio-kms, key: MINIO_KMS_SECRET_KEY } } }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - { name: data, mountPath: /data }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: minio-data } }
---
# Idempotent bucket creation. Runs after MinIO is reachable, creates the
# `factory-artifacts` bucket if absent (mc mb --ignore-existing) and applies a
# per-role retention/ILM policy (logs 30d, evidence 90d — conventions §2).
# A Job (not initContainer) so it can target the in-cluster Service. ArgoCD
# re-runs it on hook-changes; `--ignore-existing` keeps it safe to re-apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: factory
  labels: { app: minio }
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  # NO ttlSecondsAfterFinished (Factory#508). It was 600, so ten minutes after
  # this Job finished the TTL controller deleted the Job object — outcome and
  # logs alike — exactly the reaper Factory#381 removed from apps/backups. The
  # `hook-delete-policy: BeforeHookCreation` above already reaps the previous
  # Job at the START of the next sync, which is the latest possible moment a
  # human could still read why the last one failed. A TTL on top of that only
  # shortens the window in which the evidence exists.
  template:
    # NOT app=minio. The `minio` Service selects exactly {app: minio}, and a
    # Service selector is a SUBSET match, so this pod joined the Service as an
    # endpoint. It runs `mc` and listens on nothing, so for as long as it was
    # Running kube-proxy handed it a share of real traffic to minio:9000/9001
    # and it answered with connection refused — roughly half of it, since the
    # Service then had two endpoints and one real backend.
    #
    # What a human sees: artifact push/pull from AIFactory and TFactory failing
    # intermittently right after an ArgoCD sync of this app, with MinIO Healthy,
    # the Service present and both pods Running. It reads as flakiness. This Job
    # is a PostSync hook, so it fires on every sync of apps/minio.
    #
    # Worse, it could stall its own startup: the container loops
    # `until mc alias set fac http://minio.factory.svc...` and that loop can be
    # dialled straight back to itself.
    #
    # Same defect as TFactory#885 (a browser-test Job took the portal it was
    # testing offline) and AIFactory#1107 (task Jobs joined the aifactory API
    # Service). Nothing selects on this pod's labels: there are no
    # NetworkPolicies in this namespace, no ServiceMonitors, and the Job's OWN
    # metadata.labels above keep app=minio, so `kubectl get jobs -l app=minio`
    # is unaffected. Only pods route traffic.
    metadata: { labels: { app: minio-create-bucket } }
    spec:
      # Never, not OnFailure (Factory#508, same defect as Factory#438). Under
      # OnFailure the Job controller deletes the POD once backoffLimit is
      # exceeded, so a permanently failing bucket-init left nothing to read.
      # Measured in #438: 14 failed Jobs under OnFailure left 0 readable pods;
      # 7 under Never left 10. Under Never a failure leaves up to
      # backoffLimit + 1 = 7 terminal pods, which is the price of being able to
      # find out why the buckets were never configured.
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-04-03T17-07-56Z
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # The `fac` alias comes from MC_HOST_fac in the env below, not from
              # `mc alias set fac <url> "$KEY" "$SECRET"`, which put the MinIO
              # secret key in a process argument where any `ps` in this container
              # could read it. Same credential, same Secret, off argv.
              echo "waiting for minio..."
              until mc ls fac/ >/dev/null 2>&1; do
                sleep 3
              done
              mc mb --ignore-existing fac/factory-artifacts
              # Dedicated bucket for Postgres logical backups (apps/backups). Kept
              # here so bucket lifecycle lives in one place; the backup CronJob also
              # `mc mb --ignore-existing` defensively.
              mc mb --ignore-existing fac/factory-backups
              # Dedicated compliance-evidence bucket (apps/evidence-collector,
              # Factory#324). Daily dated snapshots of audit-chain head, config
              # baselines, backup markers + control-plane pushes (access-review,
              # scans). Lifecycle set below alongside the others.
              mc mb --ignore-existing fac/factory-evidence
              # Encryption at rest (Factory#314): auto-encrypt every new object
              # with SSE-S3. MinIO generates a per-object data key, wraps it with
              # the MINIO_KMS_SECRET_KEY KEK, and stores only the wrapped key +
              # ciphertext on the PVC. NOT `|| true`: if the KMS key is missing
              # this MUST fail loudly (unencrypted buckets are the bug we are
              # fixing). Idempotent - re-running re-asserts the same policy.
              # Applies only to objects PUT after this runs; pre-existing objects
              # stay as-is (a fresh cluster/bucket has none, so first sync covers
              # everything). factory-evidence is included deliberately: it holds
              # the compliance evidence trail, so it is the last bucket that
              # should sit in clear. See docs/encryption-at-rest.md.
              mc encrypt set sse-s3 fac/factory-artifacts
              mc encrypt set sse-s3 fac/factory-backups
              mc encrypt set sse-s3 fac/factory-evidence
              mc encrypt info fac/factory-artifacts
              mc encrypt info fac/factory-backups
              mc encrypt info fac/factory-evidence
              ############################################################
              # Retention, asserted rather than attempted (Factory#508)
              #
              # Every line below used to end `2>/dev/null || true`: stderr
              # discarded, exit code swallowed. Retention on factory-backups and
              # factory-evidence — the 14-day backup rule and the 90-day evidence
              # floor both cited in the compliance docs — was therefore claimed by
              # a command whose failure was unobservable by construction. A gate
              # that cannot fail (standards 4.7).
              #
              # Measured on the live cluster 2026-07-30, with this Job long since
              # deleted by its own TTL so nothing said why:
              #   factory-backups   no lifecycle configuration at all
              #   factory-evidence  no lifecycle configuration, and UN-VERSIONED
              #   factory-artifacts 4 of the 6 intended rules
              # ArgoCD reported apps/minio Synced + Healthy throughout.
              #
              # Two changes:
              #  1. `mc ilm rule add` APPENDS — re-running it duplicates rules, so
              #     it could never be re-asserted safely, which is what the
              #     `|| true` was really papering over. `mc ilm import` replaces
              #     the whole document instead: declarative, idempotent, and it
              #     takes our own stable rule IDs (verified: importing the same
              #     document twice leaves the same rules, not doubled).
              #  2. Each import is read back with `mc ilm export` and the Job
              #     fails if an expected rule is not there. The IDs come from the
              #     document we just sent, so their presence is proof the whole
              #     rule landed, not just its name.
              ############################################################
              # Durability: object versioning so an overwrite or delete is
              # recoverable (a prior version survives). Floor for DR alongside the
              # off-cluster copy tracked in docs/restore.md (#321). Read back:
              # factory-evidence was silently un-versioned under `|| true`.
              # NOTE: this image has NO grep, sed, awk, tr or wc — it is mc plus
              # coreutils plus bash, nothing else. The read-backs below therefore
              # match with the shell's own `case`, which needs no binary at all.
              # Found the hard way: the first version of this used `grep -q` and
              # died with "grep: command not found" — a failure the old
              # `2>/dev/null || true` would have swallowed without a trace.
              for b in factory-artifacts factory-backups factory-evidence; do
                mc version enable "fac/$b"
                v="$(mc version info "fac/$b")"
                case "$v" in
                  *"versioning is enabled"*) ;;
                  *) echo "FATAL: $b versioning NOT enabled after enable: $v" >&2
                     exit 1 ;;
                esac
              done

              # ilm_apply BUCKET JSON ID...  — import, export, assert each ID.
              # The IDs come from the document we just sent, so seeing one come
              # back is proof that whole rule landed, not just its name.
              ilm_apply() {
                b="$1"; doc="$2"; shift 2
                printf '%s' "$doc" | mc ilm import "fac/$b"
                got="$(mc ilm export "fac/$b")"
                for id in "$@"; do
                  case "$got" in
                    *"\"ID\":\"$id\""*) ;;
                    *) echo "FATAL: $b lifecycle rule '$id' absent after import" >&2
                       echo "$got" >&2
                       exit 1 ;;
                  esac
                done
                echo "ok: $b lifecycle = $*"
              }

              # Artifacts: logs expire after 30d, evidence after 90d (conventions
              # §2). Evidence referenced by a VAL claim must outlive the claim, so
              # 90d is a floor, not an aggressive purge. Without these rules
              # evidence had NO lifecycle guarantee (#313, #321).
              ilm_apply factory-artifacts '{"Rules":[
                {"ID":"log-pfactory-30d","Status":"Enabled","Expiration":{"Days":30},"Filter":{"And":{"Prefix":"pfactory/","Tags":[{"Key":"role","Value":"log"}]}}},
                {"ID":"log-aifactory-30d","Status":"Enabled","Expiration":{"Days":30},"Filter":{"And":{"Prefix":"aifactory/","Tags":[{"Key":"role","Value":"log"}]}}},
                {"ID":"log-tfactory-30d","Status":"Enabled","Expiration":{"Days":30},"Filter":{"And":{"Prefix":"tfactory/","Tags":[{"Key":"role","Value":"log"}]}}},
                {"ID":"evidence-pfactory-90d","Status":"Enabled","Expiration":{"Days":90},"Filter":{"And":{"Prefix":"pfactory/","Tags":[{"Key":"role","Value":"evidence"}]}}},
                {"ID":"evidence-aifactory-90d","Status":"Enabled","Expiration":{"Days":90},"Filter":{"And":{"Prefix":"aifactory/","Tags":[{"Key":"role","Value":"evidence"}]}}},
                {"ID":"evidence-tfactory-90d","Status":"Enabled","Expiration":{"Days":90},"Filter":{"And":{"Prefix":"tfactory/","Tags":[{"Key":"role","Value":"evidence"}]}}}
              ]}' log-pfactory-30d log-aifactory-30d log-tfactory-30d \
                  evidence-pfactory-90d evidence-aifactory-90d evidence-tfactory-90d

              # Backup retention = ~14 dailies. Lifecycle enforces it (no prune
              # step in the CronJob); noncurrent versions reaped a week later so
              # versioning does not grow storage unbounded.
              ilm_apply factory-backups '{"Rules":[
                {"ID":"backups-14d","Status":"Enabled","Expiration":{"Days":14},"NoncurrentVersionExpiration":{"NoncurrentDays":7},"Filter":{}}
              ]}' backups-14d

              # Compliance-evidence bucket: everything in it IS evidence, so one
              # bucket-wide 90d rule (matching the 90d evidence floor above; #313
              # #321 #324). Noncurrent versions reaped 30d later so
              # tamper-recovery is retained without unbounded growth.
              # ponytail: 90d = the established floor; SOC2's 12-month observation
              # window wants Days 365 — one-line bump when an audit period is
              # actually scoped.
              ilm_apply factory-evidence '{"Rules":[
                {"ID":"evidence-90d","Status":"Enabled","Expiration":{"Days":90},"NoncurrentVersionExpiration":{"NoncurrentDays":30},"Filter":{}}
              ]}' evidence-90d

              echo "bucket ready:"; mc ls fac/
          env:
            - { name: S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: minio-creds, key: S3_ACCESS_KEY } } }
            - { name: S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: minio-creds, key: S3_SECRET_KEY } } }
            # mc reads MC_HOST_<alias> for the `fac` alias, so the credential
            # never reaches argv. $(VAR) is kubelet env expansion, not shell.
            - { name: MC_HOST_fac, value: "http://$(S3_ACCESS_KEY):$(S3_SECRET_KEY)@minio.factory.svc.cluster.local:9000" }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
