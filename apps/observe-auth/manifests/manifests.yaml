# Keycloak SSO for the OpenObserve UI via oauth2-proxy.
#
# OpenObserve (service `observe`, :5080) has its own root login, but to put
# it behind the same Factory-wide Keycloak SSO as the cockpit, this fronts
# it with oauth2-proxy talking OIDC to keycloak.factory.svc:8080
# (realm `factory`, client `observe`). The cluster cloudflared ingress for
# observe.freundcloud.org.uk points HERE instead of the observe Service, so
# every public request is gated by a Keycloak login before reaching the UI.
# In-cluster OTLP ingest (AIFactory -> observe:5080/:5081) is unaffected — it
# talks to the observe Service directly and never traverses this proxy.
#
# Convention note: same pattern as apps/cfactory-auth/ and apps/odin-auth/.
# aifactory/pfactory/tfactory use native in-app OIDC (APP_OIDC_* env vars);
# observe (like cfactory and odin) has no native OIDC, so oauth2-proxy fronts it.
#
# Secret `oauth2-proxy-observe` (client-id, client-secret, cookie-secret) is
# created out-of-band via kubectl — NOT in this repo until sealed-secrets /
# external-secrets-operator lands. See apps/observe/README.md.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-observe
  namespace: factory
  labels:
    app: oauth2-proxy-observe
    app.kubernetes.io/instance: observe-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy-observe
  template:
    metadata:
      labels:
        app: oauth2-proxy-observe
    spec:
      enableServiceLinks: false
      # Factory#521. Same set, same reasoning, same image as
      # apps/cfactory-auth/ and apps/odin-auth/ — see the comment there.
      # 65532 is NUMERIC and is what the image already declares.
      #
      # This is apps/observe-AUTH (the SSO proxy). apps/observe/ — the
      # OpenObserve Deployment itself — is deliberately untouched here: it runs
      # as uid 0 today against a PVC written by uid 0, so hardening it is a data
      # -ownership question, not a manifest one, and it is being worked
      # separately.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.0@sha256:9ed7eaf720508640e1dce523f85f1e81743633d858175a9a26469978386ae05b
          # readOnlyRootFilesystem measured: read-only + uid 65532 + cap-drop ALL
          # answers GET /ping -> 200, which is the probe path below. Every input
          # here is an env var from a Secret; cookie-backed sessions, no disk.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://keycloak.freundcloud.org.uk/realms/factory
            # Discovery against the public issuer hairpins out through
            # cloudflared and back, so a cold start 502s and oauth2-proxy
            # exits(1) with no retry. Same change and same reasoning as
            # apps/odin-auth/ — see the comment there.
            - --skip-oidc-discovery=true
            - --login-url=https://keycloak.freundcloud.org.uk/realms/factory/protocol/openid-connect/auth
            - --redeem-url=http://keycloak.factory.svc.cluster.local:8080/realms/factory/protocol/openid-connect/token
            - --oidc-jwks-url=http://keycloak.factory.svc.cluster.local:8080/realms/factory/protocol/openid-connect/certs
            - --redirect-url=https://observe.freundcloud.org.uk/oauth2/callback
            - --upstream=http://observe.factory.svc.cluster.local:5080
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --pass-access-token=true
            - --pass-authorization-header=true
            - --set-xauthrequest=true
            - --skip-provider-button=true
            - --whitelist-domain=observe.freundcloud.org.uk
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-observe
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-observe
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-observe
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-observe
  namespace: factory
  labels:
    app: oauth2-proxy-observe
    app.kubernetes.io/instance: observe-auth
spec:
  selector:
    app: oauth2-proxy-observe
  ports:
    - name: http
      port: 4180
      targetPort: 4180
