# RoleHunter — self-hosted, single-user AI job-hunt workspace (Next.js + Postgres/pgvector).
# Source repo: github.com/olafkfreund/rolehunter  (manifests in deploy/k8s, kustomize)
#
# Exposed on the freundcloud tailnet at https://rolehunter.tail833f7.ts.net via a
# Tailscale sidecar in the app Pod (see docs/sidecar-pattern.md).
#
# Fresh deployment: the in-cluster Postgres starts empty and the migrate Job
# (ArgoCD Sync hook, wave 1) creates the schema before the app rolls out.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rolehunter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/olafkfreund/rolehunter
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: factory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
