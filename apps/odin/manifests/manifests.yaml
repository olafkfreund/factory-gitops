apiVersion: apps/v1
kind: Deployment
metadata:
  name: odin-dashboard
  namespace: factory
  labels:
    app: odin-dashboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: odin-dashboard
  template:
    metadata:
      labels:
        app: odin-dashboard
    spec:
      serviceAccountName: odin-dashboard-sa
      imagePullSecrets:
        - name: ghcr-pull
      containers:
      - name: odin
        image: ghcr.io/olafkfreund/odin:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: SONARR_API_KEY
          value: "b33eac69aaa94e2ab426f2934eabfb96"
        - name: RADARR_API_KEY
          value: "7d825135970740c1bc5845badc47c4ed"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
        volumeMounts:
        - name: ssh-key
          mountPath: /root/.ssh
          readOnly: true
      volumes:
      - name: ssh-key
        secret:
          secretName: odin-ssh-key
          defaultMode: 256
---
apiVersion: v1
kind: Service
metadata:
  name: odin-dashboard
  namespace: factory
  labels:
    app: odin-dashboard
spec:
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: odin-dashboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: odin-dashboard-sa
  namespace: factory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: odin-dashboard-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "namespaces", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/rollback"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["argocd.argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: odin-dashboard-rolebinding
subjects:
  - kind: ServiceAccount
    name: odin-dashboard-sa
    namespace: factory
roleRef:
  kind: ClusterRole
  name: odin-dashboard-role
  apiGroup: rbac.authorization.k8s.io
