apiVersion: apps/v1
kind: Deployment
metadata:
  name: odin-dashboard
  namespace: factory
  labels:
    app: odin-dashboard
spec:
  replicas: 1
  # Factory#640: retained ReplicaSets keep their image reference, and the
  # signature gate evaluates every one of them. Eleven revisions of history
  # meant five pre-signing tags sat permanently red on the board and armed a
  # denial for any `rollout undo` that reached them. Two is enough to roll
  # back one bad deploy; more is unbounded liability at Enforce.
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: odin-dashboard
  template:
    metadata:
      labels:
        app: odin-dashboard
    spec:
      serviceAccountName: odin-dashboard-sa
      imagePullSecrets:
        - name: ghcr-pull
      containers:
      - name: odin
        image: ghcr.io/olafkfreund/odin:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: SONARR_API_KEY
          value: "b33eac69aaa94e2ab426f2934eabfb96"
        - name: RADARR_API_KEY
          value: "7d825135970740c1bc5845badc47c4ed"
        # Keeps CPython from trying to write .pyc into a now read-only /app.
        # Not load-bearing (a failed .pyc write is non-fatal) but it is the
        # configuration that was actually measured, so it is the one shipped.
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        securityContext:
          # Factory#521 — ACCEPTED EXCEPTION, now with the reason attached.
          # `runAsNonRoot: false` here was explicit, i.e. somebody decided it,
          # unlike the Deployments in Factory#503 where the field was simply
          # absent. #521 asked for the decision to be confirmed rather than
          # inherited. It is correct, and this manifest is why: the
          # `odin-ssh-key` Secret below is mounted at /root/.ssh, and in this
          # image /root is `drwx------ root root` with HOME=/root (measured:
          # `id` -> uid=0(root), `ls -ld /root` -> drwx------). A non-root uid
          # cannot traverse /root, so it could not read its own deploy key.
          # Changing that means moving the mount off /root and giving the image
          # a non-root USER — an Odin image change, not a manifest one.
          #
          # readOnlyRootFilesystem — THIS HALF OF THE EXCEPTION IS NOW CLOSED.
          #
          # It previously read: "kept: uvicorn runs with --reload against /app
          # and Python writes __pycache__ there." Re-checked against the image
          # that is actually running (sha-2749b26) and the --reload half is not
          # true: the live process is
          #     cat /proc/1/cmdline -> `python backend/main.py`
          # with no --reload anywhere. The __pycache__ half was true
          # (/app/backend/__pycache__ exists) but that is a writable-rootfs
          # symptom, not a requirement — PYTHONDONTWRITEBYTECODE below removes
          # the need, and CPython treats a failed .pyc write as non-fatal anyway.
          #
          # Measured on the live image before flipping it, proved by request:
          #   --cap-drop ALL --security-opt no-new-privileges
          #                                          -> Running, GET / 200
          #   ... + PYTHONDONTWRITEBYTECODE=1        -> Running, GET / 200
          #   ... + --read-only --tmpfs /tmp         -> Running, GET / 200
          #                                             "Application startup complete."
          #
          # The one path that could have made a read-only rootfs "Running and
          # useless" is SSH: Odin polls the fleet over ssh. It is safe here
          # because ssh_base_args() in backend/main.py puts the mux socket in
          # ODIN_SSH_MUX_DIR, default /tmp/odin-ssh-mux (an emptyDir below), and
          # sets StrictHostKeyChecking=no. ssh appending to a known_hosts under
          # /root/.ssh already fails today — that path is a readOnly secret
          # mount — and it is non-fatal, so a read-only / changes nothing there.
          #
          # runAsNonRoot: false — this half of the exception STANDS, unchanged,
          # and for the reason recorded above: the odin-ssh-key Secret is mounted
          # at /root/.ssh and /root is drwx------ root root (re-measured today on
          # the live pod), so a non-root uid could not traverse to its own key.
          # Moving the mount off /root is an Odin image change, not a manifest
          # one. Note this is a mount PATH decision, so it is fixable in a repo
          # we own rather than a genuine third-party constraint: Factory#622.
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          seccompProfile: { type: RuntimeDefault }
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: ssh-key
          mountPath: /root/.ssh
          readOnly: true
        # Required by readOnlyRootFilesystem above: ODIN_SSH_MUX_DIR defaults to
        # /tmp/odin-ssh-mux and backend/main.py os.makedirs() it at import time.
        # Without a writable /tmp the process dies before it serves anything.
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: ssh-key
        secret:
          secretName: odin-ssh-key
          defaultMode: 256
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: odin-dashboard
  namespace: factory
  labels:
    app: odin-dashboard
spec:
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: odin-dashboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: odin-dashboard-sa
  namespace: factory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: odin-dashboard-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "namespaces", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/rollback"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: odin-dashboard-rolebinding
subjects:
  - kind: ServiceAccount
    name: odin-dashboard-sa
    namespace: factory
roleRef:
  kind: ClusterRole
  name: odin-dashboard-role
  apiGroup: rbac.authorization.k8s.io
