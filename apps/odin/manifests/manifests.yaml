apiVersion: apps/v1
kind: Deployment
metadata:
  name: odin-dashboard
  namespace: factory
  labels:
    app: odin-dashboard
spec:
  replicas: 1
  # Factory#640: retained ReplicaSets keep their image reference, and the
  # signature gate evaluates every one of them. Eleven revisions of history
  # meant five pre-signing tags sat permanently red on the board and armed a
  # denial for any `rollout undo` that reached them. Two is enough to roll
  # back one bad deploy; more is unbounded liability at Enforce.
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: odin-dashboard
  template:
    metadata:
      labels:
        app: odin-dashboard
    spec:
      serviceAccountName: odin-dashboard-sa
      imagePullSecrets:
        - name: ghcr-pull
      # fsGroup makes the odin-ssh-key Secret land group-owned 65532, which is
      # what lets defaultMode 0440 (below) be readable by the non-root uid.
      # Without it the files are root:root and 0440 buys nothing. Factory#622.
      securityContext:
        fsGroup: 65532
      containers:
      - name: odin
        image: ghcr.io/olafkfreund/odin:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: SONARR_API_KEY
          value: "b33eac69aaa94e2ab426f2934eabfb96"
        - name: RADARR_API_KEY
          value: "7d825135970740c1bc5845badc47c4ed"
        # Keeps CPython from trying to write .pyc into a now read-only /app.
        # Not load-bearing (a failed .pyc write is non-fatal) but it is the
        # configuration that was actually measured, so it is the one shipped.
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        # Factory#622. Points ssh_base_args() at the key's new home. Unset, the
        # backend passes no -o IdentityFile and falls back to the connecting
        # user's ~/.ssh -- which is exactly why this env var and the mountPath
        # below have to move in the SAME change.
        - name: ODIN_SSH_KEY
          value: /etc/odin/ssh/id_ed25519
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        securityContext:
          # Factory#521 — ACCEPTED EXCEPTION, now with the reason attached.
          # `runAsNonRoot: false` here was explicit, i.e. somebody decided it,
          # unlike the Deployments in Factory#503 where the field was simply
          # absent. #521 asked for the decision to be confirmed rather than
          # inherited. It is correct, and this manifest is why: the
          # `odin-ssh-key` Secret below is mounted at /root/.ssh, and in this
          # image /root is `drwx------ root root` with HOME=/root (measured:
          # `id` -> uid=0(root), `ls -ld /root` -> drwx------). A non-root uid
          # cannot traverse /root, so it could not read its own deploy key.
          # Changing that means moving the mount off /root and giving the image
          # a non-root USER — an Odin image change, not a manifest one.
          #
          # readOnlyRootFilesystem — THIS HALF OF THE EXCEPTION IS NOW CLOSED.
          #
          # It previously read: "kept: uvicorn runs with --reload against /app
          # and Python writes __pycache__ there." Re-checked against the image
          # that is actually running (sha-2749b26) and the --reload half is not
          # true: the live process is
          #     cat /proc/1/cmdline -> `python backend/main.py`
          # with no --reload anywhere. The __pycache__ half was true
          # (/app/backend/__pycache__ exists) but that is a writable-rootfs
          # symptom, not a requirement — PYTHONDONTWRITEBYTECODE below removes
          # the need, and CPython treats a failed .pyc write as non-fatal anyway.
          #
          # Measured on the live image before flipping it, proved by request:
          #   --cap-drop ALL --security-opt no-new-privileges
          #                                          -> Running, GET / 200
          #   ... + PYTHONDONTWRITEBYTECODE=1        -> Running, GET / 200
          #   ... + --read-only --tmpfs /tmp         -> Running, GET / 200
          #                                             "Application startup complete."
          #
          # The one path that could have made a read-only rootfs "Running and
          # useless" is SSH: Odin polls the fleet over ssh. It is safe here
          # because ssh_base_args() in backend/main.py puts the mux socket in
          # ODIN_SSH_MUX_DIR, default /tmp/odin-ssh-mux (an emptyDir below), and
          # sets StrictHostKeyChecking=no. ssh appending to a known_hosts under
          # /root/.ssh already fails today — that path is a readOnly secret
          # mount — and it is non-fatal, so a read-only / changes nothing there.
          #
          # runAsNonRoot — THIS HALF OF THE EXCEPTION IS NOW CLOSED TOO.
          #
          # It read: the odin-ssh-key Secret is mounted at /root/.ssh and /root
          # is drwx------ root root, so a non-root uid could not traverse to its
          # own key. True, and a mount PATH decision rather than a third-party
          # constraint, which is why it was fixable at all (Factory#622).
          #
          # Two things had to be true to move it, and BOTH were measured
          # in-cluster against the real Secret and a real host:
          #
          #   arm 1 (CONTROL) mount moved + runAsUser only, Secret left at
          #                   0400 with no fsGroup
          #                   -> key unreadable (Permission denied) AND
          #                      ssh refused: "No user exists for uid 65532"
          #   arm 2           0440 + fsGroup 65532, uid with a passwd entry
          #                   -> key -r--r----- root:65532, readable;
          #                      ssh authenticated, remote `id -un` = olafkfreund
          #
          # The control is what makes this readable: the naive version of this
          # fix (move the mount, set runAsUser) fails, and fails for TWO
          # independent reasons, so neither the mode change nor the image user
          # is cargo cult.
          #
          #   1. OpenSSH refuses a private key with group/other mode bits, so
          #      0440 looks wrong -- but sshkey_perm_ok() only applies that test
          #      when the file is owned by the CALLING uid. Root owns it, we are
          #      not root, so the check is skipped.
          #   2. ssh resolves the home dir via getpwuid(), not $HOME, and exits
          #      before authenticating if the uid has no /etc/passwd entry. A
          #      bare runAsUser here is NOT enough; the image now creates an
          #      `odin` user (uid/gid 65532, home /tmp).
          #
          # Requirement 2 is why this manifest MUST NOT land before the Odin
          # image carrying it. With the old image ODIN_SSH_KEY is ignored, ssh
          # looks under the home directory, finds nothing, and fleet polling
          # goes dark while GET / keeps answering 200.
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile: { type: RuntimeDefault }
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: ssh-key
          mountPath: /etc/odin/ssh
          readOnly: true
        # Required by readOnlyRootFilesystem above: ODIN_SSH_MUX_DIR defaults to
        # /tmp/odin-ssh-mux and backend/main.py os.makedirs() it at import time.
        # Without a writable /tmp the process dies before it serves anything.
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: ssh-key
        secret:
          secretName: odin-ssh-key
          # 288 == 0440. Was 256 (0400), which is unreadable by anyone but the
          # owner -- and the owner of a Secret volume file is root, not the
          # runAsUser. Paired with the pod fsGroup above, 0440 makes it readable
          # via the group and nothing wider. Factory#622.
          defaultMode: 288
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: odin-dashboard
  namespace: factory
  labels:
    app: odin-dashboard
spec:
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: odin-dashboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: odin-dashboard-sa
  namespace: factory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: odin-dashboard-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "namespaces", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/rollback"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: odin-dashboard-rolebinding
subjects:
  - kind: ServiceAccount
    name: odin-dashboard-sa
    namespace: factory
roleRef:
  kind: ClusterRole
  name: odin-dashboard-role
  apiGroup: rbac.authorization.k8s.io
