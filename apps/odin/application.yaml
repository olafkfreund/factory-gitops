# Odin Dashboard — homelab monitoring portal.
# Source repo: github.com/olafkfreund/Odin
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/olafkfreund/factory-gitops
    targetRevision: main
    path: apps/odin/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: factory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
