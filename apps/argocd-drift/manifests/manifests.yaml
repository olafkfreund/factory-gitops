# ArgoCD sync-honesty watchdog -> OpenObserve (Factory#425).
#
# THE DEFECT THIS CLOSES: ArgoCD reports `Synced` against the revision it last
# FETCHED, not against gitops HEAD. Three times across 2026-07-28/29 a service
# ran a stale image while `kubectl get application` said Synced/Healthy, the
# deploy workflow said success, and `kubectl rollout status` said successfully
# rolled out. Every signal in the normal check sequence was green.
#
# WHY IT IS WORSE THAN A DELAY: twice the stranded commit was the fix the
# author had just merged and was about to verify. Verification would have run
# against the OLD code and reported the fix as not working, sending the next
# investigation after a change that was never deployed. `Synced` does not just
# fail to inform here, it actively misdirects.
#
# ROOT CAUSE, MEASURED NOT ASSUMED (see docs/argocd-sync-honesty.md):
#   - factory-gitops has NO webhook, so ArgoCD only learns about commits by
#     polling (`timeout.reconciliation`, default 180s).
#   - the repo-server caches its `ls-remote` result in Redis under
#     `git-refs|<repoURL>` with an INDEPENDENT 180s TTL. Observed live cycling
#     180 -> 0 -> 180.
#   - so the controller can reconcile an app AFTER a commit lands, get the
#     cached pre-commit sha back, and record Synced against it. The issue
#     comments show exactly that: reconciledAt 10:13:40Z, AFTER the push, still
#     on the previous commit.
#   - the two stack to ~360s of legitimate blindness. A controlled push
#     measured on this cluster took 5m43s (343s) to reach all 27 apps, with 25
#     of them reporting `Synced` against the previous commit for the first
#     2m35s.
#
# THE TRAP THIS AVOIDS: lowering `timeout.reconciliation` alone fixes NOTHING,
# because the repo-server keeps handing back the same 180s-cached sha -- the
# app is "refreshed" three times against a stale answer and reports Synced each
# time. A number lowered without checking is the same class of bug as the one
# being fixed.
#
# FOUR SIGNALS, BECAUSE NO ONE OF THEM SURVIVES ALL THE CASES:
#   1. REVISION BEHIND -- reported revision != the branch tip read from git.
#      Catches the #425 incident. Gated on the tip being older than the
#      tolerance, because a commit pushed seconds ago is legitimately not
#      deployed yet.
#   2. RECONCILE STALE -- status.reconciledAt older than tolerance. Signal 1
#      goes blind whenever git happens not to have moved, so a controller that
#      wedged during a quiet hour looks perfect to it. Signal 2 reads the
#      timestamp of the last LOOK and is the only one that survives a quiet
#      repo. "No news" must never read as OK.
#   3. FAILING SYNC (#443) -- any status condition ArgoCD names *Error. Signals
#      1 and 2 both go blind on an app that is reconciling briskly against the
#      right revision and failing to APPLY it: kyverno-policies did that for
#      four days, reporting Healthy throughout, while the cluster ran a stale
#      and WEAKER copy of the image-signature policy.
#   4. SUSTAINED OutOfSync (#443) -- OutOfSync with no sync in flight and
#      nothing pending. Signal 3 goes blind in turn on a sync that keeps
#      SUCCEEDING and keeps leaving the app OutOfSync, which sets no error
#      condition at all. That is the `kyverno` app, yellow since 2026-07-26.
#
# Health and sync are different axes. Until #443 only health was watched, so a
# GitOps repo could quietly stop being authoritative with every dashboard green.
#
# NO NEW DELIVERY PATH: reuses apps/job-watchdog's exact pattern -- stock
# python image, stdlib-only script in a ConfigMap, the observe-root secret, and
# the OpenObserve ingest path apps/audit-siem-forward already proves works.
#
# WHY IT EXITS 0 EVEN WHEN IT FINDS DRIFT: identical contract to
# apps/job-watchdog. A watchdog that goes red on its findings is
# indistinguishable from a watchdog that is itself broken. Non-zero here means
# ONLY that this job could not do its work.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-drift
  namespace: factory
  labels: { app: argocd-drift }
---
# Least privilege, following the apps/cred-broker and apps/job-watchdog
# precedent: a namespaced Role, no ClusterRole, read-only, and only the one
# resource kind it reads. The `default` AppProject would permit a ClusterRole
# (clusterResourceWhitelist is `*`), which is exactly why it is not used.
#
# This Role lives in `argocd` -- where Applications are -- and is bound to a
# ServiceAccount in `factory`. That cross-namespace binding is the whole reason
# manifests/kustomization.yaml has no `namespace:` transformer.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-drift
  namespace: argocd
  labels: { app: argocd-drift }
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-drift
  namespace: argocd
  labels: { app: argocd-drift }
subjects:
  - kind: ServiceAccount
    name: argocd-drift
    namespace: factory
roleRef:
  kind: Role
  name: argocd-drift
  apiGroup: rbac.authorization.k8s.io
---
# Factory#639. Signal 5 compares each workload's LIVE security fields against
# the manifest ArgoCD last applied to it, so it must read the workloads
# themselves -- which the Application-only Role above cannot see.
#
# WHY THIS ONE IS A ClusterRole, following apps/job-watchdog (Factory#571).
# A namespaced Role would scope this to `factory` and leave every other
# namespace unwatched, and an unwatched namespace reports "no drift" for the
# part of the cluster nobody is looking at -- the same false green this app
# exists to abolish. It is also self-defeating here specifically: a namespace
# added later would silently never be examined, which is the Factory#642 defect
# (a check that examined nothing and reported nothing) built in by design.
#
# Least privilege is preserved where it counts: get/list only, no write verb,
# no secrets, no pods/log, no pods/exec. The scope widens; the power does not.
# Note these four kinds are read for their pod TEMPLATE, not their pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-drift
  labels: { app: argocd-drift }
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-drift
  labels: { app: argocd-drift }
subjects:
  - kind: ServiceAccount
    name: argocd-drift
    namespace: factory
roleRef:
  kind: ClusterRole
  name: argocd-drift
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-drift-script
  namespace: factory
  labels: { app: argocd-drift }
data:
  drift.py: |
    #!/usr/bin/env python3
    """Check every ArgoCD Application against the real HEAD of its git branch (#425).

    THE DEFECT THIS CLOSES: ArgoCD's `Synced` means "synced to the revision I last
    FETCHED", not "running what git says". On 2026-07-28 a tfactory image bump
    landed in factory-gitops at 22:32:31Z; ArgoCD still reported
    `sync=Synced health=Healthy revision=ce00dd49` -- the PREVIOUS commit -- while
    the pod ran a 68-minute-old image. Nothing anywhere said otherwise.

    Every other verification in this fleet rests on "what is deployed is what is in
    git". ArgoCD's status is the only thing asserting that, and it asserts it
    without re-checking. This job re-checks it, from outside ArgoCD, against the
    git remote itself.

    WHY NOT JUST TRUST A SHORTER POLL: because the poll interval is not the whole
    story and lowering it alone changes nothing. Measured on this cluster: the
    repo-server caches its `ls-remote` result in Redis under
    `git-refs|<repoURL>` with an INDEPENDENT 180s TTL. The controller's
    `timeout.reconciliation` is also 180s. Dropping the controller timeout to 60s
    leaves the repo-server handing back the same 180s-stale sha, so the app is
    "refreshed" three times against a cached answer and reports Synced each time.
    A number lowered without checking is exactly the class of bug this file exists
    to catch.

    TWO SIGNALS, BECAUSE ONE IS NOT ENOUGH:
      1. REVISION BEHIND -- app.status.sync.revision != the branch tip in git.
         Gated on the tip being older than DRIFT_TOLERANCE_SECONDS, because a
         commit pushed 20 seconds ago is legitimately not deployed yet. This is
         the signal that catches the #425 incident.
      2. RECONCILE STALE -- now - app.status.reconciledAt > RECONCILE_TOLERANCE.
         Signal 1 goes blind if the controller wedges while git happens not to
         have moved: revision == HEAD, everything green, nothing looking. Signal 2
         reads the timestamp of the last LOOK, so a controller that stopped
         reconciling is visible even when no commit has landed to expose it.
      Signal 2 is the one that survives a quiet repo. "No news" must never read
      as OK.

    A sync status this job cannot evaluate (Unknown, missing revision) is reported
    as a finding, never skipped. rolehunter sits in exactly that state today: its
    kustomization fails to build, ArgoCD reports sync=Unknown, and until now
    nothing said so.

    Exit codes: 0 = reported (whatever the findings), 2 = no OpenObserve
    credentials, 3 = kubernetes API unreachable, 4 = OpenObserve ingest failed,
    5 = could not reach ANY git remote. Non-zero means THIS JOB is broken, never
    that a watched Application is -- same contract as apps/job-watchdog.

    Env:
      DRIFT_TOLERANCE_SECONDS     grace after a commit lands (default 600)
      RECONCILE_TOLERANCE_SECONDS max age of status.reconciledAt (default 900)
      OBSERVE_URL / OO_ORG / OO_STREAM / OO_USER / OO_PASS  as job-watchdog
      GITHUB_API                  override for the commit-date lookup
    """

    import base64
    import json
    import os
    import ssl
    import sys
    import urllib.error
    import urllib.request
    from datetime import datetime, timezone

    SA = "/var/run/secrets/kubernetes.io/serviceaccount"

    # Grace between a commit landing and every app being expected to carry it.
    # Floor is set by the two independent 180s timers measured on this cluster
    # (controller reconciliation + repo-server git-refs cache) which can stack to
    # ~360s, plus manifest generation and rollout. 600s leaves headroom without
    # hiding a real stall. Tighten this only after tightening BOTH timers.
    DEFAULT_DRIFT_TOLERANCE = 600

    # How long ArgoCD may go without LOOKING at an app before that is itself the
    # finding. 5x the 180s reconciliation timeout: tolerant of one skipped burst
    # and a slow repo-server, intolerant of a wedged controller.
    DEFAULT_RECONCILE_TOLERANCE = 900

    # ponytail: read the branch tip straight off git's smart-HTTP endpoint rather
    # than the GitHub REST API. Same thing ArgoCD's repo-server does, needs no
    # token, and -- the reason it matters -- is not subject to the 60 req/hr
    # unauthenticated REST limit that this cluster's single egress IP shares with
    # every other job. The REST API is used for ONE thing (the tip's commit date)
    # and only when a mismatch has already been found, so a quiet cluster makes
    # zero API calls.


    def eprint(*a):
        print(*a, file=sys.stderr, flush=True)


    def _parse_ts(raw: str) -> datetime:
        dt = datetime.fromisoformat(str(raw).replace("Z", "+00:00"))
        return dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc)


    def _dur(seconds: float) -> str:
        s = int(seconds)
        if s < 120:
            return f"{s}s"
        if s < 7200:
            return f"{s // 60}m"
        if s < 172800:
            return f"{s / 3600:.1f}h"
        return f"{s / 86400:.1f}d"


    def parse_pkt_refs(body: bytes) -> dict:
        """git smart-HTTP /info/refs pkt-line stream -> {refname: sha}.

        Each record is a 4-hex length prefix (counting itself) followed by the
        payload; '0000' is a flush packet. The first ref line carries a NUL and
        the server capability list, which is discarded.
        """
        refs: dict = {}
        i = 0
        while i + 4 <= len(body):
            try:
                n = int(body[i : i + 4], 16)
            except ValueError:
                break
            if n == 0:  # flush
                i += 4
                continue
            if n < 4 or i + n > len(body):
                break
            line = body[i + 4 : i + n]
            i += n
            line = line.split(b"\x00", 1)[0].strip()
            if line.startswith(b"#"):  # "# service=git-upload-pack"
                continue
            parts = line.split(b" ", 1)
            if len(parts) == 2 and len(parts[0]) == 40:
                refs[parts[1].decode(errors="replace")] = parts[0].decode()
        return refs


    def resolve_tip(repo_url: str, target_revision: str, timeout: int = 30) -> str:
        """Branch/tag tip sha for a repo, straight from the git remote.

        A targetRevision that is already a 40-char sha is returned unchanged -- an
        app pinned to a sha cannot drift from its branch by definition.
        """
        rev = (target_revision or "HEAD").strip()
        if len(rev) == 40 and all(c in "0123456789abcdef" for c in rev.lower()):
            return rev.lower()
        url = repo_url.rstrip("/").removesuffix(".git") + "/info/refs?service=git-upload-pack"
        req = urllib.request.Request(url, headers={"user-agent": "git/2.43.0"})
        with urllib.request.urlopen(req, timeout=timeout) as r:
            refs = parse_pkt_refs(r.read())
        for candidate in (
            f"refs/heads/{rev}",
            f"refs/tags/{rev}^{{}}",
            f"refs/tags/{rev}",
            rev,
        ):
            if candidate in refs:
                return refs[candidate]
        if rev in ("HEAD", ""):
            for name, sha in refs.items():
                if name in ("refs/heads/main", "refs/heads/master"):
                    return sha
        raise KeyError(f"{rev} not found in {repo_url} ({len(refs)} refs)")


    def head_commit_age(repo_url: str, sha: str, now: datetime, api: str) -> float | None:
        """Seconds since `sha` was committed, or None if it cannot be determined.

        None means UNKNOWN, and assess() treats unknown as "old enough to judge" --
        failing closed. A drift check that goes quiet because it could not read a
        timestamp would be the same lie in a new place.
        """
        slug = repo_url.rstrip("/").removesuffix(".git").split("github.com/")[-1]
        try:
            req = urllib.request.Request(
                f"{api}/repos/{slug}/commits/{sha}",
                headers={"accept": "application/vnd.github+json", "user-agent": "argocd-drift"},
            )
            with urllib.request.urlopen(req, timeout=30) as r:
                body = json.load(r)
            return (now - _parse_ts(body["commit"]["committer"]["date"])).total_seconds()
        except Exception as e:  # noqa: BLE001
            eprint(f"warn: commit date for {slug}@{sha[:10]} unavailable: {e!r}")
            return None


    def assess(app: dict, tip: str | None, tip_age: float | None, now: datetime,
               drift_tol: int, reconcile_tol: int) -> dict:
        """Pure: one Application + the true branch tip -> one drift record."""
        meta = app.get("metadata") or {}
        spec = app.get("spec") or {}
        status = app.get("status") or {}
        src = spec.get("source") or {}
        sync = status.get("sync") or {}

        reported = sync.get("revision") or ""
        sync_status = sync.get("status") or "Unknown"
        health = (status.get("health") or {}).get("status") or "Unknown"

        reconciled_raw = status.get("reconciledAt")
        reconciled_age = (
            None if not reconciled_raw else (now - _parse_ts(reconciled_raw)).total_seconds()
        )

        # Every condition ArgoCD names *Error: SyncError, ComparisonError,
        # InvalidSpecError, UnknownError. Matching on the SUFFIX rather than a
        # fixed list is deliberate -- a condition type this code has never heard
        # of must not be the one it stays quiet about (Factory#443).
        errs = [
            c for c in (status.get("conditions") or [])
            if str(c.get("type", "")).endswith("Error")
        ]

        # The two states in which OutOfSync is the NORMAL, momentary truth
        # rather than a finding: a sync running right now, and an app still
        # behind a commit that landed inside the tolerance.
        syncing = (status.get("operationState") or {}).get("phase") == "Running"
        pending_deploy = bool(
            tip and reported and reported != tip
            and tip_age is not None and tip_age <= drift_tol
        )

        problems: list[tuple[str, str]] = []

        # SIGNAL 3 -- FAILING SYNC (Factory#443). An Application can fail every
        # sync attempt, exhaust its retries, and still report Healthy, because
        # `Healthy` describes the running workload and says nothing about
        # whether git is still the truth. kyverno-policies did exactly that for
        # four days from the Kyverno v1.12.6 -> v1.18.2 bump, and what the
        # cluster kept running through those four days was a STALE, WEAKER copy
        # of verify-factory-image-signatures that had lost its subjectRegExp --
        # it would have accepted a signature from any GitHub Actions workflow in
        # any repo. Every review artefact pointed at the git manifest, which was
        # correct. Nothing said the object doing the work was not.
        for c in errs:
            since = c.get("lastTransitionTime")
            age = "" if not since else f" for {_dur((now - _parse_ts(since)).total_seconds())}"
            problems.append(
                (f"condition_{str(c.get('type')).lower()}",
                 f"{c.get('type')}{age}: {str(c.get('message', '')).strip()[:400]} "
                 f"-- health={health} says nothing about this")
            )

        if tip is None:
            problems.append(
                ("tip_unknown",
                 "CANNOT VERIFY: the git remote could not be reached, so this "
                 f"app's reported revision {reported[:10] or '(none)'} is "
                 "unchecked. Its sync status is not evidence of anything")
            )
        elif not reported:
            problems.append(
                ("no_revision",
                 f"ArgoCD reports NO revision at all (sync={sync_status}). "
                 f"Branch tip is {tip[:10]}. Nothing to compare -- the app has "
                 "never been successfully compared against git")
            )
        elif reported != tip:
            # A commit that landed seconds ago is legitimately not deployed yet.
            # Unknown age fails CLOSED: unverifiable is not the same as fine.
            if tip_age is None or tip_age > drift_tol:
                age_txt = "age unknown" if tip_age is None else f"{_dur(tip_age)} old"
                problems.append(
                    ("revision_behind",
                     f"BEHIND GIT: reports revision {reported[:10]} but "
                     f"{src.get('targetRevision', '?')} is at {tip[:10]} "
                     f"({age_txt} > {_dur(drift_tol)} tolerance). "
                     f"sync={sync_status} health={health} -- that green status "
                     "describes the OLD revision")
                )

        if sync_status not in ("Synced", "OutOfSync"):
            problems.append(
                ("sync_unevaluated",
                 f"sync status is {sync_status} -- ArgoCD could not compare this "
                 "app against git at all, so neither Synced nor OutOfSync is "
                 "being claimed and nothing else reports it")
            )
        elif sync_status == "OutOfSync" and not syncing and not pending_deploy:
            # SIGNAL 4 -- SUSTAINED OutOfSync (Factory#443). Health and sync are
            # different axes and only health was watched, so an app could sit
            # OutOfSync indefinitely and stay green on the board.
            #
            # It fires where signal 3 cannot: a sync that keeps SUCCEEDING
            # ("successfully synced (all tasks run)") and keeps leaving the app
            # OutOfSync sets no *Error condition at all. That is the `kyverno`
            # app, permanently yellow on eleven CRDs since 2026-07-26.
            #
            # ONLY TWO THINGS ARE SUPPRESSED, and neither is a time window:
            #   - a sync operation running RIGHT NOW (operationState Running)
            #   - an app still BEHIND a tip that landed within the tolerance,
            #     i.e. an ordinary in-flight deploy
            # A tip-age gate like revision_behind's would be wrong here and was
            # measured wrong on this cluster: factory-gitops takes cd commits
            # every few minutes, so its tip is almost always younger than the
            # tolerance, and gating on it silenced the real, four-day-stuck
            # `kyverno` app on the very first live run. An app reporting the tip
            # AND OutOfSync has nothing pending -- that is live-object drift,
            # and a fresh commit somewhere else does not explain it.
            problems.append(
                ("out_of_sync",
                 f"OutOfSync with nothing in flight (revision {reported[:10]} "
                 f"{'== tip' if tip and reported == tip else 'vs tip ' + (tip or '?')[:10]}"
                 f", no sync running). health={health} describes the running "
                 "workload, NOT whether git is still the truth")
            )

        if reconciled_age is None:
            problems.append(
                ("never_reconciled",
                 "has NO reconciledAt timestamp -- ArgoCD has never completed a "
                 "comparison for this app")
            )
        elif reconciled_age > reconcile_tol:
            problems.append(
                ("reconcile_stale",
                 f"NOT RECONCILED for {_dur(reconciled_age)} "
                 f"(> {_dur(reconcile_tol)} tolerance). Its sync status is a "
                 "cached opinion from that long ago, whatever it says")
            )

        return {
            "_timestamp": int(now.timestamp() * 1_000_000),
            "source": "argocd-drift",
            "application": meta.get("name", "?"),
            "repo_url": src.get("repoURL", ""),
            "target_revision": src.get("targetRevision", ""),
            "reported_revision": reported,
            "git_tip_revision": tip or "",
            "sync_status": sync_status,
            "health_status": health,
            "error_conditions": [str(c.get("type")) for c in errs],
            "status": problems[0][0] if problems else "ok",
            "problems": [p[1] for p in problems],
            "revision_matches_git": bool(tip and reported == tip),
            "git_tip_age_seconds": None if tip_age is None else int(tip_age),
            "reconciled_age_seconds": None if reconciled_age is None else int(reconciled_age),
            "drift_tolerance_seconds": drift_tol,
            "reconcile_tolerance_seconds": reconcile_tol,
        }


    # ---- SIGNAL 5: ADDITIVE SECURITY DRIFT (Factory#639) -------------------
    #
    # Signals 1-4 all read ArgoCD's own opinion. This one does not, because for
    # this class of drift ArgoCD's opinion is structurally blind.
    #
    # MEASURED ON THIS CLUSTER 2026-08-07, one object, one reconcile loop, with
    # syncPolicy.automated.selfHeal TRUE the whole time:
    #   23:27:32  kubectl patch cronjob/endpoint-guard adding BOTH
    #               automountServiceAccountToken: true   (git does NOT declare it)
    #               securityContext.runAsUser: 65533     (git DOES declare 65532)
    #   t=3s      sync=OutOfSync, both fields live
    #   t=6s      runAsUser reverted to 65532, sync=Synced
    #   t=6..120s automountServiceAccountToken STILL true, sync=Synced/Healthy
    #   23:29:58  forced hard refresh; reconciledAt advanced to 23:29:58,
    #             field still live, still Synced/Healthy.
    #
    # The DECLARED field was reverted in under six seconds. The UNDECLARED one
    # survived every reconcile, including a forced one, and the Application
    # reported Synced throughout. A field present only in LIVE is not a
    # difference to a three-way diff, so there is nothing for self-heal to undo
    # and nothing for the UI to show.
    #
    # WHY THIS INVERTS THE SAFETY ADVICE: "a hand-applied patch does not stick,
    # self-heal reverts it" was used twice on Factory#621 to justify not running
    # an experiment. It is true for a patch that MODIFIES a declared value and
    # false for one that ADDS an undeclared field -- and the additive case is
    # the dangerous one, because it persists indefinitely while looking exactly
    # like it worked. With the image-signature gate at Enforce (Factory#522), a
    # hand-added securityContext, imagePullSecrets or automountServiceAccountToken
    # on a live workload is invisible to git AND to ArgoCD.
    #
    # WHERE "DECLARED" COMES FROM: the last-applied-configuration annotation on
    # the live object -- the manifest ArgoCD itself last applied. No ArgoCD API
    # token, no kustomize build, no git clone, no new credential. MEASURED: a
    # `kubectl patch` does NOT update that annotation, which is precisely why
    # the added field is visible here (declared automount=None, live=True) and
    # invisible to ArgoCD.
    #
    # THE HONEST CEILING, stated rather than discovered later: a change made
    # with `kubectl apply` DOES rewrite last-applied, so this check would not
    # see it. That case is ArgoCD's, and it catches it -- last-applied is exactly
    # the input its three-way diff uses to compute a prune. The two are
    # complementary: ArgoCD covers what last-applied knows about, this covers
    # what it does not. Reasoned from the mechanism, not measured.
    #
    # ponytail: additive only. A MODIFIED declared field is already ArgoCD's job
    # and was measured reverting in under six seconds above; reporting it here
    # would duplicate a working control and add noise.

    LAST_APPLIED = "kubectl.kubernetes.io/last-applied-configuration"

    # THE FIELD SET, AND WHY IT IS THIS SHORT. Comparing everything live against
    # everything declared is unusable, and that is measured rather than assumed:
    # across 42 workloads on this cluster `dnsPolicy` is defaulted by Kubernetes
    # into 42 of 42 live objects and appears in none of the declared ones. A
    # check that fires on all 42 every five minutes gets muted, which is the
    # cry-wolf failure this fleet has already hit.
    #
    # So the set is exactly the fields whose ADDITION changes the security
    # posture of a workload:
    #   securityContext          the Factory#521/#621 hardening ratchet itself
    #   hostNetwork/PID/IPC      namespace escapes to the node
    #   automountServiceAccountToken   API-token exposure (the field measured above)
    #   imagePullSecrets         supply chain: which registry credential is trusted
    # Added capabilities need no entry of their own -- capabilities.add lives
    # under a container securityContext and is reached by the leaf walk below.
    #
    # DELIBERATELY EXCLUDED: env vars. Measured at 0 additive noise here, so
    # noise is not the reason -- the reason is that this job writes what it finds
    # into an OpenObserve stream, and env values carry literal secrets. A drift
    # check that exfiltrates the thing it is guarding is a worse bug than the one
    # it closes. Add it only behind value-redaction.
    SECURITY_POD_KEYS = (
        "securityContext",
        "hostNetwork",
        "hostPID",
        "hostIPC",
        "automountServiceAccountToken",
        "imagePullSecrets",
    )

    # (apiGroup, plural) for every kind that carries a pod template.
    WORKLOAD_KINDS = (
        ("apps", "deployments", "Deployment"),
        ("apps", "statefulsets", "StatefulSet"),
        ("apps", "daemonsets", "DaemonSet"),
        ("batch", "cronjobs", "CronJob"),
    )


    def pod_template(obj: dict) -> dict:
        """Pod spec for any of the four kinds, including CronJob's extra nesting."""
        spec = obj.get("spec") or {}
        if "jobTemplate" in spec:
            spec = (spec.get("jobTemplate") or {}).get("spec") or {}
        return ((spec.get("template") or {}).get("spec") or {})


    def _leaves(value, prefix: str):
        """Flatten to (dotted-path, scalar) pairs. An empty dict or list yields
        NOTHING, and that is the whole reason this walks to leaves instead of
        comparing top-level keys.

        MEASURED: Kubernetes defaults `securityContext: {}` into 10 of 42 live
        workloads here. Comparing key PRESENCE reports all 10 forever; comparing
        leaves reports none of them, because {} has no leaves -- while still
        catching a single added runAsUser inside a securityContext that is
        otherwise declared. Fleet-wide noise measured at 0 findings.
        """
        if isinstance(value, dict):
            for k in sorted(value):
                yield from _leaves(value[k], f"{prefix}.{k}")
        elif isinstance(value, list):
            for i, v in enumerate(value):
                yield from _leaves(v, f"{prefix}[{i}]")
        else:
            yield prefix, value


    def security_leaves(pod: dict) -> dict:
        """{leaf path: value} for every security-relevant field in a pod spec."""
        out: dict = {}
        for key in SECURITY_POD_KEYS:
            if key in pod:
                out.update(_leaves(pod[key], key))
        # initContainers included: a hand-added privileged init container is the
        # classic way to touch the host and exit before anyone looks at it.
        for field in ("initContainers", "containers"):
            for c in (pod.get(field) or []):
                sc = c.get("securityContext")
                if sc is not None:
                    out.update(
                        _leaves(sc, f"{field}[{c.get('name')}].securityContext")
                    )
        return out


    def assess_workload(kind: str, obj: dict, now: datetime) -> dict | None:
        """One workload -> a security-drift record, or None if it has no baseline.

        None means "no last-applied annotation", i.e. nothing ever declared this
        object through kubectl apply. MEASURED: 10 of 52 workloads here are in
        that state and every one is Helm- or k3s-owned (keda, kyverno,
        kube-system). They are COUNTED in the summary record rather than
        reported, because ten permanent findings is how a check gets muted --
        but the count is emitted so it cannot grow in silence.
        """
        meta = obj.get("metadata") or {}
        ref = f"{kind}/{meta.get('namespace', '?')}/{meta.get('name', '?')}"
        raw = (meta.get("annotations") or {}).get(LAST_APPLIED)
        if not raw:
            return None

        base = {
            "_timestamp": int(now.timestamp() * 1_000_000),
            "source": "argocd-drift",
            "check": "security_drift",
            "workload": ref,
            "kind": kind,
            "namespace": meta.get("namespace", ""),
            "name": meta.get("name", ""),
        }

        try:
            declared = security_leaves(pod_template(json.loads(raw)))
        except Exception as e:  # noqa: BLE001 -- unreadable is a finding, not a skip
            return {
                **base,
                "status": "declared_unreadable",
                "added_fields": [],
                "problems": [
                    f"last-applied-configuration will not parse ({e!r}), so this "
                    "workload's security fields cannot be checked against anything"
                ],
            }

        live = security_leaves(pod_template(obj))
        added = {p: v for p, v in live.items() if p not in declared}
        if not added:
            return {**base, "status": "ok", "added_fields": [], "problems": []}

        return {
            **base,
            "status": "security_field_added",
            "added_fields": [f"{p}={json.dumps(v)}" for p, v in sorted(added.items())],
            "problems": [
                "LIVE-ONLY SECURITY FIELD(S) that the applied manifest does not "
                "declare: "
                + ", ".join(f"{p}={json.dumps(v)}" for p, v in sorted(added.items()))
                + " -- ArgoCD reports this workload's Application as Synced "
                "because a field present only in live is not a difference to a "
                "three-way diff, so self-heal will never remove it"
            ],
        }


    def k8s_get(path: str):
        with open(f"{SA}/token") as f:
            token = f.read().strip()
        req = urllib.request.Request(
            f"https://kubernetes.default.svc{path}",
            headers={"authorization": f"Bearer {token}", "accept": "application/json"},
            method="GET",
        )
        ctx = ssl.create_default_context(cafile=f"{SA}/ca.crt")
        with urllib.request.urlopen(req, timeout=30, context=ctx) as r:
            return json.load(r)


    def emit(oo: str, org: str, stream: str, basic: str, records: list[dict]) -> None:
        req = urllib.request.Request(
            f"{oo}/api/{org}/{stream}/_json",
            data=json.dumps(records).encode(),
            headers={"authorization": f"Basic {basic}", "content-type": "application/json"},
            method="POST",
        )
        with urllib.request.urlopen(req, timeout=60) as r:
            res = json.load(r)
        st = (res.get("status") or [{}])[0] if isinstance(res.get("status"), list) else res
        if isinstance(st, dict) and st.get("failed"):
            raise RuntimeError(f"OpenObserve rejected {st['failed']} record(s): {res}")


    def build_records(apps: list[dict], now: datetime, drift_tol: int, reconcile_tol: int,
                      api: str) -> tuple[list[dict], int]:
        """Resolve each distinct (repo, revision) once, then assess every app.

        Returns (records, reachable_remote_count). Apps sharing a repo share one
        ls-remote, which is why 29 apps cost one request, not 29.
        """
        sources = {
            ((a.get("spec") or {}).get("source") or {}).get("repoURL", ""):
                ((a.get("spec") or {}).get("source") or {}).get("targetRevision", "")
            for a in apps
        }
        pairs = {
            (((a.get("spec") or {}).get("source") or {}).get("repoURL", ""),
             ((a.get("spec") or {}).get("source") or {}).get("targetRevision", ""))
            for a in apps
        }
        del sources
        tips: dict = {}
        for repo, rev in sorted(pairs):
            if not repo:
                continue
            try:
                tips[(repo, rev)] = resolve_tip(repo, rev)
            except Exception as e:  # noqa: BLE001
                eprint(f"warn: cannot resolve {repo}@{rev or 'HEAD'}: {e!r}")
                tips[(repo, rev)] = None

        # Commit dates cost a REST call, so only look them up for pairs that
        # actually mismatch somewhere.
        ages: dict = {}
        for key, tip in tips.items():
            if not tip:
                continue
            if any(
                ((a.get("status") or {}).get("sync") or {}).get("revision") not in (tip, None, "")
                for a in apps
                if (((a.get("spec") or {}).get("source") or {}).get("repoURL", ""),
                    ((a.get("spec") or {}).get("source") or {}).get("targetRevision", "")) == key
            ):
                ages[key] = head_commit_age(key[0], tip, now, api)

        records = []
        for a in sorted(apps, key=lambda a: a["metadata"]["name"]):
            src = (a.get("spec") or {}).get("source") or {}
            key = (src.get("repoURL", ""), src.get("targetRevision", ""))
            records.append(
                assess(a, tips.get(key), ages.get(key), now, drift_tol, reconcile_tol)
            )
        return records, sum(1 for t in tips.values() if t)


    def build_security_records(workloads: list, now: datetime) -> tuple:
        """[(kind, obj)] -> (finding_records, examined, without_baseline).

        Only FINDINGS are returned as records. A per-workload `ok` record every
        five minutes would be ~12k rows a day saying nothing; the examined count
        travels in the summary record instead, which is what makes a run that
        looked at nothing distinguishable from a run that found nothing
        (Factory#642).
        """
        findings, examined, no_baseline = [], 0, []
        for kind, obj in workloads:
            rec = assess_workload(kind, obj, now)
            if rec is None:
                meta = obj.get("metadata") or {}
                no_baseline.append(
                    f"{kind}/{meta.get('namespace', '?')}/{meta.get('name', '?')}"
                )
                continue
            examined += 1
            if rec["status"] != "ok":
                findings.append(rec)
        return findings, examined, sorted(no_baseline)


    def main() -> int:
        drift_tol = int(os.environ.get("DRIFT_TOLERANCE_SECONDS", DEFAULT_DRIFT_TOLERANCE))
        reconcile_tol = int(
            os.environ.get("RECONCILE_TOLERANCE_SECONDS", DEFAULT_RECONCILE_TOLERANCE)
        )
        api = os.environ.get("GITHUB_API", "https://api.github.com").rstrip("/")
        oo = os.environ.get(
            "OBSERVE_URL", "http://observe.factory.svc.cluster.local:5080"
        ).rstrip("/")
        org = os.environ.get("OO_ORG", "default")
        stream = os.environ.get("OO_STREAM", "argocd_drift")
        sec_stream = os.environ.get("OO_SECURITY_STREAM", "security_drift")
        user, pw = os.environ.get("OO_USER", ""), os.environ.get("OO_PASS", "")
        if not user or not pw:
            eprint("FATAL: OO_USER/OO_PASS not set (observe-root secret missing)")
            return 2
        basic = base64.b64encode(f"{user}:{pw}".encode()).decode()

        try:
            apps = k8s_get(
                "/apis/argoproj.io/v1alpha1/namespaces/argocd/applications"
            )["items"]
        except Exception as e:  # noqa: BLE001 -- cannot see == cannot report
            eprint(f"FATAL: kubernetes API unreachable: {e!r}")
            return 3

        now = datetime.now(timezone.utc)
        records, reachable = build_records(apps, now, drift_tol, reconcile_tol, api)

        if apps and reachable == 0:
            # Every record would read "tip_unknown". Emitting a wall of
            # unverifiable is worse than admitting the job could not run.
            eprint("FATAL: no git remote was reachable -- nothing could be verified")
            return 5

        for r in records:
            if r["status"] == "ok":
                eprint(f"ok       {r['application']}  @{r['reported_revision'][:10]}")
            else:
                eprint(f"DRIFTED  {r['application']} [{r['status']}]")
                for p in r["problems"]:
                    eprint(f"         - {p}")

        try:
            emit(oo, org, stream, basic, records)
        except Exception as e:  # noqa: BLE001 -- a dropped record is a blind spot
            eprint(f"FATAL: cannot emit to OpenObserve stream '{stream}': {e!r}")
            return 4

        bad = [r["application"] for r in records if r["status"] != "ok"]
        eprint(
            f"reported {len(records)} Application(s) to '{stream}': "
            f"{len(records) - len(bad)} ok, {len(bad)} drifted"
            + (f" ({', '.join(bad)})" if bad else "")
        )

        # ---- SIGNAL 5: additive security drift (Factory#639) ----------------
        workloads = []
        try:
            for group, plural, kind in WORKLOAD_KINDS:
                for obj in k8s_get(f"/apis/{group}/v1/{plural}")["items"]:
                    workloads.append((kind, obj))
        except Exception as e:  # noqa: BLE001 -- cannot see == cannot report
            eprint(f"FATAL: cannot list workloads: {e!r}")
            return 3

        sec_findings, examined, no_baseline = build_security_records(workloads, now)

        # Factory#642: a check that examined nothing and reported nothing is
        # indistinguishable from a healthy fleet, and is the exact defect this
        # file exists to catch. Zero examined while workloads exist means the
        # annotation was stripped fleet-wide or RBAC was lost -- that is THIS
        # job being broken, so it exits non-zero rather than reporting all-clear.
        if workloads and examined == 0:
            eprint(
                f"FATAL: {len(workloads)} workload(s) visible but NONE had a "
                "last-applied baseline -- nothing could be compared"
            )
            return 6

        for r in sec_findings:
            eprint(f"SECDRIFT {r['workload']} [{r['status']}]")
            for p in r["problems"]:
                eprint(f"         - {p}")

        summary = {
            "_timestamp": int(now.timestamp() * 1_000_000),
            "source": "argocd-drift",
            "check": "security_drift_summary",
            "workloads_examined": examined,
            "workloads_without_baseline": len(no_baseline),
            "without_baseline": no_baseline,
            "findings": len(sec_findings),
            "drifted_workloads": [r["workload"] for r in sec_findings],
            "status": "ok" if not sec_findings else "security_field_added",
        }

        try:
            emit(oo, org, sec_stream, basic, sec_findings + [summary])
        except Exception as e:  # noqa: BLE001 -- a dropped record is a blind spot
            eprint(f"FATAL: cannot emit to OpenObserve stream '{sec_stream}': {e!r}")
            return 4

        eprint(
            f"examined {examined} workload(s) for additive security drift "
            f"({len(no_baseline)} without a declared baseline, not checked): "
            f"{len(sec_findings)} drifted"
            + (f" ({', '.join(r['workload'] for r in sec_findings)})"
               if sec_findings else "")
        )
        # Exit 0 on findings BY DESIGN, as apps/job-watchdog: a red job must mean
        # the watchdog is broken, not that a watched Application is.
        return 0


    def _selftest() -> int:
        now = datetime(2026, 7, 28, 22, 40, tzinfo=timezone.utc)
        TIP = "4774777c1e" + "0" * 30
        OLD = "ce00dd49c4" + "0" * 30

        # pkt-line parsing, including the capability NUL on the first ref line.
        def pkt(payload: bytes) -> bytes:
            return f"{len(payload) + 4:04x}".encode() + payload

        body = (
            pkt(b"# service=git-upload-pack\n")
            + b"0000"
            + pkt(b"a" * 40 + b" refs/heads/main\x00symref=HEAD:refs/heads/main\n")
            + pkt(b"b" * 40 + b" refs/heads/core-mvp-foundation\n")
            + b"0000"
        )
        refs = parse_pkt_refs(body)
        assert refs["refs/heads/main"] == "a" * 40, refs
        assert refs["refs/heads/core-mvp-foundation"] == "b" * 40, refs
        assert parse_pkt_refs(b"") == {}
        assert parse_pkt_refs(b"garbage") == {}

        def app(name, rev, sync="Synced", health="Healthy",
                reconciled="2026-07-28T22:39:00Z", target="main",
                repo="https://github.com/olafkfreund/factory-gitops",
                conditions=None):
            return {
                "metadata": {"name": name},
                "spec": {"source": {"repoURL": repo, "targetRevision": target}},
                "status": {
                    "sync": {"revision": rev, "status": sync},
                    "health": {"status": health},
                    **({"conditions": conditions} if conditions else {}),
                    **({"reconciledAt": reconciled} if reconciled else {}),
                },
            }

        # THE #425 INCIDENT, as it actually was: the tfactory app sat on the
        # previous commit and never moved until a human forced a hard refresh.
        # ArgoCD said Synced/Healthy the whole time.
        incident = assess(app("tfactory", OLD), TIP, 20 * 60, now, 600, 900)
        assert incident["status"] == "revision_behind", incident
        assert incident["revision_matches_git"] is False
        assert "Synced" in incident["problems"][0], incident

        # HONEST LIMIT, recorded so nobody assumes otherwise: the incident was
        # REPORTED 7m47s after the commit landed (22:32:31Z commit, 22:40:18Z
        # issue), and at that instant this check is deliberately still quiet.
        # The floor is physical -- reconciliation 180s + git-refs cache 180s can
        # stack to 360s of legitimate blindness -- so a tolerance below that
        # cries wolf on every normal deploy. This check catches a stall that
        # PERSISTS, which is the one nobody is standing there watching.
        # DEFAULT_DRIFT_TOLERANCE can drop once the webhook removes the poll.
        assert assess(app("tfactory", OLD), TIP, 467, now, 600, 900)["status"] == "ok"

        # THE OTHER DIRECTION: an app genuinely at the tip must stay ok, or the
        # fix has just painted everything red and taught everyone to ignore it.
        fine = assess(app("pfactory", TIP), TIP, 20 * 60, now, 600, 900)
        assert fine["status"] == "ok", fine
        assert fine["revision_matches_git"] is True
        assert fine["problems"] == []

        # A commit that landed 30 seconds ago is legitimately not deployed yet.
        fresh = assess(app("tfactory", OLD), TIP, 30, now, 600, 900)
        assert fresh["status"] == "ok", fresh

        # ...but the SAME mismatch one second past tolerance is a finding. This
        # pair is the mutation check: a tolerance that swallowed everything, or a
        # comparison stuck on True, passes one line and fails the other.
        assert assess(app("tfactory", OLD), TIP, 601, now, 600, 900)[
            "status"] == "revision_behind"

        # Unknown commit age fails CLOSED. Unverifiable must not read as fine.
        assert assess(app("tfactory", OLD), TIP, None, now, 600, 900)[
            "status"] == "revision_behind"

        # Unreachable remote: the app is not "ok", it is unverified.
        unver = assess(app("tfactory", TIP), None, None, now, 600, 900)
        assert unver["status"] == "tip_unknown", unver

        # rolehunter's live shape today: kustomize build fails, sync=Unknown.
        # Right revision, green health, and still a finding.
        rh = assess(app("rolehunter", TIP, sync="Unknown"), TIP, 8 * 60, now, 600, 900)
        assert rh["status"] == "sync_unevaluated", rh

        # ---- Factory#443: sync is a second axis, and it was unwatched -------
        #
        # THE INCIDENT, as it actually was: kyverno-policies failed every sync
        # attempt for four days and reported Healthy throughout, so nothing
        # anywhere said the live admission policy had stopped matching git.
        syncerr = [{
            "type": "SyncError",
            "lastTransitionTime": "2026-07-28T22:00:00Z",
            "message": 'Failed sync attempt to 6a92bcb: one or more objects failed to '
                       'apply, reason: admission webhook "validate-policy.kyverno.svc" '
                       'denied the request (retried 5 times).',
        }]
        failing = assess(
            app("kyverno-policies", TIP, sync="OutOfSync", conditions=syncerr),
            TIP, 8 * 60, now, 600, 900)
        assert failing["status"] == "condition_syncerror", failing
        assert failing["error_conditions"] == ["SyncError"], failing
        assert "40m" in failing["problems"][0], failing   # how long it has been failing
        assert "Healthy" in failing["problems"][0], failing

        # A type this code has never seen must still be reported, not skipped.
        assert assess(app("x", TIP, conditions=[{"type": "ComparisonError", "message": "m"}]),
                      TIP, 8 * 60, now, 600, 900)["status"] == "condition_comparisonerror"

        # ...and the OTHER direction: an informational condition is NOT an
        # error. A suffix match that had degenerated into "any condition at all"
        # would paint every app red and pass the two lines above.
        assert assess(app("x", TIP, conditions=[{"type": "SharedResourceWarning", "message": "m"}]),
                      TIP, 8 * 60, now, 600, 900)["status"] == "ok"

        # SUSTAINED OutOfSync with NO error condition -- the `kyverno` app,
        # which reports "successfully synced (all tasks run)" and stays
        # OutOfSync forever on eleven CRDs. Signal 3 sees nothing here.
        stuck = assess(app("kyverno", TIP, sync="OutOfSync"), TIP, 20 * 60, now, 600, 900)
        assert stuck["status"] == "out_of_sync", stuck
        assert stuck["error_conditions"] == [], stuck

        # ON the tip and OutOfSync stays a finding however FRESH the tip is.
        # A tip-age gate here reads as caution and is not: factory-gitops takes
        # cd commits every few minutes, so its tip is nearly always inside the
        # tolerance, and that gate silenced the real four-day-stuck `kyverno`
        # app on the first live run against this cluster.
        assert assess(app("kyverno", TIP, sync="OutOfSync"), TIP, 30, now, 600, 900)[
            "status"] == "out_of_sync"

        # THE OTHER DIRECTION, twice, because an alarm that fires on every
        # ordinary deploy is an alarm that gets muted:
        #   (a) a sync running RIGHT NOW.
        running = app("kyverno", TIP, sync="OutOfSync")
        running["status"]["operationState"] = {"phase": "Running"}
        assert assess(running, TIP, 20 * 60, now, 600, 900)["status"] == "ok"
        #   (b) an app still BEHIND a commit that landed 30 seconds ago.
        assert assess(app("tfactory", OLD, sync="OutOfSync"), TIP, 30, now, 600, 900)[
            "status"] == "ok"

        # ...and one second past tolerance the same app IS a finding. This pair
        # is the mutation check: a suppression stuck on either constant passes
        # one line and fails the other.
        assert assess(app("tfactory", OLD, sync="OutOfSync"), TIP, 601, now, 600, 900)[
            "status"] == "revision_behind"
        # Unknown tip age fails CLOSED -- unverifiable is not the same as fine.
        assert assess(app("tfactory", OLD, sync="OutOfSync"), TIP, None, now, 600, 900)[
            "status"] == "revision_behind"

        # And Synced on the tip stays quiet -- this must not have become "flag
        # every app whose sync status is not the string I expected".
        assert assess(app("kyverno", TIP), TIP, 20 * 60, now, 600, 900)["status"] == "ok"
        assert assess(app("kyverno", TIP), TIP, 30, now, 600, 900)["status"] == "ok"

        # THE QUIET-REPO CASE: revision == tip, everything green, but the
        # controller stopped looking 40 minutes ago. Signal 1 sees nothing here;
        # signal 2 is the only thing that catches a wedged controller.
        wedged = assess(
            app("aifactory", TIP, reconciled="2026-07-28T22:00:00Z"), TIP, 8 * 60, now, 600, 900)
        assert wedged["status"] == "reconcile_stale", wedged
        assert assess(app("aifactory", TIP, reconciled=None), TIP, 8 * 60, now, 600, 900)[
            "status"] == "never_reconciled"

        # No revision at all is a finding, not a silent skip.
        assert assess(app("x", ""), TIP, 8 * 60, now, 600, 900)["status"] == "no_revision"

        # An app pinned to a sha cannot drift from a branch; resolve_tip short
        # -circuits without touching the network.
        assert resolve_tip("https://example.invalid/x", "C" * 40) == "c" * 40

        # build_records must resolve each (repo, revision) ONCE, not once per app.
        calls: list = []
        real_tip, real_age = globals()["resolve_tip"], globals()["head_commit_age"]
        globals()["resolve_tip"] = lambda r, v, **k: (calls.append((r, v)), TIP)[1]
        globals()["head_commit_age"] = lambda *a, **k: 20 * 60
        try:
            recs, reachable = build_records(
                [app("a", TIP), app("b", OLD), app("c", TIP),
                 app("s", TIP, repo="https://github.com/olafkfreund/SkillAi",
                     target="core-mvp-foundation")],
                now, 600, 900, "https://api.github.com")
        finally:
            globals()["resolve_tip"], globals()["head_commit_age"] = real_tip, real_age
        assert len(calls) == 2, calls  # two distinct (repo, revision) pairs, four apps
        assert reachable == 2
        assert [r["status"] for r in recs] == [
            "ok", "revision_behind", "ok", "ok"], [r["status"] for r in recs]

        # An app ON the tip and OutOfSync needs NO commit-age lookup to be
        # judged (Factory#443) -- nothing is in flight, so the age of the last
        # commit is irrelevant and the REST call stays unspent.
        age_calls: list = []
        globals()["resolve_tip"] = lambda r, v, **k: TIP
        globals()["head_commit_age"] = lambda *a, **k: (age_calls.append(a[:2]), 30)[1]
        try:
            recs2, _ = build_records([app("kyverno", TIP, sync="OutOfSync")],
                                     now, 600, 900, "https://api.github.com")
        finally:
            globals()["resolve_tip"], globals()["head_commit_age"] = real_tip, real_age
        assert age_calls == [], age_calls
        assert recs2[0]["status"] == "out_of_sync", recs2

        # ---- Factory#639: ADDITIVE SECURITY DRIFT ---------------------------
        #
        # Every pair below is a mutation check. A check degenerated to "report
        # everything" passes the findings and fails the quiet cases; a check
        # degenerated to "always ok" passes the quiet cases and fails the
        # findings. Neither degeneration passes both halves of any pair.

        def wl(kind, live_pod, declared_pod, name="endpoint-guard", ns="factory"):
            def wrap(pod):
                if kind == "CronJob":
                    return {"spec": {"jobTemplate": {"spec": {"template": {"spec": pod}}}}}
                return {"spec": {"template": {"spec": pod}}}
            obj = wrap(live_pod)
            obj["metadata"] = {
                "name": name,
                "namespace": ns,
                "annotations": {LAST_APPLIED: json.dumps(wrap(declared_pod))},
            }
            return obj

        HARD = {"runAsNonRoot": True, "runAsUser": 65532,
                "seccompProfile": {"type": "RuntimeDefault"}}

        # THE MEASURED INCIDENT, exactly as it happened on this cluster at
        # 23:27:32 on 2026-08-07: automountServiceAccountToken added by hand to
        # the live CronJob, absent from the applied manifest, ArgoCD Synced.
        # Note this asserts CronJob's extra jobTemplate nesting works too.
        hit = assess_workload(
            "CronJob",
            wl("CronJob", {"securityContext": dict(HARD),
                           "automountServiceAccountToken": True}, {"securityContext": dict(HARD)}),
            now)
        assert hit["status"] == "security_field_added", hit
        assert hit["added_fields"] == ["automountServiceAccountToken=true"], hit
        assert "Synced" in hit["problems"][0], hit
        assert hit["workload"] == "CronJob/factory/endpoint-guard", hit

        # THE OTHER DIRECTION: live == declared must be silent, or the fix has
        # just painted the fleet red and taught everyone to ignore it.
        assert assess_workload(
            "CronJob", wl("CronJob", {"securityContext": dict(HARD)},
                          {"securityContext": dict(HARD)}), now)["status"] == "ok"

        # THE NOISE CASE THAT DECIDED THE DESIGN. Kubernetes defaults
        # `securityContext: {}` into 10 of 42 live workloads here while the
        # applied manifest has no securityContext at all. Comparing top-level
        # KEY presence reports all ten every five minutes forever; comparing
        # LEAVES reports none, because {} has no leaves. This assert is the
        # whole reason _leaves() exists.
        assert assess_workload(
            "Deployment", wl("Deployment", {"securityContext": {}}, {}), now
        )["status"] == "ok"

        # ...and the leaf walk must still catch ONE added key inside a
        # securityContext that is otherwise declared and identical. The pair
        # above and this line together forbid "ignore securityContext entirely".
        one = assess_workload(
            "Deployment",
            wl("Deployment", {"securityContext": {**HARD, "fsGroup": 1000}},
               {"securityContext": dict(HARD)}), now)
        assert one["status"] == "security_field_added", one
        assert one["added_fields"] == ["securityContext.fsGroup=1000"], one

        # Fields OUTSIDE the set stay quiet however loudly they differ.
        # `dnsPolicy` is defaulted into 42 of 42 live workloads here -- the
        # measurement that ruled out comparing everything.
        assert assess_workload(
            "Deployment",
            wl("Deployment", {"dnsPolicy": "ClusterFirst", "restartPolicy": "Always"}, {}),
            now)["status"] == "ok"

        # MODIFIED, NOT ADDED: both sides declare runAsUser and they disagree.
        # That is ArgoCD's job and it was measured reverting it in under six
        # seconds, so this check must stay quiet or it duplicates a control that
        # works. This is the line that keeps "additive only" honest.
        assert assess_workload(
            "CronJob",
            wl("CronJob", {"securityContext": {**HARD, "runAsUser": 65533}},
               {"securityContext": dict(HARD)}), now)["status"] == "ok"

        # Container-level, including capabilities.add reached by the leaf walk --
        # it needs no rule of its own, which is why there is no entry for it.
        caps = assess_workload(
            "Deployment",
            wl("Deployment",
               {"containers": [{"name": "app", "securityContext": {
                   "allowPrivilegeEscalation": False,
                   "capabilities": {"drop": ["ALL"], "add": ["NET_ADMIN"]}}}]},
               {"containers": [{"name": "app", "securityContext": {
                   "allowPrivilegeEscalation": False,
                   "capabilities": {"drop": ["ALL"]}}}]}),
            now)
        assert caps["status"] == "security_field_added", caps
        assert caps["added_fields"] == [
            'containers[app].securityContext.capabilities.add[0]="NET_ADMIN"'], caps

        # A hand-added privileged INIT container -- touches the host and exits
        # before anyone looks at it.
        init = assess_workload(
            "Deployment",
            wl("Deployment",
               {"initContainers": [{"name": "setup",
                                    "securityContext": {"privileged": True}}]},
               {"initContainers": [{"name": "setup"}]}),
            now)
        assert init["added_fields"] == [
            "initContainers[setup].securityContext.privileged=true"], init

        # The remaining set members, each the whole reason it is in the set.
        for key, val, want in (
            ("hostNetwork", True, "hostNetwork=true"),
            ("hostPID", True, "hostPID=true"),
            ("hostIPC", True, "hostIPC=true"),
        ):
            r = assess_workload("Deployment", wl("Deployment", {key: val}, {}), now)
            assert r["added_fields"] == [want], r
        pull = assess_workload(
            "Deployment",
            wl("Deployment", {"imagePullSecrets": [{"name": "rogue-registry"}]}, {}), now)
        assert pull["added_fields"] == ['imagePullSecrets[0].name="rogue-registry"'], pull

        # NO BASELINE is None, not a finding: the 10 Helm/k3s-owned workloads
        # here would otherwise be ten permanent alarms, which is how a check
        # gets muted. They are counted instead, below.
        assert assess_workload(
            "Deployment", {"metadata": {"name": "kyverno", "namespace": "kyverno"},
                           "spec": {"template": {"spec": {"hostPID": True}}}}, now) is None

        # ...but a baseline that will not PARSE is a finding, never a silent
        # skip -- unreadable is not the same as clean.
        bad_ann = {"metadata": {"name": "x", "namespace": "factory",
                                "annotations": {LAST_APPLIED: "{not json"}},
                   "spec": {"template": {"spec": {}}}}
        assert assess_workload("Deployment", bad_ann, now)["status"] == "declared_unreadable"

        # build_security_records: examined counts ONLY comparable workloads, and
        # no-baseline ones are counted separately rather than vanishing. An
        # examined count that silently included the unverifiable would be the
        # Factory#642 defect wearing a number.
        f, examined, nb = build_security_records([
            ("CronJob", wl("CronJob", {"securityContext": dict(HARD),
                                       "automountServiceAccountToken": True},
                           {"securityContext": dict(HARD)})),
            ("Deployment", wl("Deployment", {"securityContext": {}}, {}, name="observe")),
            ("Deployment", {"metadata": {"name": "keda", "namespace": "keda"},
                            "spec": {"template": {"spec": {}}}}),
        ], now)
        assert (len(f), examined, nb) == (1, 2, ["Deployment/keda/keda"]), (f, examined, nb)
        assert f[0]["workload"] == "CronJob/factory/endpoint-guard", f

        print("selftest OK")
        return 0


    if __name__ == "__main__":
        sys.exit(_selftest() if sys.argv[1:2] == ["selftest"] else main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: argocd-drift
  namespace: factory
  labels: { app: argocd-drift }
spec:
  # Every 5 minutes. The window this guards is ~360s wide by construction
  # (180s reconciliation + 180s git-refs cache), so a cadence longer than that
  # could step over a whole stall between runs. It emits to a stream, not a
  # pager: ~29 small records per run, ~8k records a day, and wakes nobody.
  #
  # Cost of the cadence, stated rather than hidden: one `ls-remote` per
  # DISTINCT (repo, branch) per run -- currently 3, not 29, because apps
  # sharing a repo share the lookup. That is ~36 unauthenticated git requests
  # an hour to github.com, against no published rate limit for the smart-HTTP
  # info/refs endpoint. The GitHub REST API is touched at most once per run and
  # only when a mismatch already exists, keeping a quiet cluster at zero REST
  # calls and well clear of the 60/hr unauthenticated limit this cluster's
  # single egress IP shares with everything else.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata: { labels: { app: argocd-drift } }
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          serviceAccountName: argocd-drift
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: drift
              # Stock python; the script is stdlib-only so no custom image and
              # nothing to rebuild when it changes.
              image: python:3.12-slim@sha256:646fb0bca3dd3ea1bcc6feb72c17ed16eed6e10cffc732fcc1478bd3e7f02d7b
              command: ["python3", "/script/drift.py"]
              env:
                - { name: OO_STREAM, value: "argocd_drift" }
                # Factory#639. A separate stream because the records have a
                # different shape (a workload, not an Application) and because
                # a quiet run writes exactly ONE row here -- the summary
                # carrying workloads_examined. Findings, when they exist, land
                # alongside it.
                - { name: OO_SECURITY_STREAM, value: "security_drift" }
                - { name: OO_ORG, value: "default" }
                # 180s. The webhook went live 2026-07-31 (Factory#506, hook
                # 659390464), which removed the ~360s of legitimate blindness
                # this used to have to tolerate: the push delivered 200 in 0.29s
                # and every app tracking this repo reported the new revision 11s
                # after the push. 180s is therefore ~16x the measured figure,
                # still generous, and no longer hides ten minutes of staleness
                # behind an `ok`. Raise it back to 600 if the hook is removed.
                - { name: DRIFT_TOLERANCE_SECONDS, value: "180" }
                # 5x the 180s reconciliation timeout: tolerant of one skipped
                # burst and a slow repo-server, intolerant of a wedged
                # controller.
                - { name: RECONCILE_TOLERANCE_SECONDS, value: "900" }
                # Same observe-root secret apps/job-watchdog already uses.
                - name: OO_USER
                  valueFrom: { secretKeyRef: { name: observe-root, key: email } }
                - name: OO_PASS
                  valueFrom: { secretKeyRef: { name: observe-root, key: password } }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 200m, memory: 128Mi }
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: argocd-drift-script
