# TriggerAuthentication for the KEDA PostgreSQL scaler (RFC-0016 #192/#220).
#
# ONE shared TriggerAuthentication for all three services. It carries the ONLY
# secret the postgres scaler needs — the password. Everything non-secret (host,
# port, userName, dbName, sslmode) lives in each ScaledObject's trigger metadata,
# in git, where it is visible and reviewable.
#
# WHY NOT a `connection` string (PFactory #265): the previous design read a libpq
# `connection` key from a per-service `factory-db-<svc>` Secret created OUT OF
# BAND. After a cluster rebuild those Secrets came back with only the
# `DATABASE_URL` key the app itself needs (the README documented that key, not
# `connection`), so `connection` resolved to EMPTY and KEDA failed every scaler
# with "error parsing postgreSQL metadata: no host given" — silently pinning all
# three services to 1 replica. Sourcing the password from `factory-secrets` (the
# canonical, always-present secret) and putting the rest in git removes the
# out-of-band prerequisite: there is no bespoke key left for a rebuild to drop.
#
# Because dbName now lives in ScaledObject metadata, the three per-service
# TriggerAuthentications collapse into this single one.
#
# TriggerAuthentication is namespace-scoped — it must live alongside the
# ScaledObjects and reads its Secret from its own namespace (here: `factory`).
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: factory-postgres
  namespace: factory
spec:
  secretTargetRef:
    - parameter: password
      name: factory-secrets
      key: POSTGRES_PASSWORD
