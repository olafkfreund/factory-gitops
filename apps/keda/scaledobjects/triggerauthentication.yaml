# TriggerAuthentications for the KEDA PostgreSQL scaler (RFC-0016 #192/#220).
#
# Topology: one Postgres DB PER SERVICE (apps/postgres). Each service's
# `job_states` lives in its own DB, so each ScaledObject must connect to ITS
# OWN database — hence one TriggerAuthentication per service rather than a single
# shared one.
#
# The KEDA postgres scaler is Go (lib/pq) and needs a LIBPQ connection string
# (`postgresql://...?sslmode=disable`), NOT the app's SQLAlchemy
# `postgresql+asyncpg://...` URL. So KEDA reads the `connection` key (libpq form)
# from the same out-of-band per-service Secret the app mounts.
#
# PREREQUISITE: per-service `factory-db-<svc>` Secrets with a `connection` key
# must exist in the `factory` namespace. Created out-of-band when Postgres is
# deployed (apps/postgres/manifests header), e.g.:
#
#   PW=$(kubectl get secret factory-secrets -n factory -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)
#   for svc in pfactory tfactory aifactory; do
#     kubectl create secret generic factory-db-$svc -n factory \
#       --from-literal=DATABASE_URL="postgresql+asyncpg://factory:$PW@postgres.factory.svc.cluster.local:5432/$svc" \
#       --from-literal=connection="postgresql://factory:$PW@postgres.factory.svc.cluster.local:5432/$svc?sslmode=disable" \
#       --dry-run=client -o yaml | kubectl apply -f -
#   done
#
# TriggerAuthentication is namespace-scoped — must live alongside the ScaledObject
# (here: `factory`).
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: factory-postgres-pfactory
  namespace: factory
spec:
  secretTargetRef:
    - parameter: connection
      name: factory-db-pfactory
      key: connection
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: factory-postgres-tfactory
  namespace: factory
spec:
  secretTargetRef:
    - parameter: connection
      name: factory-db-tfactory
      key: connection
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: factory-postgres-aifactory
  namespace: factory
spec:
  secretTargetRef:
    - parameter: connection
      name: factory-db-aifactory
      key: connection
