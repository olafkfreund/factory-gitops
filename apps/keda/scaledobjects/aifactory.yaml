# AIFactory admission-queue autoscaler (RFC-0016 #192 / RFC-0017 #681).
#
# Previously capped at min=max=1 because the rmux "Live Agent Console" kept
# pod-local panes on the RWO PVC, so a 2nd replica would split WS sessions/panes
# with no shared bus. RFC-0017 #681 puts rmux pane registration + byte fan-out
# on a shared Redis bus (REDIS_URL), so a console session on any replica reaches
# the pane regardless of which replica started the build. With durable job state
# already in Postgres (#668), AIFactory is now safe to scale >1. Cap raised to 3.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: aifactory
  namespace: factory
spec:
  scaleTargetRef:
    name: aifactory
  minReplicaCount: 1
  maxReplicaCount: 6   # raised 3->6 for the concurrency sweep (Factory#295 E1); rmux multi-replica safe via shared Redis bus
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 120
  triggers:
    - type: postgresql
      metadata:
        # Connection (PFactory #265) — FQDN, resolved from the `keda` namespace.
        host: postgres.factory.svc.cluster.local
        port: "5432"
        userName: factory
        dbName: aifactory
        sslmode: disable
        targetQueryValue: "1"
        activationTargetQueryValue: "0"
        query: >-
          SELECT count(*) FROM job_states
          WHERE service = 'aifactory' AND lifecycle_state = 'queued'
      authenticationRef:
        name: factory-postgres
