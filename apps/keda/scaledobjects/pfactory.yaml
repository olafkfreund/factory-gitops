# PFactory admission-queue autoscaler (RFC-0016 #192) — GATED, see README.
#
# Scales the PFactory control-plane Deployment on the number of plan jobs sitting
# in the durable admission queue (`job_states` rows for service=pfactory in
# lifecycle_state='queued'). PFactory has NO WebSocket fan-out, so it is safe to
# scale >1 once its state is in shared Postgres (PFactory #217). minReplicaCount
# is 1 (never scale to zero — no cold-start disruption to the API).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: pfactory
  namespace: factory
spec:
  scaleTargetRef:
    name: pfactory
  minReplicaCount: 1
  # Pinned to 1 (PFactory#755): plan sessions are still cached per process, so
  # >1 replica splits writes across pods. Raise only once #755 is fixed.
  maxReplicaCount: 1
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 120
  triggers:
    - type: postgresql
      metadata:
        # Connection (PFactory #265). FQDN, not the bare `postgres` the app pods
        # use: the KEDA operator resolves this from the `keda` namespace.
        host: postgres.factory.svc.cluster.local
        port: "5432"
        userName: factory
        dbName: pfactory
        sslmode: disable
        # ~1-2 queued plans per replica before scaling out.
        targetQueryValue: "2"
        activationTargetQueryValue: "0"
        query: >-
          SELECT count(*) FROM job_states
          WHERE service = 'pfactory' AND lifecycle_state = 'queued'
      authenticationRef:
        name: factory-postgres
