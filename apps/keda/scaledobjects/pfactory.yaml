# PFactory admission-queue autoscaler (RFC-0016 #192) — GATED, see README.
#
# Scales the PFactory control-plane Deployment on the number of plan jobs sitting
# in the durable admission queue (`job_states` rows for service=pfactory in
# lifecycle_state='queued'). Its state is in shared Postgres (PFactory #217,
# #755, #829, #905) and cross-pod events go through the Postgres relay
# (PFactory#804), so it is safe to scale >1. minReplicaCount is 1 (never scale
# to zero — no cold-start disruption to the API).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: pfactory
  namespace: factory
spec:
  scaleTargetRef:
    name: pfactory
  # TEMPORARY (#303 soak): forces a second pod so the 2-replica path sees real
  # traffic before the ceiling goes to 4. Revert on 2026-11-02 (3-day window).
  minReplicaCount: 2
  # 2 first (#273); 4 only after a week at 2 with no anomalies. Must equal
  # PFACTORY_REPLICA_COUNT in apps/pfactory/manifests/manifests.yaml.
  maxReplicaCount: 2
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 120
  triggers:
    - type: postgresql
      metadata:
        # Connection (PFactory #265). FQDN, not the bare `postgres` the app pods
        # use: the KEDA operator resolves this from the `keda` namespace.
        host: postgres.factory.svc.cluster.local
        port: "5432"
        userName: factory
        dbName: pfactory
        sslmode: disable
        # ~1-2 queued plans per replica before scaling out.
        targetQueryValue: "2"
        activationTargetQueryValue: "0"
        query: >-
          SELECT count(*) FROM job_states
          WHERE service = 'pfactory' AND lifecycle_state = 'queued'
      authenticationRef:
        name: factory-postgres
