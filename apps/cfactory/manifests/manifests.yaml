################################################################################
# CFactory backend (service: cfactory, :3111)
################################################################################
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: cfactory-data, namespace: factory, labels: { app: cfactory } }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: cfactory, namespace: factory, labels: { app: cfactory } }
spec:
  selector: { app: cfactory }
  ports: [{ name: http, port: 3111, targetPort: 3111 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cfactory, namespace: factory, labels: { app: cfactory } }
spec:
  replicas: 1
  selector: { matchLabels: { app: cfactory } }
  strategy: { type: Recreate }
  template:
    metadata: { labels: { app: cfactory } }
    spec:
      # Factory#550. No SA token in this pod. The CFactory backend has no
      # in-cluster API caller at all: the only match for "kubernetes" anywhere
      # under apps/ is an @xterm/xterm README in node_modules. It also runs under
      # the `default` SA, which has no RoleBinding in this namespace.
      #
      # Stated EXPLICITLY rather than left to the default, because the default is
      # `true` and an unset field records no decision. Factory#504's
      # chart-vs-gitops gate compares this against charts/cfactory/values.yaml
      # (which already declares false), so the two engines now agree by check
      # rather than by luck. Related: Factory#42, Factory#570.
      automountServiceAccountToken: false
      imagePullSecrets: [{ name: ghcr-pull }]
      enableServiceLinks: false
      # Factory#503. Every CronJob in this namespace has carried this set since
      # it was written; the Deployments never did, so nothing VERIFIED that the
      # control plane runs non-root. runAsUser is explicit and NUMERIC because
      # the image's `USER nonroot` is a NAME and runAsNonRoot alone cannot
      # resolve a name (AIFactory#848). Measured on the live image sha-7bf5bd6:
      # `id` -> uid=65532(nonroot) gid=1000(nonroot) — so 65532 is exactly the
      # uid this pod already runs as. NOTE the primary gid is 1000, not 65532
      # (`useradd --user-group` picked the next free gid); writes to the PVC
      # succeed via the fsGroup 65532 supplementary group, unchanged from today.
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cfactory
          image: ghcr.io/olafkfreund/cfactory:0.1.0
          imagePullPolicy: IfNotPresent
          # Factory#503. readOnlyRootFilesystem is safe HERE (unlike the agent
          # services) because every persistent write is under workspace_root
          # `~/.cfactory` — the PVC below: cfactory.db (db.py), plus
          # service-endpoints.json and copilot-settings.json (config.py). Nothing
          # else in the backend writes to disk. /tmp gets an emptyDir for
          # tempfile / FastAPI's SpooledTemporaryFile upload rollover.
          # Verified against the live image sha-7bf5bd6: read-only rootfs, uid
          # 65532, app startup complete and GET /health -> 200.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports: [{ containerPort: 3111 }]
          env:
            - { name: CFACTORY_BACKEND_PORT, value: "3111" }
            - { name: CFACTORY_AIFACTORY_API_URL, value: "http://aifactory.factory.svc.cluster.local:3101" }
            - { name: CFACTORY_PFACTORY_API_URL, value: "http://pfactory.factory.svc.cluster.local:3114" }
            - { name: CFACTORY_TFACTORY_API_URL, value: "http://tfactory.factory.svc.cluster.local:3103" }
            - { name: CFACTORY_SUBSCRIBE_UPSTREAMS, value: "true" }
            - { name: CFACTORY_LIVE_PROGRESS, value: "true" }
            # CFactory#334 / #251 part b. Without this, `oidc_actor()` returns
            # None on every request and the audit trail can never name a human:
            # measured 5,960 rows, 0 of them `user:<email>`. The IdP already
            # fronts the cockpit (oauth2-proxy-cfactory-alpha), and the ID token
            # already reaches the backend -- oauth2-proxy injects it as
            # `Authorization: Bearer <id_token>` and the frontend's nginx copies
            # that to `X-Forwarded-Id-Token`, which is the header the backend
            # reads. This value was the only missing hop.
            #
            # oidcAudience deliberately left unset: that accepts any token this
            # issuer signed, which is right for a single-realm deployment.
            #
            # Fail-safe by construction: `oidc_actor` returns None on ANY failure
            # (unreachable JWKS, bad signature, wrong issuer) and falls back to
            # the key-derived actor, so a wrong value here degrades to today's
            # behaviour rather than locking anyone out. That is also why it is
            # NOT self-verifying -- see the PR for the post-merge check.
            - { name: CFACTORY_OIDC_ISSUER, value: "https://keycloak.freundcloud.org.uk/realms/factory" }
            # RFC-0019 Phase 3: the AIFactory project a planning card is built
            # into when it is promoted to `ready`. AIFactory's
            # /api/tasks/from-issue needs a project_id and a card carries none
            # (a card is planning-level), so it is deployment config.
            # Only factory:low / factory:medium cards use it — they take the
            # skip-planning fast path. `hard` cards route through PFactory
            # first and need no project id.
            # UNSET => low/medium cards are BLOCKED with that reason rather
            # than silently accepted, so a card never sits in `ready`
            # pretending it was dispatched.
            # aifactory-demo is deliberate: the sacrificial demo repo, so a
            # mis-planned card cannot damage real work. Point it at a real
            # project when the board drives production work.
            - { name: CFACTORY_INTAKE_PROJECT_ID, value: "5d78d4b9-35f9-4445-92c1-78f3ff60a494" }
            # Shared bearer token the adapters/WS send to the sibling factories.
            # Without it every upstream fetch is 401 and the cockpit shows nothing.
            - { name: CFACTORY_UPSTREAM_TOKEN, valueFrom: { secretKeyRef: { name: factory-secrets, key: APP_API_TOKEN } } }
            # Ollama Cloud copilot key (#59). Makes the OpenAI-compatible provider
            # available + connectivity-checkable; copilot_provider stays "claude"
            # (default) until explicitly switched via CFACTORY_COPILOT_PROVIDER.
            - { name: OLLAMA_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: OLLAMA_API_KEY } } }
            - { name: CFACTORY_AUDIT_HMAC_SECRET, valueFrom: { secretKeyRef: { name: factory-secrets, key: CFACTORY_AUDIT_HMAC_SECRET } } }
            # The chain forked once at entry 2178 under the pre-CFactory#310 write
            # race. Both rows are genuine and every HMAC recomputes; relinking one
            # is the edit the chain exists to detect, so the row stays as written
            # and is declared here. Counted and shown on the Audit view, but not
            # raising the verdict. Anything NOT listed still does — a regression of
            # the append serialisation stays loud, and an acknowledgement only ever
            # forgives `forked`, so listing an id cannot hide a later edit to it.
            # Not a secret: it is an id, and the whole point is that it is reviewable.
            # Read by CFactory#312 onwards; see factory-gitops#146. Inert on older
            # images (settings carry extra="ignore"), which is what the deployed
            # sha-bd374f3 is until CFactory ships #310/#312 to main.
            - { name: CFACTORY_AUDIT_ACKNOWLEDGED_FORKS, value: "2178" }
            # RFC-0020 Phase 3 (#364): key-encryption key for the per-tenant git
            # credential store. Envelope encryption — this KEK wraps a per-record
            # data key and the credential is sealed with AES-256-GCM, so the
            # token a tenant pastes in Settings > Git integration is never at
            # rest in plaintext.
            # Format: "<key-id>:<base64 of 32 random bytes>", e.g. v1:<...>.
            # Rotate by prepending the new key: "v2:<new>,v1:<old>" — the first
            # entry seals new writes, the older ones stay only to unseal records
            # not yet re-wrapped.
            # UNSET => storing a credential is REFUSED with a clear error rather
            # than silently written in plaintext, and the board keeps serving
            # reads with status `credential_missing`.
            # LOSING IT makes every stored credential undecryptable; they must
            # be re-entered. It is backed up in agenix
            # (secrets/factory-secret-factory-secrets.age).
            - { name: CFACTORY_CREDENTIAL_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: CFACTORY_CREDENTIAL_KEY } } }
            # Bearer secret guarding the read-only MCP server at POST /mcp (#71).
            # Reuses the shared APP_API_TOKEN so the conductor authenticates with
            # the same token it uses for the other factories. Unset => /mcp open.
            - { name: CFACTORY_MCP_SECRET, valueFrom: { secretKeyRef: { name: factory-secrets, key: APP_API_TOKEN } } }
            # Token-gated API for editor/external clients (CFactory #75). Enforces a
            # scoped key on /api/* (+ /connect/*); /health, /mcp and /api/events stay
            # exempt. The browser cockpit's nginx injects this key (frontend
            # CFACTORY_API_KEY); editors connect via the cfactory-mcp host (which
            # bypasses oauth2-proxy) with the key shown on /settings/token.
            - { name: CFACTORY_API_KEYS, valueFrom: { secretKeyRef: { name: cfactory-api-keys, key: api-keys } } }
            # OpenObserve backend (apps/observe) for the cockpit Services view.
            # CFactory's Services probe hits <url>/healthz (200, no auth) to mark
            # `observe` reachable. Base URL only — additive, best-effort.
            - { name: CFACTORY_OBSERVE_API_URL, value: "http://observe.factory.svc.cluster.local:5080" }
            - { name: CFACTORY_PUBLIC_API_URL, value: "https://cfactory-mcp.freundcloud.org.uk" }
            # OpenTelemetry export -> in-cluster OpenObserve (apps/observe,
            # service `observe:5080`). Factory#516: until now `grep -c
            # OTEL_EXPORTER` across the pfactory, tfactory and cfactory
            # Deployments returned 0 — they were not misconfigured, they were
            # unconfigured, so they logged no export failure and their silence
            # read as health. A PARR run crosses PFactory -> AIFactory ->
            # TFactory; with three of four untraced a trace could never span a
            # handoff, which is the one question distributed tracing exists to
            # answer. CFactory is the cockpit that displays the result, so its
            # own read path belongs in the same trace.
            #
            # Note this is a DIFFERENT path to CFACTORY_OBSERVE_API_URL above:
            # that one is the cockpit reading OpenObserve's health for the
            # Services view, this one is CFactory writing its own spans into it.
            #
            # OpenObserve ingests OTLP/HTTP under an org-scoped base and the SDK
            # appends /v1/{traces,metrics,logs}; org = `default`.
            #
            # The credential is the SAME derived Secret AIFactory reads —
            # `otel-otlp-auth`, reconciled hourly from `observe-root` by
            # apps/observe's observe-otlp-auth-sync — not a fourth hand-copied
            # copy. That reconciler exists because the hand-maintained version
            # drifted to Bearer, which OpenObserve v0.90.3 answers with `401 Not
            # Supported`; it authenticates ingest with HTTP Basic and nothing
            # else (Factory#465).
            #
            # optional=true: the Secret is created by that CronJob, so on a fresh
            # cluster the pod must still start before the first reconcile. An
            # absent header means no auth header, which the app's own startup
            # probe reports as "NO SPANS WILL LAND" rather than claiming success.
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://observe.factory.svc.cluster.local:5080/api/default" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf" }
            - { name: OTEL_EXPORTER_OTLP_HEADERS, valueFrom: { secretKeyRef: { name: otel-otlp-auth, key: headers, optional: true } } }
          volumeMounts:
            - { name: data, mountPath: /home/nonroot/.cfactory }
            - { name: tmp,  mountPath: /tmp }
          readinessProbe: { httpGet: { path: /health, port: 3111 }, initialDelaySeconds: 5, periodSeconds: 10, failureThreshold: 6 }
          livenessProbe:  { httpGet: { path: /health, port: 3111 }, initialDelaySeconds: 20, periodSeconds: 20 }
          resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 1Gi } }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: cfactory-data } }
        - { name: tmp,  emptyDir: {} }
################################################################################
# CFactory cockpit (frontend, service: cfactory-frontend, :80 -> 8080)
# Public ingress via Cloudflare (cfactory.freundcloud.org.uk). No sidecar.
################################################################################
---
apiVersion: v1
kind: Service
metadata: { name: cfactory-frontend, namespace: factory, labels: { app: cfactory-frontend } }
spec:
  selector: { app: cfactory-frontend }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cfactory-frontend, namespace: factory, labels: { app: cfactory-frontend } }
spec:
  replicas: 1
  selector: { matchLabels: { app: cfactory-frontend } }
  template:
    metadata: { labels: { app: cfactory-frontend } }
    spec:
      # Factory#550. Static nginx serving the built cockpit bundle — it has no
      # reason to hold a Kubernetes credential, and no kubectl on PATH. Same
      # reasoning as the backend above.
      automountServiceAccountToken: false
      imagePullSecrets: [{ name: ghcr-pull }]
      enableServiceLinks: false
      # Factory#503. This pod had NO securityContext at all — not even fsGroup —
      # and it is the public cockpit. 101, not 65532: the runtime base is
      # nginxinc/nginx-unprivileged, whose user is uid 101 / gid 101 (measured:
      # `id` -> uid=101(nginx) gid=101(nginx)). Setting 65532 here would be an
      # instant CrashLoop, so the uid is the image's, not the fleet default.
      # fsGroup 101 is what makes the two emptyDirs below group-writable to that
      # uid — without it nginx cannot render its config and serves nothing.
      securityContext:
        fsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: ghcr.io/olafkfreund/cfactory-frontend:0.1.0
          imagePullPolicy: IfNotPresent
          # Factory#503. readOnlyRootFilesystem needs exactly two writable paths,
          # both found by running the live image sha-7bf5bd6 read-only:
          #   /etc/nginx/conf.d — the official entrypoint envsubsts
          #     /etc/nginx/templates/default.conf.template into it at start
          #     (that is how BACKEND_URL + CFACTORY_API_KEY get injected).
          #     Without it the entrypoint logs
          #       "ERROR: /etc/nginx/templates exists, but /etc/nginx/conf.d is
          #        not writable"
          #     and nginx comes up with NO server block: the process stays
          #     Running while the port refuses connections. Measured — this is
          #     the failure mode that looks green and is not.
          #   /tmp — nginx-unprivileged puts client_body/proxy/fastcgi temp
          #     paths there.
          # With both present: nginx starts and GET / -> 200.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports: [{ containerPort: 8080 }]
          env:
            - { name: BACKEND_URL, value: "http://cfactory.factory.svc.cluster.local:3111" }
            # Cockpit nginx injects this as `Authorization: Bearer <key>` on /api +
            # /connect so the browser cockpit keeps working once the backend
            # keystore is enforced (CFactory #75). Bare key form; same key as the
            # backend's CFACTORY_API_KEYS. Harmless no-op while the keystore is open.
            - { name: CFACTORY_API_KEY, valueFrom: { secretKeyRef: { name: cfactory-api-keys, key: api-key } } }
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
            - { name: tmp,        mountPath: /tmp }
          readinessProbe: { httpGet: { path: /, port: 8080 }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 128Mi } }
      volumes:
        - { name: nginx-conf, emptyDir: {} }
        - { name: tmp,        emptyDir: {} }
