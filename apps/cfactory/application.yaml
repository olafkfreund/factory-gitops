# CFactory — agentic control-tower cockpit over the PARR pipeline.
# Source repo: github.com/olafkfreund/CFactory
#
# Status: placeholder until CFactory grows deploy/k8s/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cfactory
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/olafkfreund/factory-gitops
    targetRevision: main
    path: apps/cfactory/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: factory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # observe-otlp-auth-sync stamps this annotation on the pod template when it
  # rewrites `otel-otlp-auth`, which is what makes the new header reach a
  # running pod at all (Factory#606). Without this, selfHeal would strip the
  # annotation straight back off and roll the Deployment a second time.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: cfactory
      jsonPointers:
        - /spec/template/metadata/annotations/otlp-auth-resourceversion
