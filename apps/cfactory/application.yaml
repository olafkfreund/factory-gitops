# CFactory — agentic control-tower cockpit over the PARR pipeline.
# Source repo: github.com/olafkfreund/CFactory
#
# Status: placeholder until CFactory grows deploy/k8s/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cfactory
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/olafkfreund/CFactory
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: factory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
