# Credential broker (Factory#292) — RBAC + refresh script + CronJob.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cred-broker
  namespace: factory
---
# Least privilege: read/patch ONLY the one Secret this broker owns.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cred-broker
  namespace: factory
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["factory-cli-creds"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cred-broker
  namespace: factory
subjects:
  - kind: ServiceAccount
    name: cred-broker
    namespace: factory
roleRef:
  kind: Role
  name: cred-broker
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cred-broker-script
  namespace: factory
data:
  refresh.py: |
    #!/usr/bin/env python3
    """Refresh the fleet's shared Claude OAuth credential in place (Factory#292).

    Reads the claude-credentials.json key of the factory-cli-creds Secret via the
    kubernetes API, performs the OAuth refresh_token grant, and patches the Secret
    with the new access + rotated refresh token. Other keys (codex/copilot/gemini)
    are untouched: the patch is a strategic merge on that one key.

    Stdlib only. Never prints a token value. Exits non-zero on any failure so a
    broken broker is visible as CronJob failures rather than silently letting the
    credential lapse.

    Every exit also states how much life the CURRENT access token has left, and
    is recorded as annotations on the Secret. Factory#437: this job failed 18
    times over three days and the diagnosis had to be reproduced by hand,
    because the pod carrying the fatal message is deleted (Factory#438) and
    because "refresh failed" alone does not say whether the fleet has minutes or
    a year of runway. It had a year, and was triaged as an outage.
    """

    import base64
    import json
    import re
    import ssl
    import sys
    import time
    import urllib.error
    import urllib.request

    # Verified live: console.anthropic.com 404s these paths; api.anthropic.com is
    # the OAuth token endpoint. Cloudflare 1010-blocks a default urllib UA, so a
    # real client UA is required.
    TOKEN_URL = "https://api.anthropic.com/v1/oauth/token"
    CLIENT_ID = "9d1c250a-e61b-44d9-88ed-5944d1962f5e"
    UA = "claude-cli/1.0.0 (external, cli)"

    NS = "factory"
    SECRET = "factory-cli-creds"
    KEY = "claude-credentials.json"
    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    ANN = "cred-broker.factory.dev"

    # A refresh token this grant can use lives ~30d. Anything claiming months of
    # access is a long-lived `claude setup-token`, which this broker cannot
    # refresh at all — worth saying out loud rather than reporting it as an
    # imminent outage.
    LONG_LIVED_DAYS = 30


    def eprint(*a):
        print(*a, file=sys.stderr, flush=True)


    def redact(s):
        # The provider has no reason to echo the token back, but a log line is
        # forever. Cheap to make that structurally impossible.
        return re.sub(r"sk-ant-[A-Za-z0-9_-]+", "sk-ant-<redacted>", s)


    def iso(ms):
        return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(ms / 1000))


    def k8s(method, path, body=None, content_type="application/json"):
        with open(f"{SA}/token") as f:
            token = f.read().strip()
        url = f"https://kubernetes.default.svc{path}"
        headers = {"authorization": f"Bearer {token}", "accept": "application/json"}
        data = None
        if body is not None:
            headers["content-type"] = content_type
            data = json.dumps(body).encode()
        req = urllib.request.Request(url, data=data, headers=headers, method=method)
        ctx = ssl.create_default_context(cafile=f"{SA}/ca.crt")
        with urllib.request.urlopen(req, timeout=30, context=ctx) as r:
            return json.load(r)


    def record(outcome, detail, expires_at_ms=None):
        """Write this run's outcome onto the Secret as annotations.

        The pod does not survive the failure (Factory#438), so stderr is not a
        durable channel. The Secret is: the broker already holds `patch` on it,
        it outlives every Job, and `kubectl get secret factory-cli-creds
        -o jsonpath='{.metadata.annotations}'` answers "what happened and how
        urgent is it" without needing a live pod.

        Best-effort — diagnostics must never mask or alter the real failure, and
        never carry token material (the outcome is a fixed code, not the body).
        """
        ann = {
            f"{ANN}/last-run": iso(time.time() * 1000),
            f"{ANN}/last-outcome": outcome,
            f"{ANN}/last-detail": detail[:120],
        }
        if expires_at_ms:
            ann[f"{ANN}/access-expires-at"] = iso(expires_at_ms)
        try:
            k8s(
                "PATCH",
                f"/api/v1/namespaces/{NS}/secrets/{SECRET}",
                {"metadata": {"annotations": ann}},
                content_type="application/merge-patch+json",
            )
        except Exception as e:  # noqa: BLE001
            eprint(f"warn: could not record outcome on the Secret: {type(e).__name__}")


    def main() -> int:
        # 1. Read the current credential out of the Secret.
        sec = k8s("GET", f"/api/v1/namespaces/{NS}/secrets/{SECRET}")
        raw = json.loads(base64.b64decode(sec["data"][KEY]).decode())
        oauth = raw.get("claudeAiOauth", raw)

        # Runway of the credential as it stands. Reported on every exit: a
        # failed refresh with a year of access left and one with an hour left
        # are the same log line today, and they are not the same incident.
        exp_ms = oauth.get("expiresAt")
        if exp_ms:
            days_left = (exp_ms / 1000 - time.time()) / 86400
            runway = f"access token valid until {iso(exp_ms)} ({days_left:.1f}d left)"
        else:
            days_left, runway = None, "access token expiry UNKNOWN (no expiresAt)"

        rt = oauth.get("refreshToken")
        if not rt:
            # A `claude setup-token` credential HAS no refresh token — there is
            # nothing to rotate, which is the whole reason to seed one. Treating
            # its absence as fatal made the correctly-seeded fleet fail every 4
            # hours forever, and the only way to silence that was to keep a
            # USABLE refresh token in the Secret — which let this job perform a
            # real refresh and rotate the year-long credential away, reporting
            # "OK: credential refreshed, access TTL 8.0h" while undoing the fix.
            # Verified by hash on 2026-08-11 (Factory#679).
            #
            # So: absent refresh token is an incident ONLY when the runway is
            # short. With months left it is the expected steady state, and the
            # same reasoning as the invalid_grant branch below applies — an
            # alarm that is always red is as useless as a gate that is always
            # green.
            if days_left is not None and days_left > LONG_LIVED_DAYS:
                eprint(
                    f"NOTE: no refreshToken, and none is needed — {days_left:.0f} days of "
                    "runway means this is a `claude setup-token` credential. Nothing to "
                    "rotate and nothing at risk."
                )
                eprint(runway)
                eprint(
                    "reporting SUCCESS. This job goes red once the runway reaches "
                    f"{LONG_LIVED_DAYS}d or less with no refresh token to renew it."
                )
                record(
                    "not-applicable:long-lived-credential",
                    f"no refreshToken, {days_left:.0f}d runway",
                    exp_ms,
                )
                return 0
            eprint(f"FATAL: no refreshToken in the Secret — needs a human re-seed. {runway}")
            record("no-refresh-token", "Secret has no refreshToken", exp_ms)
            return 2

        # 2. Refresh (rotates both tokens).
        body = json.dumps(
            {"grant_type": "refresh_token", "refresh_token": rt, "client_id": CLIENT_ID}
        ).encode()
        req = urllib.request.Request(
            TOKEN_URL,
            data=body,
            headers={
                "content-type": "application/json",
                "accept": "application/json",
                "user-agent": UA,
            },
            method="POST",
        )
        try:
            with urllib.request.urlopen(req, timeout=30) as resp:
                tok = json.load(resp)
        except urllib.error.HTTPError as e:
            detail = redact(e.read().decode(errors="replace")[:300])
            eprint(f"FATAL: refresh HTTP {e.code}: {detail}")
            eprint(runway)
            bad_grant = e.code == 400 and "invalid_grant" in detail
            if bad_grant:
                eprint(
                    "the refresh token was consumed elsewhere or expired — a human "
                    "must re-seed the Secret from a fresh `claude auth login`"
                )
                if days_left is not None and days_left > LONG_LIVED_DAYS:
                    # NOT an incident, so NOT a failure. The credential is
                    # healthy for months; this grant simply cannot rotate it,
                    # and never will. Exiting non-zero here made the CronJob
                    # fail six times a day, forever — and an alarm that is
                    # always red is exactly as useless as a gate that is always
                    # green. When the real expiry arrives, the alert that fires
                    # must not be the two-thousandth identical one.
                    #
                    # The loud path is preserved below for the case this job
                    # exists for: a refresh rejected while the runway is SHORT.
                    eprint(
                        f"NOTE: the access token still has {days_left:.0f} days left, so "
                        "this is a BROKEN ROTATION, not an imminent outage. A credential "
                        "with this much runway came from `claude setup-token`, whose "
                        "refresh token this grant cannot use — the 4h refresh cycle does "
                        "not apply to it and never will. Re-seed with `claude auth login` "
                        "(8h token + usable refresh token) or retire the broker for this "
                        "credential. See Factory#437."
                    )
                    eprint(
                        "reporting SUCCESS: nothing to rotate and nothing at risk. This "
                        "job goes red again once the runway reaches "
                        f"{LONG_LIVED_DAYS}d or less with the grant still rejected."
                    )
                    record(
                        "not-applicable:long-lived-credential",
                        f"HTTP {e.code} invalid_grant, {days_left:.0f}d runway",
                        exp_ms,
                    )
                    return 0
            code = "invalid_grant" if bad_grant else f"http_{e.code}"
            record(f"refresh-rejected:{code}", f"HTTP {e.code} {code}", exp_ms)
            return 3

        at = tok.get("access_token")
        expires_in = tok.get("expires_in")
        if not at or expires_in is None:
            eprint(f"FATAL: unexpected refresh response keys: {sorted(tok)}. {runway}")
            record("bad-refresh-response", f"keys={sorted(tok)}"[:120], exp_ms)
            return 4

        oauth["accessToken"] = at
        oauth["refreshToken"] = tok.get("refresh_token", rt)
        oauth["expiresAt"] = int(time.time() * 1000) + int(expires_in) * 1000
        raw["claudeAiOauth"] = oauth

        # 3. Patch just this key back (merge patch leaves sibling keys alone).
        payload = base64.b64encode(json.dumps(raw).encode()).decode()
        k8s(
            "PATCH",
            f"/api/v1/namespaces/{NS}/secrets/{SECRET}",
            {"data": {KEY: payload}},
            content_type="application/merge-patch+json",
        )
        ttl_h = int(expires_in) / 3600
        eprint(f"OK: credential refreshed, access TTL {ttl_h:.1f}h")
        record("ok", f"access TTL {ttl_h:.1f}h", oauth["expiresAt"])
        return 0


    if __name__ == "__main__":
        sys.exit(main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cred-broker
  namespace: factory
spec:
  # Access TTL is 8h; refresh every 4h so the token services seed is never
  # close to expiry and one missed run is harmless.
  schedule: "0 */4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  # Factory#381: this is the job whose seven-week failure went unnoticed, and the
  # window was unreconstructable because only ~9h of failed Jobs survived. At six
  # runs a day, 10 keeps not quite two days — enough for a post-mortem. The long
  # horizon is `job_health` in OpenObserve (apps/job-watchdog).
  failedJobsHistoryLimit: 10
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: cred-broker
          # MUST be Never, NOT OnFailure (Factory#438). With OnFailure the Job
          # controller deletes the pod once the backoff limit is exceeded, so
          # failedJobsHistoryLimit above retains ten Job objects containing no
          # readable logs. This job ran 10/10 failures over 37h and left zero
          # pods; the fatal message had to be reproduced by hand (Factory#437).
          # Re-running it identically with Never left an Error pod whose logs
          # read fine minutes later. This is a single short-lived stdlib python
          # process — there is nothing for an in-place container restart to save.
          #
          # Trade: backoffLimit counts pod failures rather than in-container
          # restarts, so a failing run leaves up to 3 Error pods instead of 0.
          # Ceiling is 3 x failedJobsHistoryLimit = 30 terminal pods, reaped
          # with their Jobs. They hold no resources — that visibility IS the point.
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              # Stock python; the script is stdlib-only so no custom image.
              image: python:3.12-slim@sha256:646fb0bca3dd3ea1bcc6feb72c17ed16eed6e10cffc732fcc1478bd3e7f02d7b
              command: ["python3", "/script/refresh.py"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: cred-broker-script
