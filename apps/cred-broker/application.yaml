# Credential broker — keeps the fleet's shared Claude OAuth credential fresh
# (Factory#292).
#
# The fleet (aifactory/tfactory/pfactory) seeds ~/.claude/.credentials.json from
# the factory-cli-creds Secret. Anthropic ROTATES the refresh token on every
# refresh, so when several services each refresh the same seeded credential only
# the first one stays valid — everyone else gets
# "OAuth session expired and could not be refreshed" (the #666 tail).
#
# This broker makes the Secret the single refresher: a CronJob refreshes the
# credential every 4h (access TTL is 8h) and patches the Secret in place, so the
# access token services seed is always valid and they never need to refresh —
# no rotation race. Each refresh rolls the refresh token forward, but that does
# NOT extend its life: the refresh-token lineage dies a fixed ~30 days after the
# interactive login (Factory#3687), so a `claude auth login` credential still needs
# a human re-login about monthly. The broker opens an issue 7 days before.
#
# The default credential is `claude setup-token` (~1y access, no refresh token):
# there is nothing to rotate, the broker reports not-applicable:long-lived-credential
# and stays on as the expiry reminder (docs/secrets-management.md "Re-seeding the
# Claude OAuth credential", Factory#437/#3687). `claude auth login` (8h access,
# refreshable) is the documented alternative. The broker records the outcome on
# the Secret so the diagnosis survives the pod.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cred-broker
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/olafkfreund/factory-gitops
    targetRevision: main
    path: apps/cred-broker/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: factory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
