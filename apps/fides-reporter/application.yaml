# Fides Kubernetes reporter — CronJob that snapshots the cluster's running
# workloads and reports them to the self-hosted Fides server (drift / shadow
# changes). Chart lives in the fides repo; image is built on p510 +
# k3d-imported (fides-k8s-reporter:local), matching how apps/fides runs the
# server. The fides-reporter-token Secret is created out-of-band (not in git).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fides-reporter
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/olafkfreund/fides
    targetRevision: main
    path: charts/fides-k8s-reporter
    helm:
      parameters:
        - name: image.repository
          value: ghcr.io/olafkfreund/fides-k8s-reporter
        - name: image.tag
          value: latest
        - name: image.pullPolicy
          value: Always
        - name: fides.serverUrl
          value: http://fides-server.fides.svc.cluster.local:8080
        - name: fides.environmentId
          value: 88d2eeb1-5bc4-4e05-89b0-8b4f09fbb703
        # Report ONLY the fides namespace.
        #
        # Unscoped, this snapshotted all 78 pods in the cluster — argocd,
        # gitlab, keycloak, minio, kyverno — and every third-party image
        # counted as an unregistered "shadow change". The environment reported
        # compliant:false on 1529 consecutive runs and could never report
        # anything else, which is as useless as one that is always green.
        #
        # Those images are not ours and never get Fides provenance, and the
        # allowlist is keyed by DIGEST, so allowlisting them would break on
        # every upstream image update. Scoping to what this org actually
        # builds and governs is the maintainable line.
        #
        # permissionScope stays "cluster": the chart's "namespace" scope makes
        # a Role in the RELEASE namespace (fides-reporter), which is not where
        # these workloads run. The ClusterRole reads, the CLI filters.
        - name: fides.namespace
          value: fides
        - name: cronSchedule
          value: "*/10 * * * *"
  destination:
    server: https://kubernetes.default.svc
    namespace: fides-reporter
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
