# PFactory — Plan Factory (AI planning + governance).
# Source repo: github.com/olafkfreund/PFactory
#
# Status: placeholder until PFactory grows deploy/k8s/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pfactory
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/olafkfreund/factory-gitops
    targetRevision: main
    path: apps/pfactory/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: factory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # KEDA's HPA owns spec.replicas (RFC-0016 #192). Without this, selfHeal would
  # revert the HPA's scale-out back to the manifest and fight the autoscaler.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: pfactory
      jsonPointers:
        - /spec/replicas
