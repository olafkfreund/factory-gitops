apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: pfactory-data, namespace: factory, labels: { app: pfactory } }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: pfactory, namespace: factory, labels: { app: pfactory } }
spec:
  selector: { app: pfactory }
  ports: [{ name: http, port: 3114, targetPort: 3114 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: pfactory, namespace: factory, labels: { app: pfactory } }
spec:
  # No `replicas:` — KEDA's HPA owns the replica count (RFC-0016 #192). ArgoCD
  # ignores /spec/replicas (see application.yaml ignoreDifferences) so selfHeal
  # does not fight the HPA. RollingUpdate (not Recreate) so KEDA can run >1 pod;
  # the RWO data PVC co-mounts on the single k3d node (multi-replica-safe now
  # that authoritative state is in Postgres, #220).
  selector: { matchLabels: { app: pfactory } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    metadata: { labels: { app: pfactory } }
    spec:
      # Factory#550. No SA token in this pod. PFactory has no in-cluster API
      # caller: neither `kubernetes` nor `kubernetes_asyncio` is installed in
      # ghcr.io/olafkfreund/pfactory and there is no kubectl on PATH, so the one
      # `load_incluster_config()` call in the codebase
      # (plan/enrich/adapters/kubernetes.py) cannot execute in this image. It
      # also runs under the `default` SA, which has no RoleBinding in this
      # namespace, so the token authorised nothing it could use.
      #
      # Stated EXPLICITLY rather than left to the default, because the default is
      # `true` and an unset field records no decision: the next reader cannot
      # tell "we checked and this pod needs no token" from "nobody looked".
      # Factory#504's chart-vs-gitops gate now compares this value against
      # charts/pfactory/values.yaml, so the two engines cannot drift apart again.
      # Related: Factory#42 (sandbox), Factory#570 (deploy identity blast radius).
      automountServiceAccountToken: false
      imagePullSecrets: [{ name: ghcr-pull }]
      enableServiceLinks: false
      # Factory#503. Every CronJob in this namespace has carried this set since
      # it was written; the Deployments never did, so nothing VERIFIED that the
      # control plane runs non-root — the image's `USER nonroot` was the only
      # thing holding it, and an image change that dropped it would start this
      # pod as root silently.
      # runAsUser is explicit and NUMERIC on purpose: the chainguard image's
      # `USER nonroot` is a NAME, and `runAsNonRoot: true` alone cannot resolve a
      # name — that is AIFactory#848, where every build Job died
      # CreateContainerConfigError. 65532 IS chainguard's `nonroot`, i.e. the uid
      # this pod already runs as; setting it changes nothing at runtime and makes
      # the kubelet refuse to start the pod the day the image changes.
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # The provider CLIs (claude-code/codex/gemini + antigravity) are now BAKED
        # into the image at /home/nonroot/.npm-global (#791) — the install-clis
        # init container that npm-installed them at boot hung 8+ min on a slow
        # registry and stalled the rollout. Versions pinned + Renovate-tracked in
        # the Dockerfile.
        # Seed per-CLI OAuth credential files into writable dirs (so the CLIs can refresh tokens).
        - name: seed-creds
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["sh","-c"]
          args:
            - |
              set -e
              mkdir -p /h/.claude /h/.codex /h/.gemini /h/.config/github-copilot
              cp /seed/claude-credentials.json  /h/.claude/.credentials.json
              cp /seed/codex-auth.json          /h/.codex/auth.json
              cp /seed/copilot-apps.json        /h/.config/github-copilot/apps.json
              cp /seed/gemini-oauth_creds.json  /h/.gemini/oauth_creds.json
              # `|| true` is load-bearing under the pod-level runAsUser: 65532
              # added for Factory#503. The four mount ROOTS are owned root:65532
              # (kubelet applies fsGroup), and chmod(2) requires ownership, so as
              # uid 65532 they return EPERM. Measured, not assumed:
              #   chmod: /h/.claude: Operation not permitted
              # With `set -e` that aborts the init container and the pod never
              # starts at all. Everything BELOW the roots still gets chmod'd.
              # The chmod is near-redundant now anyway — every file here is
              # created by 65532, so it is already owner-writable.
              chmod -R g+rwX /h/.claude /h/.codex /h/.gemini /h/.config || true
              echo "seeded:"; ls -la /h/.claude /h/.codex /h/.gemini
          # Writes only into the mounts above, so a read-only root fs is free.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: cc-claude, mountPath: /h/.claude }
            - { name: cc-codex,  mountPath: /h/.codex }
            - { name: cc-gemini, mountPath: /h/.gemini }
            - { name: cc-config, mountPath: /h/.config }
            - { name: cli-creds, mountPath: /seed, readOnly: true }
      containers:
        # Credential sync (Factory#292). seed-creds copies the Secret into the
        # writable ~/.claude emptyDir ONCE at pod start, so a credential the
        # cred-broker CronJob refreshes never reaches a long-running pod (the
        # pod keeps a stale/expired token until it happens to restart). The
        # cli-creds Secret VOLUME is auto-refreshed by kubelet, so this sidecar
        # just re-copies it in whenever the seed is newer than what's on disk.
        # "Newer only" matters: the agent SDK also writes this file when it
        # refreshes, and we must not clobber a fresher token with a staler one.
        - name: cred-sync
          image: python:3.12-slim@sha256:646fb0bca3dd3ea1bcc6feb72c17ed16eed6e10cffc732fcc1478bd3e7f02d7b
          command: ["python3", "-u", "-c"]
          args:
            - |
              # cred-sync (Factory#292, hardened by Factory#628). The cli-creds Secret
              # volume is refreshed by kubelet, so this re-copies the seed into the writable
              # ~/.claude emptyDir whenever the seed is genuinely newer than what is there.
              #
              # Factory#628: exp() used to collapse every read failure -- missing file,
              # malformed JSON, absent key -- to 0, and 0 is not a sentinel here, it is the
              # oldest possible timestamp. An unreadable destination therefore lost every
              # comparison, so ANY seed was copied over it, including one that had expired
              # two months earlier, announced as "adopted fresher credential (+494672.6h)".
              # 494672.6h is 56 years: it is seed_expiry_ms/3600000 with the other side at 0.
              #
              # Tested by .github/scripts/test_cred_sync.py, which also proves the three
              # vendored copies of this script are byte-identical.
              import json, os, shutil, time

              SEED = os.environ.get("CRED_SYNC_SEED", "/seed/claude-credentials.json")
              DEST = os.environ.get("CRED_SYNC_DEST", "/h/.claude/.credentials.json")
              # No real credential is 90 days fresher than the one it replaces. A delta that
              # large means one side is garbage, not that the seed is better.
              MAX_SKEW_MS = 90 * 86400000


              def exp(path):
                  """Expiry in ms, or None when unreadable / unparseable / no expiry key.

                  None means "unknown" and is deliberately not a number. Substituting a
                  timestamp for a read failure is the whole of Factory#628.
                  """
                  try:
                      with open(path) as fh:
                          value = json.load(fh).get("claudeAiOauth", {}).get("expiresAt")
                  except Exception:
                      return None
                  return None if value is None else int(value)


              def ts(ms):
                  if ms is None:
                      return "unknown"
                  return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(ms / 1000))


              def decide(seed, dest, dest_exists, now):
                  """(adopt, message). Pure, so the selftest can pin every branch."""
                  if seed is None:
                      return False, "seed unreadable, leaving dest untouched"
                  if seed <= now:
                      return False, f"seed expires {ts(seed)}, already past (now {ts(now)}), refusing to adopt"
                  if dest is None and dest_exists:
                      return False, "dest exists but is unreadable, refusing to overwrite it"
                  if dest is not None and seed - dest > MAX_SKEW_MS:
                      return False, (f"seed expires {ts(seed)}, dest expires {ts(dest)}, delta "
                                     f"{(seed - dest) / 3600000:.1f}h exceeds the sanity bound, refusing")
                  if dest is not None and seed <= dest:
                      return False, ""
                  # States what was compared, not a conclusion: this line cannot be wrong the
                  # way "adopted fresher credential" was.
                  return True, f"seed expires {ts(seed)}, dest expires {ts(dest)}, adopting seed"


              def sync(now=None):
                  now = int(time.time() * 1000) if now is None else now
                  adopt, why = decide(exp(SEED), exp(DEST), os.path.exists(DEST), now)
                  if adopt:
                      tmp = DEST + ".tmp"
                      shutil.copyfile(SEED, tmp)
                      os.chmod(tmp, 0o660)
                      os.replace(tmp, DEST)  # atomic; readers never see a partial file
                  return adopt, why


              def main():
                  last = None
                  while True:
                      try:
                          why = sync()[1]
                      except Exception as e:
                          why = f"{type(e).__name__}: {e}"
                      if why and why != last:  # a refusal recurs every 60s; say it once
                          print(f"cred-sync: {why}", flush=True)
                      last = why
                      time.sleep(60)


              if __name__ == "__main__":
                  main()
          securityContext:
            allowPrivilegeEscalation: false
            # Stdlib-only inline script; every write goes to the /h/.claude
            # emptyDir. Verified read-only + uid 65532 against python:3.12-slim.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 5m, memory: 24Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - { name: cc-claude, mountPath: /h/.claude }
            - { name: cli-creds, mountPath: /seed, readOnly: true }
        - name: pfactory
          image: ghcr.io/olafkfreund/pfactory:0.6.0
          imagePullPolicy: IfNotPresent
          # Factory#520. readOnlyRootFilesystem is now ON. #503 left it off with
          # an honest reason; this is the enumeration that reason asked for,
          # measured by running THIS image read-only rather than by reading the
          # source. Identical shape to aifactory and tfactory — see
          # apps/aifactory/manifests/manifests.yaml for the full write-path
          # table; the three images share a base and a HOME layout.
          #
          # The obvious fix stays wrong: /home/nonroot/.npm-global is ~1.1G of
          # baked provider CLIs (#791), so an emptyDir over /home/nonroot would
          # MASK them. Every volume below therefore sits BELOW /home/nonroot.
          #
          # Measured, this exact image, read-only + uid 65532 + cap-drop ALL +
          # no-new-privileges: alembic migrations ran to head,
          # "Application startup complete", uvicorn on :3114,
          # GET /api/health -> 200.
          #
          # What is NOT proven here: a full planning run. A write failure
          # mid-plan is a runtime 500, not a CrashLoop, so pod status will not
          # catch it — watch one real plan after this rolls out.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports: [{ containerPort: 3114 }]
          env:
            - { name: APP_HOST, value: "0.0.0.0" }
            - { name: APP_PORT, value: "3114" }
            # RFC-0016 #220: durable shared state in Postgres (per-service DB).
            # Replaces pod-local SQLite (~/.pfactory/data.db); makes the admission
            # cap/queue durable + multi-replica safe and creates the job_states
            # table KEDA scales on. Unset → SQLite fallback (single-pod only).
            # init_db() runs `alembic upgrade head` on boot (MIGRATIONS_AUTO_APPLY
            # defaults true), creating job_states + all tables. Out-of-band secret
            # factory-db-pfactory (see apps/postgres/manifests for the convention).
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: factory-db-pfactory, key: DATABASE_URL } } }
            # RFC-0016 #190: S3-compatible object store (in-cluster MinIO) for
            # the plan's emitted documents (plan/spec markdown + audit pack).
            # The shared client (apps/backend/runners/artifact_store.py) reads
            # these; emission is fail-open so an outage never blocks an emit.
            # Creds from the out-of-band `minio-creds` Secret.
            - { name: S3_ENDPOINT, value: "http://minio.factory.svc.cluster.local:9000" }
            - { name: S3_BUCKET, value: "factory-artifacts" }
            - { name: S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: minio-creds, key: S3_ACCESS_KEY } } }
            - { name: S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: minio-creds, key: S3_SECRET_KEY } } }
            # Shared HMAC key so PFactory's signed Task Contract verifies in
            # AIFactory's /api/tasks/from-plan (skip-planning fast path) — PARR (#517).
            - { name: AIFACTORY_TRUSTED_PLAN_KEY_PFACTORY, valueFrom: { secretKeyRef: { name: factory-secrets, key: AIFACTORY_TRUSTED_PLAN_KEY_PFACTORY } } }
            # bwrap can't run on k3d (node is a container) — disable the bash sandbox
            # so agent bash works. Real syscall sandbox via gVisor: AIFactory #363.
            - { name: AIFACTORY_BASH_SANDBOX, value: "false" }
            - { name: PATH, value: "/home/nonroot/.npm-global/bin:/home/projects/MagesticAI/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" }
            # Factory#520. What makes readOnlyRootFilesystem possible at all:
            # the claude CLI writes ~/.claude.json at the HOME ROOT, a single
            # FILE that no emptyDir can cover. This relocates it into the
            # .claude emptyDir that already exists — the same directory
            # seed-creds seeds, so credential resolution is unchanged.
            - { name: CLAUDE_CONFIG_DIR, value: "/home/nonroot/.claude" }
            - { name: PFACTORY_COMPLETION_WEBHOOK, value: "http://cfactory.factory.svc.cluster.local:3111/api/events" }
            - { name: GITHUB_TOKEN, valueFrom: { secretKeyRef: { name: factory-secrets, key: GITHUB_TOKEN } } }
            # Shared static API token for programmatic access (CFactory's adapters
            # send it as `Authorization: Bearer`). Matches aifactory so all three
            # factories accept the one shared token from factory-secrets.
            - { name: APP_API_TOKEN, valueFrom: { secretKeyRef: { name: factory-secrets, key: APP_API_TOKEN } } }
            # Federated cross-portal search (#149): read-scoped cockpit key so this
            # portal's /api/search proxy can query the cockpit's aggregated index.
            - { name: CFACTORY_READ_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: CFACTORY_READ_KEY } } }
            # OIDC SSO via Keycloak
            - { name: APP_OIDC_ENABLED, value: "true" }
            - { name: APP_OIDC_ISSUER_URL, value: "https://keycloak.freundcloud.org.uk/realms/factory" }
            - { name: APP_OIDC_CLIENT_ID, value: "pfactory" }
            - { name: APP_OIDC_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: factory-secrets, key: PFACTORY_OIDC_CLIENT_SECRET } } }
            - { name: APP_OIDC_REDIRECT_URI, value: "https://pfactory.freundcloud.org.uk/api/auth/oidc/callback" }
            # provider keys — power the claude / codex / antigravity CLIs seeded above
            - { name: OPENAI_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: OPENAI_API_KEY } } }
            - { name: GEMINI_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: GEMINI_API_KEY } } }
            # Ollama Cloud via the OpenAI-compatible provider. PFactory had no
            # OPENAI_COMPATIBLE_* config at all, so its one LLM stage (planning)
            # could not reach an Ollama model even though phase_config supports
            # the provider -- a planning-stage pin would have fallen back
            # silently rather than failing, which is the harder bug to see.
            #
            # Cloud, not the p510 daemon: loading a large model locally took the
            # host down twice on 2026-08-20. Free tier reaches 7 of the 19 models
            # listed (gpt-oss:120b, gpt-oss:20b, gemma4:31b, minimax-m3,
            # nemotron-3-nano:30b, nemotron-3-super, nemotron-3-ultra); the rest
            # answer HTTP 403. Probe with a real completion before pinning one.
            #
            # Reasoning models spend the response budget on hidden thinking, so
            # the token cap has to leave room for an actual answer: at 4096 a
            # coding-sized turn truncates to empty and reads as a bad model
            # rather than a bad cap.
            - { name: OPENAI_COMPATIBLE_BASE_URL, value: "https://ollama.com" }
            - { name: OPENAI_COMPATIBLE_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: OPENAI_COMPATIBLE_API_KEY } } }
            - { name: OPENAI_COMPATIBLE_REASONING_EFFORT, value: "low" }
            - { name: OPENAI_COMPATIBLE_MAX_TOKENS, value: "32768" }
            - { name: CONTEXT7_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: CONTEXT7_KEY } } }
            - { name: LANGCHAIN_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: LANGCHAIN_API_KEY } } }
            - { name: RAPIDAPI_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: RAPIDAPI_KEY } } }
            - { name: CLAUDE_CODE_OAUTH_TOKEN, valueFrom: { secretKeyRef: { name: factory-secrets, key: CLAUDE_CODE_OAUTH_TOKEN } } }
            # Ollama Cloud (PFactory #94) — hosted OpenAI-compatible inference at
            # https://ollama.com, reachable from the cluster (unlike host-local
            # Ollama). optional=true so the pod still starts before the key is
            # seeded into factory-secrets; base URL defaults to https://ollama.com.
            - { name: OLLAMA_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: OLLAMA_API_KEY, optional: true } } }
            # Planning-context MCP server (POST /mcp) auth. /mcp bypasses the
            # /api auth middleware, so without this it is open to the internet
            # via the ingress. Reuse the shared APP_API_TOKEN so cross-factory
            # callers (aifactory/cfactory/tfactory) authenticate with the bearer
            # they already mount; external anonymous calls get 401.
            - { name: PFACTORY_MCP_SECRET, valueFrom: { secretKeyRef: { name: factory-secrets, key: APP_API_TOKEN } } }
            # Handover/handback target — AIFactory web-server in-cluster (was the
            # localhost:3101 default). Lets PFactory's /handback-to-aifactory POST
            # corrections to the live AIFactory instead of a local one.
            - { name: PFACTORY_AIFACTORY_API_URL, value: "http://aifactory.factory.svc.cluster.local:3101" }
            # Persist plan sessions to the PVC (mounted at ~/.pfactory) so they
            # survive pod restarts/redeploys (the store was in-memory only).
            - { name: PFACTORY_PLAN_PERSIST, value: "1" }
            # Execution model for the per-task build (carried into the signed
            # contract's phase_models). Claude, not gemini: the gemini-cli QA
            # subprocess repeatedly hit its 300s timeout and escalated builds to
            # human_review, so we pin the more reliable claude-code CLI here.
            - { name: PFACTORY_EXECUTION_MODEL, value: "claude-sonnet-4-5-20250929" }
            # Knowledge enrichment: ground plans in the live Backstage catalog
            # (read-only, no auth needed for catalog reads). PFactory surfaces and
            # CITES matching catalog entities in the best-practices review lens.
            - { name: PFACTORY_ENRICH_CONNECTORS, value: "backstage,best-practices" }
            - { name: PFACTORY_BACKSTAGE_URL, value: "https://backstage.freundcloud.org.uk" }
            # OpenTelemetry export -> in-cluster OpenObserve (apps/observe,
            # service `observe:5080`). Factory#516: until now `grep -c
            # OTEL_EXPORTER` across the pfactory, tfactory and cfactory
            # Deployments returned 0 — they were not misconfigured, they were
            # unconfigured, so they logged no export failure and their silence
            # read as health. A PARR run crosses PFactory -> AIFactory ->
            # TFactory; with three of four untraced a trace could never span a
            # handoff, which is the one question distributed tracing exists to
            # answer.
            #
            # OpenObserve ingests OTLP/HTTP under an org-scoped base and the SDK
            # appends /v1/{traces,metrics,logs}; org = `default`.
            #
            # The credential is the SAME derived Secret AIFactory reads —
            # `otel-otlp-auth`, reconciled hourly from `observe-root` by
            # apps/observe's observe-otlp-auth-sync — not a fourth hand-copied
            # copy. That reconciler exists because the hand-maintained version
            # drifted to Bearer, which OpenObserve v0.90.3 answers with `401 Not
            # Supported`; it authenticates ingest with HTTP Basic and nothing
            # else (Factory#465).
            #
            # optional=true: the Secret is created by that CronJob, so on a fresh
            # cluster the pod must still start before the first reconcile. An
            # absent header means no auth header, which the app's own startup
            # probe reports as "NO SPANS WILL LAND" rather than claiming success.
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://observe.factory.svc.cluster.local:5080/api/default" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf" }
            - { name: OTEL_EXPORTER_OTLP_HEADERS, valueFrom: { secretKeyRef: { name: otel-otlp-auth, key: headers, optional: true } } }
          volumeMounts:
            - { name: data,      mountPath: /home/nonroot/.pfactory }
            - { name: cc-claude, mountPath: /home/nonroot/.claude }
            - { name: cc-codex,  mountPath: /home/nonroot/.codex }
            - { name: cc-gemini, mountPath: /home/nonroot/.gemini }
            - { name: cc-config, mountPath: /home/nonroot/.config }
            # Factory#520. All BELOW /home/nonroot on purpose, so the 1.1G of
            # baked CLIs at .npm-global stays visible.
            - { name: tmp,        mountPath: /tmp }
            - { name: home-cache, mountPath: /home/nonroot/.cache }
            - { name: home-npm,   mountPath: /home/nonroot/.npm }
            - { name: home-local, mountPath: /home/nonroot/.local }
          # Probe budgets (PFactory #265). Both probes previously inherited the
          # k8s DEFAULT timeoutSeconds: 1 — so a single sub-second stall under
          # plan load counted as a failure. Liveness (1s x 3 over 20s periods)
          # then restarted a perfectly healthy pod mid-plan, killing in-flight
          # handoffs; readiness (1s x 6) pulled the only replica out of the
          # Service, which is what returned `Connection refused` to emit callers.
          # /api/health itself is already cheap (env-var reads only, no DB/LLM)
          # and plan work already runs off the event loop via asyncio.to_thread,
          # so a slow reply means BUSY, not wedged. timeoutSeconds: 5 tolerates
          # that; liveness failureThreshold: 6 means a restart needs ~120s of
          # continuous unresponsiveness — genuinely wedged, not merely loaded.
          readinessProbe: { httpGet: { path: /api/health, port: 3114 }, initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6 }
          livenessProbe:  { httpGet: { path: /api/health, port: 3114 }, initialDelaySeconds: 30, periodSeconds: 20, timeoutSeconds: 5, failureThreshold: 6 }
          resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 2Gi } }
      volumes:
        - { name: data,      persistentVolumeClaim: { claimName: pfactory-data } }
        - { name: cc-claude, emptyDir: {} }
        - { name: cc-codex,  emptyDir: {} }
        - { name: cc-gemini, emptyDir: {} }
        - { name: cc-config, emptyDir: {} }
        - { name: cli-creds, secret: { secretName: factory-cli-creds } }
        # Factory#520 — the writable holes a read-only rootfs needs.
        - { name: tmp,        emptyDir: {} }
        - { name: home-cache, emptyDir: {} }
        - { name: home-npm,   emptyDir: {} }
        - { name: home-local, emptyDir: {} }
