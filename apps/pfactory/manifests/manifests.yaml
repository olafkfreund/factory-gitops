apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: pfactory-data, namespace: factory, labels: { app: pfactory } }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: pfactory, namespace: factory, labels: { app: pfactory } }
spec:
  selector: { app: pfactory }
  ports: [{ name: http, port: 3114, targetPort: 3114 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: pfactory, namespace: factory, labels: { app: pfactory } }
spec:
  replicas: 1
  selector: { matchLabels: { app: pfactory } }
  strategy: { type: Recreate }
  template:
    metadata: { labels: { app: pfactory } }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      enableServiceLinks: false
      securityContext: { fsGroup: 65532 }
      initContainers:
        # Always-fresh provider CLIs (upgraded on every pod start) into a shared volume.
        - name: install-clis
          image: node:22-bookworm-slim
          command: ["sh","-c"]
          args:
            - |
              set -e
              export npm_config_prefix=/clis
              npm install -g @anthropic-ai/claude-code @openai/codex @google/gemini-cli
              ln -sf /clis/bin/gemini /clis/bin/antigravity   # antigravity CLI == gemini-cli, invoked as `antigravity`
              echo "installed:"; ls -la /clis/bin
          volumeMounts:
            - { name: clis, mountPath: /clis }
        # Seed per-CLI OAuth credential files into writable dirs (so the CLIs can refresh tokens).
        - name: seed-creds
          image: busybox:1.36
          command: ["sh","-c"]
          args:
            - |
              set -e
              mkdir -p /h/.claude /h/.codex /h/.gemini /h/.config/github-copilot
              cp /seed/claude-credentials.json  /h/.claude/.credentials.json
              cp /seed/codex-auth.json          /h/.codex/auth.json
              cp /seed/copilot-apps.json        /h/.config/github-copilot/apps.json
              cp /seed/gemini-oauth_creds.json  /h/.gemini/oauth_creds.json
              chmod -R g+rwX /h/.claude /h/.codex /h/.gemini /h/.config
              echo "seeded:"; ls -la /h/.claude /h/.codex /h/.gemini
          volumeMounts:
            - { name: cc-claude, mountPath: /h/.claude }
            - { name: cc-codex,  mountPath: /h/.codex }
            - { name: cc-gemini, mountPath: /h/.gemini }
            - { name: cc-config, mountPath: /h/.config }
            - { name: cli-creds, mountPath: /seed, readOnly: true }
      containers:
        - name: pfactory
          image: ghcr.io/olafkfreund/pfactory:0.6.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3114 }]
          env:
            - { name: APP_HOST, value: "0.0.0.0" }
            - { name: APP_PORT, value: "3114" }
            # Shared HMAC key so PFactory's signed Task Contract verifies in
            # AIFactory's /api/tasks/from-plan (skip-planning fast path) — PARR (#517).
            - { name: AIFACTORY_TRUSTED_PLAN_KEY_PFACTORY, valueFrom: { secretKeyRef: { name: factory-secrets, key: AIFACTORY_TRUSTED_PLAN_KEY_PFACTORY } } }
            # bwrap can't run on k3d (node is a container) — disable the bash sandbox
            # so agent bash works. Real syscall sandbox via gVisor: AIFactory #363.
            - { name: AIFACTORY_BASH_SANDBOX, value: "false" }
            - { name: PATH, value: "/clis/bin:/home/projects/MagesticAI/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" }
            - { name: PFACTORY_COMPLETION_WEBHOOK, value: "http://cfactory.factory.svc.cluster.local:3111/api/events" }
            - { name: GITHUB_TOKEN, valueFrom: { secretKeyRef: { name: factory-secrets, key: GITHUB_TOKEN } } }
            # Shared static API token for programmatic access (CFactory's adapters
            # send it as `Authorization: Bearer`). Matches aifactory so all three
            # factories accept the one shared token from factory-secrets.
            - { name: APP_API_TOKEN, valueFrom: { secretKeyRef: { name: factory-secrets, key: APP_API_TOKEN } } }
            # OIDC SSO via Keycloak
            - { name: APP_OIDC_ENABLED, value: "true" }
            - { name: APP_OIDC_ISSUER_URL, value: "https://keycloak.freundcloud.org.uk/realms/factory" }
            - { name: APP_OIDC_CLIENT_ID, value: "pfactory" }
            - { name: APP_OIDC_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: factory-secrets, key: PFACTORY_OIDC_CLIENT_SECRET } } }
            - { name: APP_OIDC_REDIRECT_URI, value: "https://pfactory.freundcloud.org.uk/api/auth/oidc/callback" }
            # provider keys — power the claude / codex / antigravity CLIs seeded above
            - { name: OPENAI_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: OPENAI_API_KEY } } }
            - { name: GEMINI_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: GEMINI_API_KEY } } }
            - { name: CONTEXT7_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: CONTEXT7_KEY } } }
            - { name: LANGCHAIN_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: LANGCHAIN_API_KEY } } }
            - { name: RAPIDAPI_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: RAPIDAPI_KEY } } }
            - { name: CLAUDE_CODE_OAUTH_TOKEN, valueFrom: { secretKeyRef: { name: factory-secrets, key: CLAUDE_CODE_OAUTH_TOKEN } } }
            # Ollama Cloud (PFactory #94) — hosted OpenAI-compatible inference at
            # https://ollama.com, reachable from the cluster (unlike host-local
            # Ollama). optional=true so the pod still starts before the key is
            # seeded into factory-secrets; base URL defaults to https://ollama.com.
            - { name: OLLAMA_API_KEY, valueFrom: { secretKeyRef: { name: factory-secrets, key: OLLAMA_API_KEY, optional: true } } }
            # Planning-context MCP server (POST /mcp) auth. /mcp bypasses the
            # /api auth middleware, so without this it is open to the internet
            # via the ingress. Reuse the shared APP_API_TOKEN so cross-factory
            # callers (aifactory/cfactory/tfactory) authenticate with the bearer
            # they already mount; external anonymous calls get 401.
            - { name: PFACTORY_MCP_SECRET, valueFrom: { secretKeyRef: { name: factory-secrets, key: APP_API_TOKEN } } }
            # Handover/handback target — AIFactory web-server in-cluster (was the
            # localhost:3101 default). Lets PFactory's /handback-to-aifactory POST
            # corrections to the live AIFactory instead of a local one.
            - { name: PFACTORY_AIFACTORY_API_URL, value: "http://aifactory.factory.svc.cluster.local:3101" }
            # Persist plan sessions to the PVC (mounted at ~/.pfactory) so they
            # survive pod restarts/redeploys (the store was in-memory only).
            - { name: PFACTORY_PLAN_PERSIST, value: "1" }
            - { name: PFACTORY_EXECUTION_MODEL, value: "gemini-2.5-pro" }
          volumeMounts:
            - { name: data,      mountPath: /home/nonroot/.pfactory }
            - { name: clis,      mountPath: /clis }
            - { name: cc-claude, mountPath: /home/nonroot/.claude }
            - { name: cc-codex,  mountPath: /home/nonroot/.codex }
            - { name: cc-gemini, mountPath: /home/nonroot/.gemini }
            - { name: cc-config, mountPath: /home/nonroot/.config }
          readinessProbe: { httpGet: { path: /api/health, port: 3114 }, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 6 }
          livenessProbe:  { httpGet: { path: /api/health, port: 3114 }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 2Gi } }
      volumes:
        - { name: data,      persistentVolumeClaim: { claimName: pfactory-data } }
        - { name: clis,      emptyDir: {} }
        - { name: cc-claude, emptyDir: {} }
        - { name: cc-codex,  emptyDir: {} }
        - { name: cc-gemini, emptyDir: {} }
        - { name: cc-config, emptyDir: {} }
        - { name: cli-creds, secret: { secretName: factory-cli-creds } }
