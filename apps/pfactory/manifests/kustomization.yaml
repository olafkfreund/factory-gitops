apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: factory
resources:
  - manifests.yaml
# Pinned by digest after a same-tag rebuild (v0.6.7 incl. agent sandbox deps, plus restored Planning rail + plan persistence).
# IfNotPresent + reused version tags do not redeploy on content change; a
# digest forces a fresh pull. Long-term fix: sha-based CD (see PFactory #98).
images:
  - name: ghcr.io/olafkfreund/pfactory
    digest: sha256:ab2f0820ae9ba35c2339c9ca983059cfa4e7e4c149c58a75033b308b2444455f