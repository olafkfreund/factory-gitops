# CronJob health watchdog -> OpenObserve (Factory#381).
#
# THE DEFECT THIS CLOSES: cred-broker's stored credential expired 2026-06-07 and
# its 4-hourly rotation failed for ~7 weeks. Nothing noticed. It surfaced only
# because a human happened to run `kubectl get jobs`. Failed Jobs are GC'd
# (failedJobsHistoryLimit), so by the time anyone looked the evidence was gone.
#
# The existing "alert" jobs in this namespace alert by exiting non-zero. That is
# not an alert: an alert job whose alert is "the job failed", in a cluster where
# nothing watches job failures, is a no-op. This watchdog is the thing that
# actually watches, and it EMITS — a durable, queryable record per CronJob per
# run into the OpenObserve stream `job_health`.
#
# TWO SIGNALS, BECAUSE ONE IS NOT ENOUGH:
#   1. consecutive failures  — read from the Jobs the CronJob owns. Bounded by
#      failedJobsHistoryLimit: once Jobs are GC'd this signal goes blind.
#   2. STALENESS             — read from CronJob.status.lastSuccessfulTime /
#      lastScheduleTime, which live on the CronJob OBJECT and therefore SURVIVE
#      Job garbage collection entirely.
#   Signal 2 is the important one. "No news" must never read as OK — that is
#   exactly how seven weeks passed unnoticed. A CronJob whose Jobs have all been
#   GC'd, or that stopped being scheduled, or that has never once succeeded,
#   reports a problem, not silence.
#
# NO NEW DELIVERY PATH: OpenObserve (apps/observe) is already the SIEM and
# apps/audit-siem-forward already ships to it every 15 minutes and succeeds. This
# reuses that exact path and its exact credential pattern (observe-root secret,
# HTTP Basic, /api/{org}/{stream}/_json). No Prometheus, no Alertmanager — adding
# a metrics stack to fix a notification gap is the wrong trade.
#
# WHY IT EXITS 0 EVEN WHEN IT FINDS PROBLEMS: a watchdog that goes red on its
# findings is indistinguishable from a watchdog that is itself broken, and it
# would be repeating the very mistake this issue is about (using job failure as
# the alert channel). Non-zero here means ONLY "the watchdog could not do its
# job" — unreachable API server, or OpenObserve refused the record. The findings
# live in the stream.
#
# WHO WATCHES THE WATCHDOG (Factory#450): the previous answer here — "it is a
# CronJob in this namespace, so it reports on itself like any other" — was true
# only while the notification path worked, which is the one case where it is
# needed. If notify() fails permanently (token revoked, ALERT_REPO renamed,
# GitHub unreachable) then every run returns 5 before reaching the step that
# would have reported the previous run's failure, forever, and the only evidence
# is failed Jobs nobody is watching. Same shape if this CronJob is suspended or
# deleted: nothing emits, nothing notifies, and its absence is silence.
#
# A dead-man's switch cannot be built out of the thing it is watching, so the
# watchdog PUSHES A HEARTBEAT OUT instead: after a successful notify, it stamps
# a UTC timestamp into the GitHub Actions repo variable JOB_WATCHDOG_HEARTBEAT
# on ALERT_REPO. A scheduled workflow in that repo then asserts on the
# heartbeat's ABSENCE — it goes red when the stamp is missing or stale.
#
# Direction matters. The rejected alternative was GitHub Actions reaching INTO
# the cluster to read `job_health`, which needs an SSO-bypassing ingress on the
# audit log: new external attack surface, opened to close a monitoring gap.
# Pushing out needs no inbound reachability, no new credential (the same
# GITHUB_TOKEN it already uses for issues) and no new account. And it fails
# correctly for every case at once: notify broken, CronJob suspended, CronJob
# deleted, cluster down, node gone. All of them stop the stamp.
#
# THE ORDER IS THE WHOLE POINT: the stamp happens only AFTER notify() succeeds,
# never after the OpenObserve emit. Stamping after the emit would mean a
# watchdog that emits fine but cannot notify keeps its heartbeat fresh and
# reports itself healthy while telling nobody anything — which is precisely the
# defect this closes, rebuilt one layer in.
#
# A stamp that cannot be written FAILS THE RUN (exit 6). The heartbeat is part
# of the contract, not a nice-to-have: a gate that cannot run must fail. The
# stale heartbeat is the durable signal and the red Job is the immediate one.
#
# ROUTING TO A HUMAN (Factory#439): the durable record above was still
# functionally silent. The watchdog logged "postgres-backup has NEVER succeeded
# in 5.6d since creation" every 30 minutes for days, correctly, and the fleet ran
# with no database backup at all because the only reader of `job_health` is
# someone who already went looking — precisely the person who does not need it.
#
# So the watchdog now NOTIFIES, itself, directly. Two choices were on the table:
#
#   (1) an OpenObserve Alert + Destination on the `job_health` stream, or
#   (2) the watchdog posts on unhealthy.
#
# (2), for two reasons. First, a notification chain whose first link is the
# subsystem most likely to be misconfigured is a poor chain — if OpenObserve
# alerting breaks, or is never configured, it breaks silently and we are back
# here a third time. (The live cluster had ZERO destinations and ZERO alerts
# defined; option 1 was never actually armed.) Second, OpenObserve alert config
# is imperative API state that lives nowhere in git, so it would drift out of
# this GitOps repo the moment anyone touched it.
#
# THE DESTINATION IS A GITHUB ISSUE on the repo named by ALERT_REPO, because a
# real channel that already exists beats a better channel that does not. No Slack
# webhook, SMTP relay or pager endpoint exists anywhere in this fleet — the
# previous revision of this file said so and declined to invent one, which was
# right. GitHub issues need no new secret (the fleet GITHUB_TOKEN is already in
# factory-secrets), reach the maintainer by notification and email without anyone
# going looking, and are where every other fleet fault — #437, #438, #439 itself
# — is already tracked and worked. When a webhook endpoint does exist, it belongs
# alongside this, not instead of it.
#
# TWO SEVERITIES, because "this backup has NEVER worked" must not sit level with
# one transient failed run:
#   critical (never_succeeded, stale) — the job's purpose is NOT being served and
#       no success is within tolerance. Opens an issue and RE-COMMENTS every
#       ALERT_RENOTIFY_HOURS while it persists, so a long outage keeps surfacing
#       instead of sinking down the issue list.
#   warning  (failing, not_scheduled, suspended) — misbehaving, but a success is
#       still inside its tolerance window or a human suspended it on purpose.
#       Opens an issue, then stays quiet. It escalates itself to critical when
#       the last success finally ages out.
#
# AND IT SHUTS UP. A healthy CronJob produces zero GitHub traffic; an already
# reported one produces zero until it escalates or the re-notify window elapses;
# a recovered one gets a comment and its issue CLOSED. An alarm that fires every
# 30 minutes is muted within a week, which is this same bug by another route.
#
# CONTAINER KILLS (Factory#598): ATTRIBUTION, NOT DETECTION. On 2026-08-06 six
# containers across `argocd`, `factory` and `fides` were destroyed within 89
# seconds with `exitCode: 255, reason: Unknown`, and nobody could say what
# killed them. Not because the fleet lacked an alert -- because nothing in it
# reads container terminations at all. A CronJob record is about schedules and
# the ArgoCD record is about reconciliation; a Deployment whose container is
# killed and restarted produces no failed Job, no missed schedule and no drift.
#
# The defect was never "it went unnoticed". It was that the evidence which names
# the cause is DESTROYED FASTER THAN A HUMAN ARRIVES: Events age out in about an
# hour, and `lastState.terminated` is erased the moment a pod is replaced --
# rolling `fides-server` that afternoon wiped its copy before anyone looked. By
# the time #598 was filed, a restart count was the only surviving trace.
#
# So this does not just report that a container died. It NAMES THE KILLER and
# transcribes the proof into the issue while the proof still exists:
#   - the kubelet's `reason` separates the cases an exit code cannot. 255 alone
#     covers a fatal application error, a `kubectl delete`, a SIGTERM the
#     process turned into 255, an eviction and an oddly-reported OOM;
#   - `reason: Unknown` specifically means the kubelet had NO exit status --
#     the container runtime restarted underneath a running container. That is a
#     node event, and the 255 is a placeholder rather than a value anyone chose;
#   - the NODE's own conditions corroborate it. Every condition is re-stamped
#     when a kubelet re-registers, so a Ready transition 2m9s after the kill is
#     the restart that caused it. That is the difference between a hypothesis
#     and an attribution, and it is why this reads `nodes` as well as `pods`.
#
# It refuses to guess (Factory#431): a reason with no rule reports as
# `unattributed` and quotes the raw values, because a confidently wrong cause is
# worse than an admitted gap -- a reader acts on it.
#
# ONE FINDING PER CAUSE, NOT PER VICTIM. Those six kills had one cause. Six
# issues for one fault is an alarm nobody reads twice, so node-scoped causes
# (runtime_lost, evicted) group per node while container-scoped ones (an OOM is
# one container's memory limit) stay per container. Same argument that makes the
# ArgoCD record one-per-controller rather than one-per-Application.
#
# AND IT STAYS QUIET. Only terminations inside a one-hour window are reported,
# so ancient restarts on long-lived pods do not open dozens of issues on the
# first run. An ordinary non-zero exit is EMITTED to the stream but never
# notified: it is already visible as a failed Job and a CrashLoopBackOff, and an
# issue per failed build would bury the kills that have no other witness.
#
# A KILL IS AN EVENT, NOT A STATE, so it never closes as "recovered" -- nothing
# about it gets better. It closes on ABSENCE OF RECURRENCE once it has been open
# long enough for a human to meet it, and says so. The alternative considered and
# rejected was exempting these from the orphan sweep entirely: that leaves an
# issue that can open and never close, and a channel that only accumulates
# teaches people to ignore the label, which discredits every other finding here.
#
# ---------------------------------------------------------------------------
# ARGOCD STOPPED RECONCILING (Factory#443, factory-gitops#138)
# ---------------------------------------------------------------------------
#
# On 2026-08-06 `k3d-agent-0-0` went NotReady at 03:17 and stranded
# `argocd-application-controller-0` in Terminating. A single-replica StatefulSet
# does not recreate a pod stuck terminating on an unreachable node, so the
# controller was simply ABSENT and nothing in the cluster reconciled for six
# hours. Two merged PRs sat in git and never reached the cluster. ArgoCD
# reported, throughout:
#
#     $ kubectl get application pfactory -n argocd
#     pfactory   Synced   Healthy
#
# `status.sync.status` is a CACHED COMPUTATION, not a live probe. A stranded
# controller writes nothing, so nothing contradicts the old value and it reports
# `Synced` indefinitely. `status.reconciledAt` is the field that actually moves
# — it is to ArgoCD what `results[].timestamp` is to a Kyverno PolicyReport
# (Factory#444) and `gate_revision` to a readiness verdict (PFactory#450).
#
# WHY HERE AND NOT IN apps/argocd-drift, WHICH ALREADY DETECTS THIS. It does,
# correctly, and has since 2026-07-30: signal 2 of that job is exactly this
# check. It was not the detection that failed. argocd-drift EMITS to the
# OpenObserve stream `argocd_drift`, and the only reader of a stream is someone
# who already went looking — the person who does not need it. Measured over the
# nine days to 2026-08-07, `argocd_drift` holds 54,217 `ok` records and 304
# `reconcile_stale` ones, and every single one of those 304 falls inside the
# 08:00-10:00 window of the incident. The signal was right, on time, and silent.
# Factory#439 is that same defect one layer down, and this app is where it was
# fixed: this is the only thing in the fleet with a route to a human.
#
# So the DETECTION stays in argocd-drift (per Application, with the git-tip
# comparison that needs) and the ALERT lands here, on the one path that already
# notifies, dedupes, escalates, auto-closes and carries a dead-man's switch.
# Copying that ~250-line issue state machine into argocd-drift would have been a
# second thing to keep honest; this is ~40 lines that reuse it.
#
# ONE RECORD FOR THE WHOLE CONTROLLER, NOT ONE PER APPLICATION. When
# reconciliation stops it stops for everything: on 2026-08-06 all 35 Applications
# went stale together. A per-Application alert would have opened 35 GitHub issues
# for one fault, which is CFactory#306's defect (an alarm that fires routinely
# stops being an alarm) reached by volume instead of by frequency. The signal is
# therefore the FRESHEST `reconciledAt` in the cluster: if the controller is
# alive at all, something was reconciled recently. One issue, one dedup key,
# `argocd/argocd-application-controller`.
#
# THE THRESHOLD IS MEASURED, NOT GUESSED. `timeout.reconciliation` is UNSET in
# this cluster's `argocd-cm` (the ConfigMap has no `data` at all), so the
# upstream default of 180s applies. Sampled live every 25s: the freshest
# reconcile in the cluster cycles 0 -> ~180s as the controller sweeps all 35
# Applications in one burst. 900s is 5x that interval — the SAME number
# argocd-drift has used for the same field for eight days without one false
# positive across 54,217 records, and this signal takes the MINIMUM age where
# argocd-drift takes each app's own, so it fires strictly less often than a
# threshold already proven quiet.
#
# WHEN THE WHOLE NODE IS STRANDED, THIS CHECK IS BLIND — and it must be said
# out loud rather than assumed away. This is a CronJob on the cluster it
# watches. On 2026-08-06 it was stranded on the same dead node as the controller
# and argocd-drift, and none of the three ran between 03:17 and ~08:00. The
# check below therefore covers the case where the CONTROLLER alone is gone
# (OOMKilled, scaled to 0, crash-looping, its Redis unreachable) and the rest of
# the cluster is fine — a real case that nothing alerts on today, because every
# CronJob keeps passing and every Application keeps reporting Synced.
#
# The whole-cluster case is already covered, by the layer above: this watchdog
# stamps JOB_WATCHDOG_HEARTBEAT only after a successful notify, and the
# `job-watchdog-heartbeat` workflow in ALERT_REPO goes red on that stamp's
# absence. It fired correctly on 2026-08-06 — the 07:20Z run failed, and every
# run through 08:13Z, which is the only thing that did. So the new signal rides
# a path that is already proven in both halves: in-cluster for a dead
# controller, out-of-cluster for a dead cluster.
#
# ---------------------------------------------------------------------------
# BARE JOBS (Factory#603)
# ---------------------------------------------------------------------------
#
# Everything above watches CronJobs. A one-shot `Job` with no CronJob owner was
# invisible in TWO independent ways: main() read `/apis/batch/v1/jobs` only to
# attribute Jobs to an owning CronJob and discarded the rest, and job_state()
# calls an unfinished Job `active`, which evaluate() skips so an in-flight retry
# does not read as a failure. The side effect is that a Job stuck active
# FOREVER was nobody's problem.
#
# `minio-create-bucket` is the case that made this load-bearing. It is the
# ArgoCD PostSync hook that applies versioning, encryption-at-rest and ILM
# retention to `factory-artifacts`, `factory-backups` and `factory-evidence` —
# the tamper-resistance and retention halves of the compliance controls under
# Factory#310/#320. Factory#508 fixed it so it now FAILS LOUDLY. Nothing was
# reading the verdict: ArgoCD reports `apps/minio` Synced+Healthy regardless,
# because `Synced` describes the manifest and not the hook's outcome. Making a
# gate fail is half a job if nothing reads it.
#
# WHY BARE JOBS AND NOT ALL JOBS. A CronJob-owned Job that hangs is already
# caught, one layer up, by STALENESS: its CronJob's lastSuccessfulTime ages past
# tolerance and the existing `stale` finding fires. A bare Job has no such
# second signal — no schedule, no last-success timestamp, no next run. So the
# rules below are scoped to Jobs with no CronJob owner, which also avoids
# opening a second issue beside the CronJob's own for one fault.
#
# THREE GRADES, NOT ONE. A flat severity is the cry-wolf failure this app keeps
# arguing against, so:
#   job_failed  (critical) — `conditions[Failed]=True` is TERMINAL. backoffLimit
#       is exhausted or the deadline elapsed; no controller will retry it and
#       there is no next run to clear it. That is the CronJob `never_succeeded`
#       shape exactly: the work this object exists to do is not done and nothing
#       is going to do it.
#   job_stuck   (warning)  — active past JOB_STUCK_SECONDS. It may still finish;
#       a slow image pull, a big restore, a busy node. Reported once, then quiet.
#   job_wedged  (critical) — active past 4x that. It escalates ITSELF, with no
#       state to remember, because a warning that never re-notifies would let a
#       Job hang for a week behind a single quiet comment.
#
# CLOSE-ON-ABSENCE. A bare Job's record is emitted every run whether healthy or
# not, so a stuck Job that finally completes reports `ok` and its issue closes on
# the normal recovery path. A failed Job is terminal and can never report ok —
# it closes when the Job is DELETED, which is the observable form of "someone
# dealt with it" and is handled by the orphan sweep already in notify().
#
# ---------------------------------------------------------------------------
# PODS LEFT `Unknown` BY A NODE THAT CAME BACK (Factory#613)
# ---------------------------------------------------------------------------
#
# When a node is stranded and then returns, the kubelet does not re-adopt what
# it lost: on 2026-08-06 `k3d-agent-0-0` was stranded by the nightly
# nixos-upgrade, came back Ready at 14:44:07Z, and `fleet-match-29767120-98nzc`
# sat `Unknown` for over 30 hours afterwards. NO CONTROLLER OWNS THIS. Taint-
# based eviction only fires while the node is NotReady; once it is Ready again
# nothing revisits the pod.
#
# `Unknown` IS NOT THE POD PHASE, and the obvious rule would have matched
# nothing. `kubectl get pods` printed `Unknown` in the STATUS column for 30
# hours; that string is the CONTAINER's `state.terminated.reason`, which the
# column prefers over the phase. Read on the live object, the pod's
# `status.phase` is `Failed`. A check written as `phase == "Unknown"` — which is
# what both the issue and the first draft of this change said — would have
# reported a clean run while the row it was written for sat there untouched.
# That is this app's own defect rebuilt inside its fix, and it was caught only
# by running the rule against the live object instead of the description of it.
#
# The real discriminator is the attribution Factory#598 already built:
# `reason: Unknown` means the kubelet had NO exit status to report, because the
# runtime restarted underneath a running container. Nobody chose that 255. A pod
# that exited 3 of its own accord is EVIDENCE of a failure and belongs to
# whatever GC owns its history — five such `Error` pods are live in this
# namespace right now and none of them may ever be touched. So the reap predicate
# is `runtime_lost` attribution, not a phase string, and it reuses the rule that
# is already deployed and already tested rather than inventing a second one.
#
# REAPING IS THE FIX, NOT EXCLUDING IT FROM HEALTH CHECKS. Both were on the
# table and the choice matters:
#   - Excluding `Unknown` from "is this namespace healthy?" makes the check
#     green by narrowing what it looks at. The stale row is still there, the
#     owning Job still counts an active pod that will never finish, and the next
#     genuinely-Unknown pod is now excluded too. That is a waiver, not a fix.
#   - Alerting on it and stopping would be WORSE than nothing: the finding could
#     open and never close, which is precisely the cry-wolf state #613 is an
#     instance of. It would add a second permanently-red signal to fix the first.
# Deleting the pod makes the cluster's own answer true again, so every check
# that asks the ordinary question gets the ordinary answer. The condition
# closes because the condition is GONE, which is the only close worth having.
#
# A POD LOST BECAUSE ITS NODE IS GONE IS A DIFFERENT THING, and is NOT reaped.
# While the node is NotReady the pod's status is merely unknown rather than
# wrong — the container may well still be running — and deleting it would
# produce a Terminating ghost that outlives the delete. So the rule requires the
# node to be Ready AND to have been Ready for ORPHAN_REAP_AFTER_SECONDS: the
# kubelet has been back long enough to have re-adopted this pod and did not.
# That is what makes the row stale rather than unknown. A node that is still
# down is a node incident, already loud on its own terms.
#
# ROUTINE CLEANUP DOES NOT NOTIFY. A successful reap emits to the stream and
# raises nothing — same treatment `app_error` already gets, for the same reason:
# an issue per housekeeping action buries the findings that have no other
# witness. What DOES notify is a reap that did not work (`orphans_unreaped`,
# warning) — the delete was refused, or was issued and the pod is still there.
# That is a fact about this watchdog's own ability to fix what it found, and it
# must not read the same as a clean run.
#
# THE ONE WRITE VERB. This is the first thing this app is allowed to change, and
# the grant is `pods: delete` — nothing else, no `pods/eviction`, no `nodes`
# write, no `deletecollection`. It is deliberately narrow, and the predicate
# above is narrower still: a terminal pod whose EVERY termination attributes to
# `runtime_lost`, on a node that has been Ready for a quarter of an hour. A
# Running pod can never match it, and neither can a pod that reported its own
# exit status.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-watchdog
  namespace: factory
  labels: { app: job-watchdog }
---
# Read-only, and still only the two resource kinds the watchdog reads — it never
# needs to create, patch or delete anything.
#
# WHY THIS IS A ClusterRole AND NOT THE NAMESPACED Role IT USED TO BE (Factory#571).
# A namespaced Role scoped the watchdog to `factory`, which quietly meant the
# CronJobs in every OTHER namespace had no monitor at all. That is not a
# hypothetical: `fides/fides-server-updater` sat wedged for over five days
# (Factory#567) and `fides-reporter` failed repeatedly, and the watchdog reported
# neither, because it could not see them. A monitor with an invisible edge
# reports "all healthy" for the part of the cluster it is not looking at, which
# is the same false green this app exists to abolish.
#
# Least privilege is preserved where it counts: list/get only, no write verb
# anywhere, no secrets, no `pods/log`, no `pods/exec`. The scope widens; the
# power does not.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-watchdog
  labels: { app: job-watchdog }
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list"]
  # Factory#443. Read-only on Applications, for the ONE field that moves when
  # ArgoCD is alive: status.reconciledAt. Same grant apps/argocd-drift already
  # holds, and still no write verb anywhere.
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  # Factory#598. Container terminations are not a batch object, so nothing above
  # can see them: on 2026-08-06 six containers across `argocd`, `factory` and
  # `fides` died within 89 seconds with `exitCode: 255, reason: Unknown` and the
  # fleet had no component that reads `lastState.terminated` at all. `nodes` is
  # here because the exit code alone cannot tell an application fault from the
  # node's runtime being restarted underneath it — the node's own conditions can.
  # Still read-only, and deliberately NOT `pods/log`: this names what killed a
  # container, it does not read what the container said.
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # Factory#613. THE ONLY WRITE VERB THIS APP HAS, and it exists because no
  # controller owns the case: a pod left `Unknown` by a node that was stranded
  # and then came back Ready is never revisited by anything. Taint-based
  # eviction only runs while the node is NotReady, so once it recovers the stale
  # row is permanent -- `fleet-match-29767120-98nzc` sat that way for 30h+.
  #
  # Scoped as tightly as RBAC allows (`delete` on pods, not `deletecollection`,
  # not `pods/eviction`) and far more tightly than that in the code: the
  # predicate is a TERMINAL pod whose every container termination attributes to
  # `runtime_lost` -- the kubelet had no exit status, so nobody chose it -- on a
  # node that has been Ready for at least ORPHAN_REAP_AFTER_SECONDS. A Running
  # pod cannot match it, a pod that reported its own exit code cannot match it,
  # and a pod on a node that is still down is deliberately left alone.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: job-watchdog
  labels: { app: job-watchdog }
subjects:
  - kind: ServiceAccount
    name: job-watchdog
    namespace: factory
roleRef:
  kind: ClusterRole
  name: job-watchdog
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: job-watchdog-script
  namespace: factory
  labels: { app: job-watchdog }
data:
  watchdog.py: |
    #!/usr/bin/env python3
    """Report the health of every CronJob in the CLUSTER to OpenObserve (#381).

    For each CronJob it emits one record to the `job_health` stream carrying:
    consecutive failure count, age of the last SUCCESS, age of the last SCHEDULE,
    the expected period derived from the cron schedule, and a status.

    Staleness is the load-bearing signal. Consecutive-failure counting can only
    see Jobs that still exist, and failed Jobs are garbage collected — that is
    how cred-broker failed for seven weeks undetected. The last-success and
    last-schedule timestamps live on the CronJob's own status subresource, so
    they remain true long after every Job has been reaped. A CronJob with no
    surviving Jobs is therefore NOT reported healthy: it is reported stale.

    Unhealthy CronJobs are then ROUTED TO A HUMAN as a GitHub issue (#439). The
    stream alone was not a notification: it was read by nobody for days while the
    fleet ran with no database backup at all.

    It also emits ONE record on whether ArgoCD is still reconciling at all
    (#443), taken from the FRESHEST status.reconciledAt across every
    Application. `status.sync.status` cannot answer that question: it is a
    cached computation, so a controller that has stopped writing keeps reporting
    `Synced` indefinitely, which is what six hours of undeployed commits looked
    like on 2026-08-06. reconciledAt is the field that moves.

    Finally it stamps a HEARTBEAT out to a GitHub Actions repo variable, so that
    a scheduled workflow outside the cluster can go red on the watchdog's own
    silence (#450). Only after the notification succeeded — see the manifest
    header.

    Exit codes: 0 = reported (whatever the findings), 2 = no OpenObserve
    credentials, 3 = kubernetes API unreachable, 4 = OpenObserve ingest failed,
    5 = notification could not be delivered, 6 = heartbeat could not be stamped.
    A non-zero exit means THIS JOB is broken, never that a watched job is. 5 and
    6 count as much as the rest: an alert path that is not proven to deliver is
    the same bug one layer up, so neither an undelivered notification nor an
    unprovable liveness is ever a logged warning.

    Env:
      FAIL_THRESHOLD        consecutive failures before status=failing (2)
      RECONCILE_TOLERANCE_SECONDS
                            max age of the freshest ArgoCD reconciledAt (900)
      POD_TERMINATION_WINDOW_SECONDS
                            how recent a container termination must be to be
                            reported (3600). Must stay above this CronJob's own
                            period or a kill can fall between two runs.
      JOB_STUCK_SECONDS     how long a bare Job may run before it is a warning
                            (3600); 4x that and it is a critical (#603)
      ORPHAN_REAP_AFTER_SECONDS
                            how long a node must have been Ready before a pod
                            still `Unknown` on it is reaped (900) (#613)
      OBSERVE_URL           OpenObserve base url (default in-cluster service)
      OO_ORG                OpenObserve organization (default "default")
      OO_STREAM             target stream (default "job_health")
      OO_USER/OO_PASS       OpenObserve login (from the observe-root secret)
      ALERT_REPO            owner/repo to raise issues on
      ALERT_RENOTIFY_HOURS  re-comment cadence for critical (default 24)
      GITHUB_TOKEN          token with `repo` scope on ALERT_REPO
      HEARTBEAT_VAR         Actions variable to stamp on ALERT_REPO
                            (default "JOB_WATCHDOG_HEARTBEAT")
    """

    import base64
    import json
    import os
    import ssl
    import sys
    import urllib.error
    import urllib.request
    from datetime import datetime, timezone

    SA = "/var/run/secrets/kubernetes.io/serviceaccount"

    # A CronJob is judged against its OWN cadence: tolerance = 2 periods + grace.
    # Two periods means one entirely missed run is forgiven (a k3d box reboots,
    # a node is briefly gone) but two are not.
    #
    # The grace absorbs scheduler jitter, startingDeadlineSeconds and image pull,
    # and is CAPPED AT ONE PERIOD. It used to be a flat 900s, which the induced
    # failure test caught: on a 1-minute CronJob that produced a 17-MINUTE blind
    # window, and a canary with zero surviving Jobs and no recorded success ever
    # was cheerfully reported "ok" for 17 straight runs. A fixed grace is only
    # small relative to slow jobs; against fast ones it IS the blind spot this
    # whole app exists to remove.
    PERIOD_MULTIPLIER = 2
    GRACE_SECONDS = 900


    def tolerance_for(period: int) -> int:
        return PERIOD_MULTIPLIER * period + min(GRACE_SECONDS, period)

    # Escape hatch for schedules the estimator below reads wrongly (exotic cron
    # with ranges/lists). Set it on the CronJob and the estimate is ignored.
    # ponytail: none of the current five need it; it is the calibration knob for
    # the one that eventually will, because real schedules are messier than a
    # parser.
    PERIOD_ANNOTATION = "factory.dev/expected-period-seconds"

    # Which findings are CRITICAL. Both mean the same thing in different words:
    # the work this CronJob exists to do is not being done, and no success sits
    # inside its tolerance window. `never_succeeded` is the postgres-backup case
    # — there is not even a stale backup to fall back on, because there has never
    # been one. The rest (failing, not_scheduled, suspended) are warnings: a
    # success is still within tolerance and the next run may well clear it. A
    # warning that does not clear becomes critical on its own once the last
    # success ages past tolerance, so nothing has to remember to escalate it.
    # Both ArgoCD codes are critical for the same reason: while either holds, git
    # has stopped being the truth and every `Synced` in the cluster is a cached
    # opinion from before the stall. There is no "may self-recover" reading of a
    # controller that is not running.
    # The three Pod codes below are critical because each names a cause OUTSIDE
    # the container: the runtime lost it, the kernel OOM-killed it, or the
    # kubelet evicted it. None of them is something the workload chose and none
    # self-corrects. Deliberately NOT here: `signalled`, `deadline_exceeded` and
    # `unattributed`, which are warnings, and `app_error`, which never notifies
    # at all. Grading an ordinary non-zero exit critical would make every
    # transient container restart in the fleet a critical and mute the label
    # inside a week — the same cry-wolf failure this app exists to avoid, and it
    # would bury the very findings #598 is about.
    # The two bare-Job criticals (#603) say the same thing the CronJob ones do.
    # `job_failed` is TERMINAL — backoffLimit exhausted, no controller will retry
    # it, and unlike a CronJob there is no next run to clear it, which is
    # `never_succeeded` by another name. `job_wedged` is a Job that has been
    # running past four times its ceiling: a hang is the failure mode no exit
    # code will ever report. Deliberately NOT here: `job_stuck`, which is one
    # ceiling's worth of overrun and may still finish, and `orphans_unreaped`,
    # which is stale rows this watchdog could not clean up rather than a
    # workload that is down.
    CRITICAL_CODES = {"never_succeeded", "stale", "reconcile_stalled",
                      "reconcile_unreadable",
                      "runtime_lost", "oom_killed", "evicted",
                      "terminations_unreadable",
                      "job_failed", "job_wedged"}

    # Factory#443. ArgoCD's application controller re-examines every Application
    # every `timeout.reconciliation`. That key is UNSET in this cluster's
    # argocd-cm (the ConfigMap carries no `data` at all), so the upstream default
    # of 180s applies — measured, not assumed. 900s is 5x it.
    #
    # Sampled live at 25s intervals on 2026-08-07: the controller sweeps all 35
    # Applications in one burst, so the freshest reconciledAt in the cluster
    # cycles 0 -> ~180s and the oldest peaks around 340s when one app misses a
    # burst. The signal below takes the MINIMUM age, so it is quieter still.
    #
    # The strongest evidence that 900 does not cry wolf is that it is already
    # deployed: apps/argocd-drift has used exactly this number on exactly this
    # field since 2026-07-30, PER APPLICATION. Over the nine days to 2026-08-07
    # its stream holds 54,217 `ok` records and 304 `reconcile_stale`, and all 304
    # fall inside the 08:00-10:00 window of the factory-gitops#138 incident. A
    # minimum-across-apps threshold fires strictly less often than a per-app one,
    # so it inherits that quiet with room to spare.
    #
    # Raising this is safe; lowering it below ~360s is not, and would need the
    # reconciliation timeout re-measured first rather than assumed.
    DEFAULT_RECONCILE_TOLERANCE = 900
    ARGOCD_RECONCILE_INTERVAL = 180

    # The subject the ArgoCD record is filed under. It is the StatefulSet that
    # actually stopped, which is what a human needs to go and look at, and it
    # gives the finding a stable dedup key that does not depend on which
    # Application happened to be checked.
    ARGOCD_SUBJECT = ("argocd", "argocd-application-controller")

    ISSUE_LABEL = "job-watchdog"
    SEVERITY_LABELS = {"critical": "severity:critical", "warning": "severity:warning"}
    # Dedup key. In the BODY, not the title, so the title can gain and lose
    # severity wording as the finding changes without ever orphaning the issue
    # and opening a duplicate beside it.
    MARKER = "<!-- job-watchdog:{ns}/{name} -->"

    # The title is the part that actually reaches a human — it is the GitHub
    # notification and the email subject line, read in a list, often on a phone.
    # So it states the severity and the REASON, not the bare status code.
    # `status` alone is the first problem found, which for cred-broker is
    # "failing" while the thing that makes it critical is "stale"; a subject line
    # saying "failing" would understate it at exactly the moment that matters.
    TITLE_PHRASE = {
        "never_succeeded": "has never once succeeded",
        "stale": "has not succeeded within its tolerance",
        "failing": "is failing",
        "not_scheduled": "is no longer being scheduled",
        "suspended": "is suspended and will never run",
        "reconcile_stalled": "has stopped reconciling — every Synced is stale",
        "reconcile_unreadable": "cannot be read, so nothing is checking ArgoCD",
        # Factory#598. Each of these says WHAT killed the container, because
        # "exit 255" in a subject line says nothing a reader can act on.
        "runtime_lost": "lost containers to a runtime or kubelet restart, not to "
                        "anything they did",
        "oom_killed": "was OOM-killed: it exceeded its memory limit",
        "evicted": "had pods evicted under node pressure",
        "signalled": "was killed by a signal rather than exiting on its own",
        "deadline_exceeded": "was stopped mid-run by its activeDeadlineSeconds",
        "unattributed": "terminated abnormally for a reason this watchdog cannot "
                        "name, so it is recorded verbatim rather than guessed at",
        "terminations_unreadable": "cannot be read, so no container kill in this "
                                   "cluster is being attributed",
        # Factory#603. A bare Job has no schedule and no next run, so the
        # phrasing has to carry the fact that nothing is going to retry it.
        "job_failed": "FAILED and nothing will retry it — it is a one-shot Job "
                      "with no CronJob owner",
        "job_stuck": "has been running well past its expected ceiling and may "
                     "be hung",
        "job_wedged": "IS HUNG: it has been running with no end in sight and no "
                      "exit code will ever report it",
        # Factory#613.
        "orphans_unreaped": "left pods stuck `Unknown` that this watchdog could "
                            "not reap, so every namespace health check stays red",
    }

    # "last success" is the CronJob word. For the ArgoCD record the same field
    # holds the age of the last reconcile, and calling that a success in the
    # issue body would be one more sentence a reader has to translate.
    def _subject_kind(record: dict) -> str:
        return record.get("kind") or "CronJob"


    def _success_label(record: dict) -> str:
        return "last reconcile" if _subject_kind(record) == "ArgoCD" else "last success"


    def issue_title(record: dict, sev: str) -> str:
        codes = record.get("codes") or []
        worst = next((c for c in codes if c in CRITICAL_CODES), codes[0])
        return f"[{sev}] {record['cronjob']} {TITLE_PHRASE[worst]}"


    def eprint(*a):
        print(*a, file=sys.stderr, flush=True)


    def _parse_ts(raw: str) -> datetime:
        dt = datetime.fromisoformat(str(raw).replace("Z", "+00:00"))
        return dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc)


    def _dur(seconds: float) -> str:
        """Human duration. Hours-with-one-decimal alone renders short windows as
        the useless '0.1h old (> 0.1h tolerance)' — an alert a reader learns
        nothing from."""
        s = int(seconds)
        if s < 120:
            return f"{s}s"
        if s < 7200:
            return f"{s // 60}m"
        if s < 172800:
            return f"{s / 3600:.1f}h"
        return f"{s / 86400:.1f}d"


    def _ago(seconds: float | None) -> str:
        """`_dur` for a value that may legitimately be absent.

        Some subjects have no "last success" at all — a reaped-orphan record, a
        Job that has never completed — and a bare _dur(None) raises inside the
        notification path, at the exact moment a finding is being delivered.
        """
        return "never" if seconds is None else f"{_dur(seconds)} ago"


    def estimate_period_seconds(schedule: str) -> int:
        """Rough upper bound on the gap between two runs of a cron schedule.

        Deliberately coarse: it only has to be right enough to set a tolerance
        window, and it errs toward SHORTER periods (tighter tolerance, louder)
        rather than longer, because the failure mode this exists to prevent is
        silence. Unparseable => daily.
        """
        parts = str(schedule).split()
        if len(parts) != 5:
            return 24 * 3600
        minute, hour, dom, mon, dow = parts

        def step(field: str):
            if field.startswith("*/"):
                return int(field[2:])
            if field == "*":
                return 1
            return None

        if "," in minute or "-" in minute:
            return 3600  # several times an hour at worst
        ms = step(minute)
        if ms is not None:
            return ms * 60
        # Fixed minute: the hour field sets the cadence.
        if "," in hour or "-" in hour:
            return 24 * 3600
        hs = step(hour)
        if hs is not None:
            return hs * 3600
        # Fixed hour too: daily, unless a day-of-week/month field stretches it.
        if dow != "*":
            return 7 * 24 * 3600
        if dom != "*":
            return 31 * 24 * 3600
        return 24 * 3600


    def job_state(job: dict) -> str:
        """succeeded | failed | active. Unfinished Jobs count as neither."""
        st = job.get("status") or {}
        for c in st.get("conditions") or []:
            if c.get("status") != "True":
                continue
            if c.get("type") == "Failed":
                return "failed"
            if c.get("type") in ("Complete", "SuccessCriteriaMet"):
                return "succeeded"
        if st.get("active"):
            return "active"
        if st.get("succeeded"):
            return "succeeded"
        if st.get("failed"):
            return "failed"
        return "active"


    def consecutive_failures(jobs: list[dict]) -> int:
        """Failures at the head of the run history, newest first.

        Running Jobs are skipped rather than breaking the streak — a retry that
        is still in flight does not clear a run of failures. NOTE this can only
        count Jobs that still EXIST; once they are GC'd it silently returns 0,
        which is exactly why assess() does not rely on it alone.
        """
        ordered = sorted(
            jobs, key=lambda j: str(j["metadata"].get("creationTimestamp", "")), reverse=True
        )
        n = 0
        for j in ordered:
            s = job_state(j)
            if s == "active":
                continue
            if s == "succeeded":
                break
            n += 1
        return n


    def assess(cj: dict, jobs: list[dict], now: datetime, fail_threshold: int) -> dict:
        """Pure: one CronJob + the Jobs it owns -> one health record."""
        meta = cj.get("metadata") or {}
        spec = cj.get("spec") or {}
        status = cj.get("status") or {}
        name = meta.get("name", "?")
        schedule = spec.get("schedule", "")
        created = _parse_ts(meta["creationTimestamp"])

        override = (meta.get("annotations") or {}).get(PERIOD_ANNOTATION)
        period = int(override) if override else estimate_period_seconds(schedule)
        tolerance = tolerance_for(period)

        def age(field):
            raw = status.get(field)
            return None if not raw else (now - _parse_ts(raw)).total_seconds()

        success_age = age("lastSuccessfulTime")
        schedule_age = age("lastScheduleTime")
        # Never-run CronJobs are measured from creation, so a brand new one gets
        # a full tolerance window of grace and an abandoned one does not hide.
        since_created = (now - created).total_seconds()

        fails = consecutive_failures(jobs)
        problems: list[tuple[str, str]] = []

        if spec.get("suspend"):
            problems.append(("suspended", "CronJob is SUSPENDED — it will never run"))

        sched_ref = schedule_age if schedule_age is not None else since_created
        if not spec.get("suspend") and sched_ref > tolerance:
            problems.append(
                (
                    "not_scheduled",
                    f"NOT SCHEDULED for {_dur(sched_ref)} "
                    f"(> {_dur(tolerance)} tolerance) — the controller has "
                    "stopped creating Jobs for it",
                )
            )

        if fails >= fail_threshold:
            problems.append(
                ("failing", f"{fails} CONSECUTIVE FAILED runs (threshold {fail_threshold})")
            )

        if success_age is None:
            if since_created > tolerance:
                problems.append(
                    (
                        "never_succeeded",
                        f"has NEVER succeeded in {_dur(since_created)} since "
                        "creation — no recorded successful run at all",
                    )
                )
        elif success_age > tolerance:
            problems.append(
                (
                    "stale",
                    f"STALE: last success was {_dur(success_age)} ago "
                    f"(> {_dur(tolerance)} tolerance). Surviving Jobs: "
                    f"{len(jobs)} — absence of failed Jobs is NOT health, they "
                    "are garbage collected",
                )
            )

        return {
            "_timestamp": int(now.timestamp() * 1_000_000),
            "source": "job-watchdog",
            "kind": "CronJob",
            "namespace": meta.get("namespace", ""),
            "cronjob": name,
            "schedule": schedule,
            "suspended": bool(spec.get("suspend")),
            "status": problems[0][0] if problems else "ok",
            # ALL codes, not just the leading one. `status` is problems[0], and a
            # CronJob that is both not_scheduled AND stale reports status
            # "not_scheduled" — deriving severity from that alone would grade a
            # dead backup as a warning. Severity reads the whole list.
            "codes": [p[0] for p in problems],
            "problems": [p[1] for p in problems],
            "consecutive_failures": fails,
            "surviving_jobs": len(jobs),
            "last_success_age_seconds": None if success_age is None else int(success_age),
            "last_schedule_age_seconds": None if schedule_age is None else int(schedule_age),
            "expected_period_seconds": period,
            "tolerance_seconds": tolerance,
        }


    def assess_argocd(apps: list[dict], error: str | None, now: datetime,
                      tolerance: int) -> dict:
        """Pure: every ArgoCD Application -> ONE record on the controller (#443).

        THE DEFECT THIS CLOSES: on 2026-08-06 the application controller was
        stranded on a NotReady node from 03:17. It is a single-replica
        StatefulSet, and a StatefulSet does not recreate a pod stuck Terminating
        on an unreachable node, so nothing reconciled for six hours. Two merged
        PRs sat in git and never reached the cluster, while every Application
        reported `Synced Healthy` the whole time.

        WHY reconciledAt AND NOT sync.status. `status.sync.status` is a CACHED
        COMPUTATION, not a live probe. A controller that has stopped writing
        writes nothing that contradicts the old value, so `Synced` survives its
        own author indefinitely — the more thoroughly ArgoCD is broken, the more
        confidently it reports success. `status.reconciledAt` is the timestamp of
        the last LOOK, and a stopped controller cannot forge it. Same shape as
        Factory#444 (a PolicyReport's results[].timestamp, not its
        metadata.creationTimestamp) and PFactory#450 (gate_revision).

        ONE RECORD, NOT 35. Reconciliation does not stop for one Application; it
        stops for the controller. All 35 went stale together on 2026-08-06, so a
        per-Application record would have opened 35 issues for one fault, and an
        alert that arrives 35-at-a-time is one nobody reads twice. The measure is
        therefore the FRESHEST reconciledAt anywhere in the cluster: if the
        controller is running at all, something was reconciled recently. Taking
        the minimum also makes a legitimately paused or excluded single
        Application incapable of raising this, which a per-app check could not
        promise.

        FAILS CLOSED. Applications that cannot be listed at all, and a cluster
        where no Application carries a reconciledAt, are both reported as
        findings rather than skipped. "I could not check" must never leave the
        same trace as "I checked and it was fine" — that is this whole app.
        """
        ns, name = ARGOCD_SUBJECT
        ages = sorted(
            (now - _parse_ts(raw)).total_seconds()
            for raw in (
                (a.get("status") or {}).get("reconciledAt") for a in apps
            )
            if raw
        )
        freshest = ages[0] if ages else None
        problems: list[tuple[str, str]] = []

        if error is not None:
            problems.append(
                ("reconcile_unreadable",
                 f"CANNOT READ ArgoCD Applications ({error}) — so nothing is "
                 "checking whether GitOps is still running, and every `Synced` "
                 "in the cluster is now unverified")
            )
        elif freshest is None:
            problems.append(
                ("reconcile_unreadable",
                 f"{len(apps)} Application(s) and NOT ONE carries a "
                 "status.reconciledAt — the controller has never completed a "
                 "comparison, so no sync status in this cluster is evidence of "
                 "anything")
            )
        elif freshest > tolerance:
            problems.append(
                ("reconcile_stalled",
                 f"ArgoCD HAS STOPPED RECONCILING: the freshest reconciledAt "
                 f"across {len(ages)} Application(s) is {_dur(freshest)} old "
                 f"(> {_dur(tolerance)} tolerance, {_dur(ARGOCD_RECONCILE_INTERVAL)} "
                 "reconciliation interval). Every Application still reporting "
                 "Synced/Healthy is reporting a cached result from before the "
                 "stall — deploys are landing in git and nowhere else "
                 "(factory-gitops#138)")
            )

        return {
            "_timestamp": int(now.timestamp() * 1_000_000),
            "source": "job-watchdog",
            # ponytail: `cronjob` holds the subject name for an Application
            # controller too. The key is kept because it is the `job_health`
            # stream's existing schema and the issue dedup marker; `kind`
            # disambiguates. Renaming it would rewrite eight days of records and
            # orphan every open issue, to fix a word.
            "kind": "ArgoCD",
            "namespace": ns,
            "cronjob": name,
            "status": problems[0][0] if problems else "ok",
            "codes": [p[0] for p in problems],
            "problems": [p[1] for p in problems],
            "applications": len(apps),
            "last_success_age_seconds": None if freshest is None else int(freshest),
            "oldest_reconcile_age_seconds": None if not ages else int(ages[-1]),
            "expected_period_seconds": ARGOCD_RECONCILE_INTERVAL,
            "tolerance_seconds": tolerance,
        }


    # ---- CONTAINER TERMINATIONS (Factory#598) -------------------------------
    #
    # Neither of the two signals above can see a container being killed. A
    # CronJob record is about schedules and a reconcile record is about ArgoCD;
    # a running Deployment whose container is destroyed and restarted produces
    # no failed Job, no missed schedule and no sync drift. On 2026-08-06 six
    # containers across `argocd`, `factory` and `fides` died inside 89 seconds
    # with `exitCode: 255, reason: Unknown` and nothing in the fleet named a
    # cause, because nothing in the fleet reads `lastState.terminated` at all.
    #
    # ATTRIBUTION, NOT DETECTION, IS THE POINT. `exit 255` is the least
    # informative code there is: a fatal application error, a `kubectl delete`, a
    # SIGTERM the process turned into 255, an eviction and an OOM the runtime
    # reported oddly can all land on it. Reporting "a container exited 255" would
    # be a new alert that still leaves a human doing the work this exists to do.
    # What separates those cases is `reason` plus the node's own conditions, and
    # reading them is the whole of this section.
    _RUNTIME_LOST = (
        "the CONTAINER RUNTIME LOST the container: the kubelet had no exit "
        "status to report, which is what it records when containerd or the "
        "kubelet itself restarts underneath a running container. This is a "
        "NODE-LEVEL disruption, not an application exit -- the process was "
        "killed out from under the kubelet and never got to say why. The "
        "`exitCode: 255` is a placeholder for 'no status', not a value the "
        "process chose, which is exactly why it attributes nothing on its own"
    )

    # kubelet `reason` -> (code, what actually killed it). Reason first, exit
    # code only as a tiebreak: a code alone is ambiguous by construction.
    TERMINATION_REASONS = {
        "OOMKilled": (
            "oom_killed",
            "the kernel OOM-killer killed it: the container exceeded its memory "
            "limit. A limit or a leak in THIS container, not a node fault",
        ),
        "Evicted": (
            "evicted",
            "the kubelet EVICTED the pod under node pressure -- the node ran "
            "short of memory, disk or inodes and reclaimed it",
        ),
        "DeadlineExceeded": (
            "deadline_exceeded",
            "activeDeadlineSeconds elapsed and the pod was stopped mid-run",
        ),
        "Unknown": ("runtime_lost", _RUNTIME_LOST),
        "ContainerStatusUnknown": ("runtime_lost", _RUNTIME_LOST),
        "Error": (
            "app_error",
            "the process itself exited non-zero. An application fault: the "
            "container chose this exit code, nothing external killed it",
        ),
    }

    SIGNAL_EXITS = {
        137: ("signalled",
              "killed by SIGKILL (128+9) with no OOMKilled reason -- something "
              "outside the container stopped it hard"),
        143: ("signalled",
              "stopped by SIGTERM (128+15) -- a graceful stop the process "
              "turned into a non-zero exit"),
    }

    # Causes that belong to the NODE rather than to one container, and therefore
    # group into ONE finding per (node, cause). The #598 event killed six
    # containers in three namespaces from a single node-level cause; six issues
    # for one fault is an alarm nobody reads twice, which is the same argument
    # that makes the ArgoCD record one-per-controller rather than one-per-app.
    # Everything else stays per-container, because a memory limit is a property
    # of one container and merging five OOMs would hide four faults behind one.
    NODE_SCOPED = {"runtime_lost", "evicted"}

    # Which codes reach a human. `app_error` is EMITTED to the stream but never
    # notified: a container that exited non-zero of its own accord is already
    # visible as a failed Job, a CrashLoopBackOff and a red CronJob record, and
    # opening an issue for every failed build would bury the kills that nothing
    # else reports. #598 is about the terminations with no other witness.
    NOTIFY_CODES = {"runtime_lost", "oom_killed", "evicted", "signalled",
                    "deadline_exceeded", "unattributed"}

    # Only terminations this recent are reported. Long-lived pods each carry an
    # ancient restart or two; without a window the first run would open dozens of
    # issues about things that resolved days ago. Must stay comfortably above the
    # CronJob's own 30-minute period or a kill could land between two runs and be
    # seen by neither.
    POD_WINDOW_SECONDS = 3600

    # How close a node condition transition has to sit to a kill before it is
    # worth mentioning. Much tighter than the reporting window on purpose: every
    # node has SOME transition within an hour, and a correlation that always
    # fires corroborates nothing.
    NODE_CORRELATION_SECONDS = 300

    # How long a termination finding stays open once it stops recurring. See the
    # close-on-absence rule in notify(): an event does not "recover", so this is
    # the grace that lets a human meet the issue before it closes itself.
    POD_CLOSE_AFTER_HOURS = 24

    # Marks a record as a termination finding, in the dedup key itself. `/` is
    # illegal in a Kubernetes object name, so this can never collide with a
    # CronJob subject.
    KILL_PREFIX = "kill/"


    def attribute_termination(term: dict, pod_reason: str | None) -> tuple[str, str]:
        """(code, sentence) naming what killed a container.

        Returns `unattributed` rather than a guess when the kubelet's reason is
        not one there is a rule for. Factory#431: "unknown" beats a plausible
        token. A confidently wrong attribution is worse than the silence this
        change exists to remove, because a reader acts on it -- and the whole
        complaint in #598 is that a generic code was treated as an answer.
        """
        reason = str(term.get("reason") or "")
        exit_code = term.get("exitCode")
        # Eviction is recorded on the POD, not the container status, so it has to
        # be read first or it reads as an ordinary non-zero exit.
        if pod_reason == "Evicted":
            return TERMINATION_REASONS["Evicted"]
        if reason in TERMINATION_REASONS:
            code, why = TERMINATION_REASONS[reason]
            # `Error` is only the kubelet's word for "exited non-zero"; the exit
            # code is what says whether a signal did it.
            if code == "app_error" and exit_code in SIGNAL_EXITS:
                return SIGNAL_EXITS[exit_code]
            return (code, why)
        if term.get("signal"):
            return ("signalled", f"killed by signal {term['signal']}")
        if exit_code in SIGNAL_EXITS:
            return SIGNAL_EXITS[exit_code]
        return (
            "unattributed",
            f"the kubelet reported reason `{reason or 'unset'}` with exit "
            f"{exit_code}, which this watchdog has no rule for. Recorded "
            "verbatim rather than guessed at",
        )


    def node_context(node: dict | None, finished: datetime, code: str) -> list[str]:
        """What the node itself says about the moment the container died.

        This is the half that turns "the runtime lost it" into "the kubelet on
        node X re-registered 2m9s later, which is what lost it". EVERY node
        condition is re-stamped when a kubelet re-registers, so a Ready
        transition sitting right next to the kill is the node's runtime
        restarting — and that is the observation that separates a node event
        from an application one.

        The CONCLUSION is drawn only for `runtime_lost`. For an app that exited 1
        three minutes after its node came back, the same transition is context
        and probably explains why it was unhappy, but calling it the cause would
        be the confidently-wrong attribution #431 warns about.
        """
        if not node:
            return ["the node this ran on is no longer in the cluster, so its "
                    "conditions can neither corroborate nor rule anything out"]
        name = (node.get("metadata") or {}).get("name", "?")
        conds = {c.get("type"): c
                 for c in (node.get("status") or {}).get("conditions") or []}
        out = []
        ready = conds.get("Ready") or {}
        if ready.get("lastTransitionTime"):
            delta = (_parse_ts(ready["lastTransitionTime"]) - finished).total_seconds()
            if abs(delta) <= NODE_CORRELATION_SECONDS:
                out.append(
                    f"node `{name}` last re-stamped Ready={ready.get('status')} "
                    f"(reason {ready.get('reason')}) at "
                    f"{ready['lastTransitionTime']}, {_dur(abs(delta))} "
                    f"{'AFTER' if delta >= 0 else 'BEFORE'} the kill. Every node "
                    "condition is re-stamped when a kubelet re-registers, so "
                    "this is the node's kubelet going away and coming back"
                    + (" -- which is what lost the container"
                       if code == "runtime_lost" else
                       ". Context, not the cause: this container reported its "
                       "own exit status, so that did not kill it")
                )
        hot = [t for t in ("MemoryPressure", "DiskPressure", "PIDPressure")
               if (conds.get(t) or {}).get("status") == "True"]
        out.append(
            f"node `{name}` pressure as at this run: "
            + (", ".join(f"{p}=True" for p in hot) if hot else
               "no Memory/Disk/PID pressure. That rules pressure out NOW, not "
               "at the time of the kill -- node conditions carry no history, "
               "which is itself why this record has to be written when it "
               "happens rather than reconstructed afterwards")
        )
        return out


    def assess_pod_terminations(pods: list[dict], nodes: list[dict], error: str | None,
                                now: datetime,
                                window: int = POD_WINDOW_SECONDS) -> list[dict]:
        """Abnormal container terminations inside `window`, as health records.

        Reads BOTH `lastState.terminated` — the container died and is running
        again, which is the fides-db case where a restart count was the only
        surviving trace — and `state.terminated`, where it is still down. Reading
        only the first misses every one-shot pod that never came back; the #598
        sweep done by hand missed `fleet-match` for exactly that reason.

        An unreadable pod or node list is a CRITICAL finding, never a skip: a
        cluster where terminations cannot be enumerated is a cluster where the
        next #598 goes unattributed again, and that must not read as a clean run.
        """
        if error is not None:
            return [{
                "_timestamp": int(now.timestamp() * 1_000_000),
                "source": "job-watchdog", "kind": "Pod",
                "namespace": "cluster", "cronjob": f"{KILL_PREFIX}terminations",
                "schedule": "", "suspended": False,
                "status": "terminations_unreadable",
                "codes": ["terminations_unreadable"],
                "problems": [
                    f"CANNOT LIST pods or nodes: {error}. No container kill "
                    "anywhere in this cluster is being attributed while this "
                    "holds, and an unwatched kill reads exactly like no kill"
                ],
                "consecutive_failures": 0, "surviving_jobs": 0,
                "last_success_age_seconds": None, "last_schedule_age_seconds": None,
                "expected_period_seconds": window, "tolerance_seconds": window,
                "node": "", "victims": [],
            }]

        by_node = {(n.get("metadata") or {}).get("name"): n for n in nodes}
        found: dict = {}
        for p in pods:
            meta = p.get("metadata") or {}
            status = p.get("status") or {}
            node_name = (p.get("spec") or {}).get("nodeName") or ""
            statuses = ((status.get("containerStatuses") or [])
                        + (status.get("initContainerStatuses") or []))
            for cs in statuses:
                for where in ("lastState", "state"):
                    term = (cs.get(where) or {}).get("terminated") or {}
                    if not term.get("finishedAt"):
                        continue
                    # A clean exit 0 is not a kill.
                    if term.get("reason") == "Completed" and not term.get("exitCode"):
                        continue
                    finished = _parse_ts(term["finishedAt"])
                    age = (now - finished).total_seconds()
                    # The small negative bound tolerates clock skew between the
                    # kubelet that stamped it and this pod.
                    if not -60 <= age <= window:
                        continue
                    code, why = attribute_termination(term, status.get("reason"))
                    if code in NODE_SCOPED:
                        key = ("cluster",
                               f"{KILL_PREFIX}node/{node_name or 'unscheduled'}/{code}")
                    else:
                        key = (meta.get("namespace", ""),
                               f"{KILL_PREFIX}pod/{meta.get('name', '?')}"
                               f"/{cs.get('name', '?')}")
                    victim = {
                        "namespace": meta.get("namespace", ""),
                        "pod": meta.get("name", ""),
                        "container": cs.get("name", ""),
                        "node": node_name,
                        "reason": term.get("reason"),
                        "exit_code": term.get("exitCode"),
                        "signal": term.get("signal"),
                        "finished_at": term["finishedAt"],
                        "restart_count": cs.get("restartCount", 0),
                        "still_down": where == "state",
                    }
                    slot = found.setdefault(
                        key, {"code": code, "why": why, "node": node_name,
                              "victims": []})
                    # lastState and state can describe the same termination on a
                    # pod that died once and stayed down.
                    if not any(v["pod"] == victim["pod"]
                               and v["container"] == victim["container"]
                               and v["finished_at"] == victim["finished_at"]
                               for v in slot["victims"]):
                        slot["victims"].append(victim)

        records = []
        for (ns, name), slot in sorted(found.items()):
            victims = sorted(slot["victims"], key=lambda v: v["finished_at"])
            latest = _parse_ts(victims[-1]["finished_at"])
            span = (latest - _parse_ts(victims[0]["finished_at"])).total_seconds()
            problems = [
                f"{len(victims)} container(s) terminated abnormally"
                + (f" within {_dur(span)}" if len(victims) > 1 else "")
                + f", most recently {_dur((now - latest).total_seconds())} ago",
                f"WHAT KILLED THEM: {slot['why']}",
            ]
            problems += node_context(by_node.get(slot["node"]), latest, slot["code"])
            records.append({
                "_timestamp": int(now.timestamp() * 1_000_000),
                "source": "job-watchdog",
                "kind": "Pod",
                "namespace": ns,
                "cronjob": name,
                "schedule": "",
                "suspended": False,
                "status": slot["code"],
                # Only notify-worthy codes carry a code. An `app_error` record
                # still lands in the stream — it is evidence — but severity_of()
                # reads an empty list as healthy and says nothing.
                "codes": [slot["code"]] if slot["code"] in NOTIFY_CODES else [],
                "problems": problems,
                "consecutive_failures": 0,
                "surviving_jobs": 0,
                "last_success_age_seconds": None,
                "last_schedule_age_seconds": None,
                "expected_period_seconds": window,
                "tolerance_seconds": window,
                "node": slot["node"],
                "victims": victims,
            })
        return records


    def group_jobs(cronjobs: list[dict], jobs: list[dict]) -> dict:
        """uid -> Jobs owned by that CronJob (ownerReferences, not name guessing)."""
        uids = {(c.get("metadata") or {}).get("uid") for c in cronjobs}
        out: dict = {u: [] for u in uids}
        for j in jobs:
            for ref in (j.get("metadata") or {}).get("ownerReferences") or []:
                if ref.get("kind") == "CronJob" and ref.get("uid") in out:
                    out[ref["uid"]].append(j)
                    break
        return out


    # ---- BARE JOBS (Factory#603) --------------------------------------------
    #
    # How long a bare Job may run before it is worth saying something about, and
    # the multiple of that at which "may still finish" becomes "is not going to".
    # Deliberately generous: the point is to catch a HANG, not to police slow
    # work, and a threshold that fires on every long restore would be muted
    # inside a week.
    JOB_STUCK_SECONDS = 3600
    JOB_WEDGED_MULTIPLIER = 4

    # Marks a record as a bare-Job finding, in the dedup key. Same trick as
    # KILL_PREFIX: `/` is illegal in a Kubernetes object name, so a Job and a
    # same-named CronJob in the same namespace can never share an issue.
    JOB_PREFIX = "job/"

    # ---- ORPHANED PODS (Factory#613) ----------------------------------------
    #
    # How long a node must have been Ready before a pod still `Unknown` on it
    # counts as a stale row rather than an unknown one. The kubelet re-adopts
    # what it can within seconds of re-registering; a quarter of an hour later it
    # is not going to. Below this the pod is left alone -- see the header: a pod
    # whose node is gone is not the same thing as a stale row, and deleting it
    # only produces a Terminating ghost.
    ORPHAN_REAP_AFTER_SECONDS = 900
    ORPHAN_PREFIX = "orphan/"


    def assess_bare_jobs(jobs: list[dict], now: datetime,
                         stuck_after: int = JOB_STUCK_SECONDS) -> list[dict]:
        """Pure. Every Job with no CronJob owner -> one health record each.

        THE DEFECT THIS CLOSES: main() read the Job list only to attribute Jobs
        to an owning CronJob and threw the rest away, and job_state() calls an
        unfinished Job `active`, which the failure counter skips on purpose so an
        in-flight retry does not read as a failure. Between them, a one-shot Job
        that failed -- or that hung forever -- was seen by nothing.

        SCOPED TO BARE JOBS. A CronJob-owned Job that hangs already surfaces one
        layer up, as its CronJob's last success ages past tolerance. A bare Job
        has no schedule, no last-success timestamp and no next run, so it has no
        second signal at all. Reporting CronJob-owned Jobs here too would also
        open a second issue beside the CronJob's own for a single fault.
        """
        out = []
        for j in sorted(jobs, key=lambda j: ((j.get("metadata") or {}).get("namespace", ""),
                                             (j.get("metadata") or {}).get("name", ""))):
            meta = j.get("metadata") or {}
            if any(r.get("kind") == "CronJob"
                   for r in meta.get("ownerReferences") or []):
                continue
            st = j.get("status") or {}
            state = job_state(j)
            started = st.get("startTime") or meta.get("creationTimestamp")
            running_for = (now - _parse_ts(started)).total_seconds() if started else 0.0
            done = st.get("completionTime")
            success_age = None if not done else (now - _parse_ts(done)).total_seconds()
            wedged_after = stuck_after * JOB_WEDGED_MULTIPLIER

            problems: list[tuple[str, str]] = []
            if state == "failed":
                problems.append((
                    "job_failed",
                    f"FAILED after {st.get('failed') or 0} failed pod(s). This is "
                    "TERMINAL: a Job with no CronJob owner has no next run and no "
                    "controller will retry it, so it stays failed until a human "
                    "acts. ArgoCD reporting the owning Application Synced/Healthy "
                    "is not a contradiction -- Synced describes the manifest, not "
                    "a hook's outcome (Factory#508)",
                ))
            elif state == "active" and running_for > wedged_after:
                problems.append((
                    "job_wedged",
                    f"HUNG: running for {_dur(running_for)} "
                    f"(> {_dur(wedged_after)}, 4x the {_dur(stuck_after)} "
                    "ceiling). A hang is the failure mode no exit code will ever "
                    "report -- the Job is neither succeeded nor failed, so every "
                    "check that reads a terminal condition sees nothing at all",
                ))
            elif state == "active" and running_for > stuck_after:
                problems.append((
                    "job_stuck",
                    f"still running after {_dur(running_for)} "
                    f"(> {_dur(stuck_after)} ceiling). It may yet finish -- a slow "
                    f"pull or a big restore -- which is why this is a warning; it "
                    f"escalates itself to critical at {_dur(wedged_after)}",
                ))

            out.append({
                "_timestamp": int(now.timestamp() * 1_000_000),
                "source": "job-watchdog",
                "kind": "Job",
                "namespace": meta.get("namespace", ""),
                "cronjob": f"{JOB_PREFIX}{meta.get('name', '?')}",
                "schedule": "",
                "suspended": bool((j.get("spec") or {}).get("suspend")),
                "status": problems[0][0] if problems else "ok",
                "codes": [p[0] for p in problems],
                "problems": [p[1] for p in problems],
                "consecutive_failures": 0,
                "surviving_jobs": 1,
                "last_success_age_seconds": None if success_age is None else int(success_age),
                "last_schedule_age_seconds": None,
                "expected_period_seconds": stuck_after,
                "tolerance_seconds": stuck_after,
                "job_state": state,
                "running_for_seconds": int(running_for),
                "active_pods": st.get("active") or 0,
                "succeeded_pods": st.get("succeeded") or 0,
                "failed_pods": st.get("failed") or 0,
                "backoff_limit": (j.get("spec") or {}).get("backoffLimit"),
            })
        return out


    def abandoned_by_node(pod: dict) -> bool:
        """Is this a row the node abandoned, rather than a pod that failed?

        THE DISTINCTION IS THE ENTIRE SAFETY ARGUMENT for the delete verb, and
        it is NOT the one the symptom suggests. `kubectl get pods` printed
        `Unknown` for `fleet-match-29767120-98nzc` for 30 hours, and that string
        is the CONTAINER's `state.terminated.reason`, which the STATUS column
        prefers over the phase. The pod's `status.phase` is `Failed` -- verified
        on the live object. A rule keyed on `phase == "Unknown"` would have
        matched nothing at all and reported a clean run while the row it was
        written for sat there, which is this app's own defect rebuilt inside its
        fix.

        What actually separates the case is the attribution already used for
        Factory#598: `reason: Unknown` means the kubelet had NO exit status,
        because the runtime or the kubelet restarted underneath a running
        container. Nobody chose that 255. A pod that exited 3 of its own accord
        is EVIDENCE of a failure and belongs to whatever GC owns its history --
        the five `Error` pods live in this namespace right now are exactly that,
        and none of them may ever be touched.

        `all`, not `any`: if one container was lost but another reported a real
        exit status, the pod carries evidence and is left alone. Conservative in
        the only direction that matters for something that deletes.
        """
        st = pod.get("status") or {}
        phase = st.get("phase")
        if phase == "Unknown":
            return True  # the classic NodeLost shape: no container status at all
        if phase != "Failed":
            return False
        terms = [
            (cs.get("state") or {}).get("terminated")
            or (cs.get("lastState") or {}).get("terminated")
            for cs in ((st.get("containerStatuses") or [])
                       + (st.get("initContainerStatuses") or []))
        ]
        terms = [t for t in terms if t]
        if not terms:
            return False  # nothing to attribute; a guess here deletes something
        return all(attribute_termination(t, st.get("reason"))[0] == "runtime_lost"
                   for t in terms)


    def assess_orphan_pods(pods: list[dict], nodes: list[dict], now: datetime,
                           reaper, reap_after: int = ORPHAN_REAP_AFTER_SECONDS
                           ) -> list[dict]:
        """Reap the rows a returning node abandoned, and say so (#613).

        `reaper(namespace, name) -> None | error string` does the delete; it is a
        parameter so the whole rule is testable without a cluster.

        TWO CONDITIONS, AND BOTH ARE LOAD-BEARING. `abandoned_by_node` above
        decides that the kubelet lost this container rather than the container
        failing. This function decides that the loss is STALE rather than
        unknown: the node must be Ready AND have been Ready for `reap_after`.
        While a node is NotReady the pod's status is merely unknown -- the
        container may well still be running -- and deleting it would produce a
        Terminating ghost. Once the node is back, the kubelet re-adopts what it
        can within seconds; a quarter of an hour later it is not going to, and
        nothing else in Kubernetes revisits the row because taint-based eviction
        only runs while the node is NotReady.

        A SUCCESSFUL REAP DOES NOT NOTIFY. The record carries no codes, so it
        lands in the stream as evidence and raises nothing -- same treatment
        `app_error` gets, and for the same reason. What notifies is a reap that
        did NOT work: a refused delete, or one that was issued and left the pod
        in place. That is a fact about this watchdog's own ability to fix what it
        found and must never read like a clean run.

        ONE RECORD PER NODE, because one node event strands many pods at once.
        """
        ready_for = {}
        for n in nodes:
            name = (n.get("metadata") or {}).get("name")
            for c in (n.get("status") or {}).get("conditions") or []:
                if c.get("type") != "Ready" or c.get("status") != "True":
                    continue
                if c.get("lastTransitionTime"):
                    ready_for[name] = (
                        now - _parse_ts(c["lastTransitionTime"])).total_seconds()

        found: dict = {}
        for p in pods:
            if not abandoned_by_node(p):
                continue
            meta = p.get("metadata") or {}
            node = (p.get("spec") or {}).get("nodeName") or ""
            settled = ready_for.get(node)
            if settled is None or settled < reap_after:
                continue  # node down, gone, or only just back -- not ours
            ns, name = meta.get("namespace", ""), meta.get("name", "?")
            # A delete was already issued and the pod is STILL here. Reissuing it
            # changes nothing, so this is reported rather than retried forever:
            # an unreported no-op loop is the silence this app exists to remove.
            if meta.get("deletionTimestamp"):
                err = ("a delete was already issued at "
                       f"{meta['deletionTimestamp']} and the pod is still here; "
                       "it needs --grace-period=0 --force, which this watchdog "
                       "deliberately does not do unattended")
            else:
                err = reaper(ns, name)
            found.setdefault(node, []).append({
                "namespace": ns, "pod": name, "node": node,
                "ready_for_seconds": int(settled),
                "reaped": err is None,
                "error": err,
            })

        records = []
        for node, victims in sorted(found.items()):
            failed = [v for v in victims if not v["reaped"]]
            problems = [
                f"{len(victims)} pod(s) on node `{node}` carry a termination the "
                "kubelet had NO exit status for -- the runtime was restarted "
                "underneath a running container, so nobody chose that exit code. "
                f"The node has been Ready for {_dur(victims[0]['ready_for_seconds'])} "
                "and never re-adopted them. Nothing else reconciles this: "
                "taint-based eviction only runs while the node is NotReady, so "
                "once it recovers the row is permanent and every \"no pods "
                "outside Running/Succeeded\" check stays red for a reason "
                "unrelated to the current state of the fleet",
                f"REAPED {len(victims) - len(failed)} of {len(victims)}: "
                + ", ".join(f"`{v['namespace']}/{v['pod']}`" for v in victims),
            ]
            for v in failed:
                problems.append(
                    f"COULD NOT REAP `{v['namespace']}/{v['pod']}`: {v['error']}")
            records.append({
                "_timestamp": int(now.timestamp() * 1_000_000),
                "source": "job-watchdog",
                "kind": "Pod",
                "namespace": "cluster",
                "cronjob": f"{ORPHAN_PREFIX}node/{node}",
                "schedule": "",
                "suspended": False,
                "status": "orphans_unreaped" if failed else "ok",
                # Housekeeping that worked notifies nobody; housekeeping that
                # did not is the only thing here a human can act on.
                "codes": ["orphans_unreaped"] if failed else [],
                "problems": problems,
                "consecutive_failures": 0,
                "surviving_jobs": 0,
                "last_success_age_seconds": None,
                "last_schedule_age_seconds": None,
                "expected_period_seconds": reap_after,
                "tolerance_seconds": reap_after,
                "node": node,
                "victims": victims,
            })
        return records


    def k8s_call(path: str, method: str = "GET"):
        with open(f"{SA}/token") as f:
            token = f.read().strip()
        req = urllib.request.Request(
            f"https://kubernetes.default.svc{path}",
            headers={"authorization": f"Bearer {token}", "accept": "application/json"},
            method=method,
        )
        ctx = ssl.create_default_context(cafile=f"{SA}/ca.crt")
        with urllib.request.urlopen(req, timeout=30, context=ctx) as r:
            raw = r.read()
        return json.loads(raw) if raw else None


    def k8s_get(path: str):
        return k8s_call(path)


    def reap_pod(ns: str, name: str) -> str | None:
        """Delete one orphaned pod. Returns None on success, else the error.

        Never raises: a refused delete is a FINDING (`orphans_unreaped`), not a
        dead run. Taking the CronJob report and the heartbeat down because a
        cleanup failed would trade a loud signal for a silent one.
        """
        try:
            k8s_call(f"/api/v1/namespaces/{ns}/pods/{name}", "DELETE")
            return None
        except Exception as e:  # noqa: BLE001 — a failed reap is a finding
            return repr(e)


    def emit(oo: str, org: str, stream: str, basic: str, records: list[dict]) -> None:
        req = urllib.request.Request(
            f"{oo}/api/{org}/{stream}/_json",
            data=json.dumps(records).encode(),
            headers={
                "authorization": f"Basic {basic}",
                "content-type": "application/json",
            },
            method="POST",
        )
        with urllib.request.urlopen(req, timeout=60) as r:
            res = json.load(r)
        st = (res.get("status") or [{}])[0] if isinstance(res.get("status"), list) else res
        if isinstance(st, dict) and st.get("failed"):
            raise RuntimeError(f"OpenObserve rejected {st['failed']} record(s): {res}")


    def severity_of(record: dict) -> str | None:
        """critical | warning | None. None means healthy — say nothing."""
        codes = record.get("codes") or []
        if not codes:
            return None
        return "critical" if any(c in CRITICAL_CODES for c in codes) else "warning"


    def issue_severity(issue: dict) -> str | None:
        names = {l.get("name") for l in (issue.get("labels") or [])}
        for sev, label in SEVERITY_LABELS.items():
            if label in names:
                return sev
        return None


    def notify_action(record: dict, issue: dict | None, now: datetime,
                      renotify_hours: float) -> str | None:
        """Pure. (health record, its open issue or None) -> what to do about it.

        None means STAY SILENT, and most calls return None by design. Both halves
        of this matter equally:

          - an unhealthy CronJob with no issue MUST produce one, or we are back
            to a correct signal nobody reads;
          - a healthy fleet, and an already-reported problem, MUST produce
            nothing at all. An alert that repeats every 30 minutes gets muted
            inside a week, and a muted alert is the same silence this closes,
            reached by a more annoying road.

        Recovery closes the issue, so the open-issue list stays a list of things
        that are actually wrong rather than a graveyard nobody trusts.
        """
        sev = severity_of(record)
        if sev is None:
            return "close" if issue else None
        if issue is None:
            return "open"
        if sev != issue_severity(issue):
            return "escalate"  # or de-escalate; either way the label is now a lie
        if sev == "critical":
            age = (now - _parse_ts(issue["updated_at"])).total_seconds()
            if age >= renotify_hours * 3600:
                return "renotify"
        return None


    def issue_body(record: dict, sev: str) -> str:
        ns, name = record["namespace"], record["cronjob"]
        def fmt(field):
            return _ago(record.get(field))
        is_cron = _subject_kind(record) == "CronJob"
        is_job = _subject_kind(record) == "Job"
        is_orphan = name.startswith(ORPHAN_PREFIX)
        is_pod = _subject_kind(record) == "Pod" and not is_orphan
        lines = [
            MARKER.format(ns=ns, name=name),
            f"**Severity: {sev.upper()}** — `{ns}/{name}`"
            + (f", schedule `{record['schedule']}`" if is_cron else "")
            + f", status `{record['status']}`.",
            "",
            "What the watchdog found:",
            "",
        ]
        lines += [f"- {p}" for p in record["problems"]]
        lines += [""]
        if is_cron:
            lines += [
                f"- Consecutive failed runs: {record['consecutive_failures']}",
                f"- Surviving Jobs: {record['surviving_jobs']} "
                "(absence of failed Jobs is not health — they are garbage collected)",
                f"- Last success: {fmt('last_success_age_seconds')}",
                f"- Last schedule: {fmt('last_schedule_age_seconds')}",
            ]
        elif is_job:
            lines += [
                f"- Job state: `{record['job_state']}` "
                f"(active {record['active_pods']}, succeeded "
                f"{record['succeeded_pods']}, failed {record['failed_pods']}, "
                f"backoffLimit {record['backoff_limit']})",
                f"- Running for: {_dur(record['running_for_seconds'])}",
                f"- Completed: {fmt('last_success_age_seconds')}",
                "- Owner: **none**. This is a bare Job, so there is no schedule, "
                "no next run and no controller that will retry it.",
            ]
        elif is_orphan:
            lines += ["| pod | node | node Ready for | reaped |",
                      "|---|---|---|---|"]
            lines += [
                f"| `{v['namespace']}/{v['pod']}` | `{v['node']}` | "
                f"{_dur(v['ready_for_seconds'])} | "
                + ("yes" if v["reaped"] else f"NO — {v['error']}") + " |"
                for v in record.get("victims") or []
            ]
            lines += [""]
        elif is_pod:
            # The victim table IS the evidence. `lastState` is destroyed the
            # moment a pod is replaced — rolling `fides-server` on 2026-08-06
            # erased its copy before anyone looked — so the terminated block is
            # transcribed here while it still exists rather than linked to.
            lines += ["| when | pod | container | node | reason | exit | restarts |",
                      "|---|---|---|---|---|---|---|"]
            lines += [
                f"| {v['finished_at']} | `{v['namespace']}/{v['pod']}` | "
                f"`{v['container']}` | `{v['node']}` | `{v['reason']}` | "
                f"`{v['exit_code']}` | {v['restart_count']}"
                + (" (still down)" if v["still_down"] else "") + " |"
                for v in record.get("victims") or []
            ]
            lines += [
                "",
                f"- Reporting window: {_dur(record['tolerance_seconds'])} "
                "(terminations older than this are not reported, so this issue "
                "describes a recent event, not a standing state)",
            ]
        else:
            lines += [
                f"- Applications seen: {record.get('applications')}",
                f"- Freshest reconcile: {fmt('last_success_age_seconds')} "
                "(this is the measure — `sync.status` is a cached computation "
                "and survives the controller that wrote it)",
                f"- Oldest reconcile: {fmt('oldest_reconcile_age_seconds')}",
            ]
        if not is_pod and not is_orphan:
            lines += [
                f"- Tolerance: {_dur(record['tolerance_seconds'])} "
                f"(period {_dur(record['expected_period_seconds'])})",
            ]
        lines += [
            "",
            "Every record, including the healthy runs, is in the OpenObserve "
            f"stream `{os.environ.get('OO_STREAM', 'job_health')}`:",
            "",
            "```sql",
            f"SELECT * FROM \"job_health\" WHERE cronjob = '{name}' "
            "ORDER BY _timestamp DESC",
            "```",
            "",
        ]
        if is_cron:
            lines += [
                "Raised automatically by the `job-watchdog` CronJob, and it will "
                "be closed automatically when this CronJob reports healthy again. "
                "Closing it by hand while the CronJob is still unhealthy just "
                "opens a fresh one on the next run.",
            ]
        elif is_job:
            lines += [
                "Where to look first:",
                "",
                "```",
                f"kubectl --context factory -n {ns} describe job "
                f"{name[len(JOB_PREFIX):]}",
                f"kubectl --context factory -n {ns} logs "
                f"job/{name[len(JOB_PREFIX):]} --all-containers --tail=100",
                "```",
                "",
                "ArgoCD reporting the owning Application `Synced`/`Healthy` does "
                "NOT contradict this: `Synced` describes the manifest, not the "
                "outcome of a PreSync/PostSync hook (Factory#508, Factory#603).",
                "",
                "Raised automatically by the `job-watchdog` CronJob. A Job that "
                "is merely slow closes itself when it completes. A `job_failed` "
                "is TERMINAL and can never report healthy, so its issue closes "
                "when the Job is DELETED — which is the observable form of "
                "someone having dealt with it.",
            ]
        elif is_orphan:
            lines += [
                "Where to look first:",
                "",
                "```",
                "# NB `Unknown` in the STATUS column is the CONTAINER's "
                "terminated reason, not status.phase (which is Failed):",
                "kubectl --context factory get pods -A -o json | jq -r "
                "'.items[] | select(any(.status.containerStatuses[]?; "
                "(.state.terminated // .lastState.terminated // {}).reason == "
                "\"Unknown\")) | \"\\(.metadata.namespace)/\\(.metadata.name)\"'",
                "kubectl --context factory get nodes",
                "```",
                "",
                "These pods are reaped, not merely reported: nothing in "
                "Kubernetes owns this case, because taint-based eviction only "
                "runs while the node is NotReady and once it recovers the stale "
                "row is permanent (Factory#613). A successful reap says nothing "
                "at all — this issue exists only because the reap did not work, "
                "and it closes on the next run that manages it.",
            ]
        elif is_pod:
            lines += [
                "Where to look first:",
                "",
                "```",
                "kubectl --context factory get nodes -o json | jq '.items[] | "
                "{name: .metadata.name, conditions: .status.conditions}'",
                "kubectl --context factory get events -A "
                "--sort-by=.lastTimestamp | tail -50",
                "```",
                "",
                "**Events age out after roughly an hour and `lastState` is "
                "destroyed the moment a pod is replaced**, so the table above "
                "may already be the only surviving record. That is why it is "
                "transcribed here rather than linked to (Factory#598).",
                "",
                "Raised automatically by the `job-watchdog` CronJob. A kill is "
                "an EVENT, not a state, so this issue is never closed as "
                "\"recovered\" — it closes on absence of recurrence once it has "
                f"been open {POD_CLOSE_AFTER_HOURS}h and no matching termination "
                "has been seen since.",
            ]
        else:
            lines += [
                "Where to look first:",
                "",
                "```",
                "kubectl --context factory -n argocd get pods",
                "kubectl --context factory -n argocd get statefulset "
                "argocd-application-controller",
                "kubectl --context factory get nodes",
                "kubectl --context factory get application -n argocd "
                "-o custom-columns=NAME:.metadata.name,"
                "RECONCILED:.status.reconciledAt",
                "```",
                "",
                "A pod stuck `Terminating` on a NotReady node is the "
                "factory-gitops#138 shape: a single-replica StatefulSet will not "
                "replace it, so the controller is simply absent.",
                "",
                "Per-Application detail — including which are behind git — is in "
                "the `argocd_drift` stream from `apps/argocd-drift`. Raised "
                "automatically by the `job-watchdog` CronJob and closed "
                "automatically once reconciliation resumes.",
            ]
        return "\n".join(lines)


    def gh(token: str, method: str, path: str, body: dict | None = None):
        req = urllib.request.Request(
            f"https://api.github.com{path}",
            data=None if body is None else json.dumps(body).encode(),
            headers={
                "authorization": f"Bearer {token}",
                "accept": "application/vnd.github+json",
                "content-type": "application/json",
                "user-agent": "factory-job-watchdog",
            },
            method=method,
        )
        with urllib.request.urlopen(req, timeout=30) as r:
            raw = r.read()
        return json.loads(raw) if raw else None


    def ensure_labels(token: str, repo: str) -> None:
        """Idempotent. A missing label makes the dedup query silently match
        nothing, which would open a duplicate issue every 30 minutes — the
        crying-wolf failure, self-inflicted on the very first run."""
        for name, color, desc in (
            (ISSUE_LABEL, "5319e7", "Raised by the CronJob health watchdog"),
            (SEVERITY_LABELS["critical"], "b60205", "The job's purpose is not being served"),
            (SEVERITY_LABELS["warning"], "fbca04", "Misbehaving, may still self-recover"),
        ):
            try:
                gh(token, "POST", f"/repos/{repo}/labels",
                   {"name": name, "color": color, "description": desc})
            except urllib.error.HTTPError as e:
                if e.code != 422:  # 422 = already exists
                    raise


    def open_watchdog_issues(token: str, repo: str) -> dict:
        """marker -> issue, for every open issue this watchdog raised."""
        issues = gh(token, "GET",
                    f"/repos/{repo}/issues?state=open&labels={ISSUE_LABEL}&per_page=100") or []
        out = {}
        for i in issues:
            for line in (i.get("body") or "").splitlines():
                line = line.strip()
                if line.startswith("<!-- job-watchdog:"):
                    out[line] = i
                    break
        return out


    def notify(token: str, repo: str, records: list[dict], now: datetime,
               renotify_hours: float) -> int:
        """Route findings to a human. Returns the number of notifications sent."""
        ensure_labels(token, repo)
        existing = open_watchdog_issues(token, repo)
        sent = 0
        for r in records:
            key = MARKER.format(ns=r["namespace"], name=r["cronjob"])
            issue = existing.get(key)
            action = notify_action(r, issue, now, renotify_hours)
            if action is None:
                continue
            sev = severity_of(r)
            name = r["cronjob"]
            if action == "open":
                new = gh(token, "POST", f"/repos/{repo}/issues", {
                    "title": issue_title(r, sev),
                    "body": issue_body(r, sev),
                    "labels": [ISSUE_LABEL, SEVERITY_LABELS[sev]],
                })
                eprint(f"NOTIFIED  {name} [{sev}] -> opened {repo}#{new['number']}")
            elif action == "escalate":
                was = issue_severity(issue)
                gh(token, "PATCH", f"/repos/{repo}/issues/{issue['number']}", {
                    "title": issue_title(r, sev),
                    "labels": [ISSUE_LABEL, SEVERITY_LABELS[sev]],
                })
                gh(token, "POST", f"/repos/{repo}/issues/{issue['number']}/comments",
                   {"body": f"Severity changed: **{was} -> {sev}**.\n\n"
                            + issue_body(r, sev)})
                eprint(f"NOTIFIED  {name} [{was} -> {sev}] -> {repo}#{issue['number']}")
            elif action == "renotify":
                gh(token, "POST", f"/repos/{repo}/issues/{issue['number']}/comments",
                   {"body": f"Still {r['status']} after "
                            f"{renotify_hours:g}h with no change.\n\n"
                            + issue_body(r, sev)})
                eprint(f"NOTIFIED  {name} [still {sev}] -> {repo}#{issue['number']}")
            elif action == "close":
                # A subject can report healthy with NO "last success" at all — a
                # reaped orphan, a Job that is simply no longer stuck. `_dur`
                # raises on None, and it would raise in the middle of delivering
                # a notification, which is the one place this app must not fall
                # over. So the timing clause is written only when there is one.
                last = r.get("last_success_age_seconds")
                why = (f": {_success_label(r)} {_ago(last)}, within its "
                       f"{_dur(r['tolerance_seconds'])} tolerance"
                       if last is not None else
                       " and the condition this issue describes is gone")
                gh(token, "POST", f"/repos/{repo}/issues/{issue['number']}/comments",
                   {"body": f"RECOVERED. `{r['namespace']}/{name}` now reports "
                            f"healthy{why}. Closing automatically."})
                gh(token, "PATCH", f"/repos/{repo}/issues/{issue['number']}",
                   {"state": "closed", "state_reason": "completed"})
                eprint(f"RECOVERED {name} -> closed {repo}#{issue['number']}")
            sent += 1

        # ORPHANS: an open issue whose CronJob no longer exists at all. Without
        # this the issue sits open forever — nothing recovers it, because
        # recovery is driven by a record and there is no longer a record to
        # produce. A permanently-open critical nobody can action is precisely
        # what teaches people to ignore the label, and a discredited channel is
        # this whole issue again.
        #
        # It is NOT closed silently, though. "The CronJob vanished" is itself the
        # Factory#429 failure mode, so the disappearance is stated out loud in a
        # comment first. The watchdog cannot tell a deliberate retirement from an
        # accidental deletion, so it says what it saw and lets a human judge.
        seen = {MARKER.format(ns=r["namespace"], name=r["cronjob"]) for r in records}
        for key, issue in existing.items():
            if key in seen:
                continue
            gone = key.split(":", 1)[1].rsplit(" ", 1)[0]

            # CLOSE-ON-ABSENCE, for termination findings only (Factory#598).
            #
            # A container kill is an EVENT. It does not recover, so the "healthy
            # again" close above would be a lie, and the "no longer exists"
            # close below would be too — the pod is usually fine, the kill simply
            # aged out of the reporting window. But exempting these from the
            # sweep entirely is worse: the sweep is the ONLY thing that closes an
            # issue whose record stops being produced, and an alert that can open
            # and never close trains people to ignore the whole label, which
            # discredits every other finding filed here.
            #
            # So: a positive rule. It closes once the finding has stopped
            # recurring AND has been visible long enough for a human to meet it,
            # and the comment says it is closing on absence rather than pretending
            # anything got better.
            if f"/{KILL_PREFIX}" in key:
                open_for = (now - _parse_ts(issue["created_at"])).total_seconds()
                if open_for < POD_CLOSE_AFTER_HOURS * 3600:
                    continue
                gh(token, "POST", f"/repos/{repo}/issues/{issue['number']}/comments",
                   {"body": f"No termination matching `{gone}` has been seen for "
                            f"the last {_dur(POD_CLOSE_AFTER_HOURS * 3600)}. "
                            "Closing on ABSENCE OF RECURRENCE — not on recovery: "
                            "a container kill is an event and nothing about it "
                            "gets better, so this says only that it has not "
                            "happened again.\n\nThe evidence stays in the table "
                            "above and in the OpenObserve `job_health` stream. "
                            "If the cause was never established, reopen: a kill "
                            "nobody attributed is Factory#598 itself."})
                gh(token, "PATCH", f"/repos/{repo}/issues/{issue['number']}",
                   {"state": "closed", "state_reason": "completed"})
                eprint(f"NO RECURRENCE {gone} -> closed {repo}#{issue['number']}")
                sent += 1
                continue

            gh(token, "POST", f"/repos/{repo}/issues/{issue['number']}/comments",
               {"body": f"`{gone}` is no longer reported by the watchdog at all, "
                        "so this finding can no longer be evaluated. "
                        "Closing.\n\nIf it was not retired deliberately then its "
                        "disappearance is itself the problem, not the fix - a "
                        "subject that stops existing produces no failures and no "
                        "alerts, only silence (Factory#429)."})
            gh(token, "PATCH", f"/repos/{repo}/issues/{issue['number']}",
               {"state": "closed", "state_reason": "not_planned"})
            eprint(f"VANISHED  {gone} -> closed {repo}#{issue['number']}")
            sent += 1
        return sent


    def heartbeat(token: str, repo: str, name: str, now: datetime) -> str:
        """Stamp `now` into the ALERT_REPO Actions variable `name`.

        The dead-man's switch for the watchdog itself (Factory#450). Called
        ONLY after notify() has succeeded — see the manifest header for why
        the order is the entire mechanism and not a detail.

        PATCH first, POST on 404: the variable is created on the very first
        run so nothing has to be seeded by hand, and a hand-deleted variable
        heals itself on the next run rather than staying red forever.

        Returns the value written. Raises on failure; the caller turns that
        into a red Job.
        """
        stamp = now.strftime("%Y-%m-%dT%H:%M:%SZ")
        try:
            gh(token, "PATCH", f"/repos/{repo}/actions/variables/{name}",
               {"name": name, "value": stamp})
        except urllib.error.HTTPError as e:
            if e.code != 404:
                raise
            gh(token, "POST", f"/repos/{repo}/actions/variables",
               {"name": name, "value": stamp})
        return stamp


    def main() -> int:
        threshold = int(os.environ.get("FAIL_THRESHOLD", "2"))
        reconcile_tol = int(
            os.environ.get("RECONCILE_TOLERANCE_SECONDS", DEFAULT_RECONCILE_TOLERANCE)
        )
        pod_window = int(
            os.environ.get("POD_TERMINATION_WINDOW_SECONDS", POD_WINDOW_SECONDS)
        )
        job_stuck = int(os.environ.get("JOB_STUCK_SECONDS", JOB_STUCK_SECONDS))
        reap_after = int(
            os.environ.get("ORPHAN_REAP_AFTER_SECONDS", ORPHAN_REAP_AFTER_SECONDS)
        )
        oo = os.environ.get(
            "OBSERVE_URL", "http://observe.factory.svc.cluster.local:5080"
        ).rstrip("/")
        org = os.environ.get("OO_ORG", "default")
        stream = os.environ.get("OO_STREAM", "job_health")
        user, pw = os.environ.get("OO_USER", ""), os.environ.get("OO_PASS", "")
        if not user or not pw:
            eprint("FATAL: OO_USER/OO_PASS not set (observe-root secret missing)")
            return 2
        basic = base64.b64encode(f"{user}:{pw}".encode()).decode()

        repo = os.environ.get("ALERT_REPO", "")
        token = os.environ.get("GITHUB_TOKEN", "")
        renotify = float(os.environ.get("ALERT_RENOTIFY_HOURS", "24"))
        hb_var = os.environ.get("HEARTBEAT_VAR", "JOB_WATCHDOG_HEARTBEAT")
        # Checked UP FRONT, before any work, and fatal — never a warning that
        # degrades to stream-only. Silently running without a notification path
        # is the exact defect #439 is about, and it would be undetectable from
        # the outside: the job would go green having told nobody anything.
        if not repo or not token:
            eprint("FATAL: ALERT_REPO/GITHUB_TOKEN not set — there would be no "
                   "path to a human, which is the defect this app exists to fix")
            return 2

        # CLUSTER-WIDE, not one namespace (Factory#571). These are the
        # all-namespaces collection endpoints. The previous per-namespace paths
        # meant every CronJob outside `factory` had no monitor at all and the
        # watchdog still reported a clean run, which is how fides/#567 stayed
        # invisible for five days. Every record already carries its namespace and
        # the issue de-duplication marker is already keyed `{ns}/{name}`, so
        # widening the query needed no change to the reporting path.
        try:
            cronjobs = k8s_get("/apis/batch/v1/cronjobs")["items"]
            jobs = k8s_get("/apis/batch/v1/jobs")["items"]
        except Exception as e:  # noqa: BLE001 — cannot see == cannot report
            eprint(f"FATAL: kubernetes API unreachable: {e!r}")
            return 3

        # ArgoCD Applications, in a try of their OWN and never a fatal (#443).
        # A cluster with no ArgoCD, or a revoked RBAC grant, must not take the
        # CronJob report and the heartbeat down with it — but it must not pass
        # silently either, so the failure becomes a critical record below rather
        # than a logged warning.
        try:
            apps = k8s_get("/apis/argoproj.io/v1alpha1/applications")["items"]
            apps_err = None
        except Exception as e:  # noqa: BLE001 — cannot see == cannot report
            apps, apps_err = [], repr(e)

        # Pods and nodes, same shape and for the same reason (#598). Both, not
        # one: the node conditions are what turn a generic `exit 255` into a
        # named cause, so losing them would leave the attribution this exists to
        # produce, unproduced.
        try:
            pods = k8s_get("/api/v1/pods")["items"]
            nodes = k8s_get("/api/v1/nodes")["items"]
            pods_err = None
        except Exception as e:  # noqa: BLE001 — cannot see == cannot report
            pods, nodes, pods_err = [], [], repr(e)

        now = datetime.now(timezone.utc)
        owned = group_jobs(cronjobs, jobs)
        records = [
            assess(c, owned.get((c.get("metadata") or {}).get("uid"), []), now, threshold)
            for c in sorted(
                cronjobs,
                key=lambda c: (c["metadata"].get("namespace", ""), c["metadata"]["name"]),
            )
        ]
        records.append(assess_argocd(apps, apps_err, now, reconcile_tol))
        records += assess_pod_terminations(pods, nodes, pods_err, now, pod_window)
        # Factory#603. The Jobs with no CronJob owner were already in hand and
        # were simply discarded; these are the ArgoCD PreSync/PostSync hooks and
        # every one-shot Job in the fleet, none of which had a monitor at all.
        records += assess_bare_jobs(jobs, now, job_stuck)
        # Factory#613. The only thing in this app that CHANGES the cluster, and
        # the only case where reporting alone would have made things worse: a
        # finding that can open and never close is what teaches people to ignore
        # the label. Skipped entirely when the pod list could not be read --
        # assess_pod_terminations has already turned that into a critical, and
        # deleting on the strength of an empty list is the one mistake here with
        # a blast radius.
        if pods_err is None:
            records += assess_orphan_pods(pods, nodes, now, reap_pod, reap_after)

        # Namespace-qualified now that the watch is cluster-wide: two namespaces
        # may hold same-named CronJobs, and a bare name would make the operator's
        # first view of an incident ambiguous.
        for r in records:
            who = f"{r['namespace']}/{r['cronjob']}"
            if r["status"] == "ok":
                eprint(f"ok       {who}")
            else:
                eprint(f"UNHEALTHY {who} [{r['status']}]")
                for p in r["problems"]:
                    eprint(f"          - {p}")

        try:
            emit(oo, org, stream, basic, records)
        except Exception as e:  # noqa: BLE001 — a dropped record is a blind spot
            eprint(f"FATAL: cannot emit to OpenObserve stream '{stream}': {e!r}")
            return 4

        bad = [f"{r['namespace']}/{r['cronjob']}" for r in records if r["status"] != "ok"]
        kinds: dict = {}
        for r in records:
            kinds[r["kind"]] = kinds.get(r["kind"], 0) + 1
        eprint(
            f"reported {len(records)} subject(s) to '{stream}' "
            f"({', '.join(f'{v} {k}' for k, v in sorted(kinds.items()))}): "
            f"{len(records) - len(bad)} ok, {len(bad)} unhealthy"
            + (f" ({', '.join(bad)})" if bad else "")
        )

        # Emit FIRST, notify second. If GitHub is down the durable record still
        # lands, and the failure below is then visible in the stream rather than
        # taking the finding down with it.
        try:
            sent = notify(token, repo, records, now, renotify)
        except Exception as e:  # noqa: BLE001 — an undelivered alert is the bug
            eprint(f"FATAL: cannot notify via {repo}: {e!r}")
            return 5
        eprint(f"notifications sent: {sent} (silence on healthy and on already-reported)")

        # AFTER notify, never after the emit. A watchdog that emits fine but
        # cannot notify must NOT be able to report itself alive — that is the
        # whole of Factory#450, and stamping any earlier would rebuild it.
        try:
            stamp = heartbeat(token, repo, hb_var, now)
        except Exception as e:  # noqa: BLE001 — an unprovable liveness is a finding
            eprint(f"FATAL: cannot stamp heartbeat {hb_var} on {repo}: {e!r}")
            eprint("       the scheduled check on its absence will go red; this "
                   "run reports red too so both signals agree")
            return 6
        eprint(f"heartbeat {hb_var}={stamp}")

        # Exit 0 on findings BY DESIGN: see the manifest header. A red watchdog
        # must mean the watchdog is broken, not that a watched job is.
        return 0


    def _selftest() -> int:
        now = datetime(2026, 7, 26, 12, 0, tzinfo=timezone.utc)

        assert estimate_period_seconds("*/15 * * * *") == 900
        assert estimate_period_seconds("0 */4 * * *") == 4 * 3600
        assert estimate_period_seconds("0 6 * * *") == 24 * 3600
        assert estimate_period_seconds("* * * * *") == 60
        assert estimate_period_seconds("0 6 * * 1") == 7 * 24 * 3600
        assert estimate_period_seconds("garbage") == 24 * 3600

        def cj(name, schedule, *, last_ok=None, last_sched=None, created="2026-06-01T00:00:00Z",
               suspend=False, ann=None):
            return {
                "metadata": {
                    "name": name, "namespace": "factory", "uid": name,
                    "creationTimestamp": created,
                    **({"annotations": ann} if ann else {}),
                },
                "spec": {"schedule": schedule, **({"suspend": True} if suspend else {})},
                "status": {
                    **({"lastSuccessfulTime": last_ok} if last_ok else {}),
                    **({"lastScheduleTime": last_sched} if last_sched else {}),
                },
            }

        def job(owner, when, state):
            st = {"succeeded": 1} if state == "succeeded" else (
                {"failed": 1} if state == "failed" else {"active": 1})
            return {
                "metadata": {
                    "name": f"{owner}-{when}", "creationTimestamp": when,
                    "ownerReferences": [{"kind": "CronJob", "uid": owner}],
                },
                "status": st,
            }

        # Healthy 4-hourly job: recent success, recent schedule, no failures.
        healthy = assess(
            cj("cred-broker", "0 */4 * * *", last_ok="2026-07-26T11:00:00Z",
               last_sched="2026-07-26T11:00:00Z"), [], now, 2)
        assert healthy["status"] == "ok", healthy
        assert healthy["tolerance_seconds"] == 2 * 4 * 3600 + 900

        # REGRESSION (found by the induced-failure test, not by this selftest):
        # the grace must never dwarf the period. A flat 900s grace gave a
        # 1-minute CronJob a 17-minute window in which it could have zero Jobs
        # and zero successes and still report "ok".
        assert tolerance_for(60) == 180, "fast schedules must not inherit a 15m grace"
        assert tolerance_for(4 * 3600) == 2 * 4 * 3600 + 900, "slow schedules keep it"
        minutely = assess(cj("fast", "* * * * *", last_sched="2026-07-26T11:59:30Z",
                             created="2026-07-26T11:50:00Z"), [], now, 2)
        assert minutely["status"] == "never_succeeded", minutely
        assert minutely["surviving_jobs"] == 0

        # THE #381 SCENARIO, still with Jobs present: two consecutive failures.
        failing = assess(
            cj("cred-broker", "0 */4 * * *", last_ok="2026-06-07T00:00:00Z",
               last_sched="2026-07-26T11:00:00Z"),
            [job("cred-broker", "2026-07-26T08:00:00Z", "failed"),
             job("cred-broker", "2026-07-26T11:00:00Z", "failed")],
            now, 2)
        assert failing["status"] == "failing", failing
        assert failing["consecutive_failures"] == 2

        # THE SAME SCENARIO AFTER GC — zero surviving Jobs. This is the case that
        # went unnoticed for seven weeks and it MUST NOT read as ok.
        gcd = assess(
            cj("cred-broker", "0 */4 * * *", last_ok="2026-06-07T00:00:00Z",
               last_sched="2026-07-26T11:00:00Z"), [], now, 2)
        assert gcd["consecutive_failures"] == 0, "no Jobs left to count"
        assert gcd["status"] == "stale", gcd
        assert gcd["surviving_jobs"] == 0

        # Stopped being scheduled at all (controller wedged / schedule removed).
        assert assess(cj("x", "0 */4 * * *", last_ok="2026-07-26T11:00:00Z",
                         last_sched="2026-07-20T00:00:00Z"), [], now, 2
                      )["status"] == "not_scheduled"

        # Never succeeded even once — postgres-backup's live shape today.
        never = assess(cj("postgres-backup", "15 2 * * *",
                          last_sched="2026-07-26T02:15:00Z"), [], now, 2)
        assert never["status"] == "never_succeeded", never

        # A CronJob created moments ago must not be flagged before it can run.
        assert assess(cj("fresh", "0 */4 * * *", created="2026-07-26T11:59:00Z"),
                      [], now, 2)["status"] == "ok"

        # Suspended is a finding, not silence.
        assert assess(cj("s", "0 */4 * * *", last_ok="2026-07-26T11:00:00Z",
                         last_sched="2026-07-26T11:00:00Z", suspend=True), [], now, 2
                      )["status"] == "suspended"

        # A success clears the streak; an in-flight run does not.
        assert consecutive_failures([
            job("a", "2026-07-26T09:00:00Z", "failed"),
            job("a", "2026-07-26T10:00:00Z", "succeeded"),
            job("a", "2026-07-26T11:00:00Z", "failed"),
            job("a", "2026-07-26T11:30:00Z", "active"),
        ]) == 1

        # Annotation overrides the estimate: read as daily this is healthy, but
        # pinned to a 60s period the 3h-old success is stale.
        pinned = cj("o", "0 6 * * *", last_ok="2026-07-26T09:00:00Z",
                    last_sched="2026-07-26T11:59:00Z")
        assert assess(pinned, [], now, 2)["status"] == "ok"
        pinned["metadata"]["annotations"] = {PERIOD_ANNOTATION: "60"}
        assert assess(pinned, [], now, 2)["status"] == "stale"

        # Ownership grouping ignores Jobs owned by nobody we track.
        grouped = group_jobs([cj("a", "* * * * *")],
                             [job("a", "2026-07-26T11:00:00Z", "failed"),
                              job("b", "2026-07-26T11:00:00Z", "failed")])
        assert len(grouped["a"]) == 1 and "b" not in grouped

        # ---- #439: severity, and the routing decision ----------------------
        healthy_rec = assess(cj("ok", "0 */4 * * *", last_ok="2026-07-26T11:00:00Z",
                                last_sched="2026-07-26T11:00:00Z"), [], now, 2)
        assert severity_of(healthy_rec) is None

        # postgres-backup's real shape: never once succeeded. CRITICAL.
        assert severity_of(never) == "critical", never
        assert severity_of(gcd) == "critical", gcd          # stale after GC
        # A transient run of failures with the last success still INSIDE
        # tolerance is not the same thing as a backup that has never worked.
        # That distinction is the whole point of having two levels.
        #
        # Note `failing` above does not qualify: its last success is 49.5d old,
        # so it is failing AND stale, and severity_of correctly grades it
        # critical. This selftest asserted "warning" on it at first and the
        # assertion was what was wrong. A genuinely transient blip needs a
        # recent success, so build one:
        blip = assess(
            cj("blip", "0 */4 * * *", last_ok="2026-07-26T08:00:00Z",
               last_sched="2026-07-26T11:00:00Z"),
            [job("blip", "2026-07-26T09:00:00Z", "failed"),
             job("blip", "2026-07-26T11:00:00Z", "failed")],
            now, 2)
        assert blip["codes"] == ["failing"], blip
        assert severity_of(blip) == "warning", blip
        # And it escalates itself with no help once that success ages out.
        aged = assess(cj("blip", "0 */4 * * *", last_ok="2026-07-25T00:00:00Z",
                         last_sched="2026-07-26T11:00:00Z"), [], now, 2)
        assert severity_of(aged) == "critical", aged
        assert severity_of(assess(cj("s", "0 */4 * * *", last_ok="2026-07-26T11:00:00Z",
                                     last_sched="2026-07-26T11:00:00Z", suspend=True),
                                  [], now, 2)) == "warning"

        # Severity reads EVERY code, not just status. This CronJob stopped being
        # scheduled AND its last success has aged out; status is "not_scheduled"
        # (the first problem found) but it is unambiguously critical.
        both = assess(cj("b", "0 */4 * * *", last_ok="2026-06-01T00:00:00Z",
                         last_sched="2026-07-01T00:00:00Z"), [], now, 2)
        assert both["status"] == "not_scheduled" and "stale" in both["codes"]
        assert severity_of(both) == "critical", both

        def iss(sev, updated):
            return {"number": 1, "updated_at": updated,
                    "labels": [{"name": ISSUE_LABEL}, {"name": SEVERITY_LABELS[sev]}]}

        # THE ALARM HALF: an unhealthy CronJob nobody has an issue for gets one.
        assert notify_action(never, None, now, 24) == "open"

        # THE SILENCE HALF, which matters just as much. An alarm that re-fires
        # every 30 minutes is muted within a week, and a muted alarm is #439
        # again by a louder route.
        assert notify_action(healthy_rec, None, now, 24) is None, "healthy must be silent"
        assert notify_action(never, iss("critical", "2026-07-26T11:30:00Z"), now, 24) is None, \
            "already reported 30m ago must not re-notify"
        assert notify_action(blip, iss("warning", "2026-06-01T00:00:00Z"), now, 24) is None, \
            "warnings are reported once and then stay quiet, however long they last"

        # Escalation: the same CronJob, worse. The open issue's label is now
        # wrong, so it is corrected and said out loud once.
        assert notify_action(never, iss("warning", "2026-07-26T11:59:00Z"), now, 24) == "escalate"
        # De-escalation is also a change worth one comment, not silent relabelling.
        assert notify_action(blip, iss("critical", "2026-07-26T11:59:00Z"), now, 24) == "escalate"

        # A critical that will not go away keeps surfacing, once a day, so a
        # month-old outage does not quietly sink down the issue list. This is the
        # postgres-backup case: right, ignored, and ignored again.
        assert notify_action(never, iss("critical", "2026-07-24T00:00:00Z"), now, 24) == "renotify"
        assert notify_action(never, iss("critical", "2026-07-24T00:00:00Z"), now, 999) is None

        # Recovery closes the issue, so the open list stays things that are
        # actually broken rather than a graveyard everyone learns to scroll past.
        assert notify_action(healthy_rec, iss("critical", "2026-07-26T11:00:00Z"), now, 24) == "close"

        # notify_action being right is not enough: a correct decision that the
        # caller ignores is still an issue filed every 30 minutes. A mutation
        # test caught exactly that — deleting the `if action is None: continue`
        # guard in notify() left every assertion above passing. So drive notify()
        # itself over a stub transport and count what it would really send.
        calls: list = []
        stub_issues: list = []

        def fake_gh(token, method, path, body=None):
            calls.append((method, path))
            if method == "POST" and path.endswith("/issues"):
                return {"number": 99}
            if "/issues?" in path:
                return list(stub_issues)
            return {}

        def writes():
            return [c for c in calls
                    if c[0] != "GET" and not c[1].endswith("/labels")]

        real_gh = globals()["gh"]
        globals()["gh"] = fake_gh
        try:
            # A HEALTHY FLEET SENDS NOTHING. Not one issue, comment or edit.
            assert notify("t", "o/r", [healthy_rec, healthy_rec], now, 24) == 0
            assert not writes(), writes()

            # One genuinely unhealthy CronJob sends exactly one thing.
            calls.clear()
            assert notify("t", "o/r", [never], now, 24) == 1
            assert writes() == [("POST", "/repos/o/r/issues")], writes()

            # And a mixed fleet notifies once, for the one that is broken.
            calls.clear()
            assert notify("t", "o/r", [healthy_rec, never, healthy_rec], now, 24) == 1
            assert len(writes()) == 1, writes()

            # DEDUP, matched off the body marker of the issue we already raised.
            # This is what stops the same finding filing a fresh issue every 30
            # minutes, so it is checked against a real issue payload rather than
            # trusted. Note the title here is deliberately NOT the title notify()
            # would write, because dedup must key on the marker alone.
            stub_issues.append({
                "number": 99,
                "title": "something a human renamed it to",
                "updated_at": "2026-07-26T11:45:00Z",
                "body": issue_body(never, "critical"),
                "labels": [{"name": ISSUE_LABEL},
                           {"name": SEVERITY_LABELS["critical"]}],
            })
            assert list(open_watchdog_issues("t", "o/r")) == [
                MARKER.format(ns="factory", name="postgres-backup")]
            calls.clear()
            assert notify("t", "o/r", [never], now, 24) == 0, "must not duplicate"
            assert not writes(), writes()

            # Same issue, but the CronJob has recovered: comment and close.
            calls.clear()
            recovered = assess(cj("postgres-backup", "15 2 * * *",
                                  last_ok="2026-07-26T11:00:00Z",
                                  last_sched="2026-07-26T11:00:00Z"), [], now, 2)
            assert notify("t", "o/r", [recovered], now, 24) == 1
            assert writes() == [("POST", "/repos/o/r/issues/99/comments"),
                                ("PATCH", "/repos/o/r/issues/99")], writes()

            # ORPHAN: the CronJob has been deleted outright, so it appears in no
            # record at all. Its issue must not sit open forever — an unactionable
            # permanent critical is what trains people to ignore the label.
            calls.clear()
            assert notify("t", "o/r", [healthy_rec], now, 24) == 1
            assert writes() == [("POST", "/repos/o/r/issues/99/comments"),
                                ("PATCH", "/repos/o/r/issues/99")], writes()

            # ...but a healthy fleet with no orphans is still completely silent.
            stub_issues.clear()
            calls.clear()
            assert notify("t", "o/r", [healthy_rec], now, 24) == 0
            assert not writes(), writes()
        finally:
            globals()["gh"] = real_gh

        # The dedup key lives in the body and survives the title changing, so a
        # finding that worsens updates one issue instead of stacking duplicates.
        body = issue_body(never, "critical")
        assert body.splitlines()[0] == MARKER.format(ns="factory", name="postgres-backup")
        assert "NEVER succeeded" in body and "CRITICAL" in body
        assert "Last success: never" in body

        # The title is the notification email's subject line, so it must name the
        # reason that DROVE the severity, not merely the first problem found.
        # cred-broker's live record is `failing` first and `stale` second; a
        # subject line reading "is failing" would understate a three-day outage.
        assert issue_title(never, "critical") == \
            "[critical] postgres-backup has never once succeeded", issue_title(never, "critical")
        cb = assess(cj("cred-broker", "0 */4 * * *", last_ok="2026-07-01T00:00:00Z",
                       last_sched="2026-07-26T11:00:00Z"),
                    [job("cred-broker", "2026-07-26T08:00:00Z", "failed"),
                     job("cred-broker", "2026-07-26T11:00:00Z", "failed")], now, 2)
        assert cb["status"] == "failing" and severity_of(cb) == "critical"
        assert issue_title(cb, "critical") == \
            "[critical] cred-broker has not succeeded within its tolerance", issue_title(cb, "critical")
        assert issue_title(blip, "warning") == "[warning] blip is failing"

        # ------------------------------------------------------------------
        # HEARTBEAT (Factory#450). The dead-man's switch this watchdog cannot
        # check for itself, so its contract is checked here instead.
        # ------------------------------------------------------------------
        calls.clear()
        globals()["gh"] = fake_gh
        try:
            # Normal run: one PATCH, and the value is a parseable UTC stamp the
            # consumer workflow can subtract from `now`.
            stamp = heartbeat("t", "o/r", "JOB_WATCHDOG_HEARTBEAT", now)
            assert calls == [("PATCH",
                              "/repos/o/r/actions/variables/JOB_WATCHDOG_HEARTBEAT")], calls
            assert _parse_ts(stamp) == now.replace(microsecond=0), stamp

            # First ever run, or someone deleted the variable: 404 on PATCH must
            # CREATE it, not fail forever. A switch that needs hand-seeding is a
            # switch that is off.
            def gh_404(token, method, path, body=None):
                calls.append((method, path))
                if method == "PATCH":
                    raise urllib.error.HTTPError(path, 404, "Not Found", {}, None)
                return {}

            calls.clear()
            globals()["gh"] = gh_404
            heartbeat("t", "o/r", "JOB_WATCHDOG_HEARTBEAT", now)
            assert calls == [
                ("PATCH", "/repos/o/r/actions/variables/JOB_WATCHDOG_HEARTBEAT"),
                ("POST", "/repos/o/r/actions/variables"),
            ], calls

            # Anything that is NOT a missing variable propagates. A revoked
            # token (401) or a renamed repo must reach main() and turn the run
            # red — swallowing it is how a heartbeat starts lying. The stub
            # deliberately lets POST SUCCEED, so a 404-only guard that decayed
            # into catch-everything would quietly "create" its way to green
            # here instead of raising.
            def gh_401(token, method, path, body=None):
                calls.append((method, path))
                if method == "PATCH":
                    raise urllib.error.HTTPError(path, 401, "Unauthorized", {}, None)
                return {}

            calls.clear()
            globals()["gh"] = gh_401
            try:
                heartbeat("t", "o/r", "JOB_WATCHDOG_HEARTBEAT", now)
                raise AssertionError("a rejected stamp must not be swallowed")
            except urllib.error.HTTPError as e:
                assert e.code == 401
            assert calls == [
                ("PATCH", "/repos/o/r/actions/variables/JOB_WATCHDOG_HEARTBEAT")
            ], f"a non-404 must not fall through to create: {calls}"
        finally:
            globals()["gh"] = real_gh

        # THE ORDERING CONSTRAINT, asserted on the source rather than trusted:
        # the stamp must come after the notify call. If it ever drifts above it,
        # a watchdog that cannot notify would keep its heartbeat fresh and report
        # itself healthy while telling nobody anything.
        # Context-managed: the bare open() leaked the handle (py/file-not-closed,
        # the one true positive in factory-gitops' first CodeQL baseline).
        if os.path.exists(__file__):
            with open(__file__) as _self_src:
                src = _self_src.read()
        else:
            src = ""
        if src:
            # Sliced at _selftest, not to end-of-file: the assertions below name
            # the very strings they forbid, so an unbounded slice matches its own
            # source and the check reports a failure it invented itself.
            body_of_main = src.split("def main() -> int:", 1)[1].split(
                "def _selftest", 1)[0]
            assert body_of_main.index("sent = notify(") < body_of_main.index(
                "stamp = heartbeat("), "heartbeat must be stamped AFTER notify"
            assert body_of_main.index("emit(oo,") < body_of_main.index(
                "sent = notify("), "emit still comes first; a dropped record is a blind spot"

            # THE SCOPE CONSTRAINT, also asserted on the source (Factory#571).
            # The watchdog must list CronJobs and Jobs from the all-namespaces
            # collection endpoints. A per-namespace path silently shrinks what is
            # watched WITHOUT failing anything: the run still goes green, the
            # stream still fills, the heartbeat is still stamped, and the
            # CronJobs outside the scope simply have no monitor. That is exactly
            # how fides/#567 stayed invisible for five days, and it is invisible
            # by construction, so it gets a test rather than a comment.
            assert "/apis/batch/v1/cronjobs" in body_of_main, \
                "must list CronJobs cluster-wide"
            assert "/apis/batch/v1/jobs" in body_of_main, \
                "must list Jobs cluster-wide"
            assert "/apis/batch/v1/namespaces/" not in body_of_main, \
                "a per-namespace list re-creates the unwatched-namespace blind spot"

            # THE ARGOCD RECORD MUST BE PRODUCED (Factory#443), and asserted on
            # the source for the same reason as the two above: dropping the
            # append is invisible from every other angle. Every CronJob record
            # still lands, the run still goes green, the heartbeat is still
            # stamped, and the only difference is that a stalled controller has
            # nothing watching it again.
            assert "assess_argocd(" in body_of_main, \
                "main must produce the ArgoCD reconciliation record"
            assert "/apis/argoproj.io/v1alpha1/applications" in body_of_main, \
                "must list Applications cluster-wide"
            # ...and its failure must NOT be able to abort the run: the CronJob
            # findings and the heartbeat outrank it.
            assert "apps, apps_err = [], repr(e)" in body_of_main, \
                "an unreadable ArgoCD must degrade to a finding, not a dead run"

            # Same three, for the termination records (Factory#598). Dropping the
            # `records +=` is invisible from every other angle: every other
            # record still lands, the run still goes green, the heartbeat is
            # still stamped, and the only difference is that container kills stop
            # being attributed — which is the exact state #598 was filed about.
            assert "assess_pod_terminations(" in body_of_main, \
                "main must produce the container-termination records"
            assert "/api/v1/pods" in body_of_main and "/api/v1/nodes" in body_of_main, \
                "must list pods AND nodes: the node conditions are the attribution"
            assert "pods, nodes, pods_err = [], [], repr(e)" in body_of_main, \
                "an unreadable pod list must degrade to a finding, not a dead run"

            # Factory#603 / #613, and for the same invisible-from-every-other-
            # angle reason as the four above: drop either call and every other
            # record still lands, the run still goes green and the heartbeat is
            # still stamped. The only difference is that bare Jobs go back to
            # having no monitor and orphaned pods go back to being nobody's.
            assert "assess_bare_jobs(" in body_of_main, \
                "main must score the Jobs with no CronJob owner"
            assert "assess_orphan_pods(" in body_of_main and \
                "reap_pod" in body_of_main, \
                "main must reap orphaned pods, not merely describe them"
            # The reap must never run off an empty pod list: an unreadable list
            # is already a critical, and deleting on the strength of it is the
            # one mistake in this file with a blast radius.
            assert "if pods_err is None:" in body_of_main, \
                "reaping must be skipped when the pod list could not be read"

        # Same-named CronJobs in two namespaces must stay two findings, not one.
        # Cluster-wide listing makes name collisions reachable for the first
        # time; if the issue marker collided, the second namespace's outage would
        # be silently absorbed into the first one's issue and never reported.
        a = dict(cj("reporter", "*/10 * * * *", last_ok="2026-06-01T00:00:00Z"))
        b = dict(cj("reporter", "*/10 * * * *", last_ok="2026-06-01T00:00:00Z"))
        a["metadata"] = {**a["metadata"], "namespace": "fides", "uid": "uid-a"}
        b["metadata"] = {**b["metadata"], "namespace": "fides-reporter", "uid": "uid-b"}
        ra, rb = assess(a, [], now, 2), assess(b, [], now, 2)
        assert ra["namespace"] == "fides" and rb["namespace"] == "fides-reporter"
        assert ra["cronjob"] == rb["cronjob"] == "reporter"
        assert MARKER.format(ns=ra["namespace"], name=ra["cronjob"]) != \
            MARKER.format(ns=rb["namespace"], name=rb["cronjob"]), \
            "same-named CronJobs in different namespaces must not share an issue"
        assert severity_of(ra) is not None, "a long-stale CronJob must still be a finding"

        # ---- Factory#443 / factory-gitops#138: ArgoCD stopped reconciling ----
        #
        # THE INCIDENT, as it actually was. The controller was stranded on a
        # NotReady node from 03:17Z on 2026-08-06 and nothing reconciled for six
        # hours, while every Application reported Synced/Healthy. The measured
        # numbers from the issue, reproduced here: reconciledAt frozen at
        # 03:13:27Z, read at 09:40:13Z.
        def app(reconciled, sync="Synced", health="Healthy"):
            return {
                "metadata": {"name": "pfactory", "namespace": "argocd"},
                "status": {
                    "sync": {"status": sync, "revision": "5c53892"},
                    "health": {"status": health},
                    **({"reconciledAt": reconciled} if reconciled else {}),
                },
            }

        outage = datetime(2026, 8, 6, 9, 40, 13, tzinfo=timezone.utc)
        stalled = assess_argocd([app("2026-08-06T03:13:27Z")], None, outage, 900)
        assert stalled["status"] == "reconcile_stalled", stalled
        assert severity_of(stalled) == "critical", stalled
        assert stalled["last_success_age_seconds"] == 23206, stalled
        # The record must say WHY Synced/Healthy is not a contradiction, because
        # that is the whole reason six hours passed.
        assert "cached" in stalled["problems"][0], stalled
        # ...and the title is the part that reaches a phone.
        assert issue_title(stalled, "critical") == (
            "[critical] argocd-application-controller has stopped reconciling "
            "— every Synced is stale"), issue_title(stalled, "critical")

        # ONE record for 35 stalled Applications, not 35. An alert that arrives
        # 35-at-a-time for one fault is CFactory#306 by volume.
        many = assess_argocd([app("2026-08-06T03:13:27Z")] * 35, None, outage, 900)
        assert many["applications"] == 35 and many["status"] == "reconcile_stalled"
        assert MARKER.format(ns=many["namespace"], name=many["cronjob"]) == \
            "<!-- job-watchdog:argocd/argocd-application-controller -->", many

        # THE OTHER DIRECTION, and it is the one that decides whether anyone
        # still reads this alert in a month. Live-measured on 2026-08-07: the
        # controller sweeps every Application in one burst, so the freshest
        # reconcile cycles 0 -> ~180s and the oldest peaks near 340s. NONE of
        # that may fire.
        healthy_now = datetime(2026, 8, 7, 12, 56, 8, tzinfo=timezone.utc)
        normal = assess_argocd(
            [app("2026-08-07T12:49:57Z"),   # 371s — the oldest measured
             app("2026-08-07T12:52:56Z"),   # 192s
             app("2026-08-07T12:55:56Z")],  # 12s  — the freshest
            None, healthy_now, 900)
        assert normal["status"] == "ok", normal
        assert normal["codes"] == [] and normal["problems"] == [], normal
        assert severity_of(normal) is None, "a reconciling controller must be silent"
        assert normal["last_success_age_seconds"] == 12, normal
        assert normal["oldest_reconcile_age_seconds"] == 371, normal
        # A single app far behind the rest is NOT this finding — apps/argocd-drift
        # owns per-app drift. Only the controller having stopped is.
        lagging = assess_argocd(
            [app("2026-08-06T03:13:27Z"), app("2026-08-07T12:55:56Z")],
            None, healthy_now, 900)
        assert lagging["status"] == "ok", lagging

        # THE MUTATION PAIR. One second inside tolerance is silence; one second
        # outside is a critical. A comparison stuck on either constant, or a
        # tolerance that swallowed everything, passes one line and fails the
        # other.
        edge = datetime(2026, 8, 7, 12, 0, 0, tzinfo=timezone.utc)
        assert assess_argocd([app("2026-08-07T11:45:01Z")], None, edge, 900)[
            "status"] == "ok"                       # 899s
        assert assess_argocd([app("2026-08-07T11:44:59Z")], None, edge, 900)[
            "status"] == "reconcile_stalled"        # 901s

        # FAILS CLOSED, both ways. "I could not check" must never leave the same
        # trace as "I checked and it was fine" — RBAC revoked, CRD gone, ArgoCD
        # uninstalled all land here.
        blind = assess_argocd([], "HTTPError(403)", edge, 900)
        assert blind["status"] == "reconcile_unreadable", blind
        assert severity_of(blind) == "critical", blind
        assert "403" in blind["problems"][0], blind
        # Applications that exist but have never been reconciled are a finding,
        # not an empty list quietly reported ok.
        assert assess_argocd([app(None), app(None)], None, edge, 900)[
            "status"] == "reconcile_unreadable"
        # An empty cluster is unreadable too — zero Applications means zero
        # evidence, and DEFINITELY not health.
        assert assess_argocd([], None, edge, 900)["status"] == "reconcile_unreadable"

        # A stalled controller must open exactly one issue, and a recovered one
        # must CLOSE it. notify_action being right is not enough on its own —
        # see the CronJob equivalent above — so drive it through both states.
        assert notify_action(stalled, None, outage, 24) == "open"
        assert notify_action(stalled, iss("critical", "2026-08-06T09:30:00Z"),
                             outage, 24) is None, "already reported must not repeat"
        assert notify_action(normal, iss("critical", "2026-08-06T09:30:00Z"),
                             healthy_now, 24) == "close"

        # The issue body must not carry CronJob furniture no reader can act on,
        # and MUST carry the reconcile numbers. A shared template that quietly
        # printed "Surviving Jobs: 0" for a dead controller is how a real alert
        # starts reading like a template.
        body = issue_body(stalled, "critical")
        assert "Surviving Jobs" not in body and "schedule ``" not in body, body
        assert "Freshest reconcile: 6.4h ago" in body, body
        assert "Applications seen: 1" in body, body
        assert "kubectl --context factory -n argocd get pods" in body, body
        # ...and the CronJob body must not have lost its own furniture either.
        cron_body = issue_body(ra, "critical")
        assert "Surviving Jobs" in cron_body and "Last success" in cron_body

        # ---- CONTAINER TERMINATIONS (Factory#598) ---------------------------
        #
        # The fixture is the real 2026-08-06 incident, transcribed from the live
        # cluster: six containers in three namespaces, `Unknown`/255, in two
        # bursts 89 seconds apart, all on k3d-agent-0-0, whose kubelet
        # re-registered at 14:44:07 — 2m9s after the second burst.
        def term_pod(ns, name, container, node, reason, code, when, *,
                     where="lastState", restarts=1, pod_reason=None):
            t = {"reason": reason, "exitCode": code, "finishedAt": when}
            return {
                "metadata": {"name": name, "namespace": ns},
                "spec": {"nodeName": node},
                "status": {
                    **({"reason": pod_reason} if pod_reason else {}),
                    "containerStatuses": [{
                        "name": container, "restartCount": restarts,
                        where: {"terminated": t},
                    }],
                },
            }

        def term_node(name, ready_at, *, pressure=None):
            conds = [{"type": "Ready", "status": "True", "reason": "KubeletReady",
                      "lastTransitionTime": ready_at}]
            for p in ("MemoryPressure", "DiskPressure", "PIDPressure"):
                conds.append({"type": p,
                              "status": "True" if p == pressure else "False",
                              "reason": "x", "lastTransitionTime": ready_at})
            return {"metadata": {"name": name}, "status": {"conditions": conds}}

        # 1. THE ATTRIBUTION TABLE. Every one of these lands on exit 255 or a
        #    bare non-zero code in the raw data, which is why the code alone can
        #    never be the answer.
        assert attribute_termination({"reason": "Unknown", "exitCode": 255},
                                     None)[0] == "runtime_lost"
        assert attribute_termination({"reason": "ContainerStatusUnknown",
                                      "exitCode": 255}, None)[0] == "runtime_lost"
        assert attribute_termination({"reason": "OOMKilled", "exitCode": 137},
                                     None)[0] == "oom_killed"
        assert attribute_termination({"reason": "Error", "exitCode": 143},
                                     None)[0] == "signalled"
        assert attribute_termination({"reason": "Error", "exitCode": 137},
                                     None)[0] == "signalled"
        assert attribute_termination({"reason": "Error", "exitCode": 3},
                                     None)[0] == "app_error"
        assert attribute_termination({"reason": "DeadlineExceeded", "exitCode": 1},
                                     None)[0] == "deadline_exceeded"
        # Eviction is stamped on the POD, and reads as an ordinary exit without it.
        assert attribute_termination({"reason": "Error", "exitCode": 137},
                                     "Evicted")[0] == "evicted"
        # Factory#431: a reason with no rule is NOT dressed up as an app error.
        assert attribute_termination({"reason": "BrandNewReason", "exitCode": 42},
                                     None)[0] == "unattributed"

        incident = datetime(2026, 8, 6, 14, 50, tzinfo=timezone.utc)
        agent = term_node("k3d-agent-0-0", "2026-08-06T14:44:07Z")
        kills = [
            term_pod("argocd", "argocd-redis-868dbb7cf4-dmfnw", "redis",
                     "k3d-agent-0-0", "Unknown", 255, "2026-08-06T14:40:29Z"),
            term_pod("argocd", "argocd-notifications-controller-6c65b4b9f6-6d2ql",
                     "argocd-notifications-controller", "k3d-agent-0-0",
                     "Unknown", 255, "2026-08-06T14:40:29Z"),
            term_pod("factory", "nfs-provisioner-866dd8d944-mptfm",
                     "nfs-provisioner", "k3d-agent-0-0", "Unknown", 255,
                     "2026-08-06T14:41:58Z"),
            # Still down, and recorded on `state` rather than `lastState`. The
            # hand sweep of this incident missed exactly this pod by reading only
            # lastState, so a regression here would recreate a real blind spot.
            term_pod("factory", "fleet-match-29767120-98nzc", "match",
                     "k3d-agent-0-0", "Unknown", 255, "2026-08-06T14:41:58Z",
                     where="state", restarts=0),
            term_pod("fides", "fides-db-54fdd777db-vm9lb", "postgres",
                     "k3d-agent-0-0", "Unknown", 255, "2026-08-06T14:41:58Z",
                     restarts=3),
        ]

        # 2. ONE FINDING FOR ONE NODE-LEVEL CAUSE, not five. The fan-out argument
        #    that makes the ArgoCD record one-per-controller applies identically.
        recs = assess_pod_terminations(kills, [agent], None, incident)
        assert len(recs) == 1, [r["cronjob"] for r in recs]
        lost = recs[0]
        assert lost["status"] == "runtime_lost", lost
        assert lost["cronjob"] == f"{KILL_PREFIX}node/k3d-agent-0-0/runtime_lost"
        assert lost["namespace"] == "cluster"
        assert len(lost["victims"]) == 5, lost["victims"]
        assert {v["namespace"] for v in lost["victims"]} == {
            "argocd", "factory", "fides"}, "the kill crossed namespaces"
        assert severity_of(lost) == "critical", "a node losing containers is critical"

        # 3. IT NAMES THE KILLER, and corroborates it with the node's own clock.
        #    A finding that says "exit 255" and stops is the defect, not the fix.
        blob = " ".join(lost["problems"])
        assert "CONTAINER RUNTIME LOST" in blob, blob
        assert "which is what lost the container" in blob, blob
        assert "2026-08-06T14:44:07Z" in blob and "2m" in blob, blob
        assert "not an application exit" in blob, blob

        # 4. AND IT DOES NOT OVERCLAIM. The same node transition sits next to an
        #    app that exited 1 four minutes later; that is context, not cause.
        app_rec = assess_pod_terminations(
            [term_pod("factory", "cloudflared-x", "cloudflared", "k3d-agent-0-0",
                      "Error", 1, "2026-08-06T14:47:29Z")],
            [agent], None, incident)[0]
        assert app_rec["status"] == "app_error"
        assert "Context, not the cause" in " ".join(app_rec["problems"])
        # ...and an ordinary non-zero exit must NEVER reach a human. If it did,
        # every failed build in the fleet would be an issue and the ones that
        # matter would be buried — the cry-wolf failure, restated.
        assert app_rec["codes"] == [], app_rec
        assert severity_of(app_rec) is None, "app_error must not notify"
        assert notify_action(app_rec, None, incident, 24) is None

        # 5. PER-CONTAINER CAUSES DO NOT GROUP. Five OOMs on one node are five
        #    faults; merging them would hide four behind one memory limit.
        ooms = assess_pod_terminations(
            [term_pod("factory", f"hog-{i}", "app", "k3d-agent-0-0",
                      "OOMKilled", 137, "2026-08-06T14:41:00Z") for i in range(3)],
            [agent], None, incident)
        assert len(ooms) == 3, [r["cronjob"] for r in ooms]
        assert all(r["status"] == "oom_killed" for r in ooms)
        assert all(severity_of(r) == "critical" for r in ooms)
        # Warning-grade causes stay warnings: a SIGTERM is not a node fault.
        sigterm = assess_pod_terminations(
            [term_pod("factory", "app-1", "app", "k3d-agent-0-0", "Error", 143,
                      "2026-08-06T14:41:00Z")], [agent], None, incident)[0]
        assert severity_of(sigterm) == "warning", sigterm

        # 6. QUIET WHEN NOTHING IS WRONG — the half that decides whether anyone
        #    still reads this label in a month. The same six kills, a day later:
        #    outside the window, nothing is reported at all.
        later = datetime(2026, 8, 7, 14, 50, tzinfo=timezone.utc)
        assert assess_pod_terminations(kills, [agent], None, later) == []
        # A clean exit 0 is not a kill even inside the window.
        assert assess_pod_terminations(
            [term_pod("factory", "done", "c", "k3d-agent-0-0", "Completed", 0,
                      "2026-08-06T14:41:00Z", where="state")],
            [agent], None, incident) == []
        # An empty cluster reports nothing rather than something reassuring.
        assert assess_pod_terminations([], [agent], None, incident) == []

        # 7. FAILING CLOSED. An unreadable pod list is a critical finding, never
        #    a clean run: "nothing is watching" must not look like "nothing
        #    happened", which is the whole thesis of this app.
        blind = assess_pod_terminations([], [], "HTTPError(403)", incident)
        assert len(blind) == 1 and blind[0]["status"] == "terminations_unreadable"
        assert severity_of(blind[0]) == "critical"
        assert "403" in " ".join(blind[0]["problems"])

        # 8. NODE PRESSURE IS REPORTED WHEN PRESENT, and its absence is stated as
        #    absence-now rather than absence-then. Node conditions carry no
        #    history, and pretending otherwise would be the confident-wrong
        #    attribution again.
        hot = assess_pod_terminations(
            kills, [term_node("k3d-agent-0-0", "2026-08-06T14:44:07Z",
                              pressure="DiskPressure")], None, incident)[0]
        assert "DiskPressure=True" in " ".join(hot["problems"])
        assert "carry no history" in " ".join(lost["problems"])
        # A vanished node must not silently drop the finding.
        orphan = assess_pod_terminations(kills, [], None, incident)[0]
        assert "no longer in the cluster" in " ".join(orphan["problems"])

        # 9. THE ISSUE BODY carries the evidence, because `lastState` is destroyed
        #    the moment the pod is replaced and the events age out in an hour.
        #    Transcribing it is the only thing that outlives the incident.
        kill_body = issue_body(lost, "critical")
        assert "fides-db-54fdd777db-vm9lb" in kill_body, kill_body
        assert "`Unknown`" in kill_body and "`255`" in kill_body
        assert "Surviving Jobs" not in kill_body, "CronJob furniture leaked"
        assert "Freshest reconcile" not in kill_body, "ArgoCD furniture leaked"
        assert "absence of recurrence" in kill_body
        assert issue_title(lost, "critical").startswith(
            "[critical] kill/node/k3d-agent-0-0/runtime_lost lost containers")
        # Every code that can notify must have a title phrase, or issue_title
        # raises mid-incident and the notification is lost at the worst moment.
        for c in NOTIFY_CODES | {"terminations_unreadable"}:
            assert c in TITLE_PHRASE, c

        # 10. CLOSE-ON-ABSENCE. An event does not recover, so it must never be
        #     closed as "healthy again" — but it must still close, or a channel
        #     that only ever accumulates teaches people to ignore the label.
        kill_marker = MARKER.format(ns=lost["namespace"], name=lost["cronjob"])
        assert f"/{KILL_PREFIX}" in kill_marker, kill_marker
        cron_marker = MARKER.format(ns="factory", name="cred-broker")
        assert f"/{KILL_PREFIX}" not in cron_marker, cron_marker
        # A live finding is never swept: it is still in `records`, so the
        # absence rule cannot fire on something that is currently happening.
        assert kill_marker in {
            MARKER.format(ns=r["namespace"], name=r["cronjob"]) for r in recs}

        # ---- BARE JOBS (Factory#603) ----------------------------------------
        #
        # The live case is `minio-create-bucket`: an ArgoCD PostSync hook with no
        # CronJob owner, fixed by Factory#508 to fail loudly, watched by nothing.
        # Enumerating CronJobs could never see it, and job_state() calls an
        # unfinished Job `active` so a hang was nobody's problem either.
        def bare(name, *, state="active", started="2026-07-26T11:00:00Z",
                 completed=None, failed=0, owner=None):
            if state == "succeeded":
                st = {"succeeded": 1, "completionTime": completed,
                      "conditions": [{"type": "Complete", "status": "True"}]}
            elif state == "failed":
                st = {"failed": failed or 1,
                      "conditions": [{"type": "Failed", "status": "True"}]}
            else:
                st = {"active": 1}
            st["startTime"] = started
            return {
                "metadata": {
                    "name": name, "namespace": "factory",
                    "creationTimestamp": started,
                    **({"ownerReferences": [{"kind": "CronJob", "uid": owner}]}
                       if owner else {}),
                },
                "spec": {"backoffLimit": 0},
                "status": st,
            }

        # 1. A FAILED bare Job is a CRITICAL, because it is terminal: no
        #    controller retries it and there is no next run to clear it.
        mc = assess_bare_jobs([bare("minio-create-bucket", state="failed")], now)[0]
        assert len(assess_bare_jobs([bare("x", state="failed")], now)) == 1
        assert mc["status"] == "job_failed", mc
        assert mc["kind"] == "Job" and mc["cronjob"] == "job/minio-create-bucket"
        assert severity_of(mc) == "critical", mc
        assert notify_action(mc, None, now, 24) == "open"

        # 2. A SUCCEEDED one is silent. The record is still emitted — that is
        #    what lets a recovered Job close its own issue below — but it says
        #    nothing to anyone.
        ok_job = assess_bare_jobs(
            [bare("minio-create-bucket", state="succeeded",
                  completed="2026-07-26T11:55:00Z")], now)[0]
        assert ok_job["status"] == "ok", ok_job
        assert severity_of(ok_job) is None
        assert notify_action(ok_job, None, now, 24) is None
        assert ok_job["last_success_age_seconds"] == 300, ok_job

        # 3. THE HANG, which is the failure mode no exit code will ever report,
        #    and the reason a flat severity would be wrong. Three grades, and
        #    the boundaries are mutation pairs: one second either side.
        def state_at(started):
            return assess_bare_jobs([bare("h", started=started)], now)[0]["status"]

        assert state_at("2026-07-26T11:00:00Z") == "ok"          # 3600s exactly
        assert state_at("2026-07-26T10:59:59Z") == "job_stuck"    # 3601s
        assert state_at("2026-07-26T08:00:00Z") == "job_stuck"    # 14400s exactly
        assert state_at("2026-07-26T07:59:59Z") == "job_wedged"   # 14401s
        stuck = assess_bare_jobs([bare("h", started="2026-07-26T10:00:00Z")], now)[0]
        wedged = assess_bare_jobs([bare("h", started="2026-07-26T00:00:00Z")], now)[0]
        # A Job an hour over may still finish; one four times over will not.
        # Grading both critical is the cry-wolf failure, grading both warning
        # means a week-long hang never re-surfaces after one quiet comment.
        assert severity_of(stuck) == "warning", stuck
        assert severity_of(wedged) == "critical", wedged
        # It escalates ITSELF as the clock runs, with nothing to remember.
        assert notify_action(wedged, iss("warning", "2026-07-26T11:59:00Z"),
                             now, 24) == "escalate"

        # 4. CronJob-OWNED JOBS ARE NOT SCORED HERE. Their hang already surfaces
        #    one layer up as their CronJob's last success ageing out, and a
        #    second issue beside the CronJob's own for one fault is the fan-out
        #    this app argues against everywhere else.
        assert assess_bare_jobs([bare("cb-1", owner="cred-broker")], now) == []
        assert len(assess_bare_jobs(
            [bare("cb-1", owner="cred-broker"), bare("hook")], now)) == 1

        # 5. The dedup key cannot collide with a same-named CronJob. Without the
        #    prefix, a bare Job called `cred-broker` would silently absorb the
        #    CronJob's outage into its own issue.
        assert MARKER.format(ns="factory", name=mc["cronjob"]) != \
            MARKER.format(ns="factory", name="minio-create-bucket")

        # 6. THE BODY carries Job furniture and none of anyone else's.
        jbody = issue_body(mc, "critical")
        assert "Owner: **none**" in jbody, jbody
        assert "Job state: `failed`" in jbody, jbody
        assert "Surviving Jobs" not in jbody and "Freshest reconcile" not in jbody
        assert "Synced` describes the manifest" in jbody, jbody
        assert issue_title(mc, "critical") == (
            "[critical] job/minio-create-bucket FAILED and nothing will retry it "
            "— it is a one-shot Job with no CronJob owner"), issue_title(mc, "critical")

        # 7. CLOSE-ON-ABSENCE, driven through notify() rather than trusted. A
        #    stuck Job that finishes CLOSES its issue; a finding that can open
        #    and never close is worse than no alert at all.
        calls.clear()
        stub_issues.clear()
        globals()["gh"] = fake_gh
        try:
            assert notify("t", "o/r", [stuck], now, 24) == 1
            assert writes() == [("POST", "/repos/o/r/issues")], writes()
            stub_issues.append({
                "number": 7, "title": "t", "created_at": "2026-07-26T11:00:00Z",
                "updated_at": "2026-07-26T11:00:00Z",
                "body": issue_body(stuck, "warning"),
                "labels": [{"name": ISSUE_LABEL},
                           {"name": SEVERITY_LABELS["warning"]}]})
            # Still stuck: reported once, then completely quiet.
            calls.clear()
            assert notify("t", "o/r", [stuck], now, 24) == 0
            assert not writes(), writes()
            # It finished. Comment + close, on the ordinary recovery path.
            calls.clear()
            done = assess_bare_jobs(
                [bare("h", state="succeeded", started="2026-07-26T10:00:00Z",
                      completed="2026-07-26T11:58:00Z")], now)[0]
            assert notify("t", "o/r", [done], now, 24) == 1
            assert writes() == [("POST", "/repos/o/r/issues/7/comments"),
                                ("PATCH", "/repos/o/r/issues/7")], writes()
        finally:
            globals()["gh"] = real_gh

        # ---- ORPHANED PODS (Factory#613) ------------------------------------
        #
        # The live case: `k3d-agent-0-0` was stranded by the nightly
        # nixos-upgrade on 2026-08-06, came back Ready at 14:44:07Z, and
        # `fleet-match-29767120-98nzc` sat `Unknown` for 30h+ afterwards.
        # Nothing owns this: taint-based eviction only runs while the node is
        # NotReady, so once it recovers the stale row is permanent.
        # THE FIXTURE IS THE LIVE OBJECT, field for field, because the obvious
        # rule was wrong and only the live object said so. `kubectl get pods`
        # printed `Unknown` in the STATUS column for 30 hours; that is the
        # CONTAINER's state.terminated.reason. status.phase is `Failed`. A check
        # written as `phase == "Unknown"` matches this pod NOT AT ALL.
        def lost_pod(name, node, *, ns="factory", deleting=None, phase="Failed",
                     reason="Unknown", code=255, statuses=None):
            cs = ([] if statuses == [] else statuses or
                  [{"name": "match", "restartCount": 0, "state": {"terminated": {
                      "reason": reason, "exitCode": code,
                      "finishedAt": "2026-08-06T14:41:58Z"}}}])
            return {
                "metadata": {"name": name, "namespace": ns,
                             **({"deletionTimestamp": deleting} if deleting else {})},
                "spec": {"nodeName": node},
                "status": {"phase": phase, "containerStatuses": cs},
            }

        def notready(name, since):
            return {"metadata": {"name": name},
                    "status": {"conditions": [
                        {"type": "Ready", "status": "False",
                         "lastTransitionTime": since}]}}

        reaped: list = []

        def ok_reaper(ns, name):
            reaped.append((ns, name))
            return None

        def broken_reaper(ns, name):
            reaped.append((ns, name))
            return "HTTPError(403 Forbidden)"

        stranded = datetime(2026, 8, 7, 21, 0, tzinfo=timezone.utc)
        back = term_node("k3d-agent-0-0", "2026-08-06T14:44:07Z")
        orphan_pods = [lost_pod("fleet-match-29767120-98nzc", "k3d-agent-0-0")]

        # 0. THE REGRESSION THAT ALMOST SHIPPED. The live pod's phase is
        #    `Failed`, so the rule the issue describes matches nothing.
        assert orphan_pods[0]["status"]["phase"] == "Failed", "the live shape"
        assert abandoned_by_node(orphan_pods[0]), \
            "the discriminator is the runtime_lost attribution, NOT the phase"

        # 1. THE REAP. The node has been Ready for 30h and the kubelet never
        #    re-adopted this pod, so the row is STALE, not unknown.
        reaped.clear()
        rec = assess_orphan_pods(orphan_pods, [back], stranded, ok_reaper)[0]
        assert reaped == [("factory", "fleet-match-29767120-98nzc")], reaped
        assert rec["cronjob"] == "orphan/node/k3d-agent-0-0", rec
        # 2. ...AND IT SAYS NOTHING. Routine housekeeping that worked is evidence
        #    in the stream, never an issue: an issue per cleanup buries the
        #    findings that have no other witness. Same rule `app_error` gets.
        assert rec["status"] == "ok" and rec["codes"] == [], rec
        assert severity_of(rec) is None
        assert notify_action(rec, None, stranded, 24) is None

        # 3. A POD WHOSE NODE IS STILL DOWN IS NOT THE SAME THING and is left
        #    alone -- its status is unknown rather than wrong, the container may
        #    still be running, and deleting it only makes a Terminating ghost.
        reaped.clear()
        assert assess_orphan_pods(
            orphan_pods, [notready("k3d-agent-0-0", "2026-08-07T20:00:00Z")],
            stranded, ok_reaper) == []
        # Nor is one whose node only just came back: the kubelet re-adopts what
        # it can within seconds, and this is the window that lets it.
        assert assess_orphan_pods(
            orphan_pods, [term_node("k3d-agent-0-0", "2026-08-07T20:55:00Z")],
            stranded, ok_reaper) == []
        # Nor one whose node is no longer in the cluster at all.
        assert assess_orphan_pods(orphan_pods, [], stranded, ok_reaper) == []
        assert reaped == [], "nothing may be deleted in any of those three cases"

        # 4. THE MUTATION PAIR on the settle window: one second either side.
        edge_now = datetime(2026, 8, 7, 12, 0, 0, tzinfo=timezone.utc)
        assert assess_orphan_pods(
            orphan_pods, [term_node("k3d-agent-0-0", "2026-08-07T11:45:01Z")],
            edge_now, ok_reaper) == []                                   # 899s
        assert len(assess_orphan_pods(
            orphan_pods, [term_node("k3d-agent-0-0", "2026-08-07T11:44:59Z")],
            edge_now, ok_reaper)) == 1                                   # 901s

        # 5. THE GUARD THAT KEEPS A DELETE VERB SAFE, and the one assertion in
        #    this file with a blast radius behind it. A pod that reported its own
        #    exit status was NOT abandoned -- it failed, it is evidence, and
        #    whatever GC owns its history owns it. Five such `Error` pods are
        #    live in `factory` right now (cred-broker, trace-silence-check) and
        #    the fixtures below are their exact shape.
        reaped.clear()
        for reason, code in (("Error", 3), ("Error", 1), ("OOMKilled", 137),
                             ("DeadlineExceeded", 1), ("Completed", 0)):
            assert assess_orphan_pods(
                [lost_pod("real-failure", "k3d-agent-0-0", reason=reason,
                          code=code)],
                [back], stranded, ok_reaper) == [], (reason, code)
        # Nor a pod that is not terminal at all.
        for phase in ("Running", "Pending", "Succeeded"):
            assert assess_orphan_pods(
                [lost_pod("live", "k3d-agent-0-0", phase=phase)],
                [back], stranded, ok_reaper) == [], phase
        # Nor one whose containers cannot be read: a guess here deletes something.
        assert assess_orphan_pods(
            [lost_pod("opaque", "k3d-agent-0-0", statuses=[])],
            [back], stranded, ok_reaper) == []
        # A pod where ONE container was lost and another reported a real exit
        # code still carries evidence. `all`, not `any`.
        assert assess_orphan_pods(
            [lost_pod("mixed", "k3d-agent-0-0", statuses=[
                {"name": "a", "state": {"terminated": {
                    "reason": "Unknown", "exitCode": 255,
                    "finishedAt": "2026-08-06T14:41:58Z"}}},
                {"name": "b", "state": {"terminated": {
                    "reason": "Error", "exitCode": 7,
                    "finishedAt": "2026-08-06T14:41:58Z"}}}])],
            [back], stranded, ok_reaper) == []
        assert reaped == [], "nothing but an abandoned row may ever be deleted"
        # The classic NodeLost shape -- phase Unknown, no container status at
        # all -- is still covered; it is simply not the shape #613 turned out
        # to be.
        assert abandoned_by_node(
            {"status": {"phase": "Unknown"}}), "NodeLost must still be reaped"

        # 6. A REAP THAT DID NOT WORK IS A FINDING, and a warning rather than a
        #    critical: stale rows are not a workload being down.
        reaped.clear()
        refused = assess_orphan_pods(orphan_pods, [back], stranded, broken_reaper)[0]
        assert refused["status"] == "orphans_unreaped", refused
        assert severity_of(refused) == "warning", refused
        assert "403" in " ".join(refused["problems"]), refused
        assert notify_action(refused, None, stranded, 24) == "open"
        # A pod already asked to go and still here is reported, NOT deleted
        # again: reissuing a delete that did nothing is a silent no-op loop.
        reaped.clear()
        again = assess_orphan_pods(
            [lost_pod("fleet-match-29767120-98nzc", "k3d-agent-0-0",
                         deleting="2026-08-07T20:00:00Z")],
            [back], stranded, ok_reaper)[0]
        assert reaped == [], "a pod already Terminating must not be re-deleted"
        assert again["status"] == "orphans_unreaped", again
        assert "grace-period=0" in " ".join(again["problems"]), again

        # 7. ONE RECORD PER NODE. One node event strands many pods, and one
        #    issue per victim is CFactory#306 by volume.
        reaped.clear()
        many_recs = assess_orphan_pods(
            [lost_pod(f"p-{i}", "k3d-agent-0-0", ns=f"ns-{i}") for i in range(4)],
            [back], stranded, ok_reaper)
        assert len(many_recs) == 1 and len(many_recs[0]["victims"]) == 4
        assert len(reaped) == 4

        # 8. THE BODY, and its own furniture only.
        obody = issue_body(refused, "warning")
        assert "fleet-match-29767120-98nzc" in obody and "NO — " in obody
        assert "Surviving Jobs" not in obody and "Freshest reconcile" not in obody
        assert "Job state" not in obody, obody
        assert "taint-based eviction" in obody, obody

        # 9. CLOSE-ON-ABSENCE, again through notify(). The unreaped finding opens,
        #    the next run reaps successfully, and the issue CLOSES -- including
        #    the close comment, which has no "last success" to quote and must not
        #    raise while delivering a notification.
        calls.clear()
        stub_issues.clear()
        globals()["gh"] = fake_gh
        try:
            assert notify("t", "o/r", [refused], stranded, 24) == 1
            assert writes() == [("POST", "/repos/o/r/issues")], writes()
            stub_issues.append({
                "number": 8, "title": "t", "created_at": "2026-08-07T20:00:00Z",
                "updated_at": "2026-08-07T20:00:00Z",
                "body": issue_body(refused, "warning"),
                "labels": [{"name": ISSUE_LABEL},
                           {"name": SEVERITY_LABELS["warning"]}]})
            calls.clear()
            assert notify("t", "o/r", [rec], stranded, 24) == 1
            assert writes() == [("POST", "/repos/o/r/issues/8/comments"),
                                ("PATCH", "/repos/o/r/issues/8")], writes()
        finally:
            globals()["gh"] = real_gh

        # Every new code that can reach a human needs a title phrase, or
        # issue_title raises mid-incident and the notification is lost.
        for c in ("job_failed", "job_stuck", "job_wedged", "orphans_unreaped"):
            assert c in TITLE_PHRASE, c

        print("selftest OK")
        return 0


    if __name__ == "__main__":
        sys.exit(_selftest() if sys.argv[1:2] == ["selftest"] else main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: job-watchdog
  namespace: factory
  labels: { app: job-watchdog }
spec:
  # Every 30 minutes. The tightest thing it guards is cred-broker at 4-hourly, so
  # a broken rotation is recorded within half an hour of its second failed run
  # rather than seven weeks later. It emits to a stream, not a pager, so this
  # cadence costs ~300 small records a day and wakes nobody.
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata: { labels: { app: job-watchdog } }
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          serviceAccountName: job-watchdog
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watchdog
              # Stock python; the script is stdlib-only so no custom image.
              image: python:3.12-slim@sha256:646fb0bca3dd3ea1bcc6feb72c17ed16eed6e10cffc732fcc1478bd3e7f02d7b
              command: ["python3", "/script/watchdog.py"]
              env:
                - { name: FAIL_THRESHOLD, value: "2" }
                # 5x ArgoCD's 180s reconciliation interval (Factory#443), which
                # is the upstream default here because `timeout.reconciliation`
                # is unset in argocd-cm. The same number apps/argocd-drift has
                # used on the same field since 2026-07-30 without one false
                # positive in 54,217 records — and this one takes the minimum
                # age across Applications, so it is quieter still.
                - { name: RECONCILE_TOLERANCE_SECONDS, value: "900" }
                # 2x this CronJob's 30-minute period (Factory#598). A kill must
                # not be able to land between two runs and be seen by neither,
                # and the overlap costs only a repeated record for an already
                # de-duplicated finding.
                - { name: POD_TERMINATION_WINDOW_SECONDS, value: "3600" }
                # Factory#603. How long a bare Job may run before it is a
                # warning; 4x that (4h) and it is a critical. Deliberately
                # generous — the point is to catch a HANG, not to police slow
                # work, and a ceiling that fires on every long restore is muted
                # inside a week. The longest-running bare Job in this fleet is
                # minio-create-bucket, which completes in seconds.
                - { name: JOB_STUCK_SECONDS, value: "3600" }
                # Factory#613. How long a node must have been Ready before a pod
                # still `Unknown` on it is a stale row rather than an unknown
                # one. The kubelet re-adopts what it can within seconds of
                # re-registering; 15 minutes later it is not going to.
                - { name: ORPHAN_REAP_AFTER_SECONDS, value: "900" }
                - { name: OO_STREAM, value: "job_health" }
                - { name: OO_ORG, value: "default" }
                # Where unhealthy findings go so a human passively meets them.
                - { name: ALERT_REPO, value: "olafkfreund/Factory" }
                - { name: ALERT_RENOTIFY_HOURS, value: "24" }
                # Existing fleet token. No new secret, and no webhook URL is
                # committed anywhere — a URL in git that silently drops messages
                # would be this same bug wearing a convincing disguise.
                - name: GITHUB_TOKEN
                  valueFrom: { secretKeyRef: { name: factory-secrets, key: GITHUB_TOKEN } }
                # Same observe-root secret apps/audit-siem-forward already uses.
                - name: OO_USER
                  valueFrom: { secretKeyRef: { name: observe-root, key: email } }
                - name: OO_PASS
                  valueFrom: { secretKeyRef: { name: observe-root, key: password } }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 200m, memory: 128Mi }
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: job-watchdog-script
