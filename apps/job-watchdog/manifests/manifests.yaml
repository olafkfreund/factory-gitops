# CronJob health watchdog -> OpenObserve (Factory#381).
#
# THE DEFECT THIS CLOSES: cred-broker's stored credential expired 2026-06-07 and
# its 4-hourly rotation failed for ~7 weeks. Nothing noticed. It surfaced only
# because a human happened to run `kubectl get jobs`. Failed Jobs are GC'd
# (failedJobsHistoryLimit), so by the time anyone looked the evidence was gone.
#
# The existing "alert" jobs in this namespace alert by exiting non-zero. That is
# not an alert: an alert job whose alert is "the job failed", in a cluster where
# nothing watches job failures, is a no-op. This watchdog is the thing that
# actually watches, and it EMITS — a durable, queryable record per CronJob per
# run into the OpenObserve stream `job_health`.
#
# TWO SIGNALS, BECAUSE ONE IS NOT ENOUGH:
#   1. consecutive failures  — read from the Jobs the CronJob owns. Bounded by
#      failedJobsHistoryLimit: once Jobs are GC'd this signal goes blind.
#   2. STALENESS             — read from CronJob.status.lastSuccessfulTime /
#      lastScheduleTime, which live on the CronJob OBJECT and therefore SURVIVE
#      Job garbage collection entirely.
#   Signal 2 is the important one. "No news" must never read as OK — that is
#   exactly how seven weeks passed unnoticed. A CronJob whose Jobs have all been
#   GC'd, or that stopped being scheduled, or that has never once succeeded,
#   reports a problem, not silence.
#
# NO NEW DELIVERY PATH: OpenObserve (apps/observe) is already the SIEM and
# apps/audit-siem-forward already ships to it every 15 minutes and succeeds. This
# reuses that exact path and its exact credential pattern (observe-root secret,
# HTTP Basic, /api/{org}/{stream}/_json). No Prometheus, no Alertmanager — adding
# a metrics stack to fix a notification gap is the wrong trade.
#
# WHY IT EXITS 0 EVEN WHEN IT FINDS PROBLEMS: a watchdog that goes red on its
# findings is indistinguishable from a watchdog that is itself broken, and it
# would be repeating the very mistake this issue is about (using job failure as
# the alert channel). Non-zero here means ONLY "the watchdog could not do its
# job" — unreachable API server, or OpenObserve refused the record. The findings
# live in the stream.
#
# WHO WATCHES THE WATCHDOG (Factory#450): the previous answer here — "it is a
# CronJob in this namespace, so it reports on itself like any other" — was true
# only while the notification path worked, which is the one case where it is
# needed. If notify() fails permanently (token revoked, ALERT_REPO renamed,
# GitHub unreachable) then every run returns 5 before reaching the step that
# would have reported the previous run's failure, forever, and the only evidence
# is failed Jobs nobody is watching. Same shape if this CronJob is suspended or
# deleted: nothing emits, nothing notifies, and its absence is silence.
#
# A dead-man's switch cannot be built out of the thing it is watching, so the
# watchdog PUSHES A HEARTBEAT OUT instead: after a successful notify, it stamps
# a UTC timestamp into the GitHub Actions repo variable JOB_WATCHDOG_HEARTBEAT
# on ALERT_REPO. A scheduled workflow in that repo then asserts on the
# heartbeat's ABSENCE — it goes red when the stamp is missing or stale.
#
# Direction matters. The rejected alternative was GitHub Actions reaching INTO
# the cluster to read `job_health`, which needs an SSO-bypassing ingress on the
# audit log: new external attack surface, opened to close a monitoring gap.
# Pushing out needs no inbound reachability, no new credential (the same
# GITHUB_TOKEN it already uses for issues) and no new account. And it fails
# correctly for every case at once: notify broken, CronJob suspended, CronJob
# deleted, cluster down, node gone. All of them stop the stamp.
#
# THE ORDER IS THE WHOLE POINT: the stamp happens only AFTER notify() succeeds,
# never after the OpenObserve emit. Stamping after the emit would mean a
# watchdog that emits fine but cannot notify keeps its heartbeat fresh and
# reports itself healthy while telling nobody anything — which is precisely the
# defect this closes, rebuilt one layer in.
#
# A stamp that cannot be written FAILS THE RUN (exit 6). The heartbeat is part
# of the contract, not a nice-to-have: a gate that cannot run must fail. The
# stale heartbeat is the durable signal and the red Job is the immediate one.
#
# ROUTING TO A HUMAN (Factory#439): the durable record above was still
# functionally silent. The watchdog logged "postgres-backup has NEVER succeeded
# in 5.6d since creation" every 30 minutes for days, correctly, and the fleet ran
# with no database backup at all because the only reader of `job_health` is
# someone who already went looking — precisely the person who does not need it.
#
# So the watchdog now NOTIFIES, itself, directly. Two choices were on the table:
#
#   (1) an OpenObserve Alert + Destination on the `job_health` stream, or
#   (2) the watchdog posts on unhealthy.
#
# (2), for two reasons. First, a notification chain whose first link is the
# subsystem most likely to be misconfigured is a poor chain — if OpenObserve
# alerting breaks, or is never configured, it breaks silently and we are back
# here a third time. (The live cluster had ZERO destinations and ZERO alerts
# defined; option 1 was never actually armed.) Second, OpenObserve alert config
# is imperative API state that lives nowhere in git, so it would drift out of
# this GitOps repo the moment anyone touched it.
#
# THE DESTINATION IS A GITHUB ISSUE on the repo named by ALERT_REPO, because a
# real channel that already exists beats a better channel that does not. No Slack
# webhook, SMTP relay or pager endpoint exists anywhere in this fleet — the
# previous revision of this file said so and declined to invent one, which was
# right. GitHub issues need no new secret (the fleet GITHUB_TOKEN is already in
# factory-secrets), reach the maintainer by notification and email without anyone
# going looking, and are where every other fleet fault — #437, #438, #439 itself
# — is already tracked and worked. When a webhook endpoint does exist, it belongs
# alongside this, not instead of it.
#
# TWO SEVERITIES, because "this backup has NEVER worked" must not sit level with
# one transient failed run:
#   critical (never_succeeded, stale) — the job's purpose is NOT being served and
#       no success is within tolerance. Opens an issue and RE-COMMENTS every
#       ALERT_RENOTIFY_HOURS while it persists, so a long outage keeps surfacing
#       instead of sinking down the issue list.
#   warning  (failing, not_scheduled, suspended) — misbehaving, but a success is
#       still inside its tolerance window or a human suspended it on purpose.
#       Opens an issue, then stays quiet. It escalates itself to critical when
#       the last success finally ages out.
#
# AND IT SHUTS UP. A healthy CronJob produces zero GitHub traffic; an already
# reported one produces zero until it escalates or the re-notify window elapses;
# a recovered one gets a comment and its issue CLOSED. An alarm that fires every
# 30 minutes is muted within a week, which is this same bug by another route.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-watchdog
  namespace: factory
  labels: { app: job-watchdog }
---
# Read-only, and still only the two resource kinds the watchdog reads — it never
# needs to create, patch or delete anything.
#
# WHY THIS IS A ClusterRole AND NOT THE NAMESPACED Role IT USED TO BE (Factory#571).
# A namespaced Role scoped the watchdog to `factory`, which quietly meant the
# CronJobs in every OTHER namespace had no monitor at all. That is not a
# hypothetical: `fides/fides-server-updater` sat wedged for over five days
# (Factory#567) and `fides-reporter` failed repeatedly, and the watchdog reported
# neither, because it could not see them. A monitor with an invisible edge
# reports "all healthy" for the part of the cluster it is not looking at, which
# is the same false green this app exists to abolish.
#
# Least privilege is preserved where it counts: list/get on two resource kinds,
# no write verb anywhere, no secrets, no pods, no exec. The scope widens; the
# power does not.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-watchdog
  labels: { app: job-watchdog }
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: job-watchdog
  labels: { app: job-watchdog }
subjects:
  - kind: ServiceAccount
    name: job-watchdog
    namespace: factory
roleRef:
  kind: ClusterRole
  name: job-watchdog
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: job-watchdog-script
  namespace: factory
  labels: { app: job-watchdog }
data:
  watchdog.py: |
    #!/usr/bin/env python3
    """Report the health of every CronJob in the CLUSTER to OpenObserve (#381).

    For each CronJob it emits one record to the `job_health` stream carrying:
    consecutive failure count, age of the last SUCCESS, age of the last SCHEDULE,
    the expected period derived from the cron schedule, and a status.

    Staleness is the load-bearing signal. Consecutive-failure counting can only
    see Jobs that still exist, and failed Jobs are garbage collected — that is
    how cred-broker failed for seven weeks undetected. The last-success and
    last-schedule timestamps live on the CronJob's own status subresource, so
    they remain true long after every Job has been reaped. A CronJob with no
    surviving Jobs is therefore NOT reported healthy: it is reported stale.

    Unhealthy CronJobs are then ROUTED TO A HUMAN as a GitHub issue (#439). The
    stream alone was not a notification: it was read by nobody for days while the
    fleet ran with no database backup at all.

    Finally it stamps a HEARTBEAT out to a GitHub Actions repo variable, so that
    a scheduled workflow outside the cluster can go red on the watchdog's own
    silence (#450). Only after the notification succeeded — see the manifest
    header.

    Exit codes: 0 = reported (whatever the findings), 2 = no OpenObserve
    credentials, 3 = kubernetes API unreachable, 4 = OpenObserve ingest failed,
    5 = notification could not be delivered, 6 = heartbeat could not be stamped.
    A non-zero exit means THIS JOB is broken, never that a watched job is. 5 and
    6 count as much as the rest: an alert path that is not proven to deliver is
    the same bug one layer up, so neither an undelivered notification nor an
    unprovable liveness is ever a logged warning.

    Env:
      FAIL_THRESHOLD        consecutive failures before status=failing (2)
      OBSERVE_URL           OpenObserve base url (default in-cluster service)
      OO_ORG                OpenObserve organization (default "default")
      OO_STREAM             target stream (default "job_health")
      OO_USER/OO_PASS       OpenObserve login (from the observe-root secret)
      ALERT_REPO            owner/repo to raise issues on
      ALERT_RENOTIFY_HOURS  re-comment cadence for critical (default 24)
      GITHUB_TOKEN          token with `repo` scope on ALERT_REPO
      HEARTBEAT_VAR         Actions variable to stamp on ALERT_REPO
                            (default "JOB_WATCHDOG_HEARTBEAT")
    """

    import base64
    import json
    import os
    import ssl
    import sys
    import urllib.error
    import urllib.request
    from datetime import datetime, timezone

    SA = "/var/run/secrets/kubernetes.io/serviceaccount"

    # A CronJob is judged against its OWN cadence: tolerance = 2 periods + grace.
    # Two periods means one entirely missed run is forgiven (a k3d box reboots,
    # a node is briefly gone) but two are not.
    #
    # The grace absorbs scheduler jitter, startingDeadlineSeconds and image pull,
    # and is CAPPED AT ONE PERIOD. It used to be a flat 900s, which the induced
    # failure test caught: on a 1-minute CronJob that produced a 17-MINUTE blind
    # window, and a canary with zero surviving Jobs and no recorded success ever
    # was cheerfully reported "ok" for 17 straight runs. A fixed grace is only
    # small relative to slow jobs; against fast ones it IS the blind spot this
    # whole app exists to remove.
    PERIOD_MULTIPLIER = 2
    GRACE_SECONDS = 900


    def tolerance_for(period: int) -> int:
        return PERIOD_MULTIPLIER * period + min(GRACE_SECONDS, period)

    # Escape hatch for schedules the estimator below reads wrongly (exotic cron
    # with ranges/lists). Set it on the CronJob and the estimate is ignored.
    # ponytail: none of the current five need it; it is the calibration knob for
    # the one that eventually will, because real schedules are messier than a
    # parser.
    PERIOD_ANNOTATION = "factory.dev/expected-period-seconds"

    # Which findings are CRITICAL. Both mean the same thing in different words:
    # the work this CronJob exists to do is not being done, and no success sits
    # inside its tolerance window. `never_succeeded` is the postgres-backup case
    # — there is not even a stale backup to fall back on, because there has never
    # been one. The rest (failing, not_scheduled, suspended) are warnings: a
    # success is still within tolerance and the next run may well clear it. A
    # warning that does not clear becomes critical on its own once the last
    # success ages past tolerance, so nothing has to remember to escalate it.
    CRITICAL_CODES = {"never_succeeded", "stale"}

    ISSUE_LABEL = "job-watchdog"
    SEVERITY_LABELS = {"critical": "severity:critical", "warning": "severity:warning"}
    # Dedup key. In the BODY, not the title, so the title can gain and lose
    # severity wording as the finding changes without ever orphaning the issue
    # and opening a duplicate beside it.
    MARKER = "<!-- job-watchdog:{ns}/{name} -->"

    # The title is the part that actually reaches a human — it is the GitHub
    # notification and the email subject line, read in a list, often on a phone.
    # So it states the severity and the REASON, not the bare status code.
    # `status` alone is the first problem found, which for cred-broker is
    # "failing" while the thing that makes it critical is "stale"; a subject line
    # saying "failing" would understate it at exactly the moment that matters.
    TITLE_PHRASE = {
        "never_succeeded": "has never once succeeded",
        "stale": "has not succeeded within its tolerance",
        "failing": "is failing",
        "not_scheduled": "is no longer being scheduled",
        "suspended": "is suspended and will never run",
    }


    def issue_title(record: dict, sev: str) -> str:
        codes = record.get("codes") or []
        worst = next((c for c in codes if c in CRITICAL_CODES), codes[0])
        return f"[{sev}] {record['cronjob']} {TITLE_PHRASE[worst]}"


    def eprint(*a):
        print(*a, file=sys.stderr, flush=True)


    def _parse_ts(raw: str) -> datetime:
        dt = datetime.fromisoformat(str(raw).replace("Z", "+00:00"))
        return dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc)


    def _dur(seconds: float) -> str:
        """Human duration. Hours-with-one-decimal alone renders short windows as
        the useless '0.1h old (> 0.1h tolerance)' — an alert a reader learns
        nothing from."""
        s = int(seconds)
        if s < 120:
            return f"{s}s"
        if s < 7200:
            return f"{s // 60}m"
        if s < 172800:
            return f"{s / 3600:.1f}h"
        return f"{s / 86400:.1f}d"


    def estimate_period_seconds(schedule: str) -> int:
        """Rough upper bound on the gap between two runs of a cron schedule.

        Deliberately coarse: it only has to be right enough to set a tolerance
        window, and it errs toward SHORTER periods (tighter tolerance, louder)
        rather than longer, because the failure mode this exists to prevent is
        silence. Unparseable => daily.
        """
        parts = str(schedule).split()
        if len(parts) != 5:
            return 24 * 3600
        minute, hour, dom, mon, dow = parts

        def step(field: str):
            if field.startswith("*/"):
                return int(field[2:])
            if field == "*":
                return 1
            return None

        if "," in minute or "-" in minute:
            return 3600  # several times an hour at worst
        ms = step(minute)
        if ms is not None:
            return ms * 60
        # Fixed minute: the hour field sets the cadence.
        if "," in hour or "-" in hour:
            return 24 * 3600
        hs = step(hour)
        if hs is not None:
            return hs * 3600
        # Fixed hour too: daily, unless a day-of-week/month field stretches it.
        if dow != "*":
            return 7 * 24 * 3600
        if dom != "*":
            return 31 * 24 * 3600
        return 24 * 3600


    def job_state(job: dict) -> str:
        """succeeded | failed | active. Unfinished Jobs count as neither."""
        st = job.get("status") or {}
        for c in st.get("conditions") or []:
            if c.get("status") != "True":
                continue
            if c.get("type") == "Failed":
                return "failed"
            if c.get("type") in ("Complete", "SuccessCriteriaMet"):
                return "succeeded"
        if st.get("active"):
            return "active"
        if st.get("succeeded"):
            return "succeeded"
        if st.get("failed"):
            return "failed"
        return "active"


    def consecutive_failures(jobs: list[dict]) -> int:
        """Failures at the head of the run history, newest first.

        Running Jobs are skipped rather than breaking the streak — a retry that
        is still in flight does not clear a run of failures. NOTE this can only
        count Jobs that still EXIST; once they are GC'd it silently returns 0,
        which is exactly why assess() does not rely on it alone.
        """
        ordered = sorted(
            jobs, key=lambda j: str(j["metadata"].get("creationTimestamp", "")), reverse=True
        )
        n = 0
        for j in ordered:
            s = job_state(j)
            if s == "active":
                continue
            if s == "succeeded":
                break
            n += 1
        return n


    def assess(cj: dict, jobs: list[dict], now: datetime, fail_threshold: int) -> dict:
        """Pure: one CronJob + the Jobs it owns -> one health record."""
        meta = cj.get("metadata") or {}
        spec = cj.get("spec") or {}
        status = cj.get("status") or {}
        name = meta.get("name", "?")
        schedule = spec.get("schedule", "")
        created = _parse_ts(meta["creationTimestamp"])

        override = (meta.get("annotations") or {}).get(PERIOD_ANNOTATION)
        period = int(override) if override else estimate_period_seconds(schedule)
        tolerance = tolerance_for(period)

        def age(field):
            raw = status.get(field)
            return None if not raw else (now - _parse_ts(raw)).total_seconds()

        success_age = age("lastSuccessfulTime")
        schedule_age = age("lastScheduleTime")
        # Never-run CronJobs are measured from creation, so a brand new one gets
        # a full tolerance window of grace and an abandoned one does not hide.
        since_created = (now - created).total_seconds()

        fails = consecutive_failures(jobs)
        problems: list[tuple[str, str]] = []

        if spec.get("suspend"):
            problems.append(("suspended", "CronJob is SUSPENDED — it will never run"))

        sched_ref = schedule_age if schedule_age is not None else since_created
        if not spec.get("suspend") and sched_ref > tolerance:
            problems.append(
                (
                    "not_scheduled",
                    f"NOT SCHEDULED for {_dur(sched_ref)} "
                    f"(> {_dur(tolerance)} tolerance) — the controller has "
                    "stopped creating Jobs for it",
                )
            )

        if fails >= fail_threshold:
            problems.append(
                ("failing", f"{fails} CONSECUTIVE FAILED runs (threshold {fail_threshold})")
            )

        if success_age is None:
            if since_created > tolerance:
                problems.append(
                    (
                        "never_succeeded",
                        f"has NEVER succeeded in {_dur(since_created)} since "
                        "creation — no recorded successful run at all",
                    )
                )
        elif success_age > tolerance:
            problems.append(
                (
                    "stale",
                    f"STALE: last success was {_dur(success_age)} ago "
                    f"(> {_dur(tolerance)} tolerance). Surviving Jobs: "
                    f"{len(jobs)} — absence of failed Jobs is NOT health, they "
                    "are garbage collected",
                )
            )

        return {
            "_timestamp": int(now.timestamp() * 1_000_000),
            "source": "job-watchdog",
            "namespace": meta.get("namespace", ""),
            "cronjob": name,
            "schedule": schedule,
            "suspended": bool(spec.get("suspend")),
            "status": problems[0][0] if problems else "ok",
            # ALL codes, not just the leading one. `status` is problems[0], and a
            # CronJob that is both not_scheduled AND stale reports status
            # "not_scheduled" — deriving severity from that alone would grade a
            # dead backup as a warning. Severity reads the whole list.
            "codes": [p[0] for p in problems],
            "problems": [p[1] for p in problems],
            "consecutive_failures": fails,
            "surviving_jobs": len(jobs),
            "last_success_age_seconds": None if success_age is None else int(success_age),
            "last_schedule_age_seconds": None if schedule_age is None else int(schedule_age),
            "expected_period_seconds": period,
            "tolerance_seconds": tolerance,
        }


    def group_jobs(cronjobs: list[dict], jobs: list[dict]) -> dict:
        """uid -> Jobs owned by that CronJob (ownerReferences, not name guessing)."""
        uids = {(c.get("metadata") or {}).get("uid") for c in cronjobs}
        out: dict = {u: [] for u in uids}
        for j in jobs:
            for ref in (j.get("metadata") or {}).get("ownerReferences") or []:
                if ref.get("kind") == "CronJob" and ref.get("uid") in out:
                    out[ref["uid"]].append(j)
                    break
        return out


    def k8s_get(path: str):
        with open(f"{SA}/token") as f:
            token = f.read().strip()
        req = urllib.request.Request(
            f"https://kubernetes.default.svc{path}",
            headers={"authorization": f"Bearer {token}", "accept": "application/json"},
            method="GET",
        )
        ctx = ssl.create_default_context(cafile=f"{SA}/ca.crt")
        with urllib.request.urlopen(req, timeout=30, context=ctx) as r:
            return json.load(r)


    def emit(oo: str, org: str, stream: str, basic: str, records: list[dict]) -> None:
        req = urllib.request.Request(
            f"{oo}/api/{org}/{stream}/_json",
            data=json.dumps(records).encode(),
            headers={
                "authorization": f"Basic {basic}",
                "content-type": "application/json",
            },
            method="POST",
        )
        with urllib.request.urlopen(req, timeout=60) as r:
            res = json.load(r)
        st = (res.get("status") or [{}])[0] if isinstance(res.get("status"), list) else res
        if isinstance(st, dict) and st.get("failed"):
            raise RuntimeError(f"OpenObserve rejected {st['failed']} record(s): {res}")


    def severity_of(record: dict) -> str | None:
        """critical | warning | None. None means healthy — say nothing."""
        codes = record.get("codes") or []
        if not codes:
            return None
        return "critical" if any(c in CRITICAL_CODES for c in codes) else "warning"


    def issue_severity(issue: dict) -> str | None:
        names = {l.get("name") for l in (issue.get("labels") or [])}
        for sev, label in SEVERITY_LABELS.items():
            if label in names:
                return sev
        return None


    def notify_action(record: dict, issue: dict | None, now: datetime,
                      renotify_hours: float) -> str | None:
        """Pure. (health record, its open issue or None) -> what to do about it.

        None means STAY SILENT, and most calls return None by design. Both halves
        of this matter equally:

          - an unhealthy CronJob with no issue MUST produce one, or we are back
            to a correct signal nobody reads;
          - a healthy fleet, and an already-reported problem, MUST produce
            nothing at all. An alert that repeats every 30 minutes gets muted
            inside a week, and a muted alert is the same silence this closes,
            reached by a more annoying road.

        Recovery closes the issue, so the open-issue list stays a list of things
        that are actually wrong rather than a graveyard nobody trusts.
        """
        sev = severity_of(record)
        if sev is None:
            return "close" if issue else None
        if issue is None:
            return "open"
        if sev != issue_severity(issue):
            return "escalate"  # or de-escalate; either way the label is now a lie
        if sev == "critical":
            age = (now - _parse_ts(issue["updated_at"])).total_seconds()
            if age >= renotify_hours * 3600:
                return "renotify"
        return None


    def issue_body(record: dict, sev: str) -> str:
        ns, name = record["namespace"], record["cronjob"]
        def fmt(field):
            v = record.get(field)
            return "never" if v is None else f"{_dur(v)} ago"
        lines = [
            MARKER.format(ns=ns, name=name),
            f"**Severity: {sev.upper()}** — `{ns}/{name}`, schedule "
            f"`{record['schedule']}`, status `{record['status']}`.",
            "",
            "What the watchdog found:",
            "",
        ]
        lines += [f"- {p}" for p in record["problems"]]
        lines += [
            "",
            f"- Consecutive failed runs: {record['consecutive_failures']}",
            f"- Surviving Jobs: {record['surviving_jobs']} "
            "(absence of failed Jobs is not health — they are garbage collected)",
            f"- Last success: {fmt('last_success_age_seconds')}",
            f"- Last schedule: {fmt('last_schedule_age_seconds')}",
            f"- Tolerance: {_dur(record['tolerance_seconds'])} "
            f"(period {_dur(record['expected_period_seconds'])})",
            "",
            "Every record, including the healthy runs, is in the OpenObserve "
            f"stream `{os.environ.get('OO_STREAM', 'job_health')}`:",
            "",
            "```sql",
            f"SELECT * FROM \"job_health\" WHERE cronjob = '{name}' "
            "ORDER BY _timestamp DESC",
            "```",
            "",
            "Raised automatically by the `job-watchdog` CronJob, and it will be "
            "closed automatically when this CronJob reports healthy again. "
            "Closing it by hand while the CronJob is still unhealthy just opens "
            "a fresh one on the next run.",
        ]
        return "\n".join(lines)


    def gh(token: str, method: str, path: str, body: dict | None = None):
        req = urllib.request.Request(
            f"https://api.github.com{path}",
            data=None if body is None else json.dumps(body).encode(),
            headers={
                "authorization": f"Bearer {token}",
                "accept": "application/vnd.github+json",
                "content-type": "application/json",
                "user-agent": "factory-job-watchdog",
            },
            method=method,
        )
        with urllib.request.urlopen(req, timeout=30) as r:
            raw = r.read()
        return json.loads(raw) if raw else None


    def ensure_labels(token: str, repo: str) -> None:
        """Idempotent. A missing label makes the dedup query silently match
        nothing, which would open a duplicate issue every 30 minutes — the
        crying-wolf failure, self-inflicted on the very first run."""
        for name, color, desc in (
            (ISSUE_LABEL, "5319e7", "Raised by the CronJob health watchdog"),
            (SEVERITY_LABELS["critical"], "b60205", "The job's purpose is not being served"),
            (SEVERITY_LABELS["warning"], "fbca04", "Misbehaving, may still self-recover"),
        ):
            try:
                gh(token, "POST", f"/repos/{repo}/labels",
                   {"name": name, "color": color, "description": desc})
            except urllib.error.HTTPError as e:
                if e.code != 422:  # 422 = already exists
                    raise


    def open_watchdog_issues(token: str, repo: str) -> dict:
        """marker -> issue, for every open issue this watchdog raised."""
        issues = gh(token, "GET",
                    f"/repos/{repo}/issues?state=open&labels={ISSUE_LABEL}&per_page=100") or []
        out = {}
        for i in issues:
            for line in (i.get("body") or "").splitlines():
                line = line.strip()
                if line.startswith("<!-- job-watchdog:"):
                    out[line] = i
                    break
        return out


    def notify(token: str, repo: str, records: list[dict], now: datetime,
               renotify_hours: float) -> int:
        """Route findings to a human. Returns the number of notifications sent."""
        ensure_labels(token, repo)
        existing = open_watchdog_issues(token, repo)
        sent = 0
        for r in records:
            key = MARKER.format(ns=r["namespace"], name=r["cronjob"])
            issue = existing.get(key)
            action = notify_action(r, issue, now, renotify_hours)
            if action is None:
                continue
            sev = severity_of(r)
            name = r["cronjob"]
            if action == "open":
                new = gh(token, "POST", f"/repos/{repo}/issues", {
                    "title": issue_title(r, sev),
                    "body": issue_body(r, sev),
                    "labels": [ISSUE_LABEL, SEVERITY_LABELS[sev]],
                })
                eprint(f"NOTIFIED  {name} [{sev}] -> opened {repo}#{new['number']}")
            elif action == "escalate":
                was = issue_severity(issue)
                gh(token, "PATCH", f"/repos/{repo}/issues/{issue['number']}", {
                    "title": issue_title(r, sev),
                    "labels": [ISSUE_LABEL, SEVERITY_LABELS[sev]],
                })
                gh(token, "POST", f"/repos/{repo}/issues/{issue['number']}/comments",
                   {"body": f"Severity changed: **{was} -> {sev}**.\n\n"
                            + issue_body(r, sev)})
                eprint(f"NOTIFIED  {name} [{was} -> {sev}] -> {repo}#{issue['number']}")
            elif action == "renotify":
                gh(token, "POST", f"/repos/{repo}/issues/{issue['number']}/comments",
                   {"body": f"Still {r['status']} after "
                            f"{renotify_hours:g}h with no change.\n\n"
                            + issue_body(r, sev)})
                eprint(f"NOTIFIED  {name} [still {sev}] -> {repo}#{issue['number']}")
            elif action == "close":
                gh(token, "POST", f"/repos/{repo}/issues/{issue['number']}/comments",
                   {"body": f"RECOVERED. `{r['namespace']}/{name}` now reports "
                            f"healthy: last success {_dur(r['last_success_age_seconds'])} "
                            f"ago, within its {_dur(r['tolerance_seconds'])} tolerance. "
                            "Closing automatically."})
                gh(token, "PATCH", f"/repos/{repo}/issues/{issue['number']}",
                   {"state": "closed", "state_reason": "completed"})
                eprint(f"RECOVERED {name} -> closed {repo}#{issue['number']}")
            sent += 1

        # ORPHANS: an open issue whose CronJob no longer exists at all. Without
        # this the issue sits open forever — nothing recovers it, because
        # recovery is driven by a record and there is no longer a record to
        # produce. A permanently-open critical nobody can action is precisely
        # what teaches people to ignore the label, and a discredited channel is
        # this whole issue again.
        #
        # It is NOT closed silently, though. "The CronJob vanished" is itself the
        # Factory#429 failure mode, so the disappearance is stated out loud in a
        # comment first. The watchdog cannot tell a deliberate retirement from an
        # accidental deletion, so it says what it saw and lets a human judge.
        seen = {MARKER.format(ns=r["namespace"], name=r["cronjob"]) for r in records}
        for key, issue in existing.items():
            if key in seen:
                continue
            gone = key.split(":", 1)[1].rsplit(" ", 1)[0]
            gh(token, "POST", f"/repos/{repo}/issues/{issue['number']}/comments",
               {"body": f"The CronJob `{gone}` no longer exists in the watched "
                        "namespace, so this finding can no longer be evaluated. "
                        "Closing.\n\nIf it was not retired deliberately then its "
                        "disappearance is itself the problem, not the fix - a "
                        "CronJob that stops existing produces no failures and no "
                        "alerts, only silence (Factory#429)."})
            gh(token, "PATCH", f"/repos/{repo}/issues/{issue['number']}",
               {"state": "closed", "state_reason": "not_planned"})
            eprint(f"VANISHED  {gone} -> closed {repo}#{issue['number']}")
            sent += 1
        return sent


    def heartbeat(token: str, repo: str, name: str, now: datetime) -> str:
        """Stamp `now` into the ALERT_REPO Actions variable `name`.

        The dead-man's switch for the watchdog itself (Factory#450). Called
        ONLY after notify() has succeeded — see the manifest header for why
        the order is the entire mechanism and not a detail.

        PATCH first, POST on 404: the variable is created on the very first
        run so nothing has to be seeded by hand, and a hand-deleted variable
        heals itself on the next run rather than staying red forever.

        Returns the value written. Raises on failure; the caller turns that
        into a red Job.
        """
        stamp = now.strftime("%Y-%m-%dT%H:%M:%SZ")
        try:
            gh(token, "PATCH", f"/repos/{repo}/actions/variables/{name}",
               {"name": name, "value": stamp})
        except urllib.error.HTTPError as e:
            if e.code != 404:
                raise
            gh(token, "POST", f"/repos/{repo}/actions/variables",
               {"name": name, "value": stamp})
        return stamp


    def main() -> int:
        threshold = int(os.environ.get("FAIL_THRESHOLD", "2"))
        oo = os.environ.get(
            "OBSERVE_URL", "http://observe.factory.svc.cluster.local:5080"
        ).rstrip("/")
        org = os.environ.get("OO_ORG", "default")
        stream = os.environ.get("OO_STREAM", "job_health")
        user, pw = os.environ.get("OO_USER", ""), os.environ.get("OO_PASS", "")
        if not user or not pw:
            eprint("FATAL: OO_USER/OO_PASS not set (observe-root secret missing)")
            return 2
        basic = base64.b64encode(f"{user}:{pw}".encode()).decode()

        repo = os.environ.get("ALERT_REPO", "")
        token = os.environ.get("GITHUB_TOKEN", "")
        renotify = float(os.environ.get("ALERT_RENOTIFY_HOURS", "24"))
        hb_var = os.environ.get("HEARTBEAT_VAR", "JOB_WATCHDOG_HEARTBEAT")
        # Checked UP FRONT, before any work, and fatal — never a warning that
        # degrades to stream-only. Silently running without a notification path
        # is the exact defect #439 is about, and it would be undetectable from
        # the outside: the job would go green having told nobody anything.
        if not repo or not token:
            eprint("FATAL: ALERT_REPO/GITHUB_TOKEN not set — there would be no "
                   "path to a human, which is the defect this app exists to fix")
            return 2

        # CLUSTER-WIDE, not one namespace (Factory#571). These are the
        # all-namespaces collection endpoints. The previous per-namespace paths
        # meant every CronJob outside `factory` had no monitor at all and the
        # watchdog still reported a clean run, which is how fides/#567 stayed
        # invisible for five days. Every record already carries its namespace and
        # the issue de-duplication marker is already keyed `{ns}/{name}`, so
        # widening the query needed no change to the reporting path.
        try:
            cronjobs = k8s_get("/apis/batch/v1/cronjobs")["items"]
            jobs = k8s_get("/apis/batch/v1/jobs")["items"]
        except Exception as e:  # noqa: BLE001 — cannot see == cannot report
            eprint(f"FATAL: kubernetes API unreachable: {e!r}")
            return 3

        now = datetime.now(timezone.utc)
        owned = group_jobs(cronjobs, jobs)
        records = [
            assess(c, owned.get((c.get("metadata") or {}).get("uid"), []), now, threshold)
            for c in sorted(
                cronjobs,
                key=lambda c: (c["metadata"].get("namespace", ""), c["metadata"]["name"]),
            )
        ]

        # Namespace-qualified now that the watch is cluster-wide: two namespaces
        # may hold same-named CronJobs, and a bare name would make the operator's
        # first view of an incident ambiguous.
        for r in records:
            who = f"{r['namespace']}/{r['cronjob']}"
            if r["status"] == "ok":
                eprint(f"ok       {who}")
            else:
                eprint(f"UNHEALTHY {who} [{r['status']}]")
                for p in r["problems"]:
                    eprint(f"          - {p}")

        try:
            emit(oo, org, stream, basic, records)
        except Exception as e:  # noqa: BLE001 — a dropped record is a blind spot
            eprint(f"FATAL: cannot emit to OpenObserve stream '{stream}': {e!r}")
            return 4

        bad = [f"{r['namespace']}/{r['cronjob']}" for r in records if r["status"] != "ok"]
        eprint(
            f"reported {len(records)} CronJob(s) to '{stream}': "
            f"{len(records) - len(bad)} ok, {len(bad)} unhealthy"
            + (f" ({', '.join(bad)})" if bad else "")
        )

        # Emit FIRST, notify second. If GitHub is down the durable record still
        # lands, and the failure below is then visible in the stream rather than
        # taking the finding down with it.
        try:
            sent = notify(token, repo, records, now, renotify)
        except Exception as e:  # noqa: BLE001 — an undelivered alert is the bug
            eprint(f"FATAL: cannot notify via {repo}: {e!r}")
            return 5
        eprint(f"notifications sent: {sent} (silence on healthy and on already-reported)")

        # AFTER notify, never after the emit. A watchdog that emits fine but
        # cannot notify must NOT be able to report itself alive — that is the
        # whole of Factory#450, and stamping any earlier would rebuild it.
        try:
            stamp = heartbeat(token, repo, hb_var, now)
        except Exception as e:  # noqa: BLE001 — an unprovable liveness is a finding
            eprint(f"FATAL: cannot stamp heartbeat {hb_var} on {repo}: {e!r}")
            eprint("       the scheduled check on its absence will go red; this "
                   "run reports red too so both signals agree")
            return 6
        eprint(f"heartbeat {hb_var}={stamp}")

        # Exit 0 on findings BY DESIGN: see the manifest header. A red watchdog
        # must mean the watchdog is broken, not that a watched job is.
        return 0


    def _selftest() -> int:
        now = datetime(2026, 7, 26, 12, 0, tzinfo=timezone.utc)

        assert estimate_period_seconds("*/15 * * * *") == 900
        assert estimate_period_seconds("0 */4 * * *") == 4 * 3600
        assert estimate_period_seconds("0 6 * * *") == 24 * 3600
        assert estimate_period_seconds("* * * * *") == 60
        assert estimate_period_seconds("0 6 * * 1") == 7 * 24 * 3600
        assert estimate_period_seconds("garbage") == 24 * 3600

        def cj(name, schedule, *, last_ok=None, last_sched=None, created="2026-06-01T00:00:00Z",
               suspend=False, ann=None):
            return {
                "metadata": {
                    "name": name, "namespace": "factory", "uid": name,
                    "creationTimestamp": created,
                    **({"annotations": ann} if ann else {}),
                },
                "spec": {"schedule": schedule, **({"suspend": True} if suspend else {})},
                "status": {
                    **({"lastSuccessfulTime": last_ok} if last_ok else {}),
                    **({"lastScheduleTime": last_sched} if last_sched else {}),
                },
            }

        def job(owner, when, state):
            st = {"succeeded": 1} if state == "succeeded" else (
                {"failed": 1} if state == "failed" else {"active": 1})
            return {
                "metadata": {
                    "name": f"{owner}-{when}", "creationTimestamp": when,
                    "ownerReferences": [{"kind": "CronJob", "uid": owner}],
                },
                "status": st,
            }

        # Healthy 4-hourly job: recent success, recent schedule, no failures.
        healthy = assess(
            cj("cred-broker", "0 */4 * * *", last_ok="2026-07-26T11:00:00Z",
               last_sched="2026-07-26T11:00:00Z"), [], now, 2)
        assert healthy["status"] == "ok", healthy
        assert healthy["tolerance_seconds"] == 2 * 4 * 3600 + 900

        # REGRESSION (found by the induced-failure test, not by this selftest):
        # the grace must never dwarf the period. A flat 900s grace gave a
        # 1-minute CronJob a 17-minute window in which it could have zero Jobs
        # and zero successes and still report "ok".
        assert tolerance_for(60) == 180, "fast schedules must not inherit a 15m grace"
        assert tolerance_for(4 * 3600) == 2 * 4 * 3600 + 900, "slow schedules keep it"
        minutely = assess(cj("fast", "* * * * *", last_sched="2026-07-26T11:59:30Z",
                             created="2026-07-26T11:50:00Z"), [], now, 2)
        assert minutely["status"] == "never_succeeded", minutely
        assert minutely["surviving_jobs"] == 0

        # THE #381 SCENARIO, still with Jobs present: two consecutive failures.
        failing = assess(
            cj("cred-broker", "0 */4 * * *", last_ok="2026-06-07T00:00:00Z",
               last_sched="2026-07-26T11:00:00Z"),
            [job("cred-broker", "2026-07-26T08:00:00Z", "failed"),
             job("cred-broker", "2026-07-26T11:00:00Z", "failed")],
            now, 2)
        assert failing["status"] == "failing", failing
        assert failing["consecutive_failures"] == 2

        # THE SAME SCENARIO AFTER GC — zero surviving Jobs. This is the case that
        # went unnoticed for seven weeks and it MUST NOT read as ok.
        gcd = assess(
            cj("cred-broker", "0 */4 * * *", last_ok="2026-06-07T00:00:00Z",
               last_sched="2026-07-26T11:00:00Z"), [], now, 2)
        assert gcd["consecutive_failures"] == 0, "no Jobs left to count"
        assert gcd["status"] == "stale", gcd
        assert gcd["surviving_jobs"] == 0

        # Stopped being scheduled at all (controller wedged / schedule removed).
        assert assess(cj("x", "0 */4 * * *", last_ok="2026-07-26T11:00:00Z",
                         last_sched="2026-07-20T00:00:00Z"), [], now, 2
                      )["status"] == "not_scheduled"

        # Never succeeded even once — postgres-backup's live shape today.
        never = assess(cj("postgres-backup", "15 2 * * *",
                          last_sched="2026-07-26T02:15:00Z"), [], now, 2)
        assert never["status"] == "never_succeeded", never

        # A CronJob created moments ago must not be flagged before it can run.
        assert assess(cj("fresh", "0 */4 * * *", created="2026-07-26T11:59:00Z"),
                      [], now, 2)["status"] == "ok"

        # Suspended is a finding, not silence.
        assert assess(cj("s", "0 */4 * * *", last_ok="2026-07-26T11:00:00Z",
                         last_sched="2026-07-26T11:00:00Z", suspend=True), [], now, 2
                      )["status"] == "suspended"

        # A success clears the streak; an in-flight run does not.
        assert consecutive_failures([
            job("a", "2026-07-26T09:00:00Z", "failed"),
            job("a", "2026-07-26T10:00:00Z", "succeeded"),
            job("a", "2026-07-26T11:00:00Z", "failed"),
            job("a", "2026-07-26T11:30:00Z", "active"),
        ]) == 1

        # Annotation overrides the estimate: read as daily this is healthy, but
        # pinned to a 60s period the 3h-old success is stale.
        pinned = cj("o", "0 6 * * *", last_ok="2026-07-26T09:00:00Z",
                    last_sched="2026-07-26T11:59:00Z")
        assert assess(pinned, [], now, 2)["status"] == "ok"
        pinned["metadata"]["annotations"] = {PERIOD_ANNOTATION: "60"}
        assert assess(pinned, [], now, 2)["status"] == "stale"

        # Ownership grouping ignores Jobs owned by nobody we track.
        grouped = group_jobs([cj("a", "* * * * *")],
                             [job("a", "2026-07-26T11:00:00Z", "failed"),
                              job("b", "2026-07-26T11:00:00Z", "failed")])
        assert len(grouped["a"]) == 1 and "b" not in grouped

        # ---- #439: severity, and the routing decision ----------------------
        healthy_rec = assess(cj("ok", "0 */4 * * *", last_ok="2026-07-26T11:00:00Z",
                                last_sched="2026-07-26T11:00:00Z"), [], now, 2)
        assert severity_of(healthy_rec) is None

        # postgres-backup's real shape: never once succeeded. CRITICAL.
        assert severity_of(never) == "critical", never
        assert severity_of(gcd) == "critical", gcd          # stale after GC
        # A transient run of failures with the last success still INSIDE
        # tolerance is not the same thing as a backup that has never worked.
        # That distinction is the whole point of having two levels.
        #
        # Note `failing` above does not qualify: its last success is 49.5d old,
        # so it is failing AND stale, and severity_of correctly grades it
        # critical. This selftest asserted "warning" on it at first and the
        # assertion was what was wrong. A genuinely transient blip needs a
        # recent success, so build one:
        blip = assess(
            cj("blip", "0 */4 * * *", last_ok="2026-07-26T08:00:00Z",
               last_sched="2026-07-26T11:00:00Z"),
            [job("blip", "2026-07-26T09:00:00Z", "failed"),
             job("blip", "2026-07-26T11:00:00Z", "failed")],
            now, 2)
        assert blip["codes"] == ["failing"], blip
        assert severity_of(blip) == "warning", blip
        # And it escalates itself with no help once that success ages out.
        aged = assess(cj("blip", "0 */4 * * *", last_ok="2026-07-25T00:00:00Z",
                         last_sched="2026-07-26T11:00:00Z"), [], now, 2)
        assert severity_of(aged) == "critical", aged
        assert severity_of(assess(cj("s", "0 */4 * * *", last_ok="2026-07-26T11:00:00Z",
                                     last_sched="2026-07-26T11:00:00Z", suspend=True),
                                  [], now, 2)) == "warning"

        # Severity reads EVERY code, not just status. This CronJob stopped being
        # scheduled AND its last success has aged out; status is "not_scheduled"
        # (the first problem found) but it is unambiguously critical.
        both = assess(cj("b", "0 */4 * * *", last_ok="2026-06-01T00:00:00Z",
                         last_sched="2026-07-01T00:00:00Z"), [], now, 2)
        assert both["status"] == "not_scheduled" and "stale" in both["codes"]
        assert severity_of(both) == "critical", both

        def iss(sev, updated):
            return {"number": 1, "updated_at": updated,
                    "labels": [{"name": ISSUE_LABEL}, {"name": SEVERITY_LABELS[sev]}]}

        # THE ALARM HALF: an unhealthy CronJob nobody has an issue for gets one.
        assert notify_action(never, None, now, 24) == "open"

        # THE SILENCE HALF, which matters just as much. An alarm that re-fires
        # every 30 minutes is muted within a week, and a muted alarm is #439
        # again by a louder route.
        assert notify_action(healthy_rec, None, now, 24) is None, "healthy must be silent"
        assert notify_action(never, iss("critical", "2026-07-26T11:30:00Z"), now, 24) is None, \
            "already reported 30m ago must not re-notify"
        assert notify_action(blip, iss("warning", "2026-06-01T00:00:00Z"), now, 24) is None, \
            "warnings are reported once and then stay quiet, however long they last"

        # Escalation: the same CronJob, worse. The open issue's label is now
        # wrong, so it is corrected and said out loud once.
        assert notify_action(never, iss("warning", "2026-07-26T11:59:00Z"), now, 24) == "escalate"
        # De-escalation is also a change worth one comment, not silent relabelling.
        assert notify_action(blip, iss("critical", "2026-07-26T11:59:00Z"), now, 24) == "escalate"

        # A critical that will not go away keeps surfacing, once a day, so a
        # month-old outage does not quietly sink down the issue list. This is the
        # postgres-backup case: right, ignored, and ignored again.
        assert notify_action(never, iss("critical", "2026-07-24T00:00:00Z"), now, 24) == "renotify"
        assert notify_action(never, iss("critical", "2026-07-24T00:00:00Z"), now, 999) is None

        # Recovery closes the issue, so the open list stays things that are
        # actually broken rather than a graveyard everyone learns to scroll past.
        assert notify_action(healthy_rec, iss("critical", "2026-07-26T11:00:00Z"), now, 24) == "close"

        # notify_action being right is not enough: a correct decision that the
        # caller ignores is still an issue filed every 30 minutes. A mutation
        # test caught exactly that — deleting the `if action is None: continue`
        # guard in notify() left every assertion above passing. So drive notify()
        # itself over a stub transport and count what it would really send.
        calls: list = []
        stub_issues: list = []

        def fake_gh(token, method, path, body=None):
            calls.append((method, path))
            if method == "POST" and path.endswith("/issues"):
                return {"number": 99}
            if "/issues?" in path:
                return list(stub_issues)
            return {}

        def writes():
            return [c for c in calls
                    if c[0] != "GET" and not c[1].endswith("/labels")]

        real_gh = globals()["gh"]
        globals()["gh"] = fake_gh
        try:
            # A HEALTHY FLEET SENDS NOTHING. Not one issue, comment or edit.
            assert notify("t", "o/r", [healthy_rec, healthy_rec], now, 24) == 0
            assert not writes(), writes()

            # One genuinely unhealthy CronJob sends exactly one thing.
            calls.clear()
            assert notify("t", "o/r", [never], now, 24) == 1
            assert writes() == [("POST", "/repos/o/r/issues")], writes()

            # And a mixed fleet notifies once, for the one that is broken.
            calls.clear()
            assert notify("t", "o/r", [healthy_rec, never, healthy_rec], now, 24) == 1
            assert len(writes()) == 1, writes()

            # DEDUP, matched off the body marker of the issue we already raised.
            # This is what stops the same finding filing a fresh issue every 30
            # minutes, so it is checked against a real issue payload rather than
            # trusted. Note the title here is deliberately NOT the title notify()
            # would write, because dedup must key on the marker alone.
            stub_issues.append({
                "number": 99,
                "title": "something a human renamed it to",
                "updated_at": "2026-07-26T11:45:00Z",
                "body": issue_body(never, "critical"),
                "labels": [{"name": ISSUE_LABEL},
                           {"name": SEVERITY_LABELS["critical"]}],
            })
            assert list(open_watchdog_issues("t", "o/r")) == [
                MARKER.format(ns="factory", name="postgres-backup")]
            calls.clear()
            assert notify("t", "o/r", [never], now, 24) == 0, "must not duplicate"
            assert not writes(), writes()

            # Same issue, but the CronJob has recovered: comment and close.
            calls.clear()
            recovered = assess(cj("postgres-backup", "15 2 * * *",
                                  last_ok="2026-07-26T11:00:00Z",
                                  last_sched="2026-07-26T11:00:00Z"), [], now, 2)
            assert notify("t", "o/r", [recovered], now, 24) == 1
            assert writes() == [("POST", "/repos/o/r/issues/99/comments"),
                                ("PATCH", "/repos/o/r/issues/99")], writes()

            # ORPHAN: the CronJob has been deleted outright, so it appears in no
            # record at all. Its issue must not sit open forever — an unactionable
            # permanent critical is what trains people to ignore the label.
            calls.clear()
            assert notify("t", "o/r", [healthy_rec], now, 24) == 1
            assert writes() == [("POST", "/repos/o/r/issues/99/comments"),
                                ("PATCH", "/repos/o/r/issues/99")], writes()

            # ...but a healthy fleet with no orphans is still completely silent.
            stub_issues.clear()
            calls.clear()
            assert notify("t", "o/r", [healthy_rec], now, 24) == 0
            assert not writes(), writes()
        finally:
            globals()["gh"] = real_gh

        # The dedup key lives in the body and survives the title changing, so a
        # finding that worsens updates one issue instead of stacking duplicates.
        body = issue_body(never, "critical")
        assert body.splitlines()[0] == MARKER.format(ns="factory", name="postgres-backup")
        assert "NEVER succeeded" in body and "CRITICAL" in body
        assert "Last success: never" in body

        # The title is the notification email's subject line, so it must name the
        # reason that DROVE the severity, not merely the first problem found.
        # cred-broker's live record is `failing` first and `stale` second; a
        # subject line reading "is failing" would understate a three-day outage.
        assert issue_title(never, "critical") == \
            "[critical] postgres-backup has never once succeeded", issue_title(never, "critical")
        cb = assess(cj("cred-broker", "0 */4 * * *", last_ok="2026-07-01T00:00:00Z",
                       last_sched="2026-07-26T11:00:00Z"),
                    [job("cred-broker", "2026-07-26T08:00:00Z", "failed"),
                     job("cred-broker", "2026-07-26T11:00:00Z", "failed")], now, 2)
        assert cb["status"] == "failing" and severity_of(cb) == "critical"
        assert issue_title(cb, "critical") == \
            "[critical] cred-broker has not succeeded within its tolerance", issue_title(cb, "critical")
        assert issue_title(blip, "warning") == "[warning] blip is failing"

        # ------------------------------------------------------------------
        # HEARTBEAT (Factory#450). The dead-man's switch this watchdog cannot
        # check for itself, so its contract is checked here instead.
        # ------------------------------------------------------------------
        calls.clear()
        globals()["gh"] = fake_gh
        try:
            # Normal run: one PATCH, and the value is a parseable UTC stamp the
            # consumer workflow can subtract from `now`.
            stamp = heartbeat("t", "o/r", "JOB_WATCHDOG_HEARTBEAT", now)
            assert calls == [("PATCH",
                              "/repos/o/r/actions/variables/JOB_WATCHDOG_HEARTBEAT")], calls
            assert _parse_ts(stamp) == now.replace(microsecond=0), stamp

            # First ever run, or someone deleted the variable: 404 on PATCH must
            # CREATE it, not fail forever. A switch that needs hand-seeding is a
            # switch that is off.
            def gh_404(token, method, path, body=None):
                calls.append((method, path))
                if method == "PATCH":
                    raise urllib.error.HTTPError(path, 404, "Not Found", {}, None)
                return {}

            calls.clear()
            globals()["gh"] = gh_404
            heartbeat("t", "o/r", "JOB_WATCHDOG_HEARTBEAT", now)
            assert calls == [
                ("PATCH", "/repos/o/r/actions/variables/JOB_WATCHDOG_HEARTBEAT"),
                ("POST", "/repos/o/r/actions/variables"),
            ], calls

            # Anything that is NOT a missing variable propagates. A revoked
            # token (401) or a renamed repo must reach main() and turn the run
            # red — swallowing it is how a heartbeat starts lying. The stub
            # deliberately lets POST SUCCEED, so a 404-only guard that decayed
            # into catch-everything would quietly "create" its way to green
            # here instead of raising.
            def gh_401(token, method, path, body=None):
                calls.append((method, path))
                if method == "PATCH":
                    raise urllib.error.HTTPError(path, 401, "Unauthorized", {}, None)
                return {}

            calls.clear()
            globals()["gh"] = gh_401
            try:
                heartbeat("t", "o/r", "JOB_WATCHDOG_HEARTBEAT", now)
                raise AssertionError("a rejected stamp must not be swallowed")
            except urllib.error.HTTPError as e:
                assert e.code == 401
            assert calls == [
                ("PATCH", "/repos/o/r/actions/variables/JOB_WATCHDOG_HEARTBEAT")
            ], f"a non-404 must not fall through to create: {calls}"
        finally:
            globals()["gh"] = real_gh

        # THE ORDERING CONSTRAINT, asserted on the source rather than trusted:
        # the stamp must come after the notify call. If it ever drifts above it,
        # a watchdog that cannot notify would keep its heartbeat fresh and report
        # itself healthy while telling nobody anything.
        src = open(__file__).read() if os.path.exists(__file__) else ""
        if src:
            # Sliced at _selftest, not to end-of-file: the assertions below name
            # the very strings they forbid, so an unbounded slice matches its own
            # source and the check reports a failure it invented itself.
            body_of_main = src.split("def main() -> int:", 1)[1].split(
                "def _selftest", 1)[0]
            assert body_of_main.index("sent = notify(") < body_of_main.index(
                "stamp = heartbeat("), "heartbeat must be stamped AFTER notify"
            assert body_of_main.index("emit(oo,") < body_of_main.index(
                "sent = notify("), "emit still comes first; a dropped record is a blind spot"

            # THE SCOPE CONSTRAINT, also asserted on the source (Factory#571).
            # The watchdog must list CronJobs and Jobs from the all-namespaces
            # collection endpoints. A per-namespace path silently shrinks what is
            # watched WITHOUT failing anything: the run still goes green, the
            # stream still fills, the heartbeat is still stamped, and the
            # CronJobs outside the scope simply have no monitor. That is exactly
            # how fides/#567 stayed invisible for five days, and it is invisible
            # by construction, so it gets a test rather than a comment.
            assert "/apis/batch/v1/cronjobs" in body_of_main, \
                "must list CronJobs cluster-wide"
            assert "/apis/batch/v1/jobs" in body_of_main, \
                "must list Jobs cluster-wide"
            assert "/apis/batch/v1/namespaces/" not in body_of_main, \
                "a per-namespace list re-creates the unwatched-namespace blind spot"

        # Same-named CronJobs in two namespaces must stay two findings, not one.
        # Cluster-wide listing makes name collisions reachable for the first
        # time; if the issue marker collided, the second namespace's outage would
        # be silently absorbed into the first one's issue and never reported.
        a = dict(cj("reporter", "*/10 * * * *", last_ok="2026-06-01T00:00:00Z"))
        b = dict(cj("reporter", "*/10 * * * *", last_ok="2026-06-01T00:00:00Z"))
        a["metadata"] = {**a["metadata"], "namespace": "fides", "uid": "uid-a"}
        b["metadata"] = {**b["metadata"], "namespace": "fides-reporter", "uid": "uid-b"}
        ra, rb = assess(a, [], now, 2), assess(b, [], now, 2)
        assert ra["namespace"] == "fides" and rb["namespace"] == "fides-reporter"
        assert ra["cronjob"] == rb["cronjob"] == "reporter"
        assert MARKER.format(ns=ra["namespace"], name=ra["cronjob"]) != \
            MARKER.format(ns=rb["namespace"], name=rb["cronjob"]), \
            "same-named CronJobs in different namespaces must not share an issue"
        assert severity_of(ra) is not None, "a long-stale CronJob must still be a finding"

        print("selftest OK")
        return 0


    if __name__ == "__main__":
        sys.exit(_selftest() if sys.argv[1:2] == ["selftest"] else main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: job-watchdog
  namespace: factory
  labels: { app: job-watchdog }
spec:
  # Every 30 minutes. The tightest thing it guards is cred-broker at 4-hourly, so
  # a broken rotation is recorded within half an hour of its second failed run
  # rather than seven weeks later. It emits to a stream, not a pager, so this
  # cadence costs ~300 small records a day and wakes nobody.
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata: { labels: { app: job-watchdog } }
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          serviceAccountName: job-watchdog
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watchdog
              # Stock python; the script is stdlib-only so no custom image.
              image: python:3.12-slim@sha256:646fb0bca3dd3ea1bcc6feb72c17ed16eed6e10cffc732fcc1478bd3e7f02d7b
              command: ["python3", "/script/watchdog.py"]
              env:
                - { name: FAIL_THRESHOLD, value: "2" }
                - { name: OO_STREAM, value: "job_health" }
                - { name: OO_ORG, value: "default" }
                # Where unhealthy findings go so a human passively meets them.
                - { name: ALERT_REPO, value: "olafkfreund/Factory" }
                - { name: ALERT_RENOTIFY_HOURS, value: "24" }
                # Existing fleet token. No new secret, and no webhook URL is
                # committed anywhere — a URL in git that silently drops messages
                # would be this same bug wearing a convincing disguise.
                - name: GITHUB_TOKEN
                  valueFrom: { secretKeyRef: { name: factory-secrets, key: GITHUB_TOKEN } }
                # Same observe-root secret apps/audit-siem-forward already uses.
                - name: OO_USER
                  valueFrom: { secretKeyRef: { name: observe-root, key: email } }
                - name: OO_PASS
                  valueFrom: { secretKeyRef: { name: observe-root, key: password } }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 200m, memory: 128Mi }
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: job-watchdog-script
