# Keycloak SSO for CFactory via oauth2-proxy.
#
# CFactory's frontend (cfactory-frontend:80) has no native auth; this
# fronts it with oauth2-proxy talking OIDC to keycloak.factory.svc:8080
# (realm `factory`, client `cfactory`). The cluster cloudflared ingress
# for cfactory.freundcloud.org.uk points HERE instead of the frontend,
# so every public request is gated by a Keycloak login before reaching
# the cockpit UI. The cfactory backend (cfactory:3111) stays internal —
# only the frontend talks to it (BACKEND_URL=...svc.cluster.local:3111).
#
# Convention note: same pattern as apps/odin-auth/. aifactory/pfactory/
# tfactory still use native in-app OIDC (APP_OIDC_* env vars).
#
# Secret `oauth2-proxy-cfactory` (client-id, client-secret, cookie-secret)
# is created out-of-band via kubectl — NOT in this repo until
# sealed-secrets / external-secrets-operator lands.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-cfactory
  namespace: factory
  labels:
    app: oauth2-proxy-cfactory
    app.kubernetes.io/instance: cfactory-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy-cfactory
  template:
    metadata:
      labels:
        app: oauth2-proxy-cfactory
    spec:
      enableServiceLinks: false
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.0
          args:
            # Provider, upstream and header injection live in the alpha config
            # (see alpha-config.yaml) — required for the tenant claim ->
            # X-Tenant-Id header (#13). That includes the editor OIDC layer:
            # --skip-jwt-bearer-tokens accepts a valid Keycloak JWT bearer (from
            # the factory-vscode public client, which carries `cfactory` in its
            # audience via a Keycloak audience mapper) instead of forcing an
            # interactive browser login; the extra audience itself is
            # oidcConfig.extraAudiences in the alpha config.
            - --alpha-config=/etc/oauth2-proxy/config/oauth2-proxy.yaml
            - --redirect-url=https://cfactory.freundcloud.org.uk/oauth2/callback
            - --reverse-proxy=true
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --skip-provider-button=true
            - --whitelist-domain=cfactory.freundcloud.org.uk
            - --skip-jwt-bearer-tokens=true
          env:
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-cfactory
                  key: cookie-secret
          volumeMounts:
            - name: alpha-config
              mountPath: /etc/oauth2-proxy/config
              readOnly: true
            # client-secret consumed as a file (alpha config clientSecretFile);
            # same out-of-band `oauth2-proxy-cfactory` Secret as before.
            - name: oidc-secrets
              mountPath: /etc/oauth2-proxy/secrets
              readOnly: true
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: alpha-config
          configMap:
            name: oauth2-proxy-cfactory-alpha
        - name: oidc-secrets
          secret:
            secretName: oauth2-proxy-cfactory
            items:
              - key: client-secret
                path: client-secret
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-cfactory
  namespace: factory
  labels:
    app: oauth2-proxy-cfactory
    app.kubernetes.io/instance: cfactory-auth
spec:
  selector:
    app: oauth2-proxy-cfactory
  ports:
    - name: http
      port: 4180
      targetPort: 4180
