################################################################################
# trace-silence-check (Factory#516)
#
# WHY THIS EXISTS
#
# Factory#465 read "PFactory, TFactory and CFactory show 0 occurrences over the
# same window" as evidence that the problem was AIFactory-specific. The three
# quiet services were not healthy, they were unwired, and the thing that made
# that misreading possible is that NOTHING IN THE FLEET EVER ASKED whether a
# service was still emitting. Silence was the same shape as health.
#
# It happened a second time, and worse. After the OTLP config landed on all
# four services, PFactory and TFactory logged
#
#     OTel tracing enabled ... (startup export accepted)
#     OTel instrumentation installed: FastAPI
#
# on every boot, and exported exactly ZERO spans for weeks. Both claims were
# individually true and neither one measured delivery: the export probe proves
# the credential with an EMPTY payload, and the instrumentation line proves a
# call did not raise. The app that got instrumented was not the app that
# served (see each service's observability/tracing.py).
#
# So the check that was missing is the only one that cannot be satisfied by a
# component reporting on itself: ask the COLLECTOR whether spans arrived, by
# service name, and fail when the answer is none. It is indifferent to WHY a
# service went dark -- bad credential, unwired env, uninstrumented app, crashed
# exporter, a rebuild that dropped a Secret. Any cause, same alarm.
#
# THE SECOND HALF (Factory#607)
#
# Counting spans per service answers "is this service emitting". It cannot
# answer "does the run's trace reach the work", and that is a different
# question with a nastier failure mode: the PARR work happens in per-task
# Kubernetes Jobs, and a Job handed a stale or fabricated TRACEPARENT emits a
# perfectly healthy-looking <service>-job span -- under a trace nobody is
# looking at. Every count-by-service check passes on that.
#
# So the block at the end of check.py asks the collector the actual property:
# for each trace that has a job-side span in the window, does that trace also
# hold a control-plane span? It is vacuous when no Jobs ran, which is why
# <service>-job must NEVER be added to EXPECTED_SERVICES -- see the window
# note below.
#
# WHY A CRONJOB
#
# job-watchdog sweeps EVERY CronJob in this namespace rather than a hardcoded
# list, so a repeated failure here inherits human routing (a GitHub issue) for
# free -- the same reasoning that put observe-otlp-auth-sync in a CronJob.
#
# WHY THE WINDOW IS SAFE
#
# Every service in EXPECTED_SERVICES is a long-lived FastAPI pod with a kubelet
# readinessProbe hitting it every 10s. Once the ASGI app is instrumented those
# probes alone are a continuous span source, so "zero spans in an hour" cannot
# mean "idle" for these four -- it means broken. A service that is genuinely
# request-driven and can be legitimately quiet must NOT be added to this list
# without widening its window first.
#
# The credential is observe-root, the same primary secret observe-otlp-auth-sync
# derives the ingest header from, read here via secretKeyRef -- this job only
# READS it, so it needs no ServiceAccount and no RBAC at all.
################################################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: trace-silence-check-script
  namespace: factory
  labels: { app: observe }
data:
  check.py: |
    """Fail when a service that should be tracing has stopped (Factory#516).

    stdlib only, same as job-watchdog and observe-otlp-auth-sync.
    """
    import base64
    import json
    import os
    import sys
    import time
    import urllib.error
    import urllib.request

    ENDPOINT = os.environ["OBSERVE_ENDPOINT"].rstrip("/")
    ORG = os.environ.get("OBSERVE_ORG", "default")
    STREAM = os.environ.get("OBSERVE_TRACES_STREAM", "default")
    EXPECTED = [s.strip() for s in os.environ["EXPECTED_SERVICES"].split(",") if s.strip()]
    LOOKBACK_MIN = int(os.environ.get("LOOKBACK_MINUTES", "60"))
    # Factory#607: spans emitted from inside a per-task Kubernetes Job carry a
    # service name of this shape (job_dispatch.trace_env sets <service>-job).
    JOB_SUFFIX = os.environ.get("JOB_SIDE_SUFFIX", "-job")

    email = os.environ["OBSERVE_EMAIL"]
    password = os.environ["OBSERVE_PASSWORD"]
    auth = base64.b64encode(f"{email}:{password}".encode()).decode()

    now = int(time.time())


    def query(sql, size=100):
        body = json.dumps({
            "query": {
                "sql": sql,
                "start_time": (now - LOOKBACK_MIN * 60) * 1_000_000,
                "end_time": now * 1_000_000,
                "from": 0,
                "size": size,
            }
        }).encode()
        req = urllib.request.Request(
            f"{ENDPOINT}/api/{ORG}/_search?type=traces",
            data=body,
            headers={"Content-Type": "application/json",
                     "Authorization": f"Basic {auth}"},
        )
        try:
            raw = urllib.request.urlopen(req, timeout=60).read().decode()
        except urllib.error.HTTPError as e:
            # A collector that cannot be QUERIED is itself a reason to shout: it
            # is the state in which every service looks silent and none is.
            # Never print the response body unfiltered -- it can echo the request.
            print(f"FAIL: collector query returned HTTP {e.code}; "
                  f"cannot tell whether any service is tracing", file=sys.stderr)
            sys.exit(1)
        except Exception as e:  # noqa: BLE001 - any transport failure is a real failure
            print(f"FAIL: collector unreachable ({type(e).__name__}); "
                  f"cannot tell whether any service is tracing", file=sys.stderr)
            sys.exit(1)
        return json.loads(raw).get("hits", [])


    counts = {
        h["service_name"]: h.get("n", 0)
        for h in query(f"SELECT service_name, count(*) AS n FROM {STREAM} "
                       f"GROUP BY service_name")
    }

    silent = [s for s in EXPECTED if counts.get(s, 0) <= 0]
    for s in EXPECTED:
        print(f"  {s:<16} {counts.get(s, 0):>10} spans in the last {LOOKBACK_MIN}m")

    if silent:
        print(
            f"\nFAIL: {len(silent)} of {len(EXPECTED)} services emitted NO spans in "
            f"the last {LOOKBACK_MIN} minutes: {', '.join(silent)}\n"
            f"\nThese pods each answer a readinessProbe every 10s, so zero spans is "
            f"not idleness. Check, in this order:\n"
            f"  1. does the Deployment still have OTEL_EXPORTER_OTLP_ENDPOINT?\n"
            f"  2. does the pod log say 'REJECTED the startup export'?  -> credential\n"
            f"  3. does it say 'OTel tracing enabled' and still nothing lands?\n"
            f"     -> the app that got instrumented is not the app that serves;\n"
            f"        that is Factory#516, see the service's observability/tracing.py\n",
            file=sys.stderr,
        )
        sys.exit(1)

    print(f"\nOK: all {len(EXPECTED)} services emitted spans in the last {LOOKBACK_MIN}m")

    # ── Factory#607: did the job-side spans actually JOIN a run's trace? ──────
    #
    # The check above asks whether a service is emitting. It cannot ask the
    # question Factory#607 is about, because the interesting failure emits
    # perfectly: a Job handed a stale or fabricated TRACEPARENT produces a
    # healthy-looking <service>-job span under a trace nobody is looking at.
    # Verified as a mutation on 2026-08-07 -- the orphan landed in this
    # collector under trace abab...abab while the run's own trace held only its
    # control-plane span. Counting spans by service name passes that case.
    #
    # So: for every trace that has a job-side span in the window, assert the
    # trace ALSO holds a control-plane span. That is the property "the trace
    # crosses the Job boundary", stated as something the collector can answer.
    #
    # Deliberately VACUOUS WHEN IDLE. Jobs are dispatched per PARR task, not on
    # a timer, so an hour with no builds legitimately has no job-side spans --
    # and a check that goes red because the factory was quiet is a check people
    # learn to ignore. This is why <service>-job must NEVER be added to
    # EXPECTED_SERVICES: that list is for pods a kubelet probes every 10s.
    job_traces = {
        h["trace_id"]
        for h in query(f"SELECT trace_id FROM {STREAM} "
                       f"WHERE service_name LIKE '%{JOB_SUFFIX}'", size=200)
        if h.get("trace_id")
    }
    if not job_traces:
        print(f"  (no job-side spans in the last {LOOKBACK_MIN}m -- no PARR Jobs "
              f"ran, nothing to check)")
        sys.exit(0)

    ids = ", ".join(f"'{t}'" for t in job_traces)
    spans_by_trace = {}
    for h in query(f"SELECT trace_id, service_name FROM {STREAM} "
                   f"WHERE trace_id IN ({ids})", size=1000):
        spans_by_trace.setdefault(h["trace_id"], set()).add(h["service_name"])

    orphaned = [
        t for t in job_traces
        if not any(not s.endswith(JOB_SUFFIX) for s in spans_by_trace.get(t, ()))
    ]
    print(f"\n  {len(job_traces)} trace(s) with a job-side span; "
          f"{len(job_traces) - len(orphaned)} of them cross the Job boundary")

    if orphaned:
        print(
            f"\nFAIL: {len(orphaned)} of {len(job_traces)} traces hold a job-side "
            f"span and NO control-plane span: {', '.join(sorted(orphaned)[:5])}\n"
            f"\nThe Job emitted, so this is not a silent exporter -- the trace "
            f"context did not survive the dispatch. Check, in this order:\n"
            f"  1. does the Job manifest carry TRACEPARENT?  -> job_dispatch.trace_env\n"
            f"  2. is it the DISPATCHING span's traceparent, or a stale one?\n"
            f"  3. did the control-plane span itself fail to export?\n"
            f"     -> then the Job is fine and the parent is the silent half\n",
            file=sys.stderr,
        )
        sys.exit(1)

    print("OK: every job-side span in the window belongs to a trace that also "
          "holds a control-plane span")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trace-silence-check
  namespace: factory
  labels: { app: observe }
spec:
  # Hourly, matching the LOOKBACK_MINUTES window below. Tracing going dark is
  # a degradation, not an outage, so this trades detection latency for a job
  # that cannot itself become noise.
  schedule: "43 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      # No retry. A retry would only re-ask the same question about the same
      # window and turn one honest failure into two.
      backoffLimit: 0
      template:
        metadata: { labels: { app: trace-silence-check } }
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: check
              # Stock python; the script is stdlib-only, same as job-watchdog.
              image: python:3.12-slim@sha256:646fb0bca3dd3ea1bcc6feb72c17ed16eed6e10cffc732fcc1478bd3e7f02d7b
              command: ["python3", "/script/check.py"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              env:
                - { name: OBSERVE_ENDPOINT, value: "http://observe.factory.svc.cluster.local:5080" }
                # The four PARR services. Each is a long-lived FastAPI pod with
                # a readinessProbe, so each is a continuous span source once its
                # SERVING app is instrumented. Keep in step with each service's
                # DEFAULT_SERVICE_NAME.
                - { name: EXPECTED_SERVICES, value: "pfactory-web,tfactory-web,aifactory-web,cfactory-api" }
                - { name: LOOKBACK_MINUTES, value: "60" }
                - { name: OBSERVE_EMAIL,    valueFrom: { secretKeyRef: { name: observe-root, key: email } } }
                - { name: OBSERVE_PASSWORD, valueFrom: { secretKeyRef: { name: observe-root, key: password } } }
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 200m, memory: 128Mi }
              volumeMounts:
                - { name: script, mountPath: /script, readOnly: true }
          volumes:
            - name: script
              configMap: { name: trace-silence-check-script }
