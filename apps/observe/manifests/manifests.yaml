################################################################################
# OpenObserve — bundled OTLP backend (service: observe)
#
# Single-binary OpenObserve: OTLP-native ingest (HTTP on :5080, gRPC on :5081)
# + web UI (:5080), storing locally to Parquet + SQLite under ZO_DATA_DIR.
#
# Ports (OpenObserve defaults):
#   5080  HTTP  — web UI AND OTLP/HTTP ingest (POST /api/<org>/v1/{traces,metrics,logs})
#   5081  gRPC  — OTLP/gRPC ingest
#
# Isolated: own Deployment/Service/PVC, own labels (app: observe), namespace
# factory. Touches nothing else. Public exposure is a separate cloudflared
# route the operator adds (see README.md) — not in this manifest.
################################################################################
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: observe-data, namespace: factory, labels: { app: observe } }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: observe, namespace: factory, labels: { app: observe } }
spec:
  selector: { app: observe }
  ports:
    # Web UI + OTLP/HTTP ingest.
    - { name: http, port: 5080, targetPort: 5080 }
    # OTLP/gRPC ingest.
    - { name: grpc, port: 5081, targetPort: 5081 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: observe, namespace: factory, labels: { app: observe } }
spec:
  replicas: 1
  selector: { matchLabels: { app: observe } }
  # Recreate: single writer to a ReadWriteOnce PVC (Parquet + SQLite), same as cfactory.
  strategy: { type: Recreate }
  template:
    metadata: { labels: { app: observe } }
    spec:
      enableServiceLinks: false
      # OpenObserve image runs as root by default; fsGroup lets it own the PVC dir.
      #
      # Factory#521 — this pod had fsGroup and NOTHING else: no seccomp profile,
      # no capability drop, no no-new-privileges. It was the last Deployment in
      # this namespace still on the container-runtime defaults, i.e. it kept all
      # 14 default capabilities and the unconfined seccomp profile.
      #
      # Everything below was measured against this exact image before it was
      # applied, because a wrong guess here is a CrashLoop on the cluster's only
      # observability backend. Probed with `docker run` on the pinned digest,
      # proved by REQUEST rather than by container status (#521 warns a container
      # can stay Running and useless):
      #
      #   baseline (runtime defaults)                 /healthz 200, /web/ 200
      #   --cap-drop ALL --security-opt               /healthz 200, /web/ 200
      #     no-new-privileges                          <- what is applied here
      #   ... + --user 65532:65532                    /healthz 200, /web/ 200
      #   ... + --read-only --tmpfs /tmp              PANIC, exit 101:
      #       "create cache dir success: Os { code: 30, kind: ReadOnlyFilesystem }"
      #       at src/config/src/config.rs:3114
      #
      # So `readOnlyRootFilesystem: true` is NOT available on this image: it
      # builds a cache directory outside /tmp at startup and panics when it
      # cannot. That is a real finding, not a guess — Factory#322 tracks the
      # rootfs epic and this workload is a documented non-starter for it.
      #
      # `runAsNonRoot`/`runAsUser: 65532` DOES work on a fresh volume (third
      # probe above) and is deliberately still NOT set here — but for a smaller
      # reason than first recorded, and the correction is worth keeping.
      #
      # The first version of this comment said the uid flip needs a chown of the
      # existing volume because fsGroup fixes group ownership and not the mode
      # bits. That was challenged and then MEASURED, read-only, against the live
      # observe-data PVC:
      #
      #   /data                    drwxrwsrwx  0 65532     <- group rw, setgid
      #   /data/wal, /data/db ...  drwxrwsr-x  0 65532     <- group rw, setgid
      #   *.parquet, *.wal         -rw-r--r--  0 65532     <- group READ ONLY
      #
      # So both halves were half right. kubelet's SetVolumeOwnership DID apply
      # group-rw and setgid recursively at mount — the directories prove it. The
      # FILES are 0644 because the root process created them after that pass
      # (they are dated today; the directories are dated the last pod start).
      #
      # Which means the flip is NOT a data migration: fsGroupChangePolicy
      # defaults to Always, so kubelet re-applies the recursive chown+chmod on
      # the next mount, BEFORE the container starts. A uid-65532 process would
      # never actually see the 0644 state.
      #
      # That reasoning was then MEASURED end to end on a throwaway 100Mi
      # local-path PVC (namespace fsg621, deleted after), because the claim is
      # about kubelet and needs nothing from openobserve or its data:
      #
      #   arm A  root writer, policy unset -> /data drwxrwsrwx 0 65532,
      #                                       oldfile -rw-r--r-- 0 65532
      #                                       (reproduces observe-data exactly)
      #   arm B  OnRootMismatch            -> oldfile -rw-r--r--  UNCHANGED
      #   arm C  Always (control)          -> oldfile -rw-rw-r--  promoted
      #   arm D  runAsUser 65532, unset    -> -rw-rw-r--, read OK, WRITE OK
      #
      # So the flip is safe and is what lands here, and fsGroupChangePolicy is
      # deliberately LEFT UNSET so it keeps defaulting to Always.
      #
      # DO NOT ADD fsGroupChangePolicy: OnRootMismatch.
      # Arm B is the measured proof that it silently breaks this volume: it
      # inspects only the top-level dir, /data is already drwxrwsrwx 0 65532,
      # so the recursive pass is skipped and the 5033 pre-existing Parquet/WAL
      # files stay group-read-only. uid 65532 then hits EACCES on historical
      # data while new writes succeed — /healthz stays 200 throughout, and the
      # thing that would report the failure is the thing that is broken.
      # Arm C is what makes arm B mean anything: without it a negative result
      # cannot tell "the walk was skipped" from "the walk does nothing".
      #
      # The walk it optimises away is not a real cost anyway: observe-data
      # measured 1.1G across 5033 files, not the multi-GB this comment once
      # feared. Factory#621.
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: openobserve
          # Pinned, NOT latest. public.ecr.aws/zinclabs is the official ECR mirror.
          image: public.ecr.aws/zinclabs/openobserve:v0.90.3@sha256:f77856199bff2097e0355d66e59d5792064ff8ff831ea5f580b3650fa5457136
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports:
            - { containerPort: 5080, name: http }
            - { containerPort: 5081, name: grpc }
          env:
            # Local data dir on the PVC: Parquet (data) + SQLite (metadata).
            - { name: ZO_DATA_DIR, value: "/data" }
            - { name: ZO_HTTP_PORT, value: "5080" }
            - { name: ZO_GRPC_PORT, value: "5081" }
            # Audit records are stamped with their ORIGINAL event time by
            # audit-siem-forward, not ingest time. OpenObserve defaults to
            # rejecting anything older than 5h, which deadlocked the forwarder:
            # every run replayed the same historical backlog, every record was
            # refused, so the high-water mark never advanced and the CronJob
            # failed every 15 minutes indefinitely. 10 years lets the immutable
            # audit chain backfill in full.
            - { name: ZO_INGEST_ALLOWED_UPTO, value: "87600" }
            # Bootstrap root user. Credentials are NEVER inlined here — they come
            # from a Secret the operator creates out-of-band (see README.md):
            #   kubectl -n factory create secret generic observe-root \
            #     --from-literal=email=... --from-literal=password=...
            - { name: ZO_ROOT_USER_EMAIL,    valueFrom: { secretKeyRef: { name: observe-root, key: email } } }
            - { name: ZO_ROOT_USER_PASSWORD, valueFrom: { secretKeyRef: { name: observe-root, key: password } } }
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { httpGet: { path: /healthz, port: 5080 }, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 6 }
          livenessProbe:  { httpGet: { path: /healthz, port: 5080 }, initialDelaySeconds: 30, periodSeconds: 20 }
          # Modest for a k3d box, per design note.
          # 2Gi, not 1Gi: OpenObserve sits at ~571Mi idle holding ~3.6GB of
          # stream data, so a search spike cleared the old cap and the kernel
          # OOM-killed it (2026-08-21, memory.oom.group took the whole pod).
          # Request raised to match the real floor rather than a quarter of it.
          resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 2Gi } }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: observe-data } }]
---
################################################################################
# otel-otlp-auth reconciler (Factory#465)
#
# WHY THIS EXISTS AT ALL
#
# `otel-otlp-auth` is the Secret AIFactory's OTLP span exporter reads as
# OTEL_EXPORTER_OTLP_HEADERS. Its entire content is a pure function of
# `observe-root`:
#
#     Authorization=Basic base64(email:password)
#
# It was nevertheless maintained BY HAND, and it drifted: it held a Bearer
# token. OpenObserve v0.90.3 answers Bearer with `401 Not Supported` — it
# authenticates ingest with HTTP Basic and nothing else. So every span batch
# was refused, once every five seconds, for the entire life of the fleet. The
# `traces` stream count was still literally zero on 2026-07-30.
#
# A derived credential that a human has to re-derive after every cluster
# rebuild is a credential that will be wrong again. So it is derived here
# instead, from the one secret that is genuinely primary.
#
# WHY A CRONJOB AND NOT A ONE-SHOT JOB OR A SYNC HOOK
#
# Two reasons, both about the failure being noticed:
#   - it re-derives after `observe-root` is rotated, without anyone
#     remembering that this second Secret exists;
#   - `job-watchdog` sweeps EVERY CronJob in this namespace rather than a
#     hardcoded list, so this one inherits human routing (a GitHub issue on
#     repeated failure) for free. An ArgoCD sync hook would inherit nothing.
#
# It writes exactly one Secret and can read exactly one, by name.
################################################################################
apiVersion: v1
kind: ServiceAccount
metadata: { name: observe-otlp-auth, namespace: factory, labels: { app: observe } }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: observe-otlp-auth, namespace: factory, labels: { app: observe } }
rules:
  # resourceNames pins this to the two Secrets it has business touching.
  # Without it the Role would grant read of every Secret in the namespace —
  # including factory-secrets — to derive one header.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["observe-root", "otel-otlp-auth"]
    verbs: ["get", "patch"]
  # create takes no resourceNames (the object does not exist yet), so it is
  # kept in its own rule and limited to create.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # Factory#606. A secretKeyRef env var is resolved once, at container start,
  # and is never refreshed, so rewriting the Secret changed nothing for a pod
  # that was already running — aifactory exported no spans for 23 hours after
  # the value was corrected. Rolling the consumers belongs to the thing that
  # knows the value changed. resourceNames pins it to the four Deployments that
  # actually mount `otel-otlp-auth`.
  #
  # `get` was deliberately excluded here while the job was edge-triggered, and
  # adding it is what makes the job CONVERGENT: it must read each consumer's
  # stamp to know whether that consumer is current. Without `get` the reader
  # 403s, the script's fail-closed rule reads every consumer as drifted, and it
  # rolls all four EVERY HOUR — a self-inflicted rolling restart of the fleet.
  # The two changes are one change; do not split them.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["aifactory", "pfactory", "tfactory", "cfactory"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: observe-otlp-auth, namespace: factory, labels: { app: observe } }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: observe-otlp-auth }
subjects:
  - { kind: ServiceAccount, name: observe-otlp-auth, namespace: factory }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: observe-otlp-auth-script, namespace: factory, labels: { app: observe } }
data:
  sync.py: |
    """Derive `otel-otlp-auth` from `observe-root`. Stdlib only (Factory#465).

    Idempotent and quiet: when the derived header already matches, it writes
    nothing and says so. Exit 0 = the Secret now holds the right value AND
    every consumer is running against it, whatever they held before.

    Factory#606: writing the Secret is not the job. `OTEL_EXPORTER_OTLP_HEADERS`
    comes from a `secretKeyRef`, which kubelet resolves once at container start
    and never refreshes, so a pod that started before the rewrite keeps
    presenting the old header forever. aifactory exported nothing for 23 hours
    that way, and the window closed only when something unrelated restarted it.
    So a changed value now also rolls the four consumers, by stamping the
    Secret's new resourceVersion onto their pod templates.

    Exit codes: 0 ok, 2 observe-root unreadable, 3 write refused,
    4 Secret written but a consumer could not be rolled (the dangerous state:
    the value is right and something is still running on the old one).
    """
    import base64
    import json
    import ssl
    import sys
    import urllib.error
    import urllib.request

    NS = "factory"
    SRC = "observe-root"
    DST = "otel-otlp-auth"
    API = "https://kubernetes.default.svc"
    ROOT = "/var/run/secrets/kubernetes.io/serviceaccount"

    # The Deployments whose pods take the header from `secretKeyRef`. Grep for
    # `otel-otlp-auth` under apps/ to check this list is still complete; the
    # Role pins the same four names.
    CONSUMERS = ("aifactory", "pfactory", "tfactory", "cfactory")
    # Stamped onto the pod template to force a roll. The value is the Secret's
    # resourceVersion, NOT a hash of the header: a truncated digest of a
    # low-entropy password sitting in a world-readable annotation is a leak,
    # and the resourceVersion changes on exactly the same events. No domain
    # prefix, so the ArgoCD ignoreDifferences pointer needs no ~1 escaping.
    ANNOTATION = "otlp-auth-resourceversion"


    def eprint(*a):
        print(*a, file=sys.stderr, flush=True)


    def k8s(method, path, body=None, content_type="application/json"):
        with open(f"{ROOT}/token") as fh:
            token = fh.read().strip()
        req = urllib.request.Request(
            API + path,
            data=None if body is None else json.dumps(body).encode(),
            headers={
                "authorization": f"Bearer {token}",
                "accept": "application/json",
                "content-type": content_type,
            },
            method=method,
        )
        ctx = ssl.create_default_context(cafile=f"{ROOT}/ca.crt")
        with urllib.request.urlopen(req, timeout=30, context=ctx) as r:
            raw = r.read()
        return json.loads(raw) if raw else None


    def drifted(rv):
        """(consumers whose stamp is not `rv`, consumers actually examined).

        The second element exists so the caller can report what it VERIFIED
        rather than what it hoped. Printing "all 4 stamped" after a 404 skipped
        one is a count asserted instead of measured — the defect this whole
        script is about, one level down.

        This is the question the reconciler has to ask every run. "Is the
        Secret right?" is NOT it — that is the mistake Factory#606 is about,
        and answering it was how this job reported ok for ten days while no
        consumer carried the stamp at all. A 404 is not drift: an app that is
        not deployed has no pod on the old header. A read that FAILS is
        treated as drift, because a consumer whose state cannot be read has
        not been shown to be current (rule 4.7).
        """
        out, seen = [], []
        for name in CONSUMERS:
            try:
                d = k8s("GET", f"/apis/apps/v1/namespaces/{NS}/deployments/{name}")
            except urllib.error.HTTPError as e:
                if e.code == 404:
                    continue
                eprint(f"cannot read {name}, assuming drift: {e!r}")
                out.append(name)
                seen.append(name)
                continue
            except Exception as e:  # noqa: BLE001 — unreadable == unverified
                eprint(f"cannot read {name}, assuming drift: {e!r}")
                out.append(name)
                seen.append(name)
                continue
            seen.append(name)
            ann = (
                ((d.get("spec") or {}).get("template") or {}).get("metadata") or {}
            ).get("annotations") or {}
            if ann.get(ANNOTATION) != rv:
                out.append(name)
        return out, seen

    def roll(rv, names=CONSUMERS):
        """Stamp `rv` on each named consumer's pod template. Returns failures.

        A 404 is not a failure: an app that is not deployed has no pod running
        on the old header. Anything else is, and it is the state worth an exit
        code — the Secret is now right and something is still exporting with
        the value it read at startup.
        """
        failed = []
        for name in names:
            try:
                k8s(
                    "PATCH",
                    f"/apis/apps/v1/namespaces/{NS}/deployments/{name}",
                    {"spec": {"template": {"metadata": {"annotations": {ANNOTATION: rv}}}}},
                    content_type="application/merge-patch+json",
                )
                print(f"rolled {name} ({ANNOTATION}={rv})")
            except urllib.error.HTTPError as e:
                if e.code == 404:
                    print(f"skipped {name}: not deployed")
                    continue
                eprint(f"cannot roll {name}: {e!r}")
                failed.append(name)
            except Exception as e:  # noqa: BLE001 — a refused roll is the finding
                eprint(f"cannot roll {name}: {e!r}")
                failed.append(name)
        return failed


    def main() -> int:
        try:
            src = k8s("GET", f"/api/v1/namespaces/{NS}/secrets/{SRC}")
            email = base64.b64decode(src["data"]["email"]).decode()
            password = base64.b64decode(src["data"]["password"]).decode()
        except Exception as e:  # noqa: BLE001 — cannot read == cannot derive
            eprint(f"FATAL: cannot read {SRC}: {e!r}")
            return 2

        # OpenObserve v0.90.3 accepts HTTP Basic for OTLP ingest and answers
        # Bearer with `401 Not Supported`. The scheme is not a preference.
        basic = base64.b64encode(f"{email}:{password}".encode()).decode()
        wanted = base64.b64encode(f"Authorization=Basic {basic}".encode()).decode()

        try:
            cur = k8s("GET", f"/api/v1/namespaces/{NS}/secrets/{DST}")
        except urllib.error.HTTPError as e:
            if e.code != 404:
                eprint(f"FATAL: cannot read {DST}: {e!r}")
                return 3
            cur = None

        if cur and (cur.get("data") or {}).get("headers") == wanted:
            # Factory#606, one layer up. Returning here made this reconciler
            # EDGE-triggered: it rolled consumers only on the run that changed
            # the Secret. A roll that failed once — a transient 403, an API
            # timeout, a Deployment not yet created — was never retried,
            # because every later run took this branch and printed ok while a
            # pod stayed on the old header forever. Observed 2026-08-10: this
            # job had reported ok hourly for ten days and NOT ONE of the four
            # consumers carried the annotation.
            #
            # So converge instead of edge-trigger. The property to hold is
            # "every consumer is stamped with the current Secret", not "the
            # Secret is correct" — asserting the latter while the former is
            # false is exactly the defect #606 describes.
            rv = (cur.get("metadata") or {}).get("resourceVersion")
            if not rv:
                eprint(f"FATAL: {DST} exists but the API returned no "
                       "resourceVersion; cannot verify consumers are current")
                return 4
            behind, seen = drifted(rv)
            if not behind:
                # Report what was VERIFIED, not len(CONSUMERS): a consumer that
                # is not deployed was skipped, not checked, and saying "all 4"
                # after examining 3 is the same unmeasured claim this script
                # exists to stop.
                absent = len(CONSUMERS) - len(seen)
                tail = f", {absent} not deployed" if absent else ""
                # Never log the header itself; the scheme is the whole diagnosis.
                print(f"ok: {DST} derived from {SRC} (scheme=Basic), "
                      f"{len(seen)}/{len(CONSUMERS)} consumers stamped {rv}{tail}")
                return 0
            print(f"converging: {DST} is correct but these are not stamped "
                  f"{rv}: {', '.join(behind)}")
            failed = roll(rv, behind)
            if failed:
                eprint(f"FATAL: could not roll {', '.join(failed)}; they may "
                       "still be exporting with the value read at startup")
                return 4
            return 0

        had = "absent"
        if cur:
            try:
                raw = base64.b64decode((cur.get("data") or {}).get("headers", "")).decode()
                had = raw.split("=", 1)[-1].split(" ")[0] or "<empty>"
            except Exception:  # noqa: BLE001
                had = "<unparseable>"

        try:
            if cur:
                new = k8s(
                    "PATCH",
                    f"/api/v1/namespaces/{NS}/secrets/{DST}",
                    {"data": {"headers": wanted}},
                    content_type="application/merge-patch+json",
                )
            else:
                new = k8s(
                    "POST",
                    f"/api/v1/namespaces/{NS}/secrets",
                    {
                        "apiVersion": "v1",
                        "kind": "Secret",
                        "metadata": {
                            "name": DST,
                            "namespace": NS,
                            "labels": {"app": "observe"},
                        },
                        "type": "Opaque",
                        "data": {"headers": wanted},
                    },
                )
        except Exception as e:  # noqa: BLE001 — a refused write is the finding
            eprint(f"FATAL: cannot write {DST}: {e!r}")
            return 3

        # Loud on change: this is the line that would have shown #465 on day one.
        print(f"REWROTE {DST} from {SRC}: auth scheme was {had}, now Basic.")

        # Factory#606. Env from a Secret is read once, at container start, so
        # the rewrite above is invisible to every pod already running. Rolling
        # them is part of the same operation that caused it, not a thing a
        # human is expected to remember.
        rv = ((new or {}).get("metadata") or {}).get("resourceVersion")
        if not rv:
            # No resourceVersion means no stable value to stamp, and stamping
            # nothing would silently leave the consumers on the old header.
            eprint(f"FATAL: {DST} written but the API returned no resourceVersion; "
                   "consumers NOT rolled and are still on the old value")
            return 4
        failed = roll(rv)
        if failed:
            eprint(f"FATAL: {DST} is correct, but these could not be rolled and are "
                   f"still exporting with the value read at startup: {', '.join(failed)}")
            return 4
        return 0


    if __name__ == "__main__":
        raise SystemExit(main())
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: observe-otlp-auth-sync, namespace: factory, labels: { app: observe } }
spec:
  # Hourly. The input changes only when observe-root is rotated, so this is
  # about bounding how long a rotation leaves traces dark, not about load.
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata: { labels: { app: observe-otlp-auth-sync } }
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          serviceAccountName: observe-otlp-auth
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: sync
              # Stock python; the script is stdlib-only, same as job-watchdog.
              image: python:3.12-slim@sha256:646fb0bca3dd3ea1bcc6feb72c17ed16eed6e10cffc732fcc1478bd3e7f02d7b
              command: ["python3", "/script/sync.py"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 200m, memory: 128Mi }
              volumeMounts:
                - { name: script, mountPath: /script, readOnly: true }
          volumes:
            - name: script
              configMap: { name: observe-otlp-auth-script }
