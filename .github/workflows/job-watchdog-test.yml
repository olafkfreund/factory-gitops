# job-watchdog's watchdog.py lives as a block scalar inside a ConfigMap, so
# nothing imported it and nothing ran its ~500 lines of embedded assertions
# (factory-gitops#152). manifest-validate.yml proves the ConfigMap is
# well-formed YAML and says nothing about the Python inside it, which meant the
# selftest could be broken — or silently pass while asserting nothing — and CI
# would stay green. Every mutation check on this app had to be run by hand.
#
# The watchdog is the fleet's only route from a failing workload to a human, so
# "its tests are run by a person who remembers to" is not good enough.
#
# No paths filter: this takes seconds, and a required check that does not run on
# a PR leaves that PR blocked forever.
#
# Four embedded selftests run here — job-watchdog, restart-watchdog,
# argocd-drift (factory-gitops#152) and fleet-match (#89). The fourth is the one
# that shows the shape of this gap rather than closing an instance of it: it was
# never in #152's list, so "all three now run" was true and this app's ~470
# assertions still had never executed in CI. Whoever adds the fifth embedded
# script adds it here in the same commit.
name: job-watchdog selftest

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: watchdog.py selftest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Extract watchdog.py from the ConfigMap
        run: |
          python3 .github/scripts/extract_embedded_script.py \
            apps/job-watchdog/manifests/manifests.yaml \
            watchdog.py \
            /tmp/watchdog_extracted.py
      - name: Selftest
        run: python3 /tmp/watchdog_extracted.py selftest

      # restart-watchdog (Factory#561) is the other half of the same job: this
      # one reports a CronJob that stopped working, that one reports a container
      # stuck in a restart loop. Its assertions cover the same class of rule --
      # what fires, what stays muted -- so they belong behind the same gate,
      # added here as a step rather than a matrix so the required check keeps
      # its existing name.
      - name: Extract restart-watchdog's watchdog.py from the ConfigMap
        run: |
          python3 .github/scripts/extract_embedded_script.py \
            apps/restart-watchdog/manifests/manifests.yaml \
            watchdog.py \
            /tmp/restart_watchdog_extracted.py
      - name: Selftest (restart-watchdog)
        run: python3 /tmp/restart_watchdog_extracted.py selftest

      # argocd-drift, the last of the three embedded selftests and the other
      # half of factory-gitops#152. It is the DETECTOR for the reconcile stall
      # that job-watchdog now alerts on (Factory#443), so a regression in its
      # assertions is a regression in the same signal from the other end. Same
      # generic extractor, one more step: the whole gap was that nobody had
      # pointed it at this file.
      - name: Extract argocd-drift's drift.py from the ConfigMap
        run: |
          python3 .github/scripts/extract_embedded_script.py \
            apps/argocd-drift/manifests/manifests.yaml \
            drift.py \
            /tmp/argocd_drift_extracted.py
      - name: Selftest (argocd-drift)
        run: python3 /tmp/argocd_drift_extracted.py selftest

      # fleet-match, the FOURTH embedded selftest, and it was the one nobody
      # noticed was missing (#89). The header above says "all three ... which
      # closes factory-gitops#152" -- that was true of the three apps #152
      # named, and fleet-match has the same shape and was not among them. Its
      # ~470 lines of assertions have never run in CI: `grep -rn
      # fleet-match .github/workflows/` returned nothing before this step.
      #
      # It is the app that answers "is the fleet running the code on main", so
      # a silently-broken assertion in it is a fleet-wide blind spot reported as
      # green -- which is the same class of defect it exists to catch, one level
      # up. Found while adding the Job-runner leg for #89: the new cases passed
      # locally and nothing in CI would ever have run them.
      - name: Extract fleet-match's match.py from the ConfigMap
        run: |
          python3 .github/scripts/extract_embedded_script.py \
            apps/fleet-match/manifests/manifests.yaml \
            match.py \
            /tmp/fleet_match_extracted.py
      - name: Selftest (fleet-match)
        run: python3 /tmp/fleet_match_extracted.py selftest
