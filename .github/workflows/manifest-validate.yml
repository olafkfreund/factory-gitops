# Validate every manifest this repo hands to ArgoCD.
#
# Until this existed, factory-gitops had exactly one workflow (cli-canary.yml),
# which runs weekly and on its own files. Nothing checked the manifests. This is
# the repo ArgoCD syncs to the live cluster, so a kustomization that fails to
# build or a manifest with a bad schema reached the cluster with nothing in the
# way -- the failure surfaced as an ArgoCD sync error after the fact, on the
# only branch that matters.
#
# Deliberately NO `paths:` filter. A required status check that does not run on
# a given PR leaves that PR blocked forever, so this must report on every PR.
# The whole job takes about 20 seconds.
#
# Rule 4.7 (Factory standards): a gate that cannot run must FAIL, not pass. Every
# way this job can fail to do its work is an explicit exit 1 below -- missing
# tools, zero kustomizations discovered, zero YAML discovered, a build that
# produces no output, a file this gate cannot validate and has not been told to
# skip, zero Kyverno policies discovered, zero Kyverno test suites discovered,
# a test suite that runs zero cases, and -- the one that is easy to miss -- a
# test case that expects a verdict and got no result at all, which the Kyverno
# CLI scores as a pass (#148).
name: manifest validation (blocking)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: kustomize build + schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize, kubeconform, yq and the Kyverno CLI
        run: |
          set -euo pipefail
          curl -sfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin kustomize
          curl -sfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
          # Pinned to v1.18.2 to MATCH the admission controller running in the
          # cluster (reg.kyverno.io/kyverno/kyverno:v1.18.2). This is not the
          # usual "pin for reproducibility" -- the whole value of the step
          # below is that it agrees with the webhook that will judge the
          # policy for real. A CLI on a different minor gives false confidence
          # in both directions: a policy the webhook rejects passing here, or
          # a policy the webhook accepts failing here.
          curl -sfL https://github.com/kyverno/kyverno/releases/download/v1.18.2/kyverno-cli_v1.18.2_linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin kyverno
          # #148 needs to read a test suite's `results:` back out of YAML, and
          # those suites use anchors and aliases, so a grep is not a parser.
          # Pinned and downloaded rather than taken from the runner image: yq
          # IS preinstalled on ubuntu-latest today, and a gate whose correctness
          # depends on undeclared image contents is a gate that breaks the week
          # that image changes.
          curl -sfL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          # Rule 4.7: prove the tools are usable before claiming anything passed.
          # A download that 404s into a 0-byte file still leaves a file behind.
          kustomize version
          kubeconform -v
          yq --version
          # The #148 assertion is a python script. It imports the standard
          # library only (json), so this proves everything it needs.
          python3 --version
          kyverno version

      - name: Build every kustomization and schema-check every manifest
        run: |
          set -uo pipefail

          # This gate used to discover its work by finding kustomization.yaml.
          # That made a directory with NO kustomization.yaml invisible rather
          # than empty -- the job reported green having validated nothing for
          # it, and the zero-DIRS guard below could not tell the difference.
          # Five directories had accumulated that way (#117), including the
          # cluster-wide Kyverno signature policy (#111), the outbound tunnel,
          # the IdP and the RWX storage provisioner.
          #
          # So the denominator is now every tracked YAML file, and each one
          # lands in exactly one of three buckets:
          #
          #   1. inside a discovered kustomization -> `kustomize build` + schema
          #   2. listed in is_skipped() below      -> deliberately not validated
          #   3. everything else                   -> kubeconform directly
          #
          # Bucket 3 is a catch-all with no list to maintain, so the sixth
          # invisible directory cannot happen: a new manifest directory is
          # validated the day it lands. The only way out of the gate is
          # is_skipped(), which is a line in a diff a reviewer sees.

          mapfile -t DIRS < <(find . -name kustomization.yaml -not -path './.git/*' -printf '%h\n' | sort)
          mapfile -t ALL < <(git ls-files -z '*.yaml' '*.yml' | tr '\0' '\n' | sort)

          # The cli-canary bug this repo fixed (#90/#92) was a gate that
          # compared three greps without checking any had MATCHED. Same trap
          # here: if a reorganisation moves the manifests, an unguarded loop
          # iterates zero times and the job reports success having validated
          # nothing. Absence is a failure, not a pass.
          if [ "${#DIRS[@]}" -eq 0 ]; then
            echo "::error::no kustomization.yaml found anywhere -- this gate validated nothing"
            exit 1
          fi
          if [ "${#ALL[@]}" -eq 0 ]; then
            echo "::error::git ls-files found no YAML at all -- this gate validated nothing"
            exit 1
          fi
          echo "discovered ${#DIRS[@]} kustomizations and ${#ALL[@]} tracked YAML files"

          # Not Kubernetes manifests. Every entry needs a reason, because every
          # entry is a file this gate deliberately does not check.
          is_skipped() {
            case "$1" in
              .github/workflows/*) return 0 ;;   # GitHub Actions, not Kubernetes
              mkdocs.yml)          return 0 ;;   # MkDocs site config
              *)                   return 1 ;;
            esac
          }

          # A file is covered by a kustomization when it sits inside that
          # kustomization's directory tree. Approximate on purpose: a file the
          # kustomization does not actually list still counts as covered. That
          # is a narrower gap than #117 and is not what this change is about.
          is_kustomized() {
            local f="$1" d
            for d in "${DIRS[@]}"; do
              case "$f" in "${d#./}"/*) return 0 ;; esac
            done
            return 1
          }

          fail=0

          for d in "${DIRS[@]}"; do
            if ! built=$(kustomize build "$d" 2>&1); then
              echo "::error file=$d/kustomization.yaml::kustomize build failed: $(printf '%s' "$built" | head -1)"
              fail=1
              continue
            fi
            # An empty build is not a passing build. kustomize exits 0 for a
            # kustomization that resources its way to nothing, which would then
            # sail through kubeconform as zero documents.
            if [ -z "$(printf '%s' "$built" | tr -d '[:space:]')" ]; then
              echo "::error file=$d/kustomization.yaml::kustomize build produced no output"
              fail=1
              continue
            fi
            # -ignore-missing-schemas: ArgoCD Application, Kyverno ClusterPolicy
            # and KEDA ScaledObject are CRDs whose schemas are not in the
            # upstream set. Their KINDS are skipped; every core kind is still
            # checked strictly, and -strict rejects unknown fields, which is
            # what catches a typo'd key that Kubernetes would silently drop.
            if ! out=$(printf '%s' "$built" | kubeconform -strict -ignore-missing-schemas -summary - 2>&1); then
              echo "::error file=$d/kustomization.yaml::schema validation failed"
              printf '%s\n' "$out" | head -20
              fail=1
              continue
            fi
            echo "ok  kustomize  $d"
          done

          loose=0
          for f in "${ALL[@]}"; do
            is_kustomized "$f" && continue
            if is_skipped "$f"; then
              echo "--  skipped   $f"
              continue
            fi
            loose=$((loose + 1))
            # Same reasoning as the empty-build guard: a YAML file with no
            # `kind:` yields zero documents, and kubeconform validating zero
            # documents exits 0. That is the gate reporting on nothing. Whoever
            # adds such a file writes it into is_skipped() with a reason rather
            # than having it pass unexamined.
            if ! grep -qE '^[[:space:]]*kind:[[:space:]]*[^[:space:]]' "$f"; then
              echo "::error file=$f::no \`kind:\` -- not a Kubernetes manifest this gate can validate; add it to is_skipped() with a reason, or fix it"
              fail=1
              continue
            fi
            if ! out=$(kubeconform -strict -ignore-missing-schemas -summary "$f" 2>&1); then
              echo "::error file=$f::schema validation failed"
              printf '%s\n' "$out" | head -20
              fail=1
              continue
            fi
            # Say which of the two happened. A file whose every resource is a
            # CRD kind with no upstream schema was parsed, not schema-checked --
            # true of the Kyverno ClusterPolicy in #111, and worth reading in the
            # log rather than inferring from a bare "ok".
            case "$out" in
              *"Valid: 0,"*"Skipped: 0"*)
                echo "::error file=$f::kubeconform found no resources here -- this gate checked nothing"
                fail=1
                continue ;;
              *"Valid: 0,"*)
                echo "ok  parsed     $f  (CRD kind, no upstream schema -- syntax only)"
                continue ;;
            esac
            echo "ok  schema     $f"
          done
          echo "validated $loose YAML files no kustomization covers"

          exit "$fail"

      - name: Assert third-party images in `factory` are pinned to a digest
        run: |
          set -uo pipefail

          # Factory#588. #140 pinned eleven third-party images to digests and
          # deliberately left the policy asserting they STAY pinned to a later
          # change (Factory#573 sequences it that way so the control lands
          # green). That later change never came, and until this step existed
          # NOTHING checked the pins -- not this workflow, not Kyverno.
          #
          # That matters more than a missing to-do, because of the shape of the
          # gap. The eleven were not passing a check; there was no check. They
          # were pinned once by hand on 2026-08-06 and then unobserved. A
          # revert, a bad merge, or an `images:` transformer would have taken
          # any of them back to a mutable tag with nothing to say so -- and
          # #140 found exactly such a transformer already in the repo, in
          # apps/observe, silently unpinning openobserve on every build while
          # the source file read as correctly pinned.
          #
          # The three Kyverno policies do not cover this and say so in their
          # own text: verify-factory-image-signatures and
          # require-first-party-signature-coverage are both scoped to
          # `ghcr.io/olafkfreund/*`, and the latter's closing comment states
          # that third-party digest pinning "is a separate policy against a
          # separate set of manifests, tracked in Factory#573". This is that
          # assertion, in CI rather than at admission, which is where it can
          # fail on the PR that breaks it instead of after the sync.
          #
          # SCOPE IS DERIVED, NOT LISTED. The set of images to check is read
          # from the ArgoCD Applications themselves: every Application whose
          # `spec.destination.namespace` is `factory` is in scope, which is
          # exactly how Factory#573 defines its own boundary. There is no
          # hand-maintained list of images and no allowlist of directories, so
          # an app added tomorrow is checked the day it lands (#117's lesson)
          # and apps/kyverno, apps/keda, apps/fides and bootstrap -- which are
          # on mutable tags but deploy elsewhere -- are excluded because of
          # what they declare, not because somebody remembered to exempt them.
          #
          # RENDERED, NOT SOURCE. `kustomize build` output is what ArgoCD
          # ships; #140 caught the observe transformer only by counting pinned
          # refs in the rendered output, where the count came back 1 of 2.
          #
          # WHAT THIS DOES NOT COVER, and it is the point of Factory#588: an
          # Application in scope whose manifests live in ANOTHER repo cannot be
          # read from here at all. `skillai` is one -- it targets `factory` and
          # its manifests are in olafkfreund/SkillAi -- and it is the reason
          # eleven of the twelve images got pinned and the twelfth did not.
          # That is declared below rather than filtered out silently, and an
          # UNdeclared external Application in scope FAILS, so the next one
          # cannot go unnoticed the way this one nearly did.

          # One line per Application that targets `factory` from another repo,
          # each carrying the issue tracking its pin. An entry here is a line
          # in a diff a reviewer sees, which is the only reason it is allowed
          # to be an exception at all.
          is_external_declared() {
            case "$1" in
              skillai) return 0 ;;   # olafkfreund/SkillAi deploy/k8s -- Factory#588
              *)       return 1 ;;
            esac
          }

          # Discover by CONTENT, same as the Kyverno steps below: an
          # Application added anywhere is seen, whatever its file is called.
          mapfile -t APPS < <(
            git ls-files -z '*.yaml' '*.yml' | tr '\0' '\n' | sort | while read -r f; do
              grep -qE '^apiVersion:[[:space:]]*"?argoproj\.io/' "$f" || continue
              grep -qE '^kind:[[:space:]]*"?Application"?[[:space:]]*$' "$f" || continue
              printf '%s\n' "$f"
            done
          )
          # Rule 4.7, same shape as every other guard in this file.
          if [ "${#APPS[@]}" -eq 0 ]; then
            echo "::error::no ArgoCD Application discovered -- this gate checked nothing"
            exit 1
          fi
          echo "discovered ${#APPS[@]} ArgoCD Application(s)"

          fail=0; inscope=0; images=0; unreachable=0

          for a in "${APPS[@]}"; do
            # All four fields in one read so a multi-document file cannot
            # pair one Application's name with another's destination.
            while IFS=$'\t' read -r name repo path ns; do
              [ "$ns" = "factory" ] || continue
              inscope=$((inscope + 1))

              # An Application this gate cannot parse is not an Application
              # this gate may pass. `.spec.sources` (multi-source) and Helm
              # sources both land here.
              if [ -z "$name" ] || [ "$name" = "null" ] || [ -z "$repo" ] || [ "$repo" = "null" ] \
                 || [ -z "$path" ] || [ "$path" = "null" ]; then
                echo "::error file=$a::an Application targeting \`factory\` declares no single source.repoURL/source.path this gate can read (multi-source or Helm?) -- it cannot be checked, so it cannot pass"
                fail=1
                continue
              fi

              case "$repo" in
                *olafkfreund/factory-gitops*) ;;
                *)
                  unreachable=$((unreachable + 1))
                  if is_external_declared "$name"; then
                    echo "--  external  $name -> $repo ($path) -- targets \`factory\`, manifests not in this repo, declared"
                  else
                    echo "::error file=$a::Application \`$name\` deploys to \`factory\` from $repo, which this gate cannot read. Pin its images in that repo, then declare it in is_external_declared() with the tracking issue."
                    fail=1
                  fi
                  continue ;;
              esac

              if [ ! -d "$path" ]; then
                echo "::error file=$a::source path \`$path\` does not exist -- this gate cannot check \`$name\`"
                fail=1
                continue
              fi

              if [ -f "$path/kustomization.yaml" ]; then
                if ! rendered=$(kustomize build "$path" 2>&1); then
                  echo "::error file=$a::kustomize build \`$path\` failed -- this gate cannot check \`$name\`"
                  fail=1
                  continue
                fi
              else
                # `find -exec cat` rather than `cat "$path"/*.yaml "$path"/*.yml`:
                # an unmatched glob is passed through literally, cat exits
                # non-zero on it, and GitHub runs this step under `bash -e`, so
                # the whole step died at the first such directory. infra/cloudflared
                # holds no .yml file and is the first one reached alphabetically.
                rendered=$(find "$path" -maxdepth 1 -type f \( -name '*.yaml' -o -name '*.yml' \) -exec cat {} +)
              fi

              # An empty render is not a passing render -- same reasoning as the
              # zero-output guard on `kustomize build` in the step above. Without
              # this, a directory that renders to nothing contributes no images
              # and no complaint, which reads exactly like a clean app.
              if [ -z "$(printf '%s' "$rendered" | tr -d '[:space:]')" ]; then
                echo "::error file=$a::\`$path\` rendered no manifests -- this gate checked nothing for \`$name\`"
                fail=1
                continue
              fi

              mapfile -t REFS < <(
                printf '%s\n' "$rendered" \
                  | sed -nE 's/^[[:space:]]*-?[[:space:]]*image:[[:space:]]*"?([^"[:space:]]+).*/\1/p' \
                  | sort -u
              )
              for i in "${REFS[@]}"; do
                [ -n "$i" ] || continue
                # First-party images are covered by the two signature policies
                # and carry an immutable sha- build tag. Stated boundary, same
                # split as docs/image-digest-pinning.md.
                case "$i" in ghcr.io/olafkfreund/*) continue ;; esac
                images=$((images + 1))
                case "$i" in
                  *@sha256:*) echo "ok  pinned    $name  $i" ;;
                  *) echo "::error file=$a::\`$name\` runs third-party image \`$i\` in \`factory\` on a mutable tag -- pin it as image:tag@sha256:... (Factory#573)"
                     fail=1 ;;
                esac
              done
            done < <(yq -r 'select(.kind == "Application") | [.metadata.name, .spec.source.repoURL, .spec.source.path, .spec.destination.namespace] | @tsv' "$a")
          done

          # Both counters are guards, not decoration. Narrowing the namespace
          # match, or widening the first-party skip, would otherwise leave this
          # step reporting success having examined nothing -- which is the
          # defect it exists to close, reproduced inside its own fix.
          if [ "$inscope" -eq 0 ]; then
            echo "::error::no Application targets the \`factory\` namespace -- discovery broke; this gate checked nothing"
            exit 1
          fi
          if [ "$images" -eq 0 ]; then
            echo "::error::not one third-party image reference was examined across $inscope Application(s) -- this gate reported green having checked nothing"
            exit 1
          fi
          echo "examined $images third-party image reference(s) across $inscope Application(s) targeting \`factory\`; $unreachable declared out of this repo"

          # What this still does NOT catch, so a green tick is not read as more
          # than it is:
          #   - Whether a pinned digest is the RIGHT image. A pin to a wrong or
          #     malicious digest is immutable and passes here. Provenance for
          #     these images is the gap Factory#573 records as unclosable:
          #     they publish no signature under an identity we could pin.
          #   - Staleness. A pinned digest never moves, including past a CVE
          #     fix, and nothing refreshes these (factory-gitops#139).
          #   - The cluster. This reads manifests, not running Pods; an image
          #     applied by hand, or by an operator, is invisible here.
          #   - Any Application in scope whose manifests are in another repo:
          #     declared above, checked in that repo, and nowhere else.
          exit "$fail"

      - name: Assert the pod-hardening ratchet has not slipped
        run: |
          set -uo pipefail

          # Factory#521. Factory#503 hardened the five Factory-owned control-plane
          # Deployments; #521 did the third-party ones. NOTHING kept either set
          # hardened. Deleting a securityContext block from any of them was, until
          # this step, a change that passed every gate in this repo: kustomize
          # builds it, kubeconform calls it schema-valid, and Kyverno ADMITS it.
          #
          # That last one is the part worth being blunt about. The fleet's Kyverno
          # policy is `Audit` for everything except the single scoped Enforce rule
          # landed in Factory#570. An Audit policy writes a PolicyReport and lets
          # the pod through -- it CONSTRAINS NOTHING. Factory#522 is the issue that
          # would change that. Until it does, this step is the only enforcement
          # that exists for pod hardening in this repo, and it is CI-side, so it
          # binds what this repo declares, not what is running in the cluster.
          #
          # It is a RATCHET, not a blanket policy, and deliberately so: a blanket
          # "every workload must be hardened" check is red today (fides-db,
          # fides-server, postgres) and a permanently-red REQUIRED check wedges
          # every merge. This repo already faced that trade for the literal-secrets
          # scan (#116) and answered it by making that job non-required. A ratchet
          # is the shape that can live inside the required job: green now, red the
          # moment something that IS hardened stops being.
          #
          # Mutation-tested before it landed, all three guards, both directions:
          #   strip drop:[ALL] from observe        -> RED  (exit 1), restore -> GREEN
          #   strip seccompProfile from odin       -> RED  (exit 1), restore -> GREEN
          #   rename a banked container            -> RED  (exit 1), restore -> GREEN

          mapfile -t DIRS < <(find . -name kustomization.yaml -not -path './.git/*' -printf '%h\n' | sort)
          mapfile -t ALL < <(git ls-files -z '*.yaml' '*.yml' | tr '\0' '\n' | sort)
          if [ "${#DIRS[@]}" -eq 0 ] || [ "${#ALL[@]}" -eq 0 ]; then
            echo "::error::discovery found nothing -- this gate checked nothing"
            exit 1
          fi

          is_kustomized() {
            local f="$1" d
            for d in "${DIRS[@]}"; do
              case "$f" in "${d#./}"/*) return 0 ;; esac
            done
            return 1
          }

          # Same three buckets as the schema step, for the same reason (#117):
          # anything not covered by a kustomization is still read, so a new
          # manifest directory is checked the day it lands.
          : > /tmp/hardening-all.yaml
          for d in "${DIRS[@]}"; do
            kustomize build "$d" >> /tmp/hardening-all.yaml 2>/dev/null
            echo "---" >> /tmp/hardening-all.yaml
          done
          for f in "${ALL[@]}"; do
            is_kustomized "$f" && continue
            case "$f" in .github/workflows/*|mkdocs.yml) continue ;; esac
            cat "$f" >> /tmp/hardening-all.yaml
            echo "---" >> /tmp/hardening-all.yaml
          done

          # yq for the parse (these manifests use flow style and anchors, so a
          # grep is not a parser -- the same reasoning as #148), python for the
          # assertion.
          yq -o=json -I0 '[.]' /tmp/hardening-all.yaml 2>/dev/null \
            | python3 -c "
          import json,sys
          docs=[]
          for line in sys.stdin:
              line=line.strip()
              if not line: continue
              try: docs.extend(json.loads(line))
              except Exception: pass
          json.dump(docs, open('/tmp/hardening.json','w'))
          "

          cat > /tmp/assert-hardened.py <<'PYEOF'
          import json, sys

          # Workloads whose hardening has been paid for and MEASURED. Losing a
          # control here is a regression and fails the build. Adding a workload
          # here is how the win gets banked.
          #   Factory#503: the five Factory-owned control-plane Deployments
          #   Factory#521: the third-party ones
          HARDENED = {
              ("aifactory", "aifactory"), ("aifactory", "cred-sync"),
              ("pfactory", "pfactory"),   ("pfactory", "cred-sync"),
              ("tfactory", "tfactory"),   ("tfactory", "cred-sync"),
              ("cfactory", "cfactory"),
              ("cfactory-frontend", "frontend"),
              ("cloudflared", "cloudflared"),
              ("keycloak", "keycloak"),
              ("minio", "minio"),
              ("redis", "redis"),
              ("oauth2-proxy-cfactory", "oauth2-proxy"),
              ("oauth2-proxy-observe", "oauth2-proxy"),
              ("oauth2-proxy-odin", "oauth2-proxy"),
              ("observe", "openobserve"),
              ("odin-dashboard", "odin"),
              ("nfs-provisioner", "nfs-provisioner"),
          }

          # Per-control carve-outs. Each one is a line in a diff a reviewer sees.
          EXCEPTIONS = {
              ("nfs-provisioner", "nfs-provisioner", "capabilities.drop[ALL]"):
                  "ganesha forks rpcbind and rpc.statd, which setuid down and bind "
                  "privileged ports. drop:[ALL] crashloops the NFS server and takes "
                  "the `nfs` storageClass -- and tfactory-data-rwx -- with it. "
                  "Measured: Factory#521, evidence in apps/nfs-provisioner/manifests.",
          }

          KINDS = {"Deployment", "StatefulSet", "DaemonSet"}
          CONTROLS = ("seccompProfile", "allowPrivilegeEscalation", "capabilities.drop[ALL]")


          def missing(pod_sc, sc):
              out = []
              # seccomp is inherited from the pod, so either level satisfies it.
              seccomp = (sc.get("seccompProfile") or pod_sc.get("seccompProfile") or {}).get("type")
              if seccomp not in ("RuntimeDefault", "Localhost"):
                  out.append("seccompProfile")
              # allowPrivilegeEscalation is container-only; no pod-level form exists.
              if sc.get("allowPrivilegeEscalation") is not False:
                  out.append("allowPrivilegeEscalation")
              drop = [str(d).upper() for d in ((sc.get("capabilities") or {}).get("drop") or [])]
              if "ALL" not in drop:
                  out.append("capabilities.drop[ALL]")
              return out


          docs = [d for d in json.load(open("/tmp/hardening.json")) if isinstance(d, dict)]
          workloads = [d for d in docs if d.get("kind") in KINDS]
          # Rule 4.7, the guard every step in this file carries: absence is a
          # failure, not a pass.
          if not workloads:
              print("::error::rendered manifests contain no Deployment/StatefulSet/DaemonSet "
                    "-- discovery broke and this gate checked nothing")
              sys.exit(1)

          seen, bad, unhardened = set(), 0, []
          for d in workloads:
              name = (d.get("metadata") or {}).get("name", "<unnamed>")
              spec = (d.get("spec") or {}).get("template", {}).get("spec") or {}
              pod_sc = spec.get("securityContext") or {}
              for c in spec.get("containers") or []:
                  cname = c.get("name", "<unnamed>")
                  gaps = missing(pod_sc, c.get("securityContext") or {})
                  if (name, cname) not in HARDENED:
                      if gaps:
                          unhardened.append(name + "/" + cname + ": " + ", ".join(gaps))
                      continue
                  seen.add((name, cname))
                  for control in gaps:
                      if (name, cname, control) in EXCEPTIONS:
                          continue
                      print("::error::REGRESSION: " + name + "/" + cname + " no longer sets "
                            + control + ". This workload was hardened deliberately "
                            "(Factory#503/#521) and the control has been removed. Kyverno is "
                            "in Audit mode (Factory#522) and will ADMIT this pod, so nothing "
                            "downstream will catch it.")
                      bad = 1

          # A banked workload that vanishes from the render silently loosens the
          # ratchet -- the #148 failure shape exactly (a name the check asserts on
          # but the tree no longer has, which passes vacuously). Renaming must be
          # a deliberate edit here, not an accident.
          for key in sorted(HARDENED - seen):
              print("::error::" + key[0] + "/" + key[1] + " is in HARDENED but no such "
                    "container was rendered -- it was renamed or removed. Update HARDENED "
                    "deliberately; leaving it stale means this gate silently stops checking it.")
              bad = 1

          # Reported, never fatal. These are the workloads #521 did not reach --
          # they are visible so the next sweep has a worklist, but they cannot
          # wedge the required check.
          if unhardened:
              print("note: " + str(len(unhardened)) + " container(s) not yet in the ratchet "
                    "(informational, does not fail):")
              for u in sorted(unhardened):
                  print("  -  " + u)
          print("ratchet: " + str(len(seen)) + "/" + str(len(HARDENED))
                + " banked workload(s) still carry " + ", ".join(CONTROLS))
          sys.exit(bad)
          PYEOF

          python3 /tmp/assert-hardened.py

          # What this does NOT do, so a green tick is not over-read:
          #   - It checks what this repo DECLARES, not what is RUNNING. Declared
          #     and live drift, which is the whole premise of #521; only a cluster
          #     probe or an Enforce-mode admission rule speaks to live state.
          #   - It does not cover runAsNonRoot or readOnlyRootFilesystem. Both have
          #     genuine per-image exceptions in this namespace (Factory#621, #622)
          #     and a ratchet that starts with carve-outs teaches people to add
          #     carve-outs. Factory#322 owns those two.
          #   - It cannot see workloads sourced from other repos. skillai-app comes
          #     from olafkfreund/SkillAi and is unhardened live; Factory#624.

      - name: Validate Kyverno policies with Kyverno's own policy validation
        run: |
          set -uo pipefail

          # #111 part 2. The step above proves the Kyverno ClusterPolicy
          # PARSES. It cannot prove the policy is VALID: kubeconform has no
          # schema for kyverno.io/v1, so it logs `ok parsed` and checks syntax
          # only. Every semantic rule Kyverno enforces is invisible to it.
          #
          # That gap is not cosmetic, because of how the failure lands.
          # Kyverno REJECTS a keyless attestor carrying neither `rekor` nor
          # `roots` ("Either Rekor URL or roots are required"). A rejected
          # policy cannot be applied AT ALL, and ArgoCD then keeps serving the
          # PREVIOUS version of the policy while reporting Synced and Healthy.
          #
          # That is exactly Factory#430: the cluster kept a stale copy of
          # verify-factory-image-signatures that had lost its subjectRegExp,
          # and for weeks it accepted a signature from ANY GitHub Actions
          # workflow in ANY repo. Every artefact a control review looks at was
          # green throughout. Because CI could not catch it, changes to that
          # file (#126, #128, #130) were each validated BY HAND against the
          # live webhook. This step is that manual check, automated.
          #
          # NOTE: `kyverno validate` does NOT exist in v1.18.x -- the
          # subcommand was removed. `kyverno apply` is what runs the same
          # policy validation the admission webhook runs.

          # A resource is mandatory for `kyverno apply`, but this step is a
          # POLICY validator, not a policy runner. The probe is a ConfigMap
          # precisely because no policy here matches one, so no rule executes:
          # no signature is fetched from ghcr.io, no log is fetched from
          # rekor.sigstore.dev, and the step needs no network beyond the
          # tool download. Policy validation happens at load time, before any
          # resource is matched, so it runs regardless.
          #
          # ponytail: a future policy that matches ConfigMaps would start
          # EXECUTING against this probe and could fail for reasons that are
          # not validity. Change the probe kind if that day comes.
          cat > /tmp/kyverno-probe.yaml <<'PROBE'
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: kyverno-policy-validation-probe
            namespace: default
          data: {}
          PROBE

          # Discover by CONTENT, not by path. That is #117's lesson applied
          # one level down: a hardcoded directory list makes the next policy
          # file invisible rather than merely unchecked. A Kyverno policy
          # added anywhere in this repo is validated the day it lands.
          #
          # Matches kyverno.io/v1 Policy and ClusterPolicy, which is what this
          # repo uses. The v1alpha1 policy types Kyverno 1.18 also ships
          # (ValidatingPolicy, ImageValidatingPolicy) are NOT matched -- see
          # the ceiling note at the end of this step.
          #
          # The optional quotes are not decoration. YAML permits
          # `apiVersion: "kyverno.io/v1"`, and a discovery regex that missed
          # that form would make the policy INVISIBLE to this gate rather than
          # merely unchecked -- #117's failure mode reproduced inside its own
          # fix. Both committed policies use the unquoted form; the quoted one
          # is accepted so that writing it can never silently disable the gate.
          mapfile -t POLICIES < <(
            git ls-files -z '*.yaml' '*.yml' | tr '\0' '\n' | sort | while read -r f; do
              grep -qE '^apiVersion:[[:space:]]*"?kyverno\.io/' "$f" || continue
              grep -qE '^kind:[[:space:]]*"?(Cluster)?Policy"?[[:space:]]*$' "$f" || continue
              printf '%s\n' "$f"
            done
          )

          # Rule 4.7, same shape as the zero-DIRS and zero-YAML guards above.
          # This repo HAS Kyverno policies. Finding none means discovery
          # broke, not that there is nothing to check.
          if [ "${#POLICIES[@]}" -eq 0 ]; then
            echo "::error::no Kyverno policy discovered -- this gate validated nothing"
            exit 1
          fi
          echo "discovered ${#POLICIES[@]} Kyverno policy file(s)"

          # The exit code is NOT the gate, and this is the whole point of the
          # step. `kyverno apply` DETECTS all three failure classes tested and
          # SWALLOWS two of them:
          #
          #   rekor/roots removed   -> exit 1, "policy validation error"
          #   operations: CRAETE    -> exit 0, "Non-fatal parsing error"
          #   patchesJson6901       -> exit 0, "skipping invalid YAML file"
          #
          # In both exit-0 cases the policy did not load at all, and the CLI
          # says so in the one place that is content rather than wording:
          # "Applying 0 policy rule(s)". Trusting the exit code alone would
          # ship the exact reports-without-checking defect #111 and #117 exist
          # to unpick, so all three signals are checked:
          #
          #   1. non-zero exit             -- the CLI called it invalid
          #   2. zero rules loaded         -- the policy was dropped entirely
          #   3. any `error=` line at -v 4 -- a policy was dropped from a file
          #                                   that still has other policies in
          #                                   it, so the rule count stays > 0
          #
          # Signal 3 is measured clean: both committed policies produce ZERO
          # `error=` lines. If a benign one ever shows up, this fails loudly
          # and legibly rather than passing quietly, which is the correct
          # direction to fail for a gate guarding cluster admission.
          #
          # -v 4 is required: at default verbosity the CLI prints a misleading
          # "Policies Skipped (as required variables are not provided)" and
          # hides the actual reason.
          #
          # -v 4 also emits one `rule.name=` per rule the engine LOADED, autogen
          # rules included. That is the authoritative inventory of what exists,
          # taken from the engine rather than from a grep over YAML, and the
          # test step below needs it (#148): a rule a suite NAMES but the policy
          # no longer HAS is reported Excluded for every one of its cases, and
          # Excluded passes. Collecting it here costs nothing -- the command was
          # already being run for its own sake.
          : > /tmp/kyverno-rule-inventory.txt

          fail=0
          for f in "${POLICIES[@]}"; do
            out=$(kyverno apply "$f" --resource /tmp/kyverno-probe.yaml -v 4 2>&1)
            rc=$?
            rules=$(printf '%s\n' "$out" | sed -n 's/^Applying \([0-9]\{1,\}\) policy rule(s).*/\1/p' | head -1)

            if [ "$rc" -ne 0 ]; then
              echo "::error file=$f::Kyverno rejected this policy -- the live webhook would refuse it, and ArgoCD would keep serving the PREVIOUS version while reporting Synced (Factory#430)"
            elif [ -z "$rules" ]; then
              echo "::error file=$f::could not read the rule count from kyverno output -- this gate cannot confirm it checked anything"
            elif [ "$rules" -eq 0 ]; then
              echo "::error file=$f::kyverno loaded 0 rules -- the policy was DROPPED, not validated"
            elif printf '%s\n' "$out" | grep -q 'error='; then
              echo "::error file=$f::kyverno reported an error while loading this policy"
            else
              # The first sed strips the ANSI colouring zerolog writes even
              # under --remove-color, which otherwise sits between `rule.name=`
              # and the name itself.
              printf '%s\n' "$out" \
                | sed 's/\x1b\[[0-9;]*m//g' \
                | sed -n 's/.*[[:space:]]rule\.name=\([^[:space:]]\{1,\}\).*/\1/p' \
                >> /tmp/kyverno-rule-inventory.txt
              echo "ok  kyverno    $f  ($rules rule(s) validated against Kyverno v1.18.2)"
              continue
            fi

            printf '%s\n' "$out" | grep -E 'error=|Applying [0-9]+ policy rule' | head -10
            fail=1
          done

          sort -u -o /tmp/kyverno-rule-inventory.txt /tmp/kyverno-rule-inventory.txt
          echo "inventoried $(wc -l < /tmp/kyverno-rule-inventory.txt) loaded rule name(s) for the test step"

          # What this still does NOT catch, so nobody reads a green tick as
          # more than it is:
          #   - Whether the policy does the RIGHT thing. A subjectRegExp that
          #     is valid but wrong (Factory#430's actual payload) is accepted
          #     here. Only #132's coverage measurement speaks to that.
          #   - Cluster-side admission of the policy object itself: CRD schema
          #     drift, or another controller's webhook rejecting it.
          #   - kyverno.io v1alpha1 policy kinds, which this repo does not use.
          exit "$fail"

      - name: Run the Kyverno policy test suites
        run: |
          set -uo pipefail

          # #143. The step above proves a policy LOADS. It cannot prove the
          # policy EVALUATES, and that is not a subtlety -- it is the whole
          # gap. `kyverno apply` there is handed a bare ConfigMap probe that
          # no rule in this repo matches, so every rule reports "not matched"
          # and nothing is executed. A rule can carry a dead expression and
          # still load with a healthy rule count.
          #
          # Measured during Factory#574, against five deliberate breakages of
          # require-first-party-signature-coverage. The live admission webhook
          # REJECTED four of them (bogus precondition operator, foreach-only
          # variable in `message`, `deny` removed, empty `match` kinds) and
          # ACCEPTED the fifth:
          #
          #   jmesPath: ... | [?regex_matchTYPO('^ghcr\.io/olafkfreund/', @)]
          #
          #   $ kubectl apply --dry-run=server -f ...
          #   clusterpolicy.kyverno.io/... configured (server dry run)
          #   $ kyverno apply ... --resource /tmp/kyverno-probe.yaml -v 4
          #   pass: 0, fail: 0, warn: 0, error: 0, skip: 0
          #
          # An unknown JMESPath function makes the variable resolve empty, the
          # precondition never fires, and the rule silently stops reporting
          # anything. Schema-valid, Ready, healthy `.status.rulecount`, and
          # measuring nothing -- Factory#430's shape exactly. The suite built
          # in Factory#564 catches it on the first case, and until this step
          # existed no workflow ran it (`grep -rn "kyverno test" .github/`
          # returned nothing).
          #
          # This step is only worth its runtime because it runs the SAME
          # v1.18.2 CLI pinned above, matching the cluster's admission
          # controller. JMESPath and glob behaviour are version-sensitive, so
          # a suite green on another minor proves nothing about admission.

          # Discover by CONTENT, not by path -- #117's lesson, and the reason
          # the issue asked for it here specifically. `kyverno test <dir>`
          # recurses looking for files literally named kyverno-test.yaml, so
          # handing it the repo root would silently ignore a suite named
          # anything else. Instead each suite FILE is found by what is in it
          # and then run by name with -f, so a new suite is run the day it
          # lands whatever it is called and wherever it sits.
          #
          # Quotes optional for the same reason as above: a discovery regex
          # that missed `apiVersion: "cli.kyverno.io/v1alpha1"` would make the
          # suite invisible rather than merely unrun, which is #117 reproduced
          # inside its own fix.
          mapfile -t SUITES < <(
            git ls-files -z '*.yaml' '*.yml' | tr '\0' '\n' | sort | while read -r f; do
              grep -qE '^apiVersion:[[:space:]]*"?cli\.kyverno\.io/' "$f" || continue
              grep -qE '^kind:[[:space:]]*"?Test"?[[:space:]]*$' "$f" || continue
              printf '%s\n' "$f"
            done
          )

          # Rule 4.7, same shape as every other guard in this file. This repo
          # HAS a test suite. Finding none means discovery broke, or a suite
          # was deleted rather than fixed.
          if [ "${#SUITES[@]}" -eq 0 ]; then
            echo "::error::no Kyverno test suite discovered -- this gate tested nothing"
            exit 1
          fi
          echo "discovered ${#SUITES[@]} Kyverno test suite(s)"

          # The exit code is NOT the whole gate, for the same reason it was not
          # in the step above. `kyverno test` on a directory holding no cases
          # prints "No test yamls available" and exits 0 -- indistinguishable
          # from a pass, and precisely how #143 happened one level up. So the
          # case count is read back out of the summary and a zero is a failure:
          #
          #   1. non-zero exit      -- a case did not get the result it expected
          #   2. a non-zero failure count, independently of the exit code, so a
          #      future release that reports failures and still exits 0 cannot
          #      quietly turn this step green
          #   3. no summary line    -- the CLI did not get as far as running
          #   4. zero cases         -- it ran, and it ran nothing
          #   5. a case that expects a real verdict and got no result at all
          #
          # Guard 5 is #148, and it is what makes coverage assertable at all.
          # `kyverno test` v1.18.2 reports a resource for which a rule produced
          # NO result as `Excluded`, and an Excluded row satisfies ANY expected
          # result -- `skip`, `pass` and `fail` alike. So guards 1 to 4 all hold
          # while the rule under test evaluates nothing whatsoever. Measured, on
          # this repo, with this CLI: re-scoping
          # require-first-party-signature-coverage to a namespace that does not
          # exist still reports "15 tests passed and 0 tests failed", five
          # expected-`fail` cases among them.
          #
          # The distinction the CLI will not draw, and this does:
          #
          #   pass / fail / warn / error  the rule evaluated this resource and
          #                               returned that verdict. An unevaluated
          #                               resource can NEVER satisfy this.
          #   skip                        "this rule has nothing to say", which
          #                               is honestly true both when the rule
          #                               ran and declined (REASON Ok) and when
          #                               it never matched at all (Excluded).
          #
          # So the assertion needs no allowlist and no edit to any suite: an
          # Excluded row is a failure exactly when the suite expected a verdict.
          # All three committed suites pass unchanged -- the 84 negative cases in
          # kyverno-test-verify-factory-image-signatures.yaml are Excluded by
          # design and stay legal.
          #
          # NOTHING HERE TOUCHES THE NETWORK, and that is a constraint rather
          # than a side note. The obvious way to assert coverage would be a
          # positive case on verify-factory-image-signatures, but a MATCHED
          # image reference sends the CLI to ghcr.io -- verdict `fail` when it
          # is reachable and `error` when it is not -- which would put a
          # third-party outage inside a required status check. #149 declined
          # that trade and so does this. The two `kyverno test` runs and the yq
          # read are all local.
          cat > /tmp/assert-evaluated.py <<'PYEOF'
          import json, sys

          # argv: <suite path, for the annotation> <suite .results as JSON> <rule inventory>
          # stdin: `kyverno test ... -o json` output, wrapped in CLI chatter.
          suite_path, expected_json, inventory_path = sys.argv[1], sys.argv[2], sys.argv[3]

          raw = sys.stdin.read()
          lo, hi = raw.find("["), raw.rfind("]")
          if lo < 0 or hi < lo:
              print(f"::error file={suite_path}::kyverno test -o json produced no JSON array -- this check cannot confirm anything")
              sys.exit(1)
          rows = json.loads(raw[lo:hi + 1])
          if not rows:
              print(f"::error file={suite_path}::kyverno test -o json reported 0 cases")
              sys.exit(1)

          entries = json.load(open(expected_json)) or []
          if not entries:
              print(f"::error file={suite_path}::no `results` entries -- this suite asserts nothing")
              sys.exit(1)

          inventory = set(open(inventory_path).read().split())
          if not inventory:
              print(f"::error file={suite_path}::the rule inventory is empty -- this check cannot confirm anything")
              sys.exit(1)

          POSITIVE = {"pass", "fail", "warn", "error"}
          UNEVALUATED = {"Excluded", "Invalid Policy"}

          want = {}
          for e in entries:
              names = e.get("resources") or ([e["resource"]] if e.get("resource") else [])
              for n in names:
                  want[(e.get("policy"), e.get("rule"), e.get("kind"), n)] = str(e.get("result", "")).lower()

          bad = 0

          # 1. Every rule a suite names must be a rule the engine actually
          #    loaded. A rule renamed or deleted in the policy leaves every case
          #    naming it reported Excluded, which satisfies `skip` as happily as
          #    `fail` -- so an all-negative suite goes on reporting all-pass
          #    while asserting nothing at all. This is the only direction an
          #    all-negative suite can be checked in without a network call.
          reported = set()
          for policy, rule, _, _ in want:
              if rule and rule not in inventory and rule not in reported:
                  reported.add(rule)
                  print(f"::error file={suite_path}::`{rule}` is not a rule of any policy this gate loaded -- "
                        f"every case naming it is reported Excluded and passes vacuously (#148)")
                  bad = 1

          # 2. Every case that expects a real verdict must have got one.
          for r in rows:
              parts = str(r.get("RESOURCE", "")).split("/")
              if len(parts) < 3:
                  continue
              policy, rule, kind, name = r.get("POLICY"), r.get("RULE"), parts[1], parts[-1]
              w = want.get((policy, rule, kind, name), want.get((policy, rule, None, name)))
              if w in POSITIVE and r.get("REASON") in UNEVALUATED:
                  print(f"::error file={suite_path}::case {r.get('ID')} expects `{w}` for {r.get('RESOURCE')}, but rule "
                        f"`{rule}` produced NO result ({r.get('REASON')}) -- the CLI scores that as a pass (#148)")
                  bad = 1

          sys.exit(bad)
          PYEOF

          fail=0
          for f in "${SUITES[@]}"; do
            out=$(kyverno test "$(dirname "$f")" -f "$(basename "$f")" 2>&1)
            rc=$?
            counts=$(printf '%s\n' "$out" \
              | sed -n 's/.*Test Summary:[[:space:]]*\([0-9]\{1,\}\) tests passed and \([0-9]\{1,\}\) tests failed.*/\1 \2/p' \
              | tail -1)
            passed=${counts%% *}
            failed=${counts##* }

            if [ -z "$counts" ]; then
              echo "::error file=$f::kyverno test printed no summary -- this gate cannot confirm it ran anything"
            elif [ $((passed + failed)) -eq 0 ]; then
              echo "::error file=$f::kyverno test ran 0 cases -- a suite that tests nothing cannot pass (#143)"
            elif [ "$rc" -ne 0 ] || [ "$failed" -ne 0 ]; then
              echo "::error file=$f::$failed of $((passed + failed)) Kyverno test case(s) failed -- a rule does not do what this suite says it does"
            elif ! yq -o=json '.results' "$f" > /tmp/kyverno-expected.json; then
              echo "::error file=$f::could not read \`results\` out of this suite -- this gate cannot confirm what it asserted"
            elif ! kyverno test "$(dirname "$f")" -f "$(basename "$f")" -o json 2>/dev/null \
                 | python3 /tmp/assert-evaluated.py "$f" /tmp/kyverno-expected.json /tmp/kyverno-rule-inventory.txt; then
              echo "::error file=$f::a case this suite says must produce a verdict produced none -- the rule under test evaluated nothing (#148)"
            else
              echo "ok  kyverno-test  $f  ($passed case(s) against Kyverno v1.18.2, every expected verdict actually evaluated)"
              continue
            fi

            printf '%s\n' "$out" | grep -Ev '^[[:space:]]*$' | tail -30
            fail=1
          done

          # What this still does NOT catch:
          #   - Any policy no suite covers. All three are covered today (#149),
          #     but coverage of policies BY suites is not itself measured --
          #     adding a fourth policy with no suite does not fail this step.
          #     Making it fail is #145 step 2, which was gated on #148 for the
          #     reason #145 gives: a coverage gate stacked on suites that
          #     cannot fail measures the wrong thing. Guard 5 is what ungates it.
          #   - A glob NARROWED until it covers nothing, in
          #     verify-factory-image-signatures specifically. Measured:
          #     `ghcr.io/olafkfreund/aifactory:*` tightened to `aifactory:v*`
          #     still reports 84 passed, 0 failed, and still passes guard 5,
          #     because every case in that suite is legitimately negative and
          #     legitimately Excluded. Asserting the positive half means a
          #     MATCHED image, which means a call to ghcr.io from a required
          #     status check; that is a worse trade than the gap. The narrowing
          #     direction is covered off-CI instead, by
          #     require-first-party-signature-coverage, which reports any
          #     first-party image in `factory` that its mirror list does not
          #     name. Guard 5's rule-inventory half DOES catch the blunter
          #     version of this -- a rule renamed or deleted outright.
          #   - Signature verification. No case here reaches a registry or
          #     rekor, by design; the suite is offline rule logic only.
          #   - Anything the webhook checks at admission time that the CLI does
          #     not, which is why the `kyverno apply` step above stays.
          #   - A `Fail` policy widening beyond its matchConditions. That is not
          #     a property of a rule, it is a property of the generated webhook,
          #     and `kyverno test` never generates one. See the next step.
          exit "$fail"

      # Factory#620. A Kyverno `Fail` webhook can stop every write it covers, so
      # the blast radius of a Fail policy is decided entirely by its
      # matchConditions -- and by how many Fail policies share the webhook.
      #
      # WHY THIS IS NOT COVERED ABOVE. Everything else in this job reasons about
      # a policy in isolation. This hazard only exists BETWEEN policies:
      # Kubernetes ANDs a webhook's matchConditions and Kyverno unions the
      # matchConditions of every policy in a failure-policy group into that
      # group's webhook. So adding a second Fail policy is enough to break the
      # first one's scope without editing the first one's file -- either
      # widening the webhook (second policy has no matchConditions) or silently
      # switching both policies off (second policy has different ones). Neither
      # is visible from either file alone, neither changes any rule's behaviour
      # in `kyverno test`, and the failure mode of getting it wrong is the whole
      # cluster.
      #
      # Kyverno v1.18.2 happens to render a policy that sets
      # `webhookConfiguration` into its OWN "finegrained" webhook, which dodges
      # the union -- verified by reading the generated config back off the
      # cluster. This gate does not depend on that holding: it keeps the repo in
      # the state that is safe either way.
      - name: A Fail policy must be scoped, and must be the only one
        run: |
          set -uo pipefail

          mapfile -t POLICIES < <(
            git ls-files -z 'apps/**/*.yaml' | tr '\0' '\n' | sort | while read -r f; do
              grep -qE '^apiVersion:[[:space:]]*"?kyverno\.io/' "$f" && printf '%s\n' "$f"
            done
          )
          # Rule 4.7: a gate that cannot run must fail, not pass. The same
          # discovery regex as the steps above, so if that regex ever stops
          # matching, every Kyverno step in this job goes red together rather
          # than this one quietly finding nothing to check.
          if [ "${#POLICIES[@]}" -eq 0 ]; then
            echo "::error::discovered 0 Kyverno policies -- this gate checked nothing"
            exit 1
          fi
          echo "scanning ${#POLICIES[@]} Kyverno policy file(s) for Fail webhooks"

          rc=0
          failing=()
          for f in "${POLICIES[@]}"; do
            # Both spellings. `spec.failurePolicy` is deprecated and Kyverno
            # rejects it outright alongside `webhookConfiguration`, but a policy
            # carrying only the old one is still a Fail webhook.
            fp=$(yq -r '[.spec.failurePolicy, .spec.webhookConfiguration.failurePolicy] | map(select(. != null)) | .[0] // "Ignore"' "$f")
            [ "$fp" = "Fail" ] || continue

            failing+=("$f")
            n=$(yq -r '.spec.webhookConfiguration.matchConditions | length // 0' "$f")
            if [ "$n" -lt 1 ]; then
              echo "::error file=$f::failurePolicy Fail with no spec.webhookConfiguration.matchConditions -- this registers a Fail webhook over everything the policy's rules cover, cluster wide (Factory#620)"
              rc=1
            else
              echo "ok  fail-scope  $f  ($n matchCondition(s))"
            fi
          done

          if [ "${#failing[@]}" -gt 1 ]; then
            echo "::error::${#failing[@]} policies set failurePolicy Fail: ${failing[*]}"
            echo "::error::Kyverno ANDs matchConditions across a failure-policy group, so a second Fail policy either widens the first one's webhook or switches both off. Read the generated webhook back off the cluster before allowing this (Factory#620)."
            rc=1
          fi

          if [ "${#failing[@]}" -eq 0 ]; then
            echo "no Fail policies -- nothing to scope"
          fi
          exit "$rc"

  # Second gate, deliberately NOT the required status check (branch protection
  # requires only "kustomize build + schema"). It currently FAILS, on purpose:
  # apps/odin/manifests/manifests.yaml still carries two live third-party API
  # keys as literal `value:` strings in this PUBLIC repo (#116). Rotating those
  # keys is an action against live Sonarr/Radarr instances and is the repo
  # owner's call, and removing the literal without rotating would make the repo
  # look clean while the exposure is unchanged.
  #
  # So this job stays red until #116 is actually closed. It is not allowlisted
  # and it is not scoped to changed files -- either of those would silence a
  # true positive, which is the exact "reports without checking" defect #117 is
  # about. Making it non-required is the honest compromise: the finding is loud
  # and permanent, but it does not wedge every merge in the repo behind a
  # decision that is not CI's to make.
  #
  # When #116 closes, add "no literal secrets in manifests" to the required
  # checks in branch protection. That is the only change needed.
  secrets:
    name: no literal secrets in manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan manifests for credentials committed as literal values
        run: |
          set -uo pipefail

          mapfile -t ALL < <(git ls-files -z '*.yaml' '*.yml' | tr '\0' '\n' | sort)
          if [ "${#ALL[@]}" -eq 0 ]; then
            echo "::error::git ls-files found no YAML at all -- this scan checked nothing"
            exit 1
          fi

          # #116: two live API keys reached a public repo because nothing looked.
          # A credential-shaped env var name followed by a literal `value:` is
          # the shape. `valueFrom:` (the secretKeyRef this repo already uses for
          # minio-creds, oauth2-proxy-* and factory-secrets) does not match.
          #
          # Reports the file, the line and the variable NAME. Never the value --
          # printing it would republish the secret into the CI log.
          awk '
            /^[[:space:]]*-?[[:space:]]*name:[[:space:]]*"?[A-Z][A-Z0-9_]*(KEY|TOKEN|SECRET|PASSWORD|PASSPHRASE|CREDENTIALS?)"?[[:space:]]*$/ {
              var = $0
              sub(/^[^:]*:[[:space:]]*/, "", var)
              gsub(/"/, "", var)
              next
            }
            var != "" && /^[[:space:]]*value:[[:space:]]*[^[:space:]]/ {
              if ($0 !~ /value:[[:space:]]*("" *|'"''"' *)$/) {
                printf "::error file=%s,line=%d::%s is set with a literal value: -- use secretKeyRef (#116)\n", FILENAME, FNR, var
                hits++
              }
            }
            { var = "" }
            END { exit (hits ? 1 : 0) }
          ' "${ALL[@]}" || {
            echo "::error::literal credentials found in manifests -- see #116"
            exit 1
          }

          echo "ok  no credential-shaped env var is set with a literal value"
