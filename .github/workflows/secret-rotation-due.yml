name: secret rotation due

# "Is any credential in the rotation ledger past its deadline?", asked out of
# band (#314). The ledger and the policy live in docs/secrets-management.md.
#
# WHY SCHEDULED: a pull request does not make a secret overdue; TIME does. On a
# PR this job therefore only validates the ledger's shape (--validate-only), so
# a PR is never failed for something it did not cause. The weekly run is the
# one that reports OVERDUE rows and goes red.
#
# WHY IT DOES NOT FILE AN ISSUE: same call as image-pin-freshness.yml. A
# failing scheduled workflow already emails the owner and shows red in the
# Actions tab; an auto-filed issue needs auto-closing logic, a second small
# state machine that rots.
#
# It reads only the ledger. It never reads, rotates or needs a secret.

on:
  schedule:
    # Weekly, Monday 06:17 UTC. Offset from image-pin-freshness (05:41 Mon).
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/secrets-management.md"
      - "scripts/rotation-ledger-check.py"
      - ".github/workflows/secret-rotation-due.yml"

permissions:
  contents: read

concurrency:
  group: secret-rotation-due-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    name: no credential in the rotation ledger is overdue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-test the checker before trusting it
        run: python3 scripts/rotation-ledger-check.py --self-test

      - name: Check the ledger
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          flag=()
          if [ "$EVENT" = "pull_request" ]; then flag=(--validate-only); fi
          python3 scripts/rotation-ledger-check.py "${flag[@]}" docs/secrets-management.md
