name: workflow duplication (no wholesale copies)

# Factory#842, factory-gitops#242.
#
# jscpd stopped counting `.github/workflows/**` fleet-wide when Factory#836
# bounded every job with `timeout-minutes`: that one line per job pushed pairs
# of Actions PREAMBLE over jscpd's 50-token floor. None of that is a paste
# anyone chose -- the workflow format requires each line verbatim, and the
# fleet's pin policy REQUIRES every workflow to name the same action digest, so
# any two jobs that both check out and both set up Python are byte-identical by
# policy. Excluding the directory cost a real capability: nothing then looked
# for somebody duplicating `codeql.yml` into `codeql-2.yml` and editing one
# line. This gate is the narrow replacement -- it compares workflows PAIRWISE
# within this repo after discarding lines shared by three or more files.
#
# THIS REPO IS CLEAN TODAY. Measured on main: no wholesale copy among its
# workflows. Wiring it now is two files; wiring it after the drift is a
# migration.
#
# WHY VENDORED AND NOT FETCHED-AND-EXECUTED (factory-gitops#242).
# The other five repos fetch this engine from the hub at a pinned SHA and RUN
# what comes back. They can: each already has `HUB_PIN_SHA` variables and
# `.github/scripts/assert-hub-pin-on-main.sh`, the helper that makes an
# executed pin safe. This repo has NEITHER, and it is the PUBLIC repo whose
# manifests ArgoCD syncs straight to the cluster. Porting the pin machinery
# here so that a workflow could download and execute code from another
# repository -- to guard nine files -- adds more attack surface than the gate
# removes. So the engine is vendored: the only code that ever EXECUTES here is
# the copy in this tree, reviewed in the pull request that added it.
#
# WHY THE DRIFT JOB HAS NO PIN. A vendored copy with no drift check silently
# rots, which is why the fleet vendors-with-a-drift-gate rather than
# vendors-and-hopes. The fleet's other drift gates read a `.hub-sha` from the
# PR's own tree, which is why they need the pin-assertion helper: a fork PR can
# point the pin at a fork commit crafted to match its own drifted copy and the
# gate diffs two matching trees and goes green (CFactory#373, AIFactory#1281).
# This gate takes no pin at all. It compares the vendored copy against hub
# `main` -- a constant URL, no PR-controlled input, so there is no ref to
# confuse and no bypass to assert away, and no pin machinery to port. The
# consequence, stated rather than implied: when the hub changes the engine,
# this job goes RED until the copy here is re-vendored. That is the intended
# behaviour ("one engine, no drift"), not a bug to soften.
#
# The two jobs are deliberately separate. `duplication` is the verdict and
# touches no network at all, so a hub outage can never turn the actual gate
# green-by-omission; `drift` is the only job that reaches out, and it only ever
# DIFFS what it downloads -- it never runs it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-duplication-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VENDORED: ".github/scripts/check_workflow_duplication.py"
  CANONICAL_URL: "https://raw.githubusercontent.com/olafkfreund/Factory/main/scripts/check_workflow_duplication.py"

jobs:
  duplication:
    name: no workflow is a wholesale copy of another
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prove the gate can fail
        # Runs BEFORE the verdict, in the same job. A green gate whose ability
        # to go red was never demonstrated is Factory#694 / #697 again. The
        # self-test builds synthetic workflows in a temp dir and asserts all
        # three rules: preamble-only siblings are NOT a copy, a wholesale copy
        # with one edited line IS, and an empty workflow directory is a finding
        # rather than a pass.
        run: python3 "${VENDORED}" --self-test

      - name: Enforce (blocking)
        # Prints the COUNT of workflows it compared on every verdict, pass or
        # fail, and exits non-zero rather than 0 if it compared nothing
        # (Factory#832) -- "0 pairs compared" looks identical to "clean"
        # otherwise.
        run: python3 "${VENDORED}" --root .

  drift:
    name: the vendored engine matches the hub canonical
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the hub canonical from main
        # curl -f, no continue-on-error, no soft-skip: an unreachable hub is a
        # check that CANNOT run, and that must fail rather than report success.
        # Downloaded to /tmp and never made executable -- this file is DIFFED,
        # never run. Nothing fetched over the network executes in this repo.
        run: curl -fsSL "${CANONICAL_URL}" -o /tmp/hub-canonical.py

      - name: Diff the vendored copy byte-for-byte
        run: |
          set -euo pipefail
          if ! diff -u /tmp/hub-canonical.py "${VENDORED}"; then
            echo "DRIFT: ${VENDORED} diverged from the hub canonical at"
            echo "olafkfreund/Factory main:scripts/check_workflow_duplication.py."
            echo "Land the change in the hub canonical first, then re-vendor it"
            echo "here byte-for-byte. Never edit the vendored copy in place."
            exit 1
          fi
          echo "No drift: the vendored engine is byte-identical to the hub canonical."
