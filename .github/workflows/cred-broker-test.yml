# The cred-broker's refresh.py lives as a block scalar inside a ConfigMap, so
# nothing imports it and nothing had ever run its decision logic. Factory#437:
# it failed every 4 hours for days because it treated "this grant cannot rotate
# a healthy long-lived credential" as an outage. An alarm that is always red is
# as useless as a gate that is always green.
#
# No paths filter: this is cheap (seconds) and a required check that does not
# run on a PR leaves that PR blocked forever.
name: cred-broker decision logic

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: refresh.py exits correctly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Extract refresh.py from the ConfigMap
        run: |
          python3 .github/scripts/extract_embedded_script.py \
            apps/cred-broker/manifests/manifests.yaml \
            refresh.py \
            /tmp/refresh_extracted.py
      - name: Both directions
        run: python3 .github/scripts/test_cred_broker.py
