name: secret-scan

on:
  pull_request:
  schedule:
    - cron: '44 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-diff-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # WITHOUT THIS the action uses its own bundled config and never reads
          # this repo's .gitleaks.toml, so every reviewed allowlist entry is
          # silently ignored. The full-history CLI step runs
          # `gitleaks detect --source .`, which picks the file up from the repo
          # root automatically -- so the two paths disagreed about the same
          # repo, and PRs failed on the secret scanner's OWN test fixtures
          # while the scheduled scan passed. Found on AIFactory#1335.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  full-history-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks-action's README does not document that non-PR events force a
      # full-history scan, so this job does not rely on that assumption: it
      # installs the pinned gitleaks CLI and runs `detect` directly against
      # the full checkout (git log), which is a genuine full-history scan.
      - name: Install pinned gitleaks CLI
        run: |
          set -euo pipefail
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Full-history gitleaks scan
        run: gitleaks detect --source . --redact -v
