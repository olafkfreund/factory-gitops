# The report script is the only thing standing between a stale credential and silence, and
# nothing else runs it (Factory#314). No paths filter: a required check that does not run
# on a PR leaves that PR blocked forever, and this takes seconds.
name: secret-rotation report logic

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: report.py classifies and exits correctly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 apps/secret-rotation/manifests/test_report.py
