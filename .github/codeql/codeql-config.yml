# CodeQL config for factory-gitops.
#
# security-and-quality is listed EXPLICITLY. A config-file REPLACES the
# workflow's `queries:` input, so omitting it silently drops the repo to
# CodeQL's narrower default suite. That is not hypothetical: TFactory and
# PFactory both did exactly that when they adopted their custom query packs,
# and their alert counts fell in a way that read as an improvement
# (Factory#711). This repo starts at full breadth so its first number is honest.
name: "factory-gitops CodeQL config"

queries:
  - uses: security-and-quality

paths:
  # The eight CI helpers, and the extracted copies of the block scalars that
  # are the real in-cluster code. Without the second entry this scan would
  # cover the helpers only and report clean over everything that matters.
  - .github/scripts
  - _codeql_extracted
  # The manifests tree, for the code that is checked in rather than embedded.
  # This list enumerated CI directories and stopped, so
  # `apps/kyverno-policies/assert-*.py` -- two admission-policy assertions that
  # run in-cluster -- were outside every entry above. Ten of the repo's twelve
  # python files were scanned and the result was published as a repo-wide
  # clean, which is the exact reading Factory#711 was filed about. `apps`
  # rather than the one directory, so the next checked-in script is covered by
  # default instead of by remembering to come back here.
  - apps
  # `paths` applies to EVERY language in the matrix, not just python. Omitting
  # this left the `actions` pack with no workflows to read, and CodeQL failed
  # the job with "could not process any code written in GitHub Actions" rather
  # than reporting a clean scan -- the right way round, but it still has to be
  # fixed here rather than by dropping the language.
  - .github/workflows

paths-ignore:
  # Vendored/third-party trees would drown the first triage pass.
  - "**/node_modules"
