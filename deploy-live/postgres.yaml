apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: factory
data:
  init-databases.sql: |
    CREATE DATABASE pfactory;
    CREATE DATABASE aifactory;
    CREATE DATABASE tfactory;
    CREATE DATABASE cfactory;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: factory
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: factory
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: factory
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: factory-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: factory
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U factory -d factory"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U factory -d factory"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: init
          configMap:
            name: postgres-init
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
