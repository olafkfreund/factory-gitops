# Keycloak — central identity provider for the Factory suite.
# dev-mode (H2 on a PVC) for the homelab. Public ingress is the in-cluster
# Cloudflare tunnel (keycloak.freundcloud.org.uk) — no Tailscale sidecar.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: keycloak-data, namespace: factory, labels: { app: keycloak } }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: keycloak, namespace: factory, labels: { app: keycloak } }
spec:
  selector: { app: keycloak }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: keycloak, namespace: factory, labels: { app: keycloak } }
spec:
  replicas: 1
  selector: { matchLabels: { app: keycloak } }
  strategy: { type: Recreate }
  template:
    metadata: { labels: { app: keycloak } }
    spec:
      enableServiceLinks: false
      # Factory#521. This pod had `fsGroup: 1000` and nothing else — no
      # runAsNonRoot, no seccompProfile, and the container had no
      # securityContext at all. Keycloak is the IdP for the whole suite: if it
      # is compromised, so is every oauth2-proxy in front of the cockpit, Odin
      # and OpenObserve, plus the native OIDC on aifactory/pfactory/tfactory.
      #
      # uid 1000 is NUMERIC and is what the image already declares (measured:
      # `docker image inspect --format '{{.Config.User}}'` -> `1000`). It also
      # matches the existing fsGroup, which is what owns the keycloak-data PVC —
      # a different uid here comes up unable to read its own realm database.
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.1@sha256:be6a86215213145bfb4fb3e2b3ab982a806d00262655abdcf3ffa6a38d241c7c
          # readOnlyRootFilesystem is DELIBERATELY ABSENT, and this is measured,
          # not assumed. `start-dev` re-runs the Quarkus augmentation on every
          # boot and REWRITES the runner jar under /opt/keycloak/lib/quarkus,
          # which is on the root filesystem, not the data PVC. Run read-only as
          # uid 1000 with cap-drop ALL against this exact tag and it dies before
          # ever listening:
          #
          #   ERROR: Build failure: Build failed due to errors
          #     [error]: Build step ...JarResultBuildStep#buildRunnerJar threw an
          #     exception: java.nio.file.ReadOnlyFileSystemException
          #
          # exit 1, CrashLoopBackOff. An emptyDir over /opt/keycloak/lib/quarkus
          # would MASK the baked augmentation output and force a full rebuild on
          # every start — the 600s startupProbe budget below exists because that
          # build is already the slow part. Closing this properly means moving
          # off `start-dev` to a pre-augmented `start --optimized` image, which
          # is a Keycloak deployment change, not a manifest one.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args: ["start-dev"]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: "admin" }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: factory-secrets, key: KEYCLOAK_ADMIN_PASSWORD } } }
            - { name: KC_HOSTNAME, value: "https://keycloak.freundcloud.org.uk" }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: "xforwarded" }
            - { name: KC_HOSTNAME_STRICT, value: "false" }
          ports: [{ containerPort: 8080 }]
          volumeMounts: [{ name: data, mountPath: /opt/keycloak/data }]
          # startupProbe gates liveness/readiness during the slow Quarkus
          # `start-dev` augmentation. Under post-reboot CPU/IO load this can take
          # >180s; the old liveness (initialDelay 90 + 3x30 = 180s) killed it
          # mid-build, causing an infinite crash-loop (incident 2026-06-25).
          # 60 x 10s = 600s budget before the container is considered failed.
          startupProbe:   { httpGet: { path: /realms/master, port: 8080 }, periodSeconds: 10, failureThreshold: 60, timeoutSeconds: 3 }
          readinessProbe: { httpGet: { path: /realms/master, port: 8080 }, initialDelaySeconds: 25, periodSeconds: 10, failureThreshold: 30 }
          livenessProbe:  { httpGet: { path: /realms/master, port: 8080 }, initialDelaySeconds: 90, periodSeconds: 30 }
          resources: { requests: { cpu: 250m, memory: 1Gi }, limits: { memory: 2560Mi } }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: keycloak-data } }
