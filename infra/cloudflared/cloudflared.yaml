# In-cluster Cloudflare Tunnel connector for the Factory suite.
# Routes *.freundcloud.org.uk public hostnames to the in-cluster Services.
# Separate tunnel (factory-cluster) from the host's p510-home/backstage tunnel
# — they don't interfere. credentials.json lives in the cloudflared-factory
# secret (seeded out-of-band from /run/agenix on p510).
apiVersion: v1
kind: ConfigMap
metadata: { name: cloudflared-config, namespace: factory }
data:
  config.yaml: |
    tunnel: 55338418-e5d7-476a-a67f-079bd3044db7
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      # CFactory cockpit sits behind oauth2-proxy (Keycloak SSO).
      # The proxy lives in the factory ns alongside the frontend; see
      # apps/cfactory-auth/. Keycloak realm: factory, client: cfactory.
      - hostname: cfactory.freundcloud.org.uk
        service: http://oauth2-proxy-cfactory.factory.svc.cluster.local:4180
      # CFactory's read-only MCP server (POST /mcp) goes straight to the backend,
      # bypassing the Keycloak SSO that fronts the human cockpit. Auth is the
      # backend's own CFACTORY_MCP_SECRET bearer (the shared APP_API_TOKEN) — the
      # same model as aifactory.freundcloud.org.uk. Lets the PARR conductor (#71).
      - hostname: cfactory-mcp.freundcloud.org.uk
        service: http://cfactory.factory.svc.cluster.local:3111
      - hostname: aifactory.freundcloud.org.uk
        service: http://aifactory.factory.svc.cluster.local:3101
      - hostname: pfactory.freundcloud.org.uk
        service: http://pfactory.factory.svc.cluster.local:3114
      - hostname: tfactory.freundcloud.org.uk
        service: http://tfactory.factory.svc.cluster.local:3103
      - hostname: keycloak.freundcloud.org.uk
        service: http://keycloak.factory.svc.cluster.local:8080
      # argocd-server has --insecure set in the bootstrap sidecar patch so
      # plain HTTP works without the HTTP→HTTPS redirect loop. Service is
      # in the argocd namespace, not factory.
      - hostname: argocd.freundcloud.org.uk
        service: http://argocd-server.argocd.svc.cluster.local:80
      - hostname: skillai.freundcloud.org.uk
        service: http://skillai-app.factory.svc.cluster.local:3000
      - hostname: rolehunter.freundcloud.org.uk
        service: http://rolehunter-app.factory.svc.cluster.local:3000
      # Odin sits behind oauth2-proxy (Keycloak SSO). The proxy lives in the
      # factory ns alongside Odin; see apps/odin-auth/ for the deployment.
      # Keycloak realm: factory, client: odin-dashboard.
      - hostname: odin.freundcloud.org.uk
        service: http://oauth2-proxy-odin.factory.svc.cluster.local:4180
      # OpenObserve UI sits behind oauth2-proxy (Keycloak SSO). The proxy
      # lives in the factory ns alongside the observe Service; see
      # apps/observe-auth/ for the deployment. Keycloak realm: factory,
      # client: observe. In-cluster OTLP ingest hits observe:5080/:5081
      # directly and does not traverse this route.
      - hostname: observe.freundcloud.org.uk
        service: http://oauth2-proxy-observe.factory.svc.cluster.local:4180
      # Fides compliance/provenance server (self-hosted, namespace fides).
      # Auth is Fides' own session cookie + FIDES_API_TOKEN — no oauth2-proxy.
      - hostname: fides.freundcloud.org.uk
        service: http://fides-server.fides.svc.cluster.local:8080
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cloudflared, namespace: factory, labels: { app: cloudflared } }
spec:
  replicas: 1
  selector: { matchLabels: { app: cloudflared } }
  template:
    metadata: { labels: { app: cloudflared } }
    spec:
      enableServiceLinks: false
      # Factory#521. This pod had NO securityContext at all — not pod level, not
      # container level — and it is the outbound tunnel: every public request to
      # *.freundcloud.org.uk arrives through this process.
      #
      # runAsUser is explicit and NUMERIC. The image already declares
      # `USER 65532:65532` (measured: docker image inspect -> Config.User
      # "65532:65532"), so this changes nothing at runtime and makes the kubelet
      # refuse to start the pod the day an image bump drops that directive.
      # A NAME here would be AIFactory#848 all over again — runAsNonRoot cannot
      # resolve one.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared:2026.5.2
          args: ["tunnel", "--config", "/etc/cloudflared/config.yaml", "run"]
          # readOnlyRootFilesystem is safe here and MEASURED, not assumed: run
          # read-only as 65532 with --cap-drop ALL and no-new-privileges against
          # this exact tag, with this config shape mounted read-only, and it
          # reaches "Starting metrics server on [::]:2000/metrics" plus a full
          # PASS on the connectivity pre-checks. It is a static Go binary with
          # no-autoupdate: config and credentials are both read-only mounts and
          # nothing else touches disk.
          #
          # drop ALL removes NET_RAW, which cloudflared uses for its ICMP proxy
          # (ping THROUGH the tunnel). Every ingress rule above is an http
          # service, so nothing here needs it; the daemon logs the ICMP source
          # it picked and carries on. Add NET_RAW back only if an ICMP route is
          # ever added to the ingress list.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe: { httpGet: { path: /ready, port: 2000 }, initialDelaySeconds: 10, periodSeconds: 20 }
          volumeMounts:
            - { name: config, mountPath: /etc/cloudflared, readOnly: true }
            - { name: creds, mountPath: /etc/cloudflared/creds, readOnly: true }
          resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 256Mi } }
      volumes:
        - name: config
          configMap: { name: cloudflared-config }
        - name: creds
          secret: { secretName: cloudflared-factory }
