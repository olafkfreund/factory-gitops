# Tailscale Serve configuration for the argocd-server sidecar.
#
# Mounted into the sidecar at /etc/tsconfig/serve.json (via TS_SERVE_CONFIG).
# Tells tailscaled inside the sidecar to terminate HTTPS on :443 (using a
# cert issued for the tailnet hostname `argocd`) and proxy everything to
# the argocd-server upstream on localhost:8080 (HTTPS, self-signed).
#
# The `${TS_CERT_DOMAIN}` placeholder is expanded by tailscaled at runtime
# to e.g. `argocd.tail833f7.ts.net` once the sidecar has joined the tailnet
# and learned its full hostname.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-tailscale-serve-config
  namespace: argocd
data:
  # argocd-server is TLS-detect: same port (8080) serves both HTTP and
  # HTTPS. We proxy via HTTP (not HTTPS) because Tailscale Serve refuses
  # to verify argocd-server's self-signed certificate and returns 502.
  # The connection stays entirely inside the Pod's loopback interface,
  # so plaintext here is fine — external clients still get HTTPS,
  # terminated by the tailscale sidecar with a real cert.
  serve.json: |
    {
      "TCP": {
        "443": { "HTTPS": true }
      },
      "Web": {
        "${TS_CERT_DOMAIN}:443": {
          "Handlers": {
            "/": { "Proxy": "http://127.0.0.1:8080" }
          }
        }
      },
      "AllowFunnel": {}
    }
